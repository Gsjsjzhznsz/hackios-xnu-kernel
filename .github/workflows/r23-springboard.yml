        run: |
          set -eu
          cd "$REL"
          : > SHA256SUMS
          for f in raphael-xnu-r23-flash.img raphael-xnu-r23-gpu-flash.img \
                   raphael-r23-flashboot.apfs r23-md1-root.apfs; do
            sha256sum "$f" >> SHA256SUMS
          done
          REPO="${{ github.repository }}"
          TAG="${{ inputs.release_tag }}"
          cat > README.txt <<EOF
          ============================================================
           R23 · 纯血 hackios SpringBoard 交付包（raphael / K20 Pro）
           —— boot-only：iOS 卷不随行（手机里已刷好，R5-R13 字节相同）
          ============================================================
          ⚠️⚠️⚠️ 启动卷只 stage 一个文件：raphael-r23-flashboot.apfs ⚠️⚠️⚠️
            （R14 事故纪律不变：md1 备份不要 stage，flash.img 已内嵌全量小卷）
          主镜像   : raphael-xnu-r23-flash.img（触摸 + 按键 + 八核；
                     cmdline touchscreen=1 buttons=1 cpus=8）
          GPU 镜像 : raphael-xnu-r23-gpu-flash.img（同上 + gpu=1：
                     梯子进 step 19 的水域——拒绝码结案 + 文件受审）
          启动卷   : raphael-r23-flashboot.apfs（stage0 = md0；R13
                     全量字节，真机验证过）
          小卷备份 : r23-md1-root.apfs（md1 同字节备份，勿 stage）
          内核     : 本仓库源码构建；R23 = 拒绝码结案 + 文件受审。
                     R22 矩阵证明 -3145797 与布局/形态/地址全正交；
                     本平台真机日志（同 4.14 scm.c 谱系）显示：spss 的
                     PAS_INIT_IMAGE 吃一模一样的码（func id 0x42000201，
                     ret -3145797，rc:-22），同一次开机里 cdsp/adsp/
                     slpi/ipa_fws/venus/modem 全过，a640_zap 也过
                     （"Brought out of reset"，落位=动态分配页）。
                     ⇒ 码属于【镜像】不属于调用。
                     而我们随卷的 a640_zap.mbn 是高通 SecTools 测试
                     签名（"Generated Test Attestation CA"/"General
                     Use Test Key (for testing only)"）——熔丝手机的
                     TZ 谁叫都不收这条链。
                     R23 驱动改动：①zap_header 先读出哈希段里证书链
                     自己的名字并下判词；②单一规范尝试（整 .mbn+可抢
                     占，两个活形态同款）；③落位=我们自己的新页
                     （vendor 同款；DT 的 pil_gpu_region@0x98f15000
                     无人引用，adreno_zapmem= 可强制回 DT 区做 A/B）；
                     ④拒绝路径发【零页对照】：GPU id + audio id 各一发。

          【R23 判读】（GPU 镜像，klog 里 adreno: 19）
          - "THE SIGNATURE CHAIN SAYS: A TEST KEY (Qualcomm SecTools
            ...)" = 文件自证有罪（测试签名链在案）。
          - "one attempt..." → "TrustZone returns 0, answer 0" = 被收
            （测试链都被收=未熔丝/调试 TZ，或文件已换）：落位（新页）
            → 写 → 0xc2000205 → "TRUSTZONE HAS AUTHENTICATED AND
            STARTED THE ZAP SHADER" → 20（CP 出安全模式）→ 21 新水域
          - 仍 -3145797 → 看零页对照：
            · "A DIFFERENT ANSWER: TrustZone does read the buffer" =
              TZ 读得动我们的缓冲——拒的是【镜像本身】（签名）。配合
              测试签名判词 = 文件是墙：换上本机原厂 a640_zap.mbn
              （stock ROM vendor.img 的 vendor/firmware/）再战即绿。
            · "THE SAME CODE: ... BEFORE the image is read" = 拒绝发生
