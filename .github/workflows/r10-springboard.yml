# =====================================================================
#  R10 · 纯血 hackios SpringBoard 一键流水线（GitHub Actions）
#  -------------------------------------------------------------------
#  与 R5-R9 相同的七步（磁盘准备/取树/取 iOS 16.5/转裸 APFS/造双盘/打启动镜像/
#  拼 iOS 卷/切片发布），R10 只改一块：**清屏**。
#    · R9 战果（用户真机实测）：门铃补丁（vtimer INTID 27→19）后内核活了，
#      launchd 全程跑通，**SpringBoard 桌面在 -v 控制台日志底下成功渲染**；
#      iOS 起来后 loader 的 fastboot 哑火（USB 被接管）——完全启动达成。
#    · R10 = 用户要的"干净桌面"轮，改动三处、全部在 cmdline/交接面：
#      ① payload cmdline 去掉 `-v`（boot_args.video.v_display 变 1 = 图形模式，
#        内核/launchd 不再往屏幕画字——非 verbose iPhone 的标准开机方式）
#      ② loader 基础 cmdline 去掉 `debug=0x8 ` 前缀（raphael 无 UART，这个位
#        只喂了屏幕控制台叠加；心跳计数与内核日志环不走 console，取证不丢）
#      ③ loader 交接前把面板清成纯黑（screen_clear + dcache clean）：没有
#        -v 控制台去滚屏，loader 自己的遗言（和固件的）会在屏上冻住整段
#        launchd 启动，直到 SpringBoard 首帧才被盖掉
#    · 内核字节与 R9 完全相同（门铃补丁 27→19 复用 tools/r9-kernel-patch.py）；
#      shim/FD/DTB 仍是 r1/r2 验证字节。iOS 卷与 R5-R9 字节相同。
#
#  产物（Release 里一站式拿齐）：
#    raphael-ios-volume.img.part-*   → fastboot flash userdata（iOS 三容器卷；
#                                      若 R5-R9 的分片还留着，哈希相同即可复用）
#    raphael-xnu-r10-flash.img       → fastboot boot（R10 loader 0.10 + R9 补丁内核）
#    raphael-r10-flashboot.apfs      → 启动卷（开机时 fastboot stage 上传 = md0）
#    r10-boot-volume-root.apfs       → 小镜像备份（调试用）
#    SHA256SUMS / README.txt / r10-rejoin.sh
#
#  手机端刷完 userdata 后（四步）：
#    fastboot boot  raphael-xnu-r10-flash.img
#    fastboot oem  ramdisk
#    fastboot stage raphael-r10-flashboot.apfs
#    fastboot oem  run                # 黑屏一阵 → 干净的苹果桌面
#  （R10 判读：fastboot 卡死/哑火 = 成功签名——iOS 接管了 USB；桌面出来后
#    截屏拍照即可，本日志通道已随 USB 一起退役。）
#
#  部署：默认分支的 .github/workflows/r10-springboard.yml → Run workflow。
#  注意：重复运行前先删掉旧 Release（或换 release_tag）。
# =====================================================================
name: R10 · SpringBoard 一键流水线

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "hackios 内核树 fork（含 xnuloader/ + tools/r10-flash-build.sh）"
        required: true
        default: "Gsjsjzhznsz/hackios-xnu-kernel"
      userland_repo:
        description: "hackios userland 树 fork"
        required: true
        default: "Gsjsjzhznsz/hackios-xnu-userland"
      release_tag:
        description: "Release tag（直链的一部分）"
        required: true
        default: "r10-springboard"
permissions:
  contents: write

concurrency:
  group: r10-springboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      REL: ${{ github.workspace }}/release
    steps:
      # ---------------------------------------------------------------
      - name: "①/⑧ 磁盘准备与依赖（含 loader 工具链 clang/lld + capstone）"
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-dev clang lld >/dev/null
          command -v clang && command -v lld-link
          # step ④ 的 dmg.py 需要 lzfse 模块（解 iOS 16.5 rootfs.dmg 的 LZFSE 块）
          sudo python3 -m pip install --break-system-packages lzfse >/dev/null 2>&1 \
            || python3 -m pip install --user --break-system-packages lzfse >/dev/null
          python3 -c "import lzfse; print('→ lzfse 模块就绪')"
          # 7-Zip 23+（读 APFS）
          sudo apt-get install -y -qq 7zip >/dev/null 2>&1 \
            || echo "::warning::apt 的 7zip 不可用，改走 7-zip.org 官方原版"
          if [ -x /usr/bin/7zz ]; then
            sudo ln -sf /usr/bin/7zz /usr/local/bin/7z
          else
            curl -fsSL -o /tmp/7z.tar.xz https://www.7-zip.org/a/7z2301-linux-x64.tar.xz
            sudo mkdir -p /opt/7zip && sudo tar -xJf /tmp/7z.tar.xz -C /opt/7zip
            sudo ln -sf /opt/7zip/7zz /usr/local/bin/7z
          fi
          command -v 7z >/dev/null || { echo "::error::7z 仍不可用"; exit 1; }
          echo "→ 7-Zip:"; 7z i | sed -n '2,3p'
          mkdir -p "$REL"
          df -h /

      # ---------------------------------------------------------------
      - name: "②/⑧ 取树（kernel fork + userland fork）"
        run: |
          set -eu
          git clone --depth 1 "https://github.com/${{ inputs.kernel_repo }}.git" hackios
          cd hackios
          if ! USERLAND_URL="https://github.com/${{ inputs.userland_repo }}.git" common/setup.sh; then
            echo "::warning::userland fork 拉取失败，回退上游 oosexgang/hackios-xnu-userland"
            rm -rf .userland.git
            USERLAND_URL="https://github.com/oosexgang/hackios-xnu-userland.git" common/setup.sh
          fi
          echo "→ raphael 启动链与 R10 打包器（loader 0.10 + R9 门铃内核）："
          ls -lh prebuilt/raphael/ tools/r10-flash-build.sh
          git log -1 --format='→ kernel 树 @ %h %s'

      # ---------------------------------------------------------------
      - name: "②b/⑧ 编译门禁（R10 loader：先编译 + 特征串全验 + debug=0x8 缺席断言，语法错误两分钟内暴露）"
        run: |
          set -eu
          cd hackios
          sudo python3 -m pip install --break-system-packages capstone >/dev/null 2>&1 \
            || python3 -m pip install --user --break-system-packages capstone >/dev/null
          python3 -c 'import capstone; print("→ capstone 就绪 (r9-kernel-patch 的双端验证)")'
          bash xnuloader/build.sh
          python3 - <<'PY'
          d = open('xnuloader/loader.efi', 'rb').read()
          for feat in (b'oem gic', b'oem sgi', b'oem peek', b'NXSB at +32',
                     b'as the firmware left it', b'never showed up as pending', b'oem gicset',
                     b'oem gicgroup', b'group repair', b'pre-arm before CPU_ON',
                     b'at the hung verdict',
                     b'oem irqtest', b'DELIVERS as a Group 1 NS IRQ', b'R10 branch',
                     b'the readback reads 0',
                     b'R10 clean screen round', b'screen cleared for the handoff'):
              assert feat in d, f'loader.efi 缺特征串 {feat!r}'
          assert b'debug=0x8' not in d, 'loader.efi 仍带 debug=0x8（R10 基础 cmdline 未清干净）'
          print(f'✓ R10 loader {len(d):,} B：清屏交接 + 无 debug 位 + R9 全套（irqtest/GIC/天梯）齐全')
          PY

      # ---------------------------------------------------------------
      - name: "③/⑧ 取 iOS 16.5（Apple CDN：4.7GB + 2.7GB + 10MB，断点续传）"
        run: |
          set -eu
          cd hackios/ios165
          KEEP=1 ./fetch.sh
          echo "→ 三个镜像："
          ls -lh rootfs.dmg cryptex-os.dmg cryptex-app.dmg
          df -h .

      # ---------------------------------------------------------------
      - name: "④/⑧ 转裸 APFS（dmg.py 解 LZFSE 抽 APFS 分区 + 常量/魔数/内容三重校验）"
        run: |
          set -eu
          cd hackios/ios165
          python3 -c "import lzfse" || { echo "::error::lzfse 模块缺失（看 step①）"; exit 1; }
          INFO=$(python3 ../tools/apfs/dmg.py info rootfs.dmg)
          echo "$INFO"
          if echo "$INFO" | grep -q '^GPT,'; then
            python3 ../tools/apfs/dmg.py extract rootfs.dmg rootfs.apfs --apfs
          else
            echo "（无 GPT —— 整镜像即裸 APFS，整卷抽出）"
            python3 ../tools/apfs/dmg.py extract rootfs.dmg rootfs.apfs
          fi
          S=$(stat -c %s rootfs.apfs)
          echo "→ rootfs.apfs = ${S} B"
          [ "$S" -eq 5628755968 ] || { echo "::error::尺寸不是上游常量 5,628,755,968（= darwin blocks 0..1374207，见 tools/darwin-write.py；Apple 改 IPSW 了？）"; exit 1; }
          python3 - <<'PY'
          d = open('rootfs.apfs','rb').read(36)
          assert d[32:36] == b'NXSB', f'rootfs.apfs 不是裸 APFS 容器: {d[32:36]!r}'
          for f in ('cryptex-os.dmg','cryptex-app.dmg'):
              m = open(f,'rb').read(36)[32:36]
              assert m == b'NXSB', f'{f} 不是裸 APFS 容器: {m!r}'
          print('✓ 三个镜像 NXSB 容器魔数齐全（@+32）')
          PY
          rm -f rootfs.dmg
          echo "→ 内容抽检（7z 列 APFS，SpringBoard 必须在）："
          7z l rootfs.apfs | grep -m1 'SpringBoard' || { echo "::error::rootfs.apfs 里没有 SpringBoard"; exit 1; }
          echo "✓ SpringBoard 在卷里"
          df -h .

      # ---------------------------------------------------------------
      - name: "⑤/⑧ 造双盘（root.apfs=小镜像 md1 + flashboot.apfs=启动卷 md0）"
        run: |
          set -eu
          cd hackios
          BUILD_RC=0
          PREBUILT=1 FLASHBOOT=1 CRYPTEXES=flash REST=1 WIFID=0 userland/build.sh || BUILD_RC=$?
          for f in userland/root.apfs userland/flashboot.apfs; do
            [ -f "$f" ] || { echo "::error::$f 未产出（看上方日志）"; exit 1; }
          done
          [ "$BUILD_RC" = 0 ] || echo "::warning::build.sh 退出码 $BUILD_RC（两个镜像已产出，继续）"
          ls -lh userland/root.apfs userland/flashboot.apfs
          python3 -c "
          for f, what in (('userland/root.apfs','小镜像 = md1 /redwood'), ('userland/flashboot.apfs','启动卷 = md0 根')):
              d = open(f,'rb').read(36)
              assert d[32:36]==b'NXSB', f'{f} 不是 APFS 容器'
              print(f'✓ {f} 是 APFS 容器（NXSB@+32）= {what}')"
          7z l userland/flashboot.apfs 2>/dev/null | grep -m1 'launchd' \
            || { echo "::error::flashboot.apfs 里没有 sbin/launchd（stage0）"; exit 1; }
          echo "✓ flashboot.apfs 带 stage0（sbin/launchd）"
          rm -rf ios165/rootfs ios165/cryptex ios165/cryptex-app ios165/20F66__iPhone10,3_6
          rm -f userland/system.apfs
          df -h .

      # ---------------------------------------------------------------
      - name: "⑥/⑧ 打 r10 启动镜像（r1 固件 + r2 shim + 现编译 R10 loader 0.10 + R9 门铃补丁内核 + 小镜像 md1 + usb 模式）"
        run: |
          set -eu
          cd hackios
          bash tools/r10-flash-build.sh .
          cp userland/raphael-xnu-r10-flash.img "$REL/"
          cp userland/flashboot.apfs "$REL/raphael-r10-flashboot.apfs"
          cp userland/root.apfs "$REL/r10-boot-volume-root.apfs"
          ls -lh "$REL"
          df -h .

      # ---------------------------------------------------------------
      - name: "⑦/⑧ 拼 iOS 卷（三容器背靠背，rootfs + cryptex-os + cryptex-app）"
        run: |
          set -eu
          cd hackios/ios165
          cat rootfs.apfs cryptex-os.dmg cryptex-app.dmg > raphael-ios-volume.img
          S=$(stat -c %s raphael-ios-volume.img)
          E=$(( $(stat -c %s rootfs.apfs) + $(stat -c %s cryptex-os.dmg) + $(stat -c %s cryptex-app.dmg) ))
          [ "$S" -eq "$E" ] || { echo "::error::拼接尺寸不符: $S != $E"; exit 1; }
          echo "→ iOS 卷 = ${S} B"
          python3 - <<'PY'
          import os
          parts = [('rootfs.apfs',), ('cryptex-os.dmg',), ('cryptex-app.dmg',)]
          f = open('raphael-ios-volume.img','rb')
          off = 0
          for i, (p,) in enumerate(parts):
              s = os.path.getsize(p)
              f.seek(off + 32); m = f.read(4)
              assert m == b'NXSB', f'container c={i} @ {off:#x}: magic {m!r}'
              print(f'✓ c={i} @ {off:#010x} NXSB（{s:,} B）')
              off += s
          assert off == os.path.getsize('raphael-ios-volume.img'), 'total size mismatch'
          print('✓ 三个 APFS 容器背靠背，内核按 ,c=0/1/2 依次可寻')
          PY
          rm -f rootfs.apfs cryptex-os.dmg cryptex-app.dmg
          df -h .

      # ---------------------------------------------------------------
      - name: "⑧/⑧ 切片 + SHA256 + 生成手机端附件"
        run: |
          set -eu
          cd hackios/ios165
          IMG=raphael-ios-volume.img
          IMG_SHA=$(sha256sum "$IMG" | awk '{print $1}')
          echo "→ 整卷 SHA256 = $IMG_SHA"
          split -b 1800m "$IMG" "$REL/raphael-ios-volume.img.part-"
          rm -f "$IMG"
          cd "$REL"
          : > SHA256SUMS
          for f in raphael-ios-volume.img.part-* raphael-xnu-r10-flash.img \
                   raphael-r10-flashboot.apfs r10-boot-volume-root.apfs; do
            sha256sum "$f" >> SHA256SUMS
          done
          echo "${IMG_SHA}  raphael-ios-volume.img" >> SHA256SUMS
          cat > r10-rejoin.sh <<'SH'
          #!/bin/sh
          # R10: 合并 iOS 卷分片 + 校验（Termux；需与分片、SHA256SUMS 同目录）
          set -e
          echo "[1/3] 校验分片 ..."
          sha256sum -c --ignore-missing SHA256SUMS
          echo "[2/3] 合并（约 7.8GB，等一会）..."
          cat raphael-ios-volume.img.part-* > raphael-ios-volume.img
          echo "[3/3] 校验整卷 ..."
          grep ' raphael-ios-volume.img$' SHA256SUMS | sha256sum -c -
          ls -lh raphael-ios-volume.img
          echo "OK → fastboot flash userdata raphael-ios-volume.img"
          SH
          chmod +x r10-rejoin.sh
          REPO="${{ github.repository }}"
          TAG="${{ inputs.release_tag }}"
          PART_URLS=$(ls raphael-ios-volume.img.part-* | sed "s|^|https://github.com/${REPO}/releases/download/${TAG}/|")
          cat > README.txt <<EOF
          ============================================================
           R10 · 纯血 hackios SpringBoard 交付包（raphael / K20 Pro）
          ============================================================
          iOS 卷   : raphael-ios-volume.img（三容器背靠背：iOS 16.5 rootfs
                     + cryptex-os + cryptex-app，内核按 ,c=0/1/2 自寻）
                     整卷 SHA256: ${IMG_SHA}
          启动镜像 : raphael-xnu-r10-flash.img（R10 loader 0.10：清屏交接；
                     内核 = R9 验证字节 + 门铃补丁 27→19，本轮一字未改）
          启动卷   : raphael-r10-flashboot.apfs（stage0 作 /sbin/launchd =
                     md0 根；每次开机经 loader 的 resident 区上传）
          小镜像   : r10-boot-volume-root.apfs（init + LaunchDaemons，备份用）

          【R5-R9 分片还在的话】先只下 SHA256SUMS，对旧分片/旧合并卷跑
          sha256sum -c：一致就免重下免重刷（iOS 卷跨轮字节相同）。

          【分片直链】共 $(ls raphael-ios-volume.img.part-* | wc -l) 片，全部下载到同一目录：
          ${PART_URLS}
          https://github.com/${REPO}/releases/download/${TAG}/raphael-xnu-r10-flash.img
          https://github.com/${REPO}/releases/download/${TAG}/raphael-r10-flashboot.apfs
          https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS
          https://github.com/${REPO}/releases/download/${TAG}/r10-rejoin.sh

          【手机端（Termux）】
            termux-setup-storage
            mkdir -p /sdcard/Download/r10 && cd /sdcard/Download/r10
            sh r10-rejoin.sh
            fastboot flash userdata raphael-ios-volume.img
            # 刷完 userdata 重回 bootloader，点亮（loader 自带 fastboot）：
            fastboot boot  raphael-xnu-r10-flash.img
            fastboot oem  ramdisk
            fastboot stage raphael-r10-flashboot.apfs
            fastboot oem  run         # 黑屏一阵（launchd 在跑）→ 干净的苹果桌面

          【R10 = 清屏轮】
          R9 证明了整条链全通：门铃补丁（vtimer INTID 27→19）后内核活了，
          SpringBoard 桌面在 -v 控制台日志底下渲染成功。R10 把桌面"擦干净"：
            ① cmdline 去掉 -v（v_display=1 图形模式，内核/launchd 不再画屏）
            ② loader 去掉 debug=0x8 前缀（raphael 无 UART，只喂了屏幕叠加）
            ③ 交接前面板清成纯黑（loader 遗言不再冻在屏上等桌面来盖）
          内核/shim/FD/DTB 字节与 R9 完全相同；iOS 卷与 R5-R9 相同。

          【判读树（R10）】
            A. **成功签名**：oem run 后黑屏 20-60 秒 → 桌面出现，无任何日志
               叠加；随后 fastboot 命令卡死/哑火 = iOS 接管了 USB —— 这是
               成功的标志，不是故障。拍照留念即可。
            B. **黑屏超过 2 分钟无桌面**：回退 R9 镜像（raphael-xnu-r9-flash.img，
               带 -v 的 verbose 版）看卡点；若 fastboot 还活着，取证套餐照旧：
                 fastboot oem log && fastboot get_staged r10-klog.txt
                 fastboot oem irqtest && fastboot oem gic
                 checkpoint 天梯：oem run 15/16/17/18/19/20/21（每条 fresh boot）
            C. **R11 观察清单**（对清屏后的桌面，回传给我）：
               1) 亮度：当前固定亮度观感如何（过亮/合适/过暗）？
               2) 动画：时钟/天气 widget 秒针或数字跳动、图标出现动画是否流畅？
                  有无撕裂/花屏/残影？
               3) 色彩：壁纸颜色是否正常（当前按 sRGB 声明，色域正常路线）？
               4) 触摸：无功能（预期内）——R11 起把 Goodix 驱动从 SPI 移植到
                  raphael 的 GENI I2C（SE7, 0x5d），需重编内核，另立一轮。
            D. SGI 针刺/复活验证（仅早期卡死时用）：fastboot oem sgi 1

          ⚠️ 刷完 userdata 后绝不要让 MIUI 开机——Android 会把 userdata
             重格回 f2fs，iOS 卷即毁（重刷可恢复，但别折腾）。
          ⚠️ 每次开机都要重复 boot/oem ramdisk/stage/oem run 四步（启动卷
             住 RAM 不落盘，这正是"不写手机闪存"设计的一部分）。
          ⚠️ 含 Apple 版权内容，仅个人研究；下载完成后请尽快删除本 Release。
          EOF
          echo "→ SHA256SUMS："
          cat SHA256SUMS
          ls -lh

      # ---------------------------------------------------------------
      - name: "⑧b 发布 Release（直链交付）"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "R10 · 纯血 hackios SpringBoard · iOS 16.5 (20F66) · 清屏轮"
          body: |
            raphael (K20 Pro) SpringBoard 交付包：iOS 16.5 (iPhone10,3 / 20F66) 三容器卷
            （rootfs 5,628,755,968 B + cryptex-os + cryptex-app ≈ 7.8GB，已按上游常量校验），
            配套启动镜像 raphael-xnu-r10-flash.img（cmdline `ufs=2 bootcpu=7 root_apfs=ufs_userdata`，
            无 -v 无 debug 位）与启动卷 raphael-r10-flashboot.apfs（stage0 = md0）。

            R10 = 清屏轮（R9 全链达成后的第一个"体验"轮）：
            - **R9 战果**：门铃补丁（vtimer INTID 27→19）让时钟中断回来，内核活到
              SpringBoard——用户真机实测：桌面图标在 -v 日志底下渲染成功，iOS
              起来后 loader 的 fastboot 随 USB 被接管而哑火（完全启动的签名）
            - **R10 改动三处、全在交接面**：① payload cmdline 去 `-v`
              （boot_args.video.v_display=1 图形模式——非 verbose iPhone 的标准
              开机方式）；② loader 基础 cmdline 去 `debug=0x8`（raphael 无 UART，
              该位只喂屏幕叠加；心跳与内核日志环不走 console，取证能力保留）；
              ③ 交接前面板清成纯黑（无 -v 控制台滚屏后，loader 遗言会在屏上
              冻住整段 launchd 启动）
            - **内核字节与 R9 完全相同**（门铃补丁复用 tools/r9-kernel-patch.py）；
              shim/FD/DTB 仍为 r1/r2 验证字节；iOS 卷与 R5-R9 字节相同

            手机端：`sh r10-rejoin.sh` → `fastboot flash userdata raphael-ios-volume.img`，
            然后：`fastboot boot raphael-xnu-r10-flash.img` → `fastboot oem ramdisk` →
            `fastboot stage raphael-r10-flashboot.apfs` → `fastboot oem run`。
            **黑屏一阵（launchd 在跑）→ 干净的苹果桌面。fastboot 随后卡死 =
            iOS 接管了 USB = 成功签名。**

            判读与 R11 观察清单（亮度/动画/色彩/触摸路线）：见附件 README.txt。

            ⚠️ 含 Apple 版权内容，仅供个人研究；下载完成后请尽快删除本 Release。

          fail_on_unmatched_files: true
          files: |
            release/raphael-ios-volume.img.part-*
            release/raphael-xnu-r10-flash.img
            release/raphael-r10-flashboot.apfs
            release/r10-boot-volume-root.apfs
            release/SHA256SUMS
            release/README.txt
            release/r10-rejoin.sh

      - name: "直链汇总（跑完看这里，复制即用）"
        run: |
          set -eu
          echo "════════════ 全部下载直链 ════════════"
          for f in "$REL"/raphael-ios-volume.img.part-* "$REL"/raphael-xnu-r10-flash.img \
                   "$REL"/raphael-r10-flashboot.apfs "$REL"/r10-boot-volume-root.apfs \
                   "$REL"/SHA256SUMS "$REL"/README.txt "$REL"/r10-rejoin.sh; do
            echo "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/$(basename "$f")"
          done
