name: R37 · SpringBoard 一键流水线（瘟疫围堵轮：etc/rc.jobs = R36 清单 + props off 收尾（rc.ios.metal 的 "nothing outlives this list"）——R36 logdump 4502 行全文验尸：J3 关闭（bundle 在真根被 Metal step 3 打开："it is there"）但 props-on + bundle 可发现 ⇒ 每个问 Metal 的进程走全链 ⇒ 64 行 SIGBUS（metal_test 死在 MTLCreateSystemDefaultDevice 内、sweep 未出首行即死、backboardd ×9 死在同一 window-server 指令、SpringBoard、lsd ×22、mobilegestalt.xpc、analyticsd、runningboardd），面板停在内核自画的橙白蓝测试图（adreno step 22），因为没有守护进程活到能往上画。参考仓库实测过同一 hazard（docs/metal.md 10.14：Metal 对设备对象的条件是 assert 不是软拒绝；rc.ios.metal：首靴 props-on 让 launchd 不出生，清单末行 "metal_props off -- nothing outlives this list"）；我们的 port 必须起 launchd，所以围堵是时间的：props 只在本清单运行期存在，收尾两行撤下——之后起的进程回软件路（Metal 在拼 bundle 路径前就返回 nil = R35 行为，3019 行零 SIGBUS）。内核 = R33 字节 verbatim（shadiff 门禁）；cmdline = R36 组原样（零新 token）；卷 = R36 J3-fix 字节 + 恰好一处换装（etc/rc.jobs）；sbin/init = R36 union init 逐字节 riding（对 R36 manifest 的 sha 硬断言）；底板 = r36 release（其 GPU 镜像 = 瘟疫案发现场镜像）
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "hackios 内核树 fork（含 xnu/ + tools/r37-*）"
        required: true
        default: "Gsjsjzhznsz/hackios-xnu-kernel"
      release_tag:
        description: "Release tag（直链的一部分）"
        required: true
        default: "r37-springboard"
      base_image:
        description: "r36 日常镜像直链（= r35 = r34 逐字节；R37 日常镜像再次原样转发）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r36-springboard/raphael-xnu-r36-flash.img"
      base_gpu_image:
        description: "r36 GPU 镜像直链（外科手术的底板：瘟疫案发现场镜像，只换 ramdisk 条目 = props-off 卷，cmdline 原样）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r36-springboard/raphael-xnu-r36-gpu-flash.img"
      base_flashboot:
        description: "r36 启动卷直链（= R13 谱系，真机验证过，原样转发）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r36-springboard/raphael-r36-flashboot.apfs"
      base_root:
        description: "r36 小卷 md1 直链（卷构建的底料：J3-fix 卷 = union init + GL+Metal 六件都在它里面）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r36-springboard/r36-md1-root.apfs"
permissions:
  contents: write
concurrency:
  group: r37-springboard
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      REL: ${{ github.workspace }}/release
      THEOS: /home/runner/theos     # (literal: GitHub Actions' env: block expands nothing)
      CCACHE_DIR: ${{ github.workspace }}/hackios/.ccache
    outputs:
      volume_sha: ${{ steps.volume.outputs.volume_sha }}
    steps:
      # ---------------------------------------------------------------
      - name: "①/⑥ 磁盘准备与依赖（内核工具链；R37 无 Mesa 无 init 构建——GL+Metal 六件与 union init 都在 r36 卷里）"
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-dev clang lld ccache \
                       flex bison m4 perl python3 autoconf automake libtinfo6 xz-utils uuid-dev 7zip \
                       >/dev/null
          command -v clang && command -v ccache && command -v 7z
          # dsymutil：BUILD_DSYM=0 时规则根本不查询它，链接只是保险（R11 run 39973048286 的教训）
          DS=$(command -v dsymutil || clang --print-prog-name=dsymutil 2>/dev/null || true)
          [ -x "$DS" ] || DS=$(ls /usr/lib/llvm-*/bin/dsymutil 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$DS" ] && [ -x "$DS" ]; then
            sudo ln -sf "$DS" /usr/bin/dsymutil
          else
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/bin/dsymutil >/dev/null && sudo chmod +x /usr/bin/dsymutil
          fi
          mkdir -p "$REL"
          {
            echo "R37 toolchain audit (recorded $(date -u +%FT%TZ))"
            echo "--- runner image ---"
            cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION)=' || true
            echo "--- apt clang (the kernel's host compiler) ---"
            clang --version | head -2
            lld --version 2>/dev/null || true
          } | tee "$REL/toolchain-versions.txt"
          df -h /

      # ---------------------------------------------------------------
      - name: "②/⑥ 取树 + 取 r36 资产（本轮底板；SHA 对官方 SHA256SUMS 硬校验）"
        run: |
          set -eu
          git clone --depth 1 "https://github.com/${{ inputs.kernel_repo }}.git" hackios
          cd hackios
          echo "→ 内核树 @ $(git log -1 --format='%h %s')"
          ls -lh xnu/files/bsd/dev/raphael_adreno.c tools/r37_volume_build.py tools/r37_flash_build.py \
                tools/r37-kernel-id.py
          # r36 的四件资产：两张镜像是外科手术的底板（GPU 底板 = 瘟疫案发现场镜像：内核条目 =
          # R33 420f4b71…，cmdline = R35/R36 组含 metal=1，小卷 = R36 J3-fix 卷），启动卷原样
          # 转发，小卷 = 卷构建的底料（union init + GL+Metal 六件 + 链接 + inject.conf 行都在里面）。
          mkdir -p base
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/raphael-xnu-r36-flash.img  "${{ inputs.base_image }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/raphael-xnu-r36-gpu-flash.img "${{ inputs.base_gpu_image }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/raphael-r36-flashboot.apfs "${{ inputs.base_flashboot }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/r36-md1-root.apfs "${{ inputs.base_root }}"
          sha256sum base/* | tee base/SHA256SUMS.r36base
          # 硬校验：四件资产必须是 r36 release 的官方字节（r36-springboard SHA256SUMS）
          python3 - base/ <<'PY'
          import hashlib, sys
          want = {
              'raphael-xnu-r36-flash.img':    'b0f9f6df4ea13ad9d45048e7ff15e33d7b2fcb67204d01964b1014517ca8a60b',
              'raphael-xnu-r36-gpu-flash.img':'2d54e2510008a9285bf42700ab177008c7ed40e68d1cceb840a48406c2ea54db',
              'raphael-r36-flashboot.apfs':   '14485e7c5ce125ef516168445c2500ac04ca5e40a908c2aef516b2d92c24ba0c',
              'r36-md1-root.apfs':            'f3daef47047626c34e3baa2f20eac53e5ca396d679fe5bb5cd980ae677b27699',
          }
          for name, sha in want.items():
              got = hashlib.sha256(open(sys.argv[1] + name, 'rb').read()).hexdigest()
              assert got == sha, f'{name}: {got} != the r36 release sha {sha}'
          print('底板四件全部等于 r36 release 的官方字节（r36-springboard SHA256SUMS）')
          PY
          # 底板谱系三查（r37-kernel-id 在本树）：v7 装载器 + R33 内核 + 小卷三态判读
          # （--expect-volume-sha = r36 release 的 J3-fix 卷）
          python3 tools/r37-kernel-id.py base/raphael-xnu-r36-flash.img base/raphael-xnu-r36-gpu-flash.img \
                  --expect-volume-sha f3daef47047626c34e3baa2f20eac53e5ca396d679fe5bb5cd980ae677b27699 \
                  --expect-volume-name "the R36 J3-fix volume" | tee base-id.txt
          grep -q "ec15106da4bad290" base-id.txt || { echo "::error::r36 底板镜像的 loader 不是设备验证过的 v7（ec15106d…）"; exit 1; }
          grep -Ec "loader  sha256" base-id.txt | grep -qx 2 || { echo "::error::两张 r36 底板镜像都要读到 loader 条目"; exit 1; }
          grep -c "VERDICT: the kernel entry is R37" base-id.txt | grep -qx 2 || { echo "::error::底板镜像的内核不是 R33 字节（= R37 期望）"; exit 1; }
          grep -q "VERDICT: the ramdisk entry is R13..R33 (the R13 bytes)" base-id.txt || { echo "::error::r36 日常镜像的小卷不是 R13 谱系"; exit 1; }
          grep -q "VERDICT: the ramdisk entry is the R36 J3-fix volume" base-id.txt || { echo "::error::r36 GPU 底板的小卷不是 R36 J3-fix 卷"; exit 1; }
          grep -q "NO new token" base-id.txt || { echo "::error::r36 GPU 底板的 cmdline 判读不对（应报 R35/R36/R37 GPU set：metal=1 在内）"; exit 1; }
          grep -c "libredwood-gl.dylib=2" base-id.txt | grep -qx 1 || { echo "::error::r36 GPU 底板小卷的名字表指纹缺 libredwood-gl.dylib"; exit 1; }
          # 两张底板镜像的 ramdisk 条目必须与各自底料一致（日常 = R13 谱系字节；GPU = r36-md1-root.apfs）
          python3 - base/ <<'PY'
          import gzip, struct, hashlib, sys
          def ramdisk_of(path):
              img = open(path, 'rb').read()
              blob = gzip.decompress(img[4096:4096 + struct.unpack('<I', img[8:12])[0]])
              x = blob.find(b'XNUP')
              size = struct.unpack('<I', blob[x+4:x+8])[0]
              i, out = x + 8, {}
              while i + 24 <= x + 8 + size and blob[i] != 0:
                  name = blob[i:i+16].rstrip(b'\0').decode()
                  esize = struct.unpack('<I', blob[i+16:i+20])[0]
                  out[name] = blob[i+24:i+24+esize]
                  i += 24 + ((esize + 15) & ~15)
              return out['ramdisk']
          daily_expect = '372c7fcb7730726a8fb806eec7251e0e75a4188f64db6fbaedcf5b7663672dd4'
          gpu_base = open(sys.argv[1] + 'r36-md1-root.apfs', 'rb').read()
          assert hashlib.sha256(ramdisk_of(sys.argv[1] + 'raphael-xnu-r36-flash.img')).hexdigest() == daily_expect, \
              'r36 日常镜像的 ramdisk 条目不是 R13 谱系字节'
          assert ramdisk_of(sys.argv[1] + 'raphael-xnu-r36-gpu-flash.img') == gpu_base, \
              'r36 GPU 镜像的 ramdisk 条目与 r36-md1-root.apfs 不一致'
          print('底板两镜像的 ramdisk 条目 == 各自底料，逐字节')
          PY

      # ---------------------------------------------------------------
      # R37 的 userland checkout：pin cb10ee1（rc.jobs.r37metal——本轮唯一变量）+ tools/apfs
      # （卷构建的提取/重建器）。本轮无 init 构建：sbin/init 不是变量，r37_volume_build 对
      # R36 manifest 的 df43673a… 硬断言它逐字节 riding。
      - name: "②b/⑥ userland pin checkout（cb10ee1 = rc.jobs.r37metal + tools/apfs；无 theos、无 init 构建）"
        run: |
          set -eu
          cd hackios
          rm -rf .userland-pin
          git clone --no-checkout https://github.com/Gsjsjzhznsz/hackios-xnu-userland.git .userland-pin
          git -C .userland-pin checkout cb10ee1cb5ffa392fbceac7145a3a562b8b39632
          GOT=$(git -C .userland-pin rev-parse HEAD)
          test "$GOT" = "cb10ee1cb5ffa392fbceac7145a3a562b8b39632" || { echo "::error::userland pin drift: $GOT"; exit 1; }
          test -f .userland-pin/userland/rc.jobs.r37metal || { echo "::error::pin 树没有 rc.jobs.r37metal"; exit 1; }
          test -f .userland-pin/tools/apfs/apfs.py || { echo "::error::pin 树没有 tools/apfs/apfs.py"; exit 1; }
          test -f .userland-pin/tools/apfs/mkapfs.py || { echo "::error::pin 树没有 tools/apfs/mkapfs.py"; exit 1; }
          grep -q "/redwood/bin/metal_props off" .userland-pin/userland/rc.jobs.r37metal || { echo "::error::rc.jobs.r37metal 缺 props off 收尾行"; exit 1; }
          grep -q "/redwood/bin/metal_props show" .userland-pin/userland/rc.jobs.r37metal || { echo "::error::rc.jobs.r37metal 缺 (none) 判决行"; exit 1; }
          echo "→ userland @ $(git -C .userland-pin log -1 --format='%h %cs %s')"

      # ---------------------------------------------------------------
      # R28i 工具链纪律（R36 原样继承）：缓存键全新、无 restore 链，重建确定性。
      - name: "②c/⑥ 缓存：theos（工具链 + iPhoneOS16.5.sdk；R37 全新键、无 restore 链）"
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: r37-theos-v19L2-v1
      - name: "②d/⑥ 缓存：xnu-deps（Apple 开源件 + host 工具 + SDK 链接树；R37 全新键、无 restore 链）"
        uses: actions/cache@v4
        with:
          path: hackios/xnu-deps
          key: r37-xnu-deps-v1
      - name: "②e/⑥ ccache（R37 clean build——零回填，只存不用）"
        uses: actions/cache@v4
        with:
          path: hackios/.ccache
          key: r37-ccache-${{ github.run_id }}

      # ---------------------------------------------------------------
      # ③ 内核构建：R37 改的是卷里的一个 rc.jobs，不是内核——本轮的构建是一次内容等价
      # 证明：同一棵树、同一个钉死的工具链，重建内核必须与 R33 发布字节内容等价（shadiff
      # 门禁，R34 run 40621589211 同法通过）。精确 sha 门禁天生不可满足——构建把墙钟写进
      # 版本串、cctools ld 假签名随机 LC_UUID（R34 run 40607732684 法证），差一个代码字节
      # 都是环境漂移或误改内核，必须查清，不许带着疑点上机。
      - name: "③/⑥ 内核源码构建 + R33 内容等价门禁（theos v19.0.0-L2 + xnu/apply.sh + xnu-deps + clean ccache + make；shadiff --gate 参照 = r36 GPU 底板内核条目 = 420f4b71…）"
        run: |
          set -eu
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/ld64" ]; then
            rm -rf "$THEOS"
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
            mkdir -p "$THEOS/toolchain"
            curl -fL --retry 3 --retry-delay 5 -sS https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          fi
          "$THEOS/toolchain/linux/iphone/bin/ld64" --version | tee -a "$REL/toolchain-versions.txt" || true
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" ]; then
            rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk" /tmp/theos-sdks
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
            git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
            mkdir -p "$THEOS/sdks"
            mv /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
            rm -rf /tmp/theos-sdks
          fi
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" || { echo "::error::iPhoneOS16.5.sdk 就位失败"; exit 1; }
          df -h /
          cd hackios
          xnu/apply.sh
          XNU_HOST_CLANG="$THEOS/toolchain/linux/iphone/bin/clang"
          export XNU_HOST_CLANG
          test -x "$XNU_HOST_CLANG" || { echo "::error::theos 工具链 clang 缺位"; exit 1; }
          "$XNU_HOST_CLANG" --version | tee -a "$REL/toolchain-versions.txt"
          grep -q "eabca92" "$REL/toolchain-versions.txt" || { echo "::error::内核编译器不是钉死的 theos clang"; exit 1; }
          bash xnu-deps/setup.sh || { echo "::error::setup.sh 失败"; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          export XNU_CCACHE=1 CCACHE_COMPILERCHECK=content XNU_WRAPPER_LOG="$PWD/xnu-clang-args.log"
          : > "$XNU_WRAPPER_LOG"
          ccache -C >/dev/null 2>&1 || true
          ccache -M 2G >/dev/null 2>&1 || true
          # dSYM 在这条流水线里是纯开销且脆弱（R34 run 40560646210：DSYMUTIL 解析为空 →
          # bash 把 --minimize 当命令 → Error 127；R35 run 40670171127 抄丢旗标后同伤复发）。
          # 正解 = 上游正规开关 BUILD_DSYM=0（MakeInc.def:298 默认 1；=0 时 dSYM 规则走
          # mkdir+touch 分支，DSYMUTIL 根本不被查询）。内核字节 = 编译+链接+strip，门禁证明力不变。
          ./xnu-build.sh -j4 -k BUILD_DSYM=0 || echo "（make 退出码 $?——上游文档：链接后的检查，内核若已产出即成功）"
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          ls -la "$K" || { echo "::error::内核没有产出"; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          # --- R37 门禁一：R33 标记快检（树没被误改的第一道网）
          echo "→ 诊断：R33 标记快检（R37 不动内核，措辞应与 R33 发布件全同）"
          echo "    R33 generation line = $(strings -a "$K" | grep -cF 'R33: the kernel generation line')（应 2）"
          echo "    R33 resident round = $(strings -a "$K" | grep -cF 'R33: the resident round')（应 1）"
          echo "    R33 keep switch = $(strings -a "$K" | grep -cF 'THE GPU STAYS ON for the system to draw with')（应 1）"
          echo "    R33 SCMDMP begin = $(strings -a "$K" | grep -cF 'SCMDMP: R33 begins')（应 1）"
          echo "    R32/R31 旧戳（应 0）= $(strings -a "$K" | grep -cE 'R32: the kernel generation line|R31: the kernel generation line')（应 0）"
          # --- R37 门禁二：内容等价——R33 的源必须产出 R33 的代码字节。
          # 精确 sha 门禁天生不可满足（墙钟版本串 + 随机 LC_UUID，R34 法证：重建 vs R33 =
          # 34 字节全落在 UUID+时间戳两个 meta 区）。正解 = shadiff 内容等价（R34 run
          # 40621589211 通过）：尺寸相等 + 非回收 + 差异只在 <=2 个 build-meta 簇
          # （UUID>=8B / 时间戳<=32B）+ 残留<=8B + 字符串差全是 Darwin 版本行。
          # 参照 = r36 GPU 底板的内核条目（= R33 发布字节 420f4b71…；② 的 r37-kernel-id
          # 判读已断言底板内核 = R33 verbatim）。
          KSHA=$(sha256sum "$K" | cut -d' ' -f1)
          echo "rebuilt kernel sha256: $KSHA" | tee -a "$REL/toolchain-versions.txt"
          python3 tools/r34_shadiff.py --gate base/raphael-xnu-r36-gpu-flash.img "$K" || {
            echo "::error::重建内核与 R33（420f4b71…）不是内容等价——见上方 GATE 法证输出；先查清，不许带疑点上机"
            exit 1
          }
          echo "→ ccache 收官统计："; ccache -s 2>/dev/null | head -8 || true

      - name: "诊断产物（wrapper argv 日志，失败也上传）"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-diag
          path: |
            hackios/xnu-clang-args.log
          if-no-files-found: ignore

      # ---------------------------------------------------------------
      # ④ 卷构建：R37 的全部内容变化都在这一步里。底料 = r36-md1（J3-fix 卷：union init、
      # GL+Metal 六件、链接、inject.conf 行、R35 谱系的一切都在里面，不重建）；脚本对 R36
      # manifest 的 sbin/init sha（df43673a…）硬断言它逐字节 riding——本轮 init 不是变量；
      # 恰好一处换装：etc/rc.jobs = rc.jobs.r37metal（R36 清单 + props off 收尾 + (none) 判
      # 决行，closing pair 在 sweep 之后）；selftest 往返 + 全卷 diff 门禁。
      - name: "④/⑥ 卷构建（r36 J3-fix 底料 + 恰好一处换装：etc/rc.jobs = rc.jobs.r37metal；sbin/init 对 R36 manifest 的 sha 硬断言 riding；selftest 往返 + 全卷逐字节 diff）"
        id: volume
        run: |
          set -eu
          cd hackios
          python3 tools/r37_volume_build.py \
              --base base/r36-md1-root.apfs \
              --apfs-dir .userland-pin/tools/apfs \
              --rc-jobs .userland-pin/userland/rc.jobs.r37metal \
              --out "$REL/r37-md1-root.apfs" \
              --manifest "$REL/r37-volume-manifest.json" \
              --slack 512 2>&1 | tee "$REL/r37-volume-build.log"
          VSHA=$(python3 -c "import json;print(json.load(open('$REL/r37-volume-manifest.json'))['volume']['sha256'])")
          echo "volume_sha=$VSHA" >> "$GITHUB_OUTPUT"
          echo "→ R37 props-off 卷 sha256: $VSHA"
          ISHA=$(python3 -c "import json;m=json.load(open('$REL/r37-volume-manifest.json'));print(m['sbin_init']['r37_sha256'])")
          echo "→ 卷里的 sbin/init（= R36 union init，riding）sha256: $ISHA"
          test "$ISHA" = "df43673ad99662b41ca650dfd747f15ea34adce6aa91c607be696c9ef13a1f04" || { echo "::error::卷里的 init 不是 R36 union init"; exit 1; }
          test "$(stat -c %s "$REL/r37-md1-root.apfs")" -lt 33554432 || { echo "::error::props-off 卷超过 32 MB（payload 预算告急）"; exit 1; }

      # ---------------------------------------------------------------
      - name: "⑤/⑥ 打 r37 双启动镜像（外科手术：底板 = r36 release；日常镜像逐字节原样，GPU 镜像只换 ramdisk 条目 = props-off 卷，cmdline = R35/R36 组原样含 metal=1——零新 token；装载器 v7 / kernel R33 / DTB = r36 原字节）"
        run: |
          set -eu
          cd hackios
          python3 tools/r37_flash_build.py \
              --daily base/raphael-xnu-r36-flash.img \
              --gpu base/raphael-xnu-r36-gpu-flash.img \
              --volume "$REL/r37-md1-root.apfs" \
              --volume-sha "${{ steps.volume.outputs.volume_sha }}" \
              --out-daily "$REL/raphael-xnu-r37-flash.img" \
              --out-gpu "$REL/raphael-xnu-r37-gpu-flash.img" 2>&1 | tee "$REL/r37-flash-build.log"
          # 启动卷：r36 的官方字节（= R13 谱系，真机验证过），名字换成本轮（不刷也不影响 boot）
          cp base/raphael-r36-flashboot.apfs "$REL/raphael-r37-flashboot.apfs"
          # 对打包后的双镜像离线复证
          python3 tools/r37-kernel-id.py \
                  "$REL/raphael-xnu-r37-flash.img" "$REL/raphael-xnu-r37-gpu-flash.img" \
                  --expect-volume-sha "${{ steps.volume.outputs.volume_sha }}" \
                  --expect-volume-name "the R37 props-off volume" | tee r37-kernel-id.txt
          grep -c "VERDICT: the kernel entry is R37" r37-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像必须双双判 R37 内核（= R33 字节 verbatim）"; exit 1; }
          grep -c "ec15106da4bad290" r37-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像的 loader 必须是设备验证过的 v7"; exit 1; }
          grep -c "VERDICT: the ramdisk entry is R13..R33 (the R13 bytes)" r37-kernel-id.txt | grep -qx 1 || { echo "::error::日常镜像的小卷必须仍是 R13 谱系（本轮控制组）"; exit 1; }
          grep -c "VERDICT: the ramdisk entry is the R37 props-off volume" r37-kernel-id.txt | grep -qx 1 || { echo "::error::GPU 镜像的小卷必须是 R37 props-off 卷"; exit 1; }
          grep -c "libredwood-gl.dylib=2" r37-kernel-id.txt | grep -qx 1 || { echo "::error::props-off 卷的名字表指纹缺 libredwood-gl.dylib"; exit 1; }
          grep -c "RedwoodMetal.bundle=5" r37-kernel-id.txt | grep -qx 1 || { echo "::error::props-off 卷的名字表指纹缺 RedwoodMetal.bundle（应 5：bundle 名 x Info.plist x Extensions 链）"; exit 1; }
          grep -c "metal_props=2" r37-kernel-id.txt | grep -qx 1 || { echo "::error::props-off 卷的名字表指纹缺 metal_props"; exit 1; }
          # cmdline：R35/R36 组原样，零新 token——每日镜像无 GPU token，GPU 镜像恰好全组
          test "$(grep 'cmdline       :' r37-kernel-id.txt | grep -c 'gpu=1')" = 1 || { echo "::error::必须恰好 GPU 镜像带 gpu=1"; exit 1; }
          test "$(grep 'cmdline       :' r37-kernel-id.txt | grep -c 'adreno_keep=1')" = 1 || { echo "::error::必须恰好 GPU 镜像带 adreno_keep=1（R33 的 resident 开关原样）"; exit 1; }
          test "$(grep 'cmdline       :' r37-kernel-id.txt | grep -c 'metal=1')" = 1 || { echo "::error::必须恰好 GPU 镜像带 metal=1（R35 的 token，本轮原样）"; exit 1; }
          test "$(grep 'cmdline       :' r37-kernel-id.txt | grep -c 'touchscreen=1 buttons=1 cpus=8 ufs=2 bootcpu=7 root_apfs=ufs_userdata gpu=1 adreno=22 adreno_pause=0 adreno_watch=0 adreno_keep=1 metal=1')" = 1 || { echo "::error::GPU 镜像的 cmdline 不是恰好 = R35/R36 组原样"; exit 1; }
          # 卷里的 rc.jobs 确实换了、init 确实没动（manifest 的双 sha + 长度都在案）
          python3 - "$REL/r37-volume-manifest.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          ini = m['sbin_init']
          assert ini['r36_sha256'] == ini['r37_sha256'] == 'df43673ad99662b41ca650dfd747f15ea34adce6aa91c607be696c9ef13a1f04', \
              'sbin/init moved -- it must ride byte for byte'
          rc = m['rc_jobs']
          assert rc['r36_sha256'] != rc['r37_sha256'], 'etc/rc.jobs did not change'
          assert m['round'] == 'R37 props-off containment (the plague round)', m['round']
          print('manifest: sbin/init riding (%s…); rc.jobs r36 %s… -> r37 %s… (%d B)'
                % (ini['r37_sha256'][:12], rc['r36_sha256'][:12], rc['r37_sha256'][:12], rc['r37_size']))
          PY
          echo "（cmdline 检查过：本轮 token 零变化；唯一卷变化 = etc/rc.jobs 一处换装，init 逐字节 riding）"
          ls -lh "$REL"
          df -h .

      # ---------------------------------------------------------------
      - name: "⑥/⑥ SHA256 + README + 发布（R37：瘟疫围堵判决树（props-off 收尾 + 世界复活判决）+ R36 的 64 行 SIGBUS 全文入账，只有 boot 资产）"
        run: |
          set -eu
          cd "$REL"
          : > SHA256SUMS
          for f in raphael-xnu-r37-flash.img raphael-xnu-r37-gpu-flash.img \
                   raphael-r37-flashboot.apfs r37-md1-root.apfs; do
            sha256sum "$f" >> SHA256SUMS
          done
          REPO="${{ github.repository }}"
          TAG="${{ inputs.release_tag }}"
          cat > README.txt <<EOF
          ============================================================
           R37 · 纯血 hackios SpringBoard 交付包（raphael / K20 Pro）
           —— 瘟疫围堵轮：etc/rc.jobs = R36 清单 + props off 收尾
              （内核 = R33 字节 verbatim；cmdline = R36 组原样零新 token；
               卷 = R36 J3-fix 字节 + 恰好一处换装；init 逐字节 riding）
          ============================================================
          ⚠️⚠️⚠️ 启动卷只 stage 一个文件：raphael-r37-flashboot.apfs ⚠️⚠️⚠️
            （R14 事故纪律不变：md1 备份不要 stage，flash.img 已内嵌全量小卷）
          主镜像   : raphael-xnu-r37-flash.img（= r36 = r35 = r34 逐字节原样：本轮控制组）
          GPU 镜像 : raphael-xnu-r37-gpu-flash.img（cmdline =
                      touchscreen=1 buttons=1 cpus=8 ufs=2 bootcpu=7
                      root_apfs=ufs_userdata gpu=1 adreno=22 adreno_pause=0
                      adreno_watch=0 adreno_keep=1 metal=1
                      = R35/R36 的 token 组原样（零新 token）；卷变量：
                      etc/rc.jobs = rc.jobs.r37metal（R36 清单 VERBATIM +
                        收尾两行：metal_props off（rc.ios.metal 的"nothing
                        outlives this list"）+ metal_props show（(none) 判决））
                      其余 = R36 谱系逐字节原样（sbin/init = union init
                        riding、GL 三件 + libredwood-gl + RedwoodMetal.bundle
                        + 三件 Metal 工具 + inject.conf）
          启动卷   : raphael-r37-flashboot.apfs（= r36 = r35 官方字节，原样转发）
          小卷 md1 : r37-md1-root.apfs（本轮新卷；逐文件清单见
                      r37-volume-manifest.json，含 rc.jobs 的新旧双 sha + init 的
                      riding 断言）
          【R36 的设备判决（用户 logdump 4502 行全文入账，本轮的地基）】
            好消息（两案之一关案）：
            ① J3 关闭：union 挂载把 bundle 站到了 Metal step 3 拼路径的
               真根上——"Metal would open /System/Library/Extensions/
               RedwoodMetal.bundle: it is there"；metal_test 看见
               IOAcceleratorES "sgx" 带两个属性、注册表里有 RedwoodGPU。
            坏消息（本案，R37 的课题）：
            ② 瘟疫：props-on + bundle 可发现 ⇒ 每个问 Metal 的进程走全
               链 ⇒ 64 行 SIGBUS：metal_test（MTLCreateSystemDefaultDevice
               内，pc 0x1a4604068）、sweep（未出首行即死）、backboardd ×9
               （每次死在同一 window-server 指令：kIOMFBSourceLimitsKey
               missing! 后 signal 10 @ 0x2256e3d34）、SpringBoard、lsd ×22、
               mobilegestalt.xpc、analyticsd、runningboardd。面板停在内核
               自画的橙白蓝测试图（adreno step 22），因为没有守护进程活到
               能往上画——即"卡 3 色"。
            参考仓库实测过同一 hazard（docs/metal.md 10.14：Metal 对设备
            对象的条件是 assert 不是软拒绝；rc.ios.metal：首靴 props-on
            让 launchd 不出生，清单末行 "metal_props off"）。
          【R37 改了什么（以及刻意不改什么）】
            内核：一字节未动（R33 的 420f4b71… verbatim；CI 用同一棵
            树 + 钉死的工具链重建，shadiff 内容等价门禁——差异只许
            落在 UUID/时间戳两个 build-meta 簇，代码区零差异）。
            cmdline：零新 token（R35/R36 组原样，metal=1 在内——测量还
            需要它；围堵靠 props off，不靠拔门）。
            卷：R36 J3-fix 字节 + 恰好一处换装（etc/rc.jobs）。sbin/init
            对 R36 manifest 的 sha 硬断言逐字节 riding——init 不是本轮
            变量；GL+Metal 六件不重建——它们在底料里逐字节 riding。
          【本轮判读树（J：props-off 收尾 + 世界复活判决）】
            刷 GPU 镜像，等 boot 走完，再等 demo job 的七行（rwtouch
            wait 22 后）：
              metal_props show（应报 "(none)"）
              metal_props on（设两个属性）
              metal_test（预期：与 R36 同点阵亡——step 3 打开 bundle，
                调用者死在 MTLCreateSystemDefaultDevice 内；这是测量
                本身，被收尾行围堵，runner 报信号后继续）
              metal_drv_test --sweep（预期：同样阵亡、同样被围堵）
              metal_props off（本轮的线：两个属性撤下）
              metal_props show（判决行：两行都应报 "(none)"）
            自检（任一不满足 ⇒ 本票作废）：
              P0  R33 的全相位行照旧（step 12/19/21/22 + STAYS-ON，
                  含橙白蓝测试图上屏）
              P1  init 的 union 行："our Metal plug-in beside iOS's
                  own, where Metal's discovery opens it"（init 逐字节
                  riding 的自证）
              P2  props-on 段与 R36 同形（metal_test/sweep 的 frontier
                  阵亡在案："[exit status 99]" / "[killed by signal 10]"
                  ——预期内，不算本轮失败）
              P3  收尾判决：props off 之后的 metal_props show 两行都报
                  "(none)"（MetalPluginName (none) + MetalPluginClassName
                  (none)）
              P4  世界复活：props off 之后不再有新 SIGBUS 行——
                  backboardd 复活并起 window server、SpringBoard 复活、
                  面板离开橙白蓝测试图（回 R35 表现：黑屏 = CA 停摆是
                  显示轮的课题）
            判决分支：
              J1  P3 "(none)" ×2 + P4 世界复活 ⇒ 瘟疫被 props-off 围堵
                  证实（毒药 = props-on 状态的持续存在，与参考 10.14 的
                  实测同形）⇒ Metal 轮转入 R39 前探（by-hand dlopen
                  分诊：bundle dlopen 单独杀不杀调用者），显示轮 R38
                  不受影响
              J2  props off 报 refused/unsupported ⇒ 不可能（R35/R36 已
                  证 metal=1 门与空串删除路径）——发生了就查 cmdline
              J3  P3 的 show 仍报值 ⇒ 空串删除路径坏（内核 setProperties
                  的 remove 分支）——内核轮跟进
              J8  P4 不成立：props off 之后世界还在 SIGBUS ⇒ 毒药不是
                  props-gated（union/纯 dlopen 投毒论）⇒ 下一轮换 bundle
                  曝光机制（撤 union，改镜像 bind + 第二只读挂载做符号
                  链镜像），内核 VM 同步取证
              J9  系统起不来（比 R36 更早的新伤）⇒ 查 init/P0；回滚 =
                  刷回 r36 GPU 镜像
              回滚：刷回 r36 GPU 镜像（本轮的卷变化随镜像整体回退）
          【logdump 读取纪律（P3：不变）】
            分区每次整写都以头行开始；拉取后按头行截断；自有区判读
            双保险（写边界 + 指针计数）。设备端一键：sh run_ios.sh
            flash r37 gpu -w 180（或 logdump）。
          【离线复验】
            python3 tools/r37-kernel-id.py <image> --expect-volume-sha <r37-md1 sha>
            （代数 grep：kernel entry is R37 ×2；loader v7 ×2；日常镜像
             ramdisk = R13..R33 ×1；GPU 镜像 = R37 props-off volume ×1；
             名字表 libredwood-gl.dylib=2、RedwoodMetal.bundle=5、
             metal_props=2；cmdline 数据行 metal=1 ×1）
          【工具链审计】
            toolchain-versions.txt：每层编译器完整版本号 + 具名 tag
            （R28i 纪律，R37 原样继承；缓存键全新）。
          【手机端（Termux / bootloader）】
            fastboot boot  raphael-xnu-r37-gpu-flash.img   # R37 轮（props-off 卷）
            fastboot oem  ramdisk
            fastboot stage raphael-r37-flashboot.apfs
            fastboot oem  run      # 等系统起完，再等 demo 的七行判决
                                   # （rwtouch wait 22 之后；预期 metal_test/
                                   #  sweep 阵亡在案，收尾两行必须跑完）
            # 设备端一键：sh run_ios.sh flash r37 gpu -w 180
            # 控制组：主镜像 = r36 = r35 = r34 逐字节原样，无需重刷
          直链：
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-xnu-r37-gpu-flash.img
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-xnu-r37-flash.img
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-r37-flashboot.apfs
            https://github.com/\${REPO}/releases/download/\${TAG}/r37-md1-root.apfs
            https://github.com/\${REPO}/releases/download/\${TAG}/r37-volume-manifest.json
            https://github.com/\${REPO}/releases/download/\${TAG}/SHA256SUMS
          ⚠️ userdata 上的 iOS 卷是唯一存货：绝不要让 MIUI 开机
             （Android 会重格回 f2fs，iOS 卷即毁）。
          ⚠️ 每次开机都要重复 boot/oem ramdisk/stage/oem run 四步。
          ⚠️ 含 Apple 版权内容，仅个人研究；下载完成后请尽快删除本 Release。
          EOF

      - name: "⑥b/⑥ 发布 Release（直链交付，r37-springboard）"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "R37 · 纯血 hackios SpringBoard · 瘟疫围堵轮（props-off 收尾进卷：R36 的 64 行 SIGBUS 以 rc.ios.metal 的 own way out 收口；内核 = R33 字节 verbatim；cmdline = R36 组原样；init 逐字节 riding）"
          body: |
            raphael (K20 Pro) R37 交付包：**瘟疫围堵轮**。

            R36 设备判决（用户 logdump 4502 行全文入账）：J3 关案
