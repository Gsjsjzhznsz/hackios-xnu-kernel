            同一 hazard：rc.ios.metal 首靴让 launchd 不出生、清单末行
            "metal_props off -- nothing outlives this list"。

            本轮一件事：etc/rc.jobs = rc.jobs.r37metal（R36 清单 VERBATIM
            + 收尾两行：props off + (none) 判决）。内核一字节未动
            （420f4b71… verbatim + CI shadiff 门禁），cmdline = R35/R36
            组原样零新 token，卷 = R36 J3-fix 字节 + 恰好一处换装，
