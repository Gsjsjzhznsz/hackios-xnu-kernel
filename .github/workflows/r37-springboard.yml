            常镜像逐字节原样，GPU 镜像只换 ramdisk 条目 = props-off 卷；
            装载器 v7 / kernel R33 / DTB = r36 原字节（SHA 硬校验）。

            ⚠️ 含 Apple 版权内容，仅供个人研究；下载完成后请尽快删除本 Release。
          fail_on_unmatched_files: true
          files: |
            release/raphael-xnu-r37-flash.img
            release/raphael-xnu-r37-gpu-flash.img
            release/raphael-r37-flashboot.apfs
            release/r37-md1-root.apfs
            release/r37-volume-manifest.json
            release/SHA256SUMS
            release/README.txt
            release/toolchain-versions.txt
      - name: "直链汇总（跑完看这里，复制即用）"
        run: |
          set -eu
          echo "════════════ 全部下载直链 ════════════"
          for f in "$REL"/raphael-xnu-r37-flash.img "$REL"/raphael-xnu-r37-gpu-flash.img \
                   "$REL"/raphael-r37-flashboot.apfs "$REL"/r37-md1-root.apfs \
                   "$REL"/r37-volume-manifest.json "$REL"/SHA256SUMS "$REL"/README.txt \
                   "$REL"/toolchain-versions.txt; do
