      - name: "⑥/⑥ SHA256 + README + 发布 Release（只有 boot 资产，几十 MB）"
        run: |
          set -eu
          cd "$REL"
          : > SHA256SUMS
          for f in raphael-xnu-r24-flash.img raphael-xnu-r24-gpu-flash.img \
                   raphael-r24-flashboot.apfs r24-md1-root.apfs; do
            sha256sum "$f" >> SHA256SUMS
          done
          REPO="${{ github.repository }}"
          TAG="${{ inputs.release_tag }}"
          cat > README.txt <<EOF
          ============================================================
           R24 · 纯血 hackios SpringBoard 交付包（raphael / K20 Pro）
           —— boot-only：iOS 卷不随行（手机里已刷好，R5-R13 字节相同）
          ============================================================
          ⚠️⚠️⚠️ 启动卷只 stage 一个文件：raphael-r24-flashboot.apfs ⚠️⚠️⚠️
            （R14 事故纪律不变：md1 备份不要 stage，flash.img 已内嵌全量小卷）
          主镜像   : raphael-xnu-r24-flash.img（触摸 + 按键 + 八核；
                     cmdline touchscreen=1 buttons=1 cpus=8）
          GPU 镜像 : raphael-xnu-r24-gpu-flash.img（同上 + gpu=1：
                     梯子进 step 19 的水域——本机原厂文件，量产链受审）
          启动卷   : raphael-r24-flashboot.apfs（stage0 = md0；R13
                     全量字节，真机验证过）
          小卷备份 : r24-md1-root.apfs（md1 同字节备份，勿 stage；
                     其 fw/a640_zap.mbn 已换成本机原厂签名件）
          内核     : 本仓库源码构建；R24 = 换血。
                     R23 实锤：判词自报 "A TEST KEY"（高通 SecTools 测
                     试链），零页对照 -3145738 换码——TZ 读得动我们的缓
                     冲、拒的是镜像（-(0x3000xx) 码族实证：0x0A=零页解
                     析拒、0x45=测试链签名拒）。R21-R23 七次同码的唯一
                     变量 = 签名链。
                     R24 改动：md1 卷内 fw/a640_zap.mbn 同长置换为本机
                     /vendor 原厂件（14256B，sha256 627ecc6a…，
                     "Xiaomi Attestation CA"/"Xiaomi Root CA"；与旧件
                     差 3453B 全在证书区，代码字节相同）；内核三岔判词
                     （A TEST KEY / THE PHONE'S OWN PRODUCTION CHAIN /
                     无标记兜底）；R23 其余机制全保留（单一规范尝试、
                     零页对照、动态页落位 adreno_zapmem=、签名链取证）。

          【R24 判读】（GPU 镜像，klog 里 adreno: 19）
          - "THE SIGNATURE CHAIN SAYS: THE PHONE'S OWN PRODUCTION
            CHAIN (Xiaomi Attestation CA / Xiaomi Root CA)" = 换血成功、
            文件就是本机 vendor 的那一份。
            （若仍 "A TEST KEY" = 旧卷压过了置换——整段回传）
          - "one attempt..." → "TrustZone returns 0, answer 0" = 被收！
            → 落位（新页）→ 写 1968 字节 → 0xc2000205 →
              "TRUSTZONE HAS AUTHENTICATED AND STARTED THE ZAP SHADER"
              = step 19 done → 20（CP 出安全模式）→ 21（commands）
              = 新水域（GPU 真正活过来的第一口水）
          - 量产链仍 -3145797 = 链不是全部（防回滚版本 vs TZ 底线、
            TZ 侧 GPU 记录）；零页对照照打：再换码仍是缓冲通路铁证，
            任何新码都是进展
          - 任一新码 = 进展，整段回传
          - 全败 → supports/give-up 诊断收尾，系统软件渲染
          - adreno_tzunload=1：give-up 提前发；adreno_zapmem=0x98f15000：
            强制 DT 区落位（A/B）
          - 任何一步停住：整段回传 klog（fastboot oem log +
