name: "SpringBoard 通用流水线（唯一工作流：所有轮共用。轮次差异 = dispatch 输入：底板三件直链+SHA / 轮门禁脚本 / 手术与判读命令模板 / Release 文本。输出命名 = <round>-*；发布 tag = release_tag）"
on:
  workflow_dispatch:
    inputs:
      round:
        description: "轮次短名（r41/r42/…）：缓存键、产物与资产文件名的唯一来源"
        required: true
        default: "r50"
      release_tag:
        description: "Release tag（直链的一部分）"
        required: true
        default: "r50-springboard"
      release_name:
        description: "Release 标题"
        required: true
        default: "R50 · 纯血 hackios SpringBoard · 寄存器全息轮（R49 判读：HR2 成立——faults 全是成功 page-in，1063 失败全 kernel copyio EFAULT；双形态已命名：Assets.car 只读映射当写缓冲（HR4）与 exec argv 垃圾顶位（HR3）；本轮每条判词带 SVC 现场 x16 + x0-x5，fd/buf/len 与 argv 数组地址一线点名；cmdline 仍 R39 形 verbatim；判决树 HR6-HR7）"
      # 教训（run 41040910832）：GitHub Release name 上限 256 字符——判读叙事全部
      # 写进 release_body（无此上限），release_name 只留一行标题。
      kernel_repo:
        description: "hackios 内核树 fork（含 xnu/ + tools/）"
        required: true
        default: "Gsjsjzhznsz/hackios-xnu-kernel"
      wifi_stack:
        description: "WiFi 对象进内核（诊断开关：0 = 不带 ath10k.o 构建）"
        required: false
        default: "1"
      base_daily_url:
        description: "底板日常镜像直链（SHA 必填；本轮日常镜像的来源）"
        required: true
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r49-springboard/raphael-xnu-r49-flash.img"
      base_daily_sha:
        description: "底板日常镜像 sha256（对官方字节硬校验）"
        required: true
        default: "b0f9f6df4ea13ad9d45048e7ff15e33d7b2fcb67204d01964b1014517ca8a60b"
      base_gpu_url:
        description: "底板 GPU 镜像直链（外科手术的底板）"
        required: true
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r49-springboard/raphael-xnu-r49-gpu-flash.img"
      base_gpu_sha:
        description: "底板 GPU 镜像 sha256"
        required: true
        default: "5fb121836d823c8f4a99205bd74ba3e4aa8e00deaf63798384f133450c2319dd"
      base_flashboot_url:
        description: "底板启动卷直链（原样转发进 Release）"
        required: true
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r49-springboard/raphael-r49-flashboot.apfs"
      base_flashboot_sha:
        description: "底板启动卷 sha256"
        required: true
        default: "14485e7c5ce125ef516168445c2500ac04ca5e40a908c2aef516b2d92c24ba0c"
      base_entry_shas:
        description: "底板 GPU 镜像内条目 sha 钉死（每行一条 name=sha；name ∈ loader.efi/kernel/ramdisk；空 = 只提取不校验）"
        required: false
        default: |
          loader.efi=4bf828e425e4b59d3668461ff89ef290dfbf3215cceec903f1662255fe45a3db
          kernel=72d75d4945eef15f8664b681adcb2d18f055d512e2913dfc14e734020427f4db
          ramdisk=5b9bbbcb6b5ede61d734bf8144fc639d4e419a22bb81e7d6cf93141f4fbe8746
      base_id_cmd:
        description: "底板判读命令（可选；空 = 跳过。占位符：$BASE_DAILY $BASE_GPU $BASE_IDFILE）"
        required: false
        default: "python3 tools/r50-kernel-id.py \"$BASE_DAILY\" \"$BASE_GPU\" | tee \"$BASE_IDFILE\""
      base_id_gates:
        description: "底板判读门禁（bash；占位符：$BASE_IDFILE。空 = 跳过）"
        required: false
        default: |
          grep -c "the kernel entry is R33" "$BASE_IDFILE" | grep -qx 1 || { echo "::error::日常底板的内核必须判为 R33（控制组）"; exit 1; }
          grep -c "the kernel entry is R49" "$BASE_IDFILE" | grep -qx 1 || { echo "::error::GPU 底板的内核必须判为 R49（R50 的门禁基准）"; exit 1; }
          grep -q "the cmdline is the R39 GPU form verbatim" "$BASE_IDFILE" || { echo "::error::GPU 底板的 cmdline 不是 R39 组原样"; exit 1; }
          grep -c "the cmdline is the daily image WITHOUT" "$BASE_IDFILE" | grep -qx 1 || { echo "::error::日常底板的 cmdline 应无任何 gpu token"; exit 1; }
          # 门禁必须 grep 工具的真实判定词，不能写起草者假设的那句（run 40838276403 教训）：
          grep -c "the ramdisk entry is R39..R50" "$BASE_IDFILE" | grep -qx 1 || { echo "::error::GPU 底板的小卷不是 R39..R50 卷（5b9bbbcb）"; exit 1; }
          grep -c "the ramdisk entry is R13..R33" "$BASE_IDFILE" | grep -qx 1 || { echo "::error::日常底板的小卷不是 R13 谱系"; exit 1; }
      pre_gate_py:
        description: "门禁一/二（python，argv[1]=新内核路径）：谱系 + 换代件标记逐字在字节里"
        required: false
        default: |
          import sys
          b = open(sys.argv[1], 'rb').read()
          def n(s): return b.count(s.encode())
          assert n('R33: the kernel generation line') == 2, 'R33 generation line x%d != 2' % n('R33: the kernel generation line')
          assert n('R33: the resident round') == 1 and n('SCMDMP: R33 begins') == 1, 'R33 lineage markers broken'
          assert n('R32: the kernel generation line') == 0, 'a stale R32 stamp rides'
          assert n('R40: the first dropped frame buys the full core snapshot') == 0, 'the retired R40 marker still rides'
          assert n('R41: the snapshot buys its own ride onto the storage too') == 0, 'the retired R41 marker still rides'
          assert n('R42: the fault names the file that died, pager forensics') == 0, 'the retired R42 marker still rides'
          assert n('R43: the probe try-locks first or walks away, no recurse') == 0, 'the retired R43 marker still rides'
          assert n('R44: the kernel asks each fatal exception to name itself') == 0, 'the retired R44 marker still rides'
          assert n('R45: the signal funnel writes who died and what was sent') == 0, 'the retired R45 marker still rides'
          assert n('R46: the signal birth ledger names every hand that feeds') == 0, 'the retired R46 marker still rides'
          assert n('R47: the flush rule lands every born line in the logdump') == 0, 'the retired R47 marker still rides'
          assert n('R48: the census counts every hand at work, live, no gate') == 0, 'the retired R48 marker still rides'
          assert n('R49: the hologram names the hand and path of every fault') == 0, 'the retired R49 marker still rides'
          for mark, why in [
              ('raphael-display: three scanout buffers, VIG0/CTL0, hardware TE', 'the display round (adreno side)'),
              ('display: raphael command TE:', 'the TE phase measurement (display.c)'),
              ('page flips retained (fb_scan=1)', 'the fb_scan boot-arg'),
              ('wifi: raphael needs WCN3990 SNOC/ath10k and MPSS service 0x45', 'the raphael Wi-Fi branch'),
              ('raphael-display: flip did not latch at TE, restoring boot framebuffer', 'the flip fallback'),
              ('R50: the registers name the syscall behind every failure', 'THE R50 register hologram marker'),
          ]:
              assert n(mark) == 1, '%s x%d != 1 (%s)' % (mark, n(mark), why)
          assert n('sigbirth: %s[%d] signal %d code 0x%llx from 0x%llx by %s[%d]\n') == 1, 'the sigbirth format x%d != 1 (the birth wire must be packed)' % n('sigbirth: %s[%d] signal %d code 0x%llx from 0x%llx by %s[%d]\n')
          assert n('sigpost: %s[%d] exception %d code 0x%llx 0x%llx\n') == 1, 'the sigpost format x%d != 1 (the R45 funnel wire must stay packed)' % n('sigpost: %s[%d] exception %d code 0x%llx 0x%llx\n')
          assert n('siglive: birth ') == 1, 'the R48 live-probe format x%d != 1 (the census did not pack)' % n('siglive: birth ')
          assert n('sigcensus: births ') == 1, 'the R48 census format x%d != 1 (the sing-out did not pack)' % n('sigcensus: births ')
          assert n('redwood-fault: ') == 2, 'the redwood-fault literal x%d != 2 (the R49 context wire + the R50 registers format did not pack)' % n('redwood-fault: ')
          assert n('redwood-fault: verdict %d context: ') == 1, 'the R49 CONTEXT format x%d != 1 (the R49 wire must stay packed)' % n('redwood-fault: verdict %d context: ')
          assert n('redwood-fault: verdict %d registers: ') == 1, 'the R50 registers format x%d != 1 (the register hologram did not pack)' % n('redwood-fault: verdict %d registers: ')
          assert n('r49-deliver: ') == 1, 'the R49 deliver format x%d != 1 (the funnel re-mount must stay packed)' % n('r49-deliver: ')
          assert b'redwood_user_fault_exit' in b, 'the R49 exit-census symbol is missing (the sleh wire did not stay packed)'
          assert b'redwood_user_fault_deliver' in b, 'the R49 deliver symbol is missing (the sleh wire did not stay packed)'
          assert n('frame dropped') == 2, 'the forensic literal x%d != 2 (the IOLog format string + the report literal)' % n('frame dropped')
          assert n('redwood-pager: verdict') == 6, 'the pager verdict literal x%d != 6 (the four R42 verdict formats + the two R43 busy formats; R50 adds no pager format -- the register hologram rides the redwood-fault literal)' % n('redwood-pager: verdict')
          assert n('XNULIVE4') >= 1, 'the R38 loader-framebuffer channel mark is missing (x%d)' % n('XNULIVE4')
          assert n('wifi_step') >= 1, 'the wifi boot-arg surface is missing'
          print('门禁一/二全过：R33 谱系 4 项 + R38 显示/WiFi/通道 5 项 + 取证字面量 2 处 + pager 判词 6 处 + R50 标记 1 项 + redwood-fault x2（context+registers）/r49-deliver x1 + sigbirth/sigpost/siglive/sigcensus 各 1 项 + R49/R48/R47/R46/R45/R44/R43/R42/R41/R40 标记零残留')
      kernel_gate_cmd:
        description: "门禁三命令模板（可选；占位符：$BASE_KERNEL $K $KU $KSHA $REL $R）"
        required: false
        default: "python3 tools/r50_kernel_gate.py --base-kernel \"$BASE_KERNEL\" --r50-kernel \"$K\" --report \"$REL/${R}-kernel-gate.txt\" | tee \"$REL/${R}-kernel-gate-run.txt\""
      flash_build_cmd:
        description: "④ 手术命令模板（必填；占位符：$BASE_DAILY $BASE_GPU $K $REL $R）"
        required: true
        default: "python3 tools/r50_flash_build.py --daily \"$BASE_DAILY\" --gpu \"$BASE_GPU\" --kernel \"$K\" --out-daily \"$REL/raphael-xnu-${R}-flash.img\" --out-gpu \"$REL/raphael-xnu-${R}-gpu-flash.img\" | tee \"$REL/${R}-pack.txt\""
      kernel_id_cmd:
        description: "⑤ 判读命令模板（必填；占位符：$REL $R $KSHA）"
        required: true
        default: "python3 tools/r50-kernel-id.py \"$REL/raphael-xnu-${R}-flash.img\" \"$REL/raphael-xnu-${R}-gpu-flash.img\" --expect-loader-sha 4bf828e425e4b59d3668461ff89ef290dfbf3215cceec903f1662255fe45a3db --expect-kernel-sha \"$KSHA\" --expect-volume-sha 5b9bbbcb6b5ede61d734bf8144fc639d4e419a22bb81e7d6cf93141f4fbe8746 | tee \"$IDFILE\""
      id_gates:
        description: "⑤ 复证门禁（bash；占位符：$IDFILE。教训：必须 grep 工具的真实判定词，run 40838276403）"
        required: true
        default: |
          grep -c "loader  sha256" "$IDFILE" | grep -qx 2 || { echo "::error::双镜像都要读到 loader 条目"; exit 1; }
          grep -c "the kernel entry is R50" "$IDFILE" | grep -qx 1 || { echo "::error::GPU 镜像内核判词不是 R50（本轮 register hologram 构建）"; exit 1; }
          grep -c "the kernel entry is R33" "$IDFILE" | grep -qx 1 || { echo "::error::日常镜像内核必须仍是 R33（控制组）"; exit 1; }
          grep -c "the cmdline is the R39 GPU form verbatim" "$IDFILE" | grep -qx 1 || { echo "::error::GPU 镜像 cmdline 不是 R39 组原样（R50 零 cmdline 改动，register hologram 默认开无需 boot-arg）"; exit 1; }
          grep -c "the cmdline is the daily image WITHOUT" "$IDFILE" | grep -qx 1 || { echo "::error::日常镜像必须无任何 gpu token（控制组原样）"; exit 1; }
          grep -c "the ramdisk entry is R39..R50" "$IDFILE" | grep -qx 1 || { echo "::error::GPU 镜像小卷不是 R39..R50 卷（5b9bbbcb）"; exit 1; }
          grep -c "the ramdisk entry is R13..R33" "$IDFILE" | grep -qx 1 || { echo "::error::日常镜像小卷不是 R13 谱系"; exit 1; }
      pre_release_cmd:
        description: "⑥ 前置命令模板（可选；转发/台账等；占位符：$BASE_FLASHBOOT $BASE_GPU $REL $R）"
        required: false
        default: |
          cp base/flashboot.apfs "$REL/raphael-${R}-flashboot.apfs"
          cp base/md1-root.apfs "$REL/${R}-md1-root.apfs"
          cat "$REL/${R}-kernel-sha.txt" >> "$REL/toolchain-versions.txt"
          {
            echo "${R} lineage (loader/cmdline/md1 = the base release's bytes re-packed; only the kernel moved)"
            sha256sum "$REL/raphael-${R}-flashboot.apfs" "$REL/${R}-md1-root.apfs"
          } >> "$REL/toolchain-versions.txt"
      release_readme:
        description: "README.txt 全文（逐字进 Release 资产）"
        required: true
        default: |
          raphael (K20 Pro) R50 交付包：**寄存器全息轮（询凶续集Ⅴ）**。

          R49 真机判读入账（本仓库档，run 41099365467）：收割全绿（KSHA
          72d75d49 逐位闭环）；持久化刷入 + 启动卷律 + run1 存活 9 分钟
          零 panic；sigcensus x9 唱票全在膛；HR2 成立——faults 全是成
          功 page-in（uf-ok 119,646/119,656，delivered 0），1063 次
          vm_fault 失败全 kernel copyio EFAULT（绕 handle_user_abort），
          triage 漏斗无罪；R43 时代 SIGBUS 浪潮 = 用户态 exc handler
          自发，非 kernel 送达。

          全息判决双破案（R50 指刀）：HR4——kr 0x2 ×111 全部 ask
          read-write 对 entry prot 0x1/7（只读 Assets.car 上的写请求），
          调用者 pc 0x20d6ff814（dyld 共享缓存），SpringBoard ×72 +
          Spotlight ×32——用户态把只读文件映射当写缓冲传 syscall
          （copyout 目的地）→ EFAULT；HR3——kr 0x1 ×30 = 0xff70/0xffc0
          垃圾顶位，调用者 = 共享缓存 exec shim 0x20d7034f8 ×23 +
          init 0x100006810 ×6——exec argv 指针数组坏顶位。

          R50 一刀（寄存器全息）：upcb 就是 SVC 现场——ARM64 ABI 上
          x16 携带 syscall 号、x0-x5 携带前六参，穿 SVC 不变。每条
          verbose 判词加一行：x0/x1/x2 = fd/buf/len（HR4 的 copyout
          目的地就是 buf）——HR3 的 x1 = argv 数组地址（数组本身没映射
          与数组内容坏一线区分）。零新锁、零新出口、预算不变——一线
          之增。

          【刷机与取证】
          1. fastboot flash boot raphael-xnu-r50-gpu-flash.img; fastboot reboot
          2. 启动卷律（必守）：oem ramdisk 臂 → fastboot stage
             raphael-r50-flashboot.apfs → stage XNUP → oem run（漏
             stage = launchd ENOENT panic）
          3. 让它跑 >= 10 分钟（R49 run1 存活 9 分钟，SB4 已过）
          4. oem logdump / oem log 抓全量日志回传
          【判读树 HR6-HR7（预注册）】
          HR6（HR4 续）= registers 行点名 x16 与 x0/x1/x2：若 x1（buf）
                落在 Assets.car 映射内 → 写哪个 syscall、fd 指向什么、
                长度多少全在手——下一轮修用户态（只读映射当缓冲的
                调用点）或 kernel 侧给只读页 COW 临时页。
          HR7（HR3 续）= x16 = execve 且 x1 落在 map 内：argv 数组本身
                有映射、数组内容坏 → copyin 层再抓数组内寄（下一轮）
                或直接审计用户态 exec shim（PAC 签名指针/未初始化栈）。
          守恒律沿袭（faults ≈ 四出口合计，gap 10 仍在观）；SB2 节流
          纪律 / SB3 panic 护栏 / SB4 白苹果 flip>=2 / SB5 WiFi 缺固件
          （已知遗留）全部沿袭。
          【镜像说明】
          - raphael-xnu-r50-flash.img = 日常控制组（= r49 逐字节原样）
          - raphael-xnu-r50-gpu-flash.img = 本轮目标镜像（仅 kernel 条目换新）
          - 启动卷 stage 一次：raphael-r50-flashboot.apfs 或固件+NV 版
          ⚠️ 含 Apple 版权内容，仅供个人研究；下载完成后请尽快删除本 Release。
      release_body:
        description: "GitHub Release 正文"
        required: true
        default: |
          raphael (K20 Pro) R50 交付包：**寄存器全息轮（询凶续集Ⅴ）**。

          R49 真机定案（run 41099365467）：收割全绿（KSHA 72d75d49）；
          持久化刷入 + 启动卷律 + run1 九分钟零 panic、SB4 过、零
          "Lock already held"；HR2 成立——faults 全成功 page-in、
          失败全 kernel copyio EFAULT（delivered 0，triage 漏斗无罪）。
          全息判决双破案：HR4 = 只读 Assets.car 映射当 syscall 写缓冲
          （copyout 目的地，SpringBoard ×72 + Spotlight ×32）；HR3 =
          exec argv 指针数组坏顶位（0xff70/0xffc0，exec shim ×23 +
          init ×6）。

          R50 一刀（寄存器全息）：upcb = SVC 现场——x16 携带 syscall
          号、x0-x5 携带前六参穿 SVC 不变；每条 verbose 判词加一行
          寄存器全息（fd/buf/len 与 argv 数组地址一线点名，HR4/HR3
          各自闭环）。零新锁零新出口，预算不变。标记同长换替
          （R50: the registers name the syscall behind every failure）。

          本轮判决问题（HR6-HR7 预注册）：HR4 的 syscall 是谁（x16
          对表 + fd/buf/len）、HR3 的 argv 数组是本身没映射还是内容
          坏（x1 对 map）——一次 boot 全部给出答案。

          内核 = R49 + 寄存器全息一行（redwood_fault_convict.c
          registers 行 + R50 标记）；loader/cmdline/卷 = r49 原字节；
          日常镜像 = r49 逐字节控制组。
          WiFi 固件+NV 走 flashboot 用户侧重建（已知遗留）。
      checksum_files:
        description: "进 SHA256SUMS 的文件名（空格分隔，相对 release/；通常是双镜像+启动卷+md1）"
        required: true
        default: "raphael-xnu-r50-flash.img raphael-xnu-r50-gpu-flash.img raphael-r50-flashboot.apfs r50-md1-root.apfs"
      release_files:
        description: "进 Release 的文件（每行一个，相对 release/）"
        required: true
        default: |
          raphael-xnu-r50-flash.img
          raphael-xnu-r50-gpu-flash.img
          raphael-r50-flashboot.apfs
          r50-md1-root.apfs
          r50-kernel-gate.txt
          SHA256SUMS
          README.txt
          toolchain-versions.txt
permissions:
  contents: write
concurrency:
  group: springboard-${{ inputs.round }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      REL: ${{ github.workspace }}/release
      R: ${{ inputs.round }}
      THEOS: /home/runner/theos     # (literal: GitHub Actions' env: block expands nothing)
      CCACHE_DIR: ${{ github.workspace }}/hackios/.ccache
    steps:
      # ---------------------------------------------------------------
      - name: "①/⑧ 磁盘准备与依赖（内核工具链）"
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-dev clang lld ccache \
                       flex bison m4 perl python3 autoconf automake libtinfo6 xz-utils uuid-dev 7zip \
                       ripgrep >/dev/null
          command -v clang && command -v ccache && command -v 7z && command -v rg
          # dsymutil：Ubuntu 的 apt clang 不往 /usr/bin 放它（R11 run 39973048286 的教训）
          DS=$(command -v dsymutil || clang --print-prog-name=dsymutil 2>/dev/null || true)
          [ -x "$DS" ] || DS=$(ls /usr/lib/llvm-*/bin/dsymutil 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$DS" ] && [ -x "$DS" ]; then
            sudo ln -sf "$DS" /usr/bin/dsymutil
          else
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/bin/dsymutil >/dev/null && sudo chmod +x /usr/bin/dsymutil
          fi
          mkdir -p "$REL"
          {
            echo "$R toolchain audit (recorded $(date -u +%FT%TZ))"
            echo "--- runner image ---"
            cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION)=' || true
            echo "--- apt clang (the kernel's host compiler) ---"
            clang --version | head -2
            lld --version 2>/dev/null || true
          } | tee "$REL/toolchain-versions.txt"
          df -h /

      # ---------------------------------------------------------------
      # ② 取树 + 取底板三件（SHA 对官方字节硬校验，统一存 base/{daily,gpu,flashboot}）
      #    + 底板条目提取（loader/kernel/ramdisk，可选 sha 校验）+ 底板判读（可选）。
      - name: "②/⑧ 取树 + 取底板三件 + 条目提取（SHA 硬校验）+ 底板判读"
        env:
          U_DAILY: ${{ inputs.base_daily_url }}
          S_DAILY: ${{ inputs.base_daily_sha }}
          U_GPU: ${{ inputs.base_gpu_url }}
          S_GPU: ${{ inputs.base_gpu_sha }}
          U_FB: ${{ inputs.base_flashboot_url }}
          S_FB: ${{ inputs.base_flashboot_sha }}
          S_ENTRIES: ${{ inputs.base_entry_shas }}
          BASE_ID_CMD: ${{ inputs.base_id_cmd }}
          BASE_ID_GATES: ${{ inputs.base_id_gates }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/${{ inputs.kernel_repo }}.git" hackios
          cd hackios
          echo "→ 内核树 @ $(git log -1 --format='%h %s')"
          mkdir -p base
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/daily.img      "$U_DAILY"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/gpu.img        "$U_GPU"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/flashboot.apfs "$U_FB"
          # 硬校验：三件资产必须等于输入钉死的官方字节
          sha256sum base/daily.img base/gpu.img base/flashboot.apfs | tee base/SHA256SUMS.base
          test "$(sha256sum base/daily.img | cut -d' ' -f1)" = "$S_DAILY" || { echo "::error::日常底板 sha 不符"; exit 1; }
          test "$(sha256sum base/gpu.img   | cut -d' ' -f1)" = "$S_GPU"   || { echo "::error::GPU 底板 sha 不符"; exit 1; }
          test "$(sha256sum base/flashboot.apfs | cut -d' ' -f1)" = "$S_FB" || { echo "::error::启动卷底板 sha 不符"; exit 1; }
          echo "底板三件全部等于输入钉死的官方字节"
          # 底板条目提取（通用 XNUP 解析）：loader.efi / kernel / ramdisk + 输入钉死的 sha 校验
          python3 - base/gpu.img <<'PY'
          import gzip, hashlib, os, struct, sys
          img = open(sys.argv[1], 'rb').read()
          page = struct.unpack_from('<I', img, 36)[0]; k_size = struct.unpack_from('<I', img, 8)[0]
          blob = gzip.decompress(img[page:page + k_size]); x = blob.find(b'XNUP')
          assert x > 0, 'no XNUP payload in the base gpu image'
          size = struct.unpack('<I', blob[x + 4:x + 8])[0]; i = x + 8
          want = {}
          for line in os.environ.get('S_ENTRIES', '').splitlines():
              line = line.strip()
              if not line:
                  continue
              name, _, sha = line.partition('=')
              want[name.strip()] = sha.strip()
          assert set(want) <= {'loader.efi', 'kernel', 'ramdisk'}, 'unknown entry names in base_entry_shas: %s' % set(want)
          names = {'loader.efi': 'base/loader.efi', 'kernel': 'base/kernel.bin', 'ramdisk': 'base/md1-root.apfs'}
          seen = set()
          while i + 24 <= x + 8 + size and blob[i] != 0:
              name = blob[i:i + 16].rstrip(b'\0').decode(); esz = struct.unpack('<I', blob[i + 16:i + 20])[0]
              if name in want:
                  data = blob[i + 24:i + 24 + esz]
                  got = hashlib.sha256(data).hexdigest()
                  exp = want[name]
                  if exp:
                      assert got == exp, 'the base %s is %s, not the pinned %s' % (name, got, exp)
                  open(names[name], 'wb').write(data)
                  print('base %s 提取：%d B, sha %s%s' % (name, len(data), got, '（= 钉死官方字节）' if exp else '（未钉，仅记录）'))
                  seen.add(name)
              i += 24 + ((esz + 15) & ~15)
          assert seen == set(want), 'the base gpu image misses entries: %s' % (set(want) - seen)
          PY
          # 底板判读（可选；模板占位符在此导出）
          if [ -n "$BASE_ID_CMD" ]; then
            export BASE_DAILY="$PWD/base/daily.img" BASE_GPU="$PWD/base/gpu.img" BASE_FLASHBOOT="$PWD/base/flashboot.apfs"
            BASE_IDFILE="$PWD/base-id.txt"
            export BASE_IDFILE
            printf '%s' "$BASE_ID_CMD" > /tmp/base-id.sh
            bash -eo pipefail /tmp/base-id.sh
            if [ -n "$BASE_ID_GATES" ]; then
              printf '%s' "$BASE_ID_GATES" > /tmp/base-id-gates.sh
              bash -eo pipefail /tmp/base-id-gates.sh
              echo "底板判读门禁全绿。"
            fi
          fi

      # ---------------------------------------------------------------
      # R28i 工具链纪律（原样继承）：缓存键随轮次、无 restore 链，重建确定性。
      - name: "②c/⑧ 缓存：theos（工具链 + iPhoneOS16.5.sdk；随轮全新键、无 restore 链）"
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: ${{ inputs.round }}-theos-v19L2-v1
      - name: "②d/⑧ 缓存：xnu-deps（Apple 开源件 + host 工具 + SDK 链接树；随轮全新键、无 restore 链）"
        uses: actions/cache@v4
        with:
          path: hackios/xnu-deps
          key: ${{ inputs.round }}-xnu-deps-v1
      - name: "②e/⑧ ccache（随轮 clean build——零回填，只存不用）"
        uses: actions/cache@v4
        with:
          path: hackios/.ccache
          key: ${{ inputs.round }}-ccache-${{ github.run_id }}

      # ---------------------------------------------------------------
      # ③ 内核构建 + 门禁（门禁一/二 = pre_gate_py 输入；门禁三 = kernel_gate_cmd 输入）。
      #    BUILD_DSYM=0 + pipefail（R34/R35/R38/R40 四轮教训全数继承）。
      - name: "③/⑧ 内核构建 + 门禁（theos v19.0.0-L2 + xnu/apply.sh + xnu-deps + mk-ath10k.py → WIFI_OBJECT + BUILD_DSYM=0）"
        env:
          WIFI_STACK: ${{ inputs.wifi_stack }}
          PRE_GATE_PY: ${{ inputs.pre_gate_py }}
          KERNEL_GATE_CMD: ${{ inputs.kernel_gate_cmd }}
        run: |
          set -euo pipefail
          # pipefail（run 40826230850 教训）：门禁 | tee 管道会吞掉门禁的退出码，
          # 门禁在 CI 上崩溃后构建照常跑完——门禁必须能杀死构建。
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/ld64" ]; then
            rm -rf "$THEOS"
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
            mkdir -p "$THEOS/toolchain"
            curl -fL --retry 3 --retry-delay 5 -sS https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          fi
          "$THEOS/toolchain/linux/iphone/bin/ld64" --version | tee -a "$REL/toolchain-versions.txt" || true
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" ]; then
            rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk" /tmp/theos-sdks
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
            git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
            mkdir -p "$THEOS/sdks"
            mv /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
            rm -rf /tmp/theos-sdks
          fi
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" || { echo "::error::iPhoneOS16.5.sdk 就位失败"; exit 1; }
          df -h /
          cd hackios
          xnu/apply.sh
          XNU_HOST_CLANG="$THEOS/toolchain/linux/iphone/bin/clang"
          export XNU_HOST_CLANG
          test -x "$XNU_HOST_CLANG" || { echo "::error::theos 工具链 clang 缺位"; exit 1; }
          "$XNU_HOST_CLANG" --version | tee -a "$REL/toolchain-versions.txt"
          grep -q "eabca92" "$REL/toolchain-versions.txt" || { echo "::error::内核编译器不是钉死的 theos clang"; exit 1; }
          bash xnu-deps/setup.sh || { echo "::error::setup.sh 失败"; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          export XNU_CCACHE=1 CCACHE_COMPILERCHECK=content XNU_WRAPPER_LOG="$PWD/xnu-clang-args.log"
          : > "$XNU_WRAPPER_LOG"
          ccache -C >/dev/null 2>&1 || true
          ccache -M 2G >/dev/null 2>&1 || true
          # WiFi 对象：mk-ath10k.py 钉版下载 → 编 ath10k.o → WIFI_OBJECT 进内核链接
          export CC="$XNU_HOST_CLANG"
          if [ "$WIFI_STACK" = "1" ]; then
            python3 tools/mk-ath10k.py
            A=xnu-deps/build/ath10k/out/ath10k.o
            test -s "$A" || { echo "::error::ath10k.o 没有产出"; exit 1; }
            echo "→ ath10k.o: $(sha256sum "$A" | cut -d' ' -f1) ($(stat -c %s "$A") B)"
            export WIFI_OBJECT="$PWD/$A"
          else
            echo "→ 诊断轮：不带 ath10k.o（wifi_stack=0）"
          fi
          ./xnu-build.sh -j4 -k BUILD_DSYM=0 \
            || echo "（make 退出码 $?——上游文档：链接后的检查，内核若已产出即成功）"
          # run#3 验尸（40853122934）：K 曾是无 export 的普通变量——门禁一/二由步 shell
          # 自己展开 "$K" 所以活得好好的，而门禁三模板经 /tmp/kernel-gate.sh 交给子 bash
          # 执行，$K 展开成空串 => 轮 gate 工具 open('') 崩；又因 python|tee 管道无
          # pipefail，tee 0 退出把崩溃整个吞掉，步③假绿，缺件迟到步⑥才被预检点名。
          # 教训：喂给子 bash 模板的占位符必须 export（BASE_KERNEL 就是这么活下来的）；
          # 门禁调用一律 bash -eo pipefail，工具崩 = 步当场死。
          export K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          ls -la "$K" || { echo "::error::内核没有产出"; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          KU=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped
          cp -f "$K" "$REL/${R}-kernel-stripped.bin" || true
          cp -f "$KU" "$REL/${R}-kernel-unstripped.bin" || true
          AS=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/config/allsymbols
          [ -f "$AS" ] && cp -f "$AS" "$REL/${R}-allsymbols.txt" || true
          KSHA=$(sha256sum "$K" | cut -d' ' -f1)
          echo "KSHA=$KSHA" >> "$GITHUB_ENV"
          echo "$KSHA  $R-kernel" > "$REL/${R}-kernel-sha.txt"
          cp "$K" "$REL/${R}-kernel.bin"
          # --- 门禁一/二（可选）：谱系 + 换代件标记逐字在字节里
          if [ -n "$PRE_GATE_PY" ]; then
            echo "→ 门禁一/二：谱系与换代件标记"
            printf '%s' "$PRE_GATE_PY" > /tmp/pre_gate.py
            python3 /tmp/pre_gate.py "$K"
          fi
          # --- 门禁三（可选）：本轮 gate 工具对底板内核
          if [ -n "$KERNEL_GATE_CMD" ]; then
            echo "→ 门禁三：轮 gate（新内核 vs 底板内核）"
            export BASE_KERNEL="$PWD/base/kernel.bin"
            printf '%s' "$KERNEL_GATE_CMD" > /tmp/kernel-gate.sh
            bash -eo pipefail /tmp/kernel-gate.sh
          fi

      # ---------------------------------------------------------------
      - name: "诊断产物（wrapper argv 日志 + 内核字节，失败也上传）"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.round }}-diag
          path: |
            hackios/xnu-clang-args.log
            hackios/xnu-deps/exporthdrs.log
            release/${{ inputs.round }}-kernel-stripped.bin
            release/${{ inputs.round }}-kernel-unstripped.bin
            release/${{ inputs.round }}-allsymbols.txt
          if-no-files-found: ignore

      # ---------------------------------------------------------------
      # ④ 打双启动镜像（外科手术命令 = 输入模板；底板 = base/ 三件）
      - name: "④/⑧ 打双启动镜像（外科手术：GPU 镜像按轮模板换条目）"
        env:
          FLASH_BUILD_CMD: ${{ inputs.flash_build_cmd }}
        run: |
          set -euo pipefail
          cd hackios
          export BASE_DAILY="$PWD/base/daily.img" BASE_GPU="$PWD/base/gpu.img"
          export K="$REL/${R}-kernel.bin" KU="$REL/${R}-kernel-unstripped.bin"
          printf '%s' "$FLASH_BUILD_CMD" > /tmp/flash-build.sh
          bash -eo pipefail /tmp/flash-build.sh
          ls -la "$REL"

      # ---------------------------------------------------------------
      # ⑤ 门禁复证：判读命令模板 + 复证门禁输入（教训：grep 工具的真实判定词）。
      - name: "⑤/⑧ 轮判读 + 复证门禁（双镜像）"
        env:
          KERNEL_ID_CMD: ${{ inputs.kernel_id_cmd }}
          ID_GATES: ${{ inputs.id_gates }}
        run: |
          set -euo pipefail
          cd hackios
          export IDFILE="$REL/${R}-kernel-id.txt"
          printf '%s' "$KERNEL_ID_CMD" > /tmp/kernel-id.sh
          bash -eo pipefail /tmp/kernel-id.sh
          printf '%s' "$ID_GATES" > /tmp/id-gates.sh
          bash -eo pipefail /tmp/id-gates.sh
          echo "${R} 复证门禁全绿。"

      # ---------------------------------------------------------------
      # ⑥ SHA256 + README（输入全文）+ 轮前置命令（转发/台账）+ Release
      - name: "⑥/⑧ SHA256 + README + 转发 + Release（${{ inputs.release_tag }}）"
        env:
          CHECKSUM_FILES: ${{ inputs.checksum_files }}
          README_BODY: ${{ inputs.release_readme }}
          PRE_RELEASE_CMD: ${{ inputs.pre_release_cmd }}
          RELEASE_FILES: ${{ inputs.release_files }}
        run: |
          set -eu
          cd hackios
          if [ -n "$PRE_RELEASE_CMD" ]; then
            printf '%s' "$PRE_RELEASE_CMD" > /tmp/pre-release.sh
            bash -eo pipefail /tmp/pre-release.sh
          fi
          ( cd "$REL" && sha256sum $CHECKSUM_FILES ) > "$REL/SHA256SUMS"
          printf '%s\n' "$README_BODY" > "$REL/README.txt"
          echo "README + SHA256SUMS + 转发资产就位"
          # 教训（springboard run#2 验尸，run 40849635001）：softprops/action-gh-release 的 files
          # glob 是相对 workspace 根解析的，而输入契约是"裸名，相对 release/"——裸名必然
          # 零命中，fail_on_unmatched_files 把它变成致命错。此处把每行翻译成 release/ 前缀
          # glob 经 GITHUB_ENV 传给 ⑥b；并预检每项真实存在，缺件直接在 ⑥ 报名（比 action
          # 的笼统 Pattern does not match 好定位）。⑥c 的直链仍用裸名（URL 不带 release/）。
          RELEASE_GLOBS=$(printf '%s\n' "$RELEASE_FILES" | sed -e '/^[[:space:]]*$/d' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^#release/#')
          printf '%s\n' "$RELEASE_GLOBS" | while IFS= read -r g; do
            [ -e "$GITHUB_WORKSPACE/$g" ] || { echo "release 资产缺失: $g（应在 $REL/ 下）"; exit 1; }
          done
          {
            echo "RELEASE_GLOBS<<UNIV_RELEASE_GLOBS_EOF"
            printf '%s\n' "$RELEASE_GLOBS"
            echo "UNIV_RELEASE_GLOBS_EOF"
          } >> "$GITHUB_ENV"
          echo "Release globs（相对 workspace 根）:"
          printf '%s\n' "$RELEASE_GLOBS"
          df -h /

      - name: "⑥b/⑧ 发布 Release（直链交付，${{ inputs.release_tag }}）"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          body: ${{ inputs.release_body }}
          fail_on_unmatched_files: true
          # run#2 教训：action 的 glob 相对 workspace 根解析；输入是裸名（相对 release/），
          # 不可直接投喂——用 ⑥ 翻译出的 release/ 前缀 glob（GITHUB_ENV）。
          files: ${{ env.RELEASE_GLOBS }}

      # ---------------------------------------------------------------
      - name: "⑥c/⑧ 直链汇总（跑完看这里，复制即用）"
        env:
          RELEASE_FILES: ${{ inputs.release_files }}
        run: |
          set -eu
          echo "════════════ 全部下载直链 ════════════"
          {
            printf '%s\n' "$RELEASE_FILES"
            echo "SHA256SUMS"
            echo "README.txt"
            echo "toolchain-versions.txt"
          } | while read -r f; do
            [ -n "$f" ] || continue
            echo "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/$f"
          done
