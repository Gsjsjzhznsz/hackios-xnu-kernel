            https://github.com/${REPO}/releases/download/${TAG}/raphael-xnu-r13-gpu-flash.img
            https://github.com/${REPO}/releases/download/${TAG}/raphael-r13-flashboot.apfs
            https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS

          【CI 提速说明（本轮起）】不再下载/转换/拼接 7.8GB iOS 卷。
          小卷三级获取：actions/cache（键 = userland 提交 + GPU 固件）
          → 上一轮 release 直取 → 完整 iOS 回退（仅首跑或缓存失效）。
          内核走 ccache（xnu-clang 包装器 XNU_CCACHE=1）；theos 与
          xnu-deps 常驻缓存。温跑全程约 15-25 分钟。

          ⚠️ userdata 上的 iOS 卷是唯一存货：绝不要让 MIUI 开机
             （Android 会重格回 f2fs，iOS 卷即毁）。
          ⚠️ 每次开机都要重复 boot/oem ramdisk/stage/oem run 四步
             （启动卷住 RAM 不落盘，"不写手机闪存"设计的一部分）。
          ⚠️ 含 Apple 版权内容，仅个人研究；下载完成后请尽快删除本 Release。
          EOF
          echo "→ SHA256SUMS："
          cat SHA256SUMS

