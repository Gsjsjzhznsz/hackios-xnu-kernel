# =====================================================================
#  R13 · SpringBoard 一键流水线（boot-only 快线，GitHub Actions）
#  -------------------------------------------------------------------
#  R12 真机战报：GMU 已活（step 6 计数器 19198638 Hz = 19.2 MHz 晶振），
#  卡 step 8 —— SMMU 尺寸自检：IDR 实算 0x10000 vs 驱动硬编码 0x20000。
#  R13 三件事：
#    ① SMMU 修复：raphael_adreno.c 的 0x20000 是 SC7280（redwood 母机
#       kgsl-smmu@3da0000）的遗留值；SM8150 的 adreno_smmu@2ca0000
#       主线 dtsi 就是 0x10000，与 R12 实测 IDR 完全一致。常量改正
#       + smmu_layout() 改为 IDR 优先（合理值直接采纳，不再挡路）
#    ② 八核：cmdline 加 cpus=8。内核 SMP 全套是上游现成的
#       （GENERIC_PSCI_SMP + MAX_CPUS 8 + GenericARMCPU 经 PSCI CPU_ON
#       起核），loader 见到 payload 自带 cpus= 就不再注入 cpus=1，
#       探测副核写入 DT，内核自己拉起。预期 7 核（loader 占 core 0）
#    ③ CI 提速（用户要求，急迫）：不再下载/转换/拼接 7.8GB iOS 卷
#       ——手机里早就刷好了。只产 boot 镜像（几十 MB）：
#       - 小卷（root.apfs + flashboot.apfs，各 4MB）三级获取：
#         缓存 → R12 release 直取（已验证 sha256）→ 完整 iOS 回退
#       - theos 工具链 / xnu-deps / ccache 三重 actions/cache
#       - xnu-clang 包装器 XNU_CCACHE=1 走 ccache（本轮起的内核
#         重编译大部分是缓存命中）
#  内核标记：R13 新增 "going with the ID registers"（SMMU 修复断言），
#  R11/R12 全套保留；loader 标记新增 "cores for the kernel, in the
#  order it takes them"（多核路径）。
#  双镜像 cmdline：touchscreen=1 buttons=1 cpus=8 ufs=2 bootcpu=7
#  root_apfs=ufs_userdata（GPU 镜像再 + gpu=1）。
#
#  部署：默认分支 .github/workflows/r13-springboard.yml → Run workflow。
#  注意：重复运行前先删掉旧 Release（或换 release_tag）。
# =====================================================================
name: R13 · SpringBoard 一键流水线（boot-only）
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "hackios 内核树 fork（含 xnu/ + tools/r13-flash-build.sh）"
        required: true
        default: "Gsjsjzhznsz/hackios-xnu-kernel"
      userland_repo:
        description: "hackios userland 树 fork"
        required: true
        default: "Gsjsjzhznsz/hackios-xnu-userland"
      release_tag:
        description: "Release tag（直链的一部分）"
        required: true
        default: "r13-springboard"
      volumes_flashboot_url:
        description: "小卷预取：flashboot 直链（空 = 只走缓存/回退）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r12-springboard/raphael-r12-flashboot.apfs"
      volumes_root_url:
        description: "小卷预取：root.apfs 直链（空 = 只走缓存/回退）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r12-springboard/r12-boot-volume-root.apfs"
permissions:
  contents: write
concurrency:
  group: r13-springboard
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      REL: ${{ github.workspace }}/release
      THEOS: /home/runner/theos     # (literal: GitHub Actions' env: block expands nothing)
      CCACHE_DIR: ${{ github.workspace }}/hackios/.ccache
    steps:
      # ---------------------------------------------------------------
      - name: "①/⑦ 磁盘准备与依赖（内核构建工具链 + 打包工具；iOS 管线依赖仅为回退路径保留）"
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get update -qq
          # 内核构建 + ccache + 打包（r13-flash-build.sh 用 7z 检卷）：
          sudo apt-get install -y -qq build-essential python3-dev clang lld ccache \
                       flex bison m4 perl python3 autoconf automake libtinfo6 xz-utils uuid-dev 7zip >/dev/null
          command -v clang && command -v ccache && command -v 7z
          # dsymutil：Ubuntu 的 apt clang 不往 /usr/bin 放它（上游在 Arch）——
          # 内核链完生成 dSYM 时经 xcrun 包装器 -find 落空，Error 127
          # （R11 run 39973048286 的教训：内核链接已成功，死在其后一步）
          DS=$(command -v dsymutil || clang --print-prog-name=dsymutil 2>/dev/null || true)
          [ -x "$DS" ] || DS=$(ls /usr/lib/llvm-*/bin/dsymutil 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$DS" ] && [ -x "$DS" ]; then
            sudo ln -sf "$DS" /usr/bin/dsymutil
          else
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/bin/dsymutil >/dev/null && sudo chmod +x /usr/bin/dsymutil
          fi
          # iOS 回退路径才需要 lzfse（dmg.py 解 LZFSE）；平时装上无妨（秒级）
          sudo python3 -m pip install --break-system-packages lzfse >/dev/null 2>&1 \
            || python3 -m pip install --user --break-system-packages lzfse >/dev/null || true
          python3 -c "import lzfse; print('→ lzfse 模块就绪（回退路径用）')" || echo "::warning::lzfse 缺失——iOS 回退路径不可用"
          mkdir -p "$REL"
          df -h /

      # ---------------------------------------------------------------
      - name: "②/⑦ 取树（kernel fork + userland fork）并记录小卷键"
        run: |
          set -eu
          git clone --depth 1 "https://github.com/${{ inputs.kernel_repo }}.git" hackios
          cd hackios
          if ! USERLAND_URL="https://github.com/${{ inputs.userland_repo }}.git" common/setup.sh; then
            echo "::warning::userland fork 拉取失败，回退上游 oosexgang/hackios-xnu-userland"
            rm -rf .userland.git
            USERLAND_URL="https://github.com/oosexgang/hackios-xnu-userland.git" common/setup.sh
          fi
          echo "→ raphael 启动链与 R13 打包器："
          ls -lh prebuilt/raphael/ tools/r13-flash-build.sh fw-gpu-raphael/
          git log -1 --format='→ kernel 树 @ %h %s'
          # 小卷缓存键：userland 提交 + GPU 固件内容（两者任一变化才需要重建小卷）
          ULSHA=$(git --git-dir=.userland.git rev-parse HEAD)
          FWSHA=$(ls fw-gpu-raphael/* | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "VOLKEY=${ULSHA:0:12}-${FWSHA:0:12}" >> "$GITHUB_ENV"
          echo "→ 小卷缓存键 VOLKEY=${ULSHA:0:12}-${FWSHA:0:12}"

      # ---------------------------------------------------------------
      - name: "②b/⑦ 编译门禁（R10 loader：编译 + 特征串全验，内核构建前快速失败）"
        run: |
          set -eu
          cd hackios
          bash xnuloader/build.sh
          python3 - <<'PY'
          d = open('xnuloader/loader.efi', 'rb').read()
          for feat in (b'oem gic', b'oem sgi', b'oem peek', b'NXSB at +32',
                     b'as the firmware left it', b'never showed up as pending', b'oem gicset',
                     b'oem gicgroup', b'group repair', b'pre-arm before CPU_ON',
                     b'at the hung verdict',
                     b'oem irqtest', b'DELIVERS as a Group 1 NS IRQ', b'R10 branch',
                     b'the readback reads 0',
                     b'R10 clean screen round', b'screen cleared for the handoff',
                     b'cores for the kernel, in the order it takes them'):
              assert feat in d, f'loader.efi 缺特征串 {feat!r}'
          assert b'debug=0x8' not in d, 'loader.efi 仍带 debug=0x8'
          print(f'✓ R13 loader（R10 0.10 原样，含多核路径特征）{len(d):,} B')
          PY

      # ---------------------------------------------------------------
      # 缓存三连：theos 工具链（~1.5GB，内容不变）→ xnu-deps（源码+host 工具+SDK）
      # → ccache（内核编译缓存，restore-keys 前缀回退取最近一次）
      - name: "②c/⑦ 缓存：theos（工具链 + iPhoneOS16.5.sdk）"
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: r13-theos-v1
      - name: "②d/⑦ 缓存：xnu-deps（Apple 开源件 + host 工具 + SDK 链接树）"
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: hackios/xnu-deps
          key: r13-xnu-deps-v1
      - name: "②e/⑦ 缓存：ccache（内核编译）"
        uses: actions/cache@v4
        with:
          path: hackios/.ccache
          key: r13-ccache-${{ github.run_id }}
          restore-keys: r13-ccache-
      - name: "②f/⑦ 缓存：小卷（root.apfs + flashboot.apfs，键 = VOLKEY）"
        id: vols
        uses: actions/cache@v4
        with:
          path: hackios/userland/.volumes
          key: r13-volumes-${{ env.VOLKEY }}

      # ---------------------------------------------------------------
      - name: "③/⑦ 内核源码构建（theos + xnu/apply.sh + xnu-deps + ccache + make）"
        run: |
          set -eu
          # theos：缓存未命中才克隆（cctools ld64 + SDK；SDK 自 2020 年拆到 theos/sdks）
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/ld64" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
            mkdir -p "$THEOS/toolchain"
            curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          fi
          "$THEOS/toolchain/linux/iphone/bin/ld64" --version || true
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" ]; then
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
            git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
            mkdir -p "$THEOS/sdks"
            mv /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
            rm -rf /tmp/theos-sdks
          fi
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" || { echo "::error::theos/sdks 的 iPhoneOS16.5.sdk 就位失败"; exit 1; }
          df -h /
          # 内核树：Apple xnu-8796.121.2 + redwood.patch + files/（含 R13 的 raphael_adreno.c）
          cd hackios
          xnu/apply.sh
          bash xnu-deps/setup.sh || { echo "::error::setup.sh 失败——exporthdrs.log 尾部："; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          # ccache：经 xnu-clang 包装器的 XNU_CCACHE=1（本地构建不受影响）
          export XNU_CCACHE=1 CCACHE_COMPILERCHECK=content
          ccache -M 2G >/dev/null 2>&1 || true
          echo "→ ccache 起步统计："; ccache -s 2>/dev/null | head -8 || true
          # make：-k 必须——构建在链接后报导出表检查错（上游 README 的已知行为），
          # 内核文件在那时已经就绪；看文件不看退出码。
          ./xnu-build.sh -j4 -k || echo "（make 退出码 $?——上游文档：链接后的检查，内核若已产出即成功）"
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          ls -la "$K" || { echo "::error::内核没有产出——exporthdrs.log 与 make 日志尾部："; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          echo "→ ccache 收官统计："; ccache -s 2>/dev/null | head -8 || true
          python3 - "$K" <<'PY'
          import sys
          d = open(sys.argv[1], 'rb').read()
          for marker, what in ((b'\x9f\x4e\x00\x71', 'cmp w20,#0x13（门铃 19 分发）'),
                               (b'\x08\x01\xa0\x52', 'movz w8,#0x8,lsl#16（门铃 19 使能）'),
                               (b'RAPHAEL TOUCH', '触摸驱动'),
                               (b'buttons: step 1', '按键驱动'),
                               (b'a640_gmu.bin', 'GPU 驱动（a640 固件名）'),
                               (b'a640_zap.mbn', 'GPU 驱动（zap mbn）'),
                               (b'the panel dimmed to', 'fbdim 调光'),
                               (b'going on with the configured rates', 'R12 测量降级（adreno step5）'),
                               (b'going with the ID registers', 'R13 SMMU 修复（IDR 优先）'),
                               (b'was not started: the firmware answers', 'PSCI SMP 起核路径')):
              assert marker in d, f'源码构建的内核缺 {what}'
          print(f'✓ 源码构建的内核带齐 R11-R13 全部标记（{len(d):,} B）')
          PY
          df -h /

      # ---------------------------------------------------------------
      # continue-on-error：本步任何失败（下载残卷 / 校验不过）都不判死刑——
      # 早立的 VOLS_OK=0 让 ④b/c/d 完整 iOS 回退接管，只有回退也失败才算失败。
      # （heredoc 一律顶层顶格：bash 的 << 终止符不许缩进，首跑的教训。）
      - name: "④/⑦ 小卷就位（缓存 → R12 release 直取 → 完整 iOS 回退，三级）"
        continue-on-error: true
        run: |
          set -eu
          cd hackios
          echo "VOLS_OK=0" >> "$GITHUB_ENV"     # 先立旗：中途死掉也轮到回退接管
          mkdir -p userland
          VOLS_OK=0
          # 第一级：actions/cache 命中（VOLKEY 对得上）
          if [ -f userland/.volumes/root.apfs ] && [ -f userland/.volumes/flashboot.apfs ]; then
            cp userland/.volumes/root.apfs userland/.volumes/flashboot.apfs userland/
            echo "→ 小卷来自缓存（VOLKEY=$VOLKEY）"
            VOLS_OK=1
          fi
          # 第二级：从上一轮 release 直取（R12 的两个 4MB 卷，内容跨轮不变：
          # 触摸/按键/GPU 的变量全在内核与 cmdline，小卷只装 userland + 固件）
          if [ "$VOLS_OK" = 0 ] && [ -n "${{ inputs.volumes_flashboot_url }}" ] && [ -n "${{ inputs.volumes_root_url }}" ]; then
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
                 -o userland/flashboot.apfs "${{ inputs.volumes_flashboot_url }}" && \
               curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
                 -o userland/root.apfs "${{ inputs.volumes_root_url }}"; then
              echo "→ 小卷取自上一轮 release（免 iOS 管线）"
              VOLS_OK=2
            else
              echo "::warning::release 直取小卷失败——走完整 iOS 回退（慢，仅此一次：成功后入缓存）"
              rm -f userland/flashboot.apfs userland/root.apfs
            fi
          fi
          # 校验与入缓存（顶层 heredoc；python 自己判断有没有东西可验）
          python3 - <<'PY'
          import os, subprocess, sys, hashlib
          root, flash = 'userland/root.apfs', 'userland/flashboot.apfs'
          if not (os.path.isfile(root) and os.path.isfile(flash)):
              print('（小卷未就位——完整 iOS 回退接管）')
              sys.exit(0)
          for f, what in ((root, '小镜像 = md1 /redwood'), (flash, '启动卷 = md0 根')):
              d = open(f, 'rb').read(36)
              assert d[32:36] == b'NXSB', f'{f} 不是 APFS 容器（@+32 读到 {d[32:36]!r}）'
              print(f'✓ {f} 是 APFS 容器 = {what}  sha256 {hashlib.sha256(open(f,"rb").read()).hexdigest()[:16]}…')
          def has(path, needle):
              out = subprocess.run(['7z', 'l', path], capture_output=True, text=True)
              return needle in out.stdout
          assert has(flash, 'launchd'), 'flashboot.apfs 里没有 sbin/launchd（stage0）'
          assert has(root, 'fw/a640_gmu.bin'), 'root.apfs 里没有 fw/a640_gmu.bin（fw-gpu 没进小镜像）'
          print('✓ 两个小卷内容校验通过（launchd + GPU 固件都在）')
          os.makedirs('userland/.volumes', exist_ok=True)
          for f in (root, flash):
              with open(f, 'rb') as i, open('userland/.volumes/' + os.path.basename(f), 'wb') as o:
                  while True:
                      chunk = i.read(1 << 20)
                      if not chunk:
                          break
                      o.write(chunk)
          open('userland/.volumes/.verified', 'w').write('ok')
          print('✓ 已入缓存目录（job 成功后 actions/cache 存档，下次秒取）')
          PY
          # 只有校验通过（stamp 在）才立旗；残卷/校验不过 → VOLS_OK 保持 0，回退接管
          if [ -f userland/.volumes/.verified ]; then
            echo "VOLS_OK=$VOLS_OK" >> "$GITHUB_ENV"
          else
            rm -f userland/flashboot.apfs userland/root.apfs
            echo "::warning::小卷未就位或校验未通过——走完整 iOS 回退（慢，仅此一次：成功后入缓存）"
          fi
          ls -lh userland/*.apfs 2>/dev/null || true

      # ---------------------------------------------------------------
      # 第三级（回退）：VOLS_OK=0 时才下载/转换 iOS 并现场构建小卷。
      # 一次成功即入缓存，之后的轮次永远不会再走到这里。
      - name: "④b/⑦ 回退：取 iOS 16.5（Apple CDN，断点续传）"
        if: env.VOLS_OK == '0'
        run: |
          set -eu
          cd hackios/ios165
          KEEP=1 ./fetch.sh
          ls -lh rootfs.dmg cryptex-os.dmg cryptex-app.dmg
          df -h .
      - name: "④c/⑦ 回退：转裸 APFS（dmg.py 解 LZFSE 抽 APFS 分区 + 魔数校验）"
        if: env.VOLS_OK == '0'
        run: |
          set -eu
          cd hackios/ios165
          python3 -c "import lzfse" || { echo "::error::lzfse 模块缺失（看 step①）"; exit 1; }
          INFO=$(python3 ../tools/apfs/dmg.py info rootfs.dmg)
          echo "$INFO"
          if echo "$INFO" | grep -q '^GPT,'; then
            python3 ../tools/apfs/dmg.py extract rootfs.dmg rootfs.apfs --apfs
          else
            echo "（无 GPT —— 整镜像即裸 APFS，整卷抽出）"
            python3 ../tools/apfs/dmg.py extract rootfs.dmg rootfs.apfs
          fi
          S=$(stat -c %s rootfs.apfs)
          echo "→ rootfs.apfs = ${S} B"
          [ "$S" -eq 5628755968 ] || { echo "::error::尺寸不是上游常量 5,628,755,968（Apple 改 IPSW 了？）"; exit 1; }
          python3 - <<'PY'
          d = open('rootfs.apfs','rb').read(36)
          assert d[32:36] == b'NXSB', f'rootfs.apfs 不是裸 APFS 容器: {d[32:36]!r}'
          for f in ('cryptex-os.dmg','cryptex-app.dmg'):
              m = open(f,'rb').read(36)[32:36]
              assert m == b'NXSB', f'{f} 不是裸 APFS 容器: {m!r}'
          print('✓ 三个镜像 NXSB 容器魔数齐全（@+32）')
          PY
          rm -f rootfs.dmg
          7z l rootfs.apfs | grep -m1 'SpringBoard' || { echo "::error::rootfs.apfs 里没有 SpringBoard"; exit 1; }
          df -h .
      - name: "④d/⑦ 回退：造双盘（GPU 固件进 fw/ + root.apfs=md1 + flashboot.apfs=md0）"
        if: env.VOLS_OK == '0'
        run: |
          set -eu
          cd hackios
          mkdir -p fw-gpu
          cp fw-gpu-raphael/a640_gmu.bin fw-gpu-raphael/a630_sqe.fw fw-gpu-raphael/a640_zap.mbn fw-gpu/
          BUILD_RC=0
          PREBUILT=1 FLASHBOOT=1 CRYPTEXES=flash REST=1 WIFID=0 userland/build.sh || BUILD_RC=$?
          for f in userland/root.apfs userland/flashboot.apfs; do
            [ -f "$f" ] || { echo "::error::$f 未产出（看上方日志）"; exit 1; }
          done
          [ "$BUILD_RC" = 0 ] || echo "::warning::build.sh 退出码 $BUILD_RC（两个镜像已产出，继续）"
          mkdir -p userland/.volumes
          cp userland/root.apfs userland/flashboot.apfs userland/.volumes/
          ls -lh userland/root.apfs userland/flashboot.apfs
          rm -rf ios165/rootfs ios165/cryptex ios165/cryptex-app ios165/20F66__iPhone10,3_6
          rm -f userland/system.apfs
          df -h .

      # ---------------------------------------------------------------
      - name: "⑤/⑦ 打 r13 双启动镜像（r1 固件 + r2 shim + R10 loader + 本仓库源码内核 + cpus=8 + 小卷 md1）"
        run: |
          set -eu
          cd hackios
          bash tools/r13-flash-build.sh .
          cp userland/raphael-xnu-r13-flash.img "$REL/"
          cp userland/raphael-xnu-r13-gpu-flash.img "$REL/"
          cp userland/flashboot.apfs "$REL/raphael-r13-flashboot.apfs"
          cp userland/root.apfs "$REL/r13-boot-volume-root.apfs"
          ls -lh "$REL"
          df -h .

      # ---------------------------------------------------------------
      - name: "⑥/⑦ SHA256 + README + 发布 Release（只有 boot 资产，几十 MB）"
        run: |
          set -eu
          cd "$REL"
          : > SHA256SUMS
          for f in raphael-xnu-r13-flash.img raphael-xnu-r13-gpu-flash.img \
                   raphael-r13-flashboot.apfs r13-boot-volume-root.apfs; do
            sha256sum "$f" >> SHA256SUMS
          done
          REPO="${{ github.repository }}"
          TAG="${{ inputs.release_tag }}"
          cat > README.txt <<EOF
          ============================================================
           R13 · 纯血 hackios SpringBoard 交付包（raphael / K20 Pro）
           —— boot-only 快线：iOS 卷不随行（手机里已刷好，R5-R12 字节相同）
          ============================================================
          主镜像   : raphael-xnu-r13-flash.img（触摸 + 按键 + 八核；
                     cmdline touchscreen=1 buttons=1 cpus=8）
          GPU 镜像 : raphael-xnu-r13-gpu-flash.img（同上 + gpu=1：梯子
                     这次过 step 8，新水域 10-21）
          启动卷   : raphael-r13-flashboot.apfs（stage0 = md0；与 R12 的
                     内容一致，手头有 R12 的可不重复 stage）
          小镜像   : r13-boot-volume-root.apfs（备份用）
          内核     : 本仓库源码构建；R13 改动 = SMMU 尺寸 0x20000→
                     0x10000（主线 sm8150.dtsi + 实测 IDR 定案）+
                     smmu_layout() IDR 优先；cmdline 加 cpus=8

          【R12 战报回顾】GMU 已活：step 6 计数器 19198638 Hz = 19.2 MHz
          晶振。step 8 死于 SMMU 自检：IDR 实算 0x10000 vs 驱动硬编码
          0x20000（SC7280 遗留）。R13 一行常量改正 + IDR 优先逻辑。

          【SMP 判读】（主/GPU 镜像通用，内核日志里找）
          - loader 行（logdump）：cores for the kernel, in the order it
            takes them: 700 600 500 400 300 200 100 ← 期望 7 核
            （loader 自己守在 core 0，不给内核）
          - "core %x is not off ... not the kernel's to take" = 某核
            固件没关（ABL 占着），属正常损耗，数一下少了谁
          - "GenericARMPE: N of M processors are running" = N 核已入
            调度（大核立即，小核 +28s，small_cores_after=0 可改全立即）
          - banner 行 "memory 6144 MB, page size 16384, N cpu" = N ≠ 1
            即多核生效；= 1 的话回传 klog 看 psci: 行
          - "psci: cpu N (MPIDR 0x...) was not started: the firmware
            answers ..." = 该核 PSCI 拒启，日志会写明原因（denied/
            already on/...），回传即诊
          - 单核回退链：R12 镜像随时可刷（本机已验证）

          【GPU 梯子判读】（GPU 镜像，klog 里 adreno: N）
          - step 8/9 应过（SMMU 修复）；"going with the ID registers"
              = IDR 与常量不符但已采纳（理论不出现；出现即回传）
          - 新水域从 10 开始：GMU 数据存储器读写 → 14 固件 → 15
            SMMU context 1 + stream 5 → 16 GMU 固件装载 → 18 PDC/RSC
            → 19 RPMh 睡眠程序 → 20 HFI 队列 → 21 收官
          - 卡在哪一步都正常：每步一行日志，回传 klog 下一轮接着修
          - "THE GPU IS NOT STARTED: step N" = 梯子在 N 步止损，
            系统照常软渲染跑完（触摸/按键/八核不受影响）

          【手机端（Termux / bootloader）】
            fastboot boot  raphael-xnu-r13-flash.img
            fastboot oem  ramdisk
            fastboot stage raphael-r13-flashboot.apfs
            fastboot oem  run         # 黑屏 → 桌面；八核自动上；+5s 触摸
            # GPU 实验（第二次开机）：
            fastboot boot  raphael-xnu-r13-gpu-flash.img
            fastboot oem  ramdisk
            fastboot stage raphael-r13-flashboot.apfs
            fastboot oem  run
          直链：
