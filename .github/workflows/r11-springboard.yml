            - **门铃进源码**：GIC_INTID_VTIMER 27→19（R9 四处二进制补丁的源码版）
            - **触摸（绝对优先）**：raphael_touch.c —— SWEET 赛道 GT9886/GENI-SE19-I2C
              驱动移植（同机 t13 真机验证：TLMM 98/100 供轨、784B 配置下发、0x4100 轮询）
              → /dev/redwood-touch，touchscreen=1
            - **按键（急需）**：raphael_buttons.c —— PMIC 仲裁器只读轮询 PM8150
              PON（电源/音量下）+ GPIO6（音量上），buttons=1
            - **GPU（实验镜像）**：raphael_adreno.c —— redwood 驱动移植到 Adreno 640
