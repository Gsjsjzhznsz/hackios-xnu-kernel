name: R40 · SpringBoard 一键流水线（GPU 取证轮：R39 验尸判死因 = CP 无声停滞而 500ms swap 等待够不到取证线——首次丢帧即出全快照；内核 = R39 源码 + 一文件补丁 + R40 标记；loader/cmdline/卷 = r39 release 原字节骑乘；WiFi 固件走 flashboot（用户侧 r40_flashboot_build，私有件不进库）；底板 = r39 release）
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "hackios 内核树 fork（含 xnu/ + tools/r40-*）"
        required: true
        default: "Gsjsjzhznsz/hackios-xnu-kernel"
      release_tag:
        description: "Release tag（直链的一部分）"
        required: true
        default: "r40-springboard"
      wifi_stack:
        description: "WiFi 对象进内核（诊断开关：0 = 不带 ath10k.o 构建；R40 内核 = R39 + 取证补丁，默认 1）"
        required: false
        default: "1"
      base_image:
        description: "r39 日常镜像直链（R40 日常镜像 = 它逐字节原样：本轮的控制组）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r39-springboard/raphael-xnu-r39-flash.img"
      base_gpu_image:
        description: "r39 GPU 镜像直链（外科手术的底板：只换 kernel 一条目，loader/cmdline/卷/usb 原字节骑乘）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r39-springboard/raphael-xnu-r39-gpu-flash.img"
      base_flashboot:
        description: "r39 启动卷直链（= R13 谱系，真机验证过，原样转发；WiFi 固件版由用户侧工具重建）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r39-springboard/raphael-r39-flashboot.apfs"
permissions:
  contents: write
concurrency:
  group: r40-springboard
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      REL: ${{ github.workspace }}/release
      THEOS: /home/runner/theos     # (literal: GitHub Actions' env: block expands nothing)
      CCACHE_DIR: ${{ github.workspace }}/hackios/.ccache
    steps:
      # ---------------------------------------------------------------
      - name: "①/⑧ 磁盘准备与依赖（内核工具链）"
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-dev clang lld ccache \
                       flex bison m4 perl python3 autoconf automake libtinfo6 xz-utils uuid-dev 7zip \
                       ripgrep >/dev/null
          command -v clang && command -v ccache && command -v 7z && command -v rg
          # dsymutil：Ubuntu 的 apt clang 不往 /usr/bin 放它（R11 run 39973048286 的教训）
          DS=$(command -v dsymutil || clang --print-prog-name=dsymutil 2>/dev/null || true)
          [ -x "$DS" ] || DS=$(ls /usr/lib/llvm-*/bin/dsymutil 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$DS" ] && [ -x "$DS" ]; then
            sudo ln -sf "$DS" /usr/bin/dsymutil
          else
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/bin/dsymutil >/dev/null && sudo chmod +x /usr/bin/dsymutil
          fi
          mkdir -p "$REL"
          {
            echo "R40 toolchain audit (recorded $(date -u +%FT%TZ))"
            echo "--- runner image ---"
            cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION)=' || true
            echo "--- apt clang (the kernel's host compiler) ---"
            clang --version | head -2
            lld --version 2>/dev/null || true
          } | tee "$REL/toolchain-versions.txt"
          df -h /

      # ---------------------------------------------------------------
      # ② 取树 + 取 r39 资产 + 基座条目提取。R40 不建 loader、不建卷：三件
      #    （loader.efi / kernel / md1）从 r39 GPU 底板的 payload 里原字节提出，
      #    对 r39 release 的官方 sha 硬校验后由打包工具原样骑乘——少两个变量。
      - name: "②/⑧ 取树 + 取 r39 资产 + 基座条目提取（SHA 对官方 SHA256SUMS 硬校验）"
        run: |
          set -eu
          git clone --depth 1 "https://github.com/${{ inputs.kernel_repo }}.git" hackios
          cd hackios
          echo "→ 内核树 @ $(git log -1 --format='%h %s')"
          ls -lh tools/r40_flash_build.py tools/r40_kernel_gate.py tools/r40-kernel-id.py \
                tools/r40_flashboot_build.py tools/r34_shadiff.py 2>/dev/null || true
          mkdir -p base
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/raphael-xnu-r39-flash.img  "${{ inputs.base_image }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/raphael-xnu-r39-gpu-flash.img "${{ inputs.base_gpu_image }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/raphael-r39-flashboot.apfs "${{ inputs.base_flashboot }}"
          sha256sum base/* | tee base/SHA256SUMS.r39base
          # 硬校验：三件资产必须是 r39 release 的官方字节（r39-springboard 的 SHA256SUMS）
          python3 - base/ <<'PY'
          import hashlib, sys
          want = {
              'raphael-xnu-r39-flash.img':    'b0f9f6df4ea13ad9d45048e7ff15e33d7b2fcb67204d01964b1014517ca8a60b',
              'raphael-xnu-r39-gpu-flash.img':'869980bb7787de63efedd362c8bbb96e54fadbb9703c0b2c9d84618da23ffbf4',
              'raphael-r39-flashboot.apfs':   '14485e7c5ce125ef516168445c2500ac04ca5e40a908c2aef516b2d92c24ba0c',
          }
          for name, sha in want.items():
              got = hashlib.sha256(open(sys.argv[1] + name, 'rb').read()).hexdigest()
              assert got == sha, f'{name}: {got} != the r39 release sha {sha}'
          print('底板三件全部等于 r39 release 的官方字节（r39-springboard SHA256SUMS）')
          PY
          # 基座条目提取：loader / kernel / md1（原字节，官方 sha 硬校验）
          python3 - base/raphael-xnu-r39-gpu-flash.img <<'PY'
          import gzip, hashlib, struct, sys
          img = open(sys.argv[1], 'rb').read()
          page = struct.unpack_from('<I', img, 36)[0]; k_size = struct.unpack_from('<I', img, 8)[0]
          blob = gzip.decompress(img[page:page + k_size]); x = blob.find(b'XNUP')
          size = struct.unpack('<I', blob[x + 4:x + 8])[0]; i = x + 8
          want = {'loader.efi': '4bf828e425e4b59d3668461ff89ef290dfbf3215cceec903f1662255fe45a3db',
                  'kernel':     '24ec4e421c3fb760972af3f97324f2c3bbe490c441239c7f8139d1914a626f16',
                  'ramdisk':    '5b9bbbcb6b5ede61d734bf8144fc639d4e419a22bb81e7d6cf93141f4fbe8746'}
          names = {'loader.efi': 'base/r39-loader.efi', 'kernel': 'base/r39-kernel.bin',
                   'ramdisk': 'base/r39-md1-root.apfs'}
          while blob[i] != 0:
              name = blob[i:i + 16].rstrip(b'\0').decode(); esz = struct.unpack('<I', blob[i + 16:i + 20])[0]
              if name in want:
                  data = blob[i + 24:i + 24 + esz]
                  got = hashlib.sha256(data).hexdigest()
                  assert got == want[name], 'the base %s is %s, not the r39 release byte %s' % (name, got, want[name])
                  open(names[name], 'wb').write(data)
                  print('r39 %s 提取：%d B, sha %s（= r39 release 官方字节）' % (name, len(data), got))
              i += 24 + ((esz + 15) & ~15)
          PY
          # 底板判读（r40-kernel-id 对 r39 底板自身的三态）
          python3 tools/r40-kernel-id.py base/raphael-xnu-r39-flash.img base/raphael-xnu-r39-gpu-flash.img \
                  | tee base-id.txt
          grep -c "the kernel entry is R33" base-id.txt | grep -qx 1 || { echo "::error::r39 日常底板的内核必须判为 R33（控制组）"; exit 1; }
          grep -c "the kernel entry is R39" base-id.txt | grep -qx 1 || { echo "::error::r39 GPU 底板的内核必须判为 R39（24ec4e42…）"; exit 1; }
          grep -q "the cmdline is the R39 GPU form verbatim" base-id.txt || { echo "::error::r39 GPU 底板的 cmdline 不是 R39 组原样"; exit 1; }
          grep -c "the cmdline is the daily image WITHOUT" base-id.txt | grep -qx 1 || { echo "::error::r39 日常底板的 cmdline 应无任何 gpu token"; exit 1; }
          grep -c "the ramdisk entry is R39" base-id.txt | grep -qx 1 || { echo "::error::r39 GPU 底板的小卷不是 R39 卷"; exit 1; }
          grep -c "the ramdisk entry is R13..R33" base-id.txt | grep -qx 1 || { echo "::error::r39 日常底板的小卷不是 R13 谱系"; exit 1; }

      # ---------------------------------------------------------------
      # R28i 工具链纪律（原样继承）：缓存键全新、无 restore 链，重建确定性。
      - name: "②c/⑧ 缓存：theos（工具链 + iPhoneOS16.5.sdk；R40 全新键、无 restore 链）"
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: r40-theos-v19L2-v1
      - name: "②d/⑧ 缓存：xnu-deps（Apple 开源件 + host 工具 + SDK 链接树；R40 全新键、无 restore 链）"
        uses: actions/cache@v4
        with:
          path: hackios/xnu-deps
          key: r40-xnu-deps-v1
      - name: "②e/⑧ ccache（R40 clean build——零回填，只存不用）"
        uses: actions/cache@v4
        with:
          path: hackios/.ccache
          key: r40-ccache-${{ github.run_id }}

      # ---------------------------------------------------------------
      # ③ 内核构建：源码 = R39 + 一文件补丁（MiniIOMobileFramebuffer.cpp：
      #    首次丢帧即 redwood_gpu_report("frame dropped")，补上 R39 验尸坐实的
      #    取证缺口）+ R40 used-标记串。门禁三层：
      #    一 = R33 谱系标记；二 = R38 显示/WiFi 标记 + R40 标记逐字在字节里；
      #    三 = r40_kernel_gate 对 r39 release 内核（24ec4e42）：尺寸带 + strings
      #         增量恰为 {R40 标记, Darwin 版本行} + 字节簇界——"差异恰为一个补丁"。
      # BUILD_DSYM=0 + .DEFAULT_GOAL=build（R34/R35/R38 三轮的教训全数继承）。
      - name: "③/⑧ 内核构建 + 三层门禁（theos v19.0.0-L2 + xnu/apply.sh + xnu-deps + mk-ath10k.py → WIFI_OBJECT + BUILD_DSYM=0 + r40_kernel_gate 对 R39 release）"
        run: |
          set -eu
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/ld64" ]; then
            rm -rf "$THEOS"
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
            mkdir -p "$THEOS/toolchain"
            curl -fL --retry 3 --retry-delay 5 -sS https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          fi
          "$THEOS/toolchain/linux/iphone/bin/ld64" --version | tee -a "$REL/toolchain-versions.txt" || true
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" ]; then
            rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk" /tmp/theos-sdks
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
            git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
            mkdir -p "$THEOS/sdks"
            mv /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
            rm -rf /tmp/theos-sdks
          fi
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" || { echo "::error::iPhoneOS16.5.sdk 就位失败"; exit 1; }
          df -h /
          cd hackios
          xnu/apply.sh
          XNU_HOST_CLANG="$THEOS/toolchain/linux/iphone/bin/clang"
          export XNU_HOST_CLANG
          test -x "$XNU_HOST_CLANG" || { echo "::error::theos 工具链 clang 缺位"; exit 1; }
          "$XNU_HOST_CLANG" --version | tee -a "$REL/toolchain-versions.txt"
          grep -q "eabca92" "$REL/toolchain-versions.txt" || { echo "::error::内核编译器不是钉死的 theos clang"; exit 1; }
          bash xnu-deps/setup.sh || { echo "::error::setup.sh 失败"; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          export XNU_CCACHE=1 CCACHE_COMPILERCHECK=content XNU_WRAPPER_LOG="$PWD/xnu-clang-args.log"
          : > "$XNU_WRAPPER_LOG"
          ccache -C >/dev/null 2>&1 || true
          ccache -M 2G >/dev/null 2>&1 || true
          # WiFi 对象：mk-ath10k.py 钉版下载 → 编 ath10k.o → WIFI_OBJECT 进内核链接（R38/R39 同款）
          export CC="$XNU_HOST_CLANG"
          if [ "${{ inputs.wifi_stack }}" = "1" ]; then
            python3 tools/mk-ath10k.py
            A=xnu-deps/build/ath10k/out/ath10k.o
            test -s "$A" || { echo "::error::ath10k.o 没有产出"; exit 1; }
            echo "→ ath10k.o: $(sha256sum "$A" | cut -d' ' -f1) ($(stat -c %s "$A") B)"
            export WIFI_OBJECT="$PWD/$A"
          else
            echo "→ 诊断轮：不带 ath10k.o（wifi_stack=0）"
          fi
          ./xnu-build.sh -j4 -k BUILD_DSYM=0 \
            || echo "（make 退出码 $?——上游文档：链接后的检查，内核若已产出即成功）"
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          ls -la "$K" || { echo "::error::内核没有产出"; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          KU=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped
          cp -f "$K" "$REL/r40-kernel-stripped.bin" || true
          cp -f "$KU" "$REL/r40-kernel-unstripped.bin" || true
          AS=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/config/allsymbols
          [ -f "$AS" ] && cp -f "$AS" "$REL/r40-allsymbols.txt" || true
          # --- 门禁一 + 二：R33 谱系 + R38 显示/WiFi 标记 + R40 标记逐字在字节里
          echo "→ 门禁一/二：谱系与换代件标记"
          python3 - "$K" <<'PY'
          import sys
          b = open(sys.argv[1], 'rb').read()
          def n(s): return b.count(s.encode())
          assert n('R33: the kernel generation line') == 2, 'R33 generation line x%d != 2' % n('R33: the kernel generation line')
          assert n('R33: the resident round') == 1 and n('SCMDMP: R33 begins') == 1, 'R33 lineage markers broken'
          assert n('R32: the kernel generation line') == 0, 'a stale R32 stamp rides'
          for mark, why in [
              ('raphael-display: three scanout buffers, VIG0/CTL0, hardware TE', 'the display round (adreno side)'),
              ('display: raphael command TE:', 'the TE phase measurement (display.c)'),
              ('page flips retained (fb_scan=1)', 'the fb_scan boot-arg'),
              ('wifi: raphael needs WCN3990 SNOC/ath10k and MPSS service 0x45', 'the raphael Wi-Fi branch'),
              ('raphael-display: flip did not latch at TE, restoring boot framebuffer', 'the flip fallback'),
              ('R40: the first dropped frame buys the full core snapshot', 'THE R40 forensic marker'),
          ]:
              assert n(mark) == 1, '%s x%d != 1 (%s)' % (mark, n(mark), why)
          assert n('XNULIVE4') >= 1, 'the R38 loader-framebuffer channel mark is missing (x%d)' % n('XNULIVE4')
          assert n('wifi_step') >= 1, 'the wifi boot-arg surface is missing'
          print('门禁一/二全过：R33 谱系 4 项 + R38 显示/WiFi/通道 5 项 + R40 取证标记 1 项')
          PY
          # --- 门禁三：对 r39 release 内核（24ec4e42）——"差异恰为一个补丁"
          echo "→ 门禁三：r40_kernel_gate（R40 构建 vs r39 release 的 24ec4e42 内核）"
          python3 tools/r40_kernel_gate.py --r39-kernel base/r39-kernel.bin --r40-kernel "$K" \
                  --report "$REL/r40-kernel-gate.txt" | tee "$REL/r40-kernel-gate-run.txt"
          sha256sum "$K" | tee "$REL/r40-kernel-sha.txt"
          cp "$K" "$REL/r40-kernel.bin"

      # ---------------------------------------------------------------
      - name: "诊断产物（wrapper argv 日志，失败也上传）"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r40-diag
          path: |
            hackios/xnu-clang-args.log
            hackios/xnu-deps/exporthdrs.log
            release/r40-kernel-stripped.bin
            release/r40-kernel-unstripped.bin
            release/r40-allsymbols.txt
          if-no-files-found: ignore

      # ---------------------------------------------------------------
      # ④ 打 r40 双启动镜像（外科手术：底板 = r39 release；GPU 镜像只换 kernel
      #    一条目，loader/cmdline/卷/usb = r39 原字节骑乘；日常镜像逐字节原样）
      - name: "④/⑧ 打 r40 双启动镜像（外科手术：底板 = r39 release；GPU 镜像只换 kernel 一条目）"
        run: |
          set -eu
          cd hackios
          python3 tools/r40_flash_build.py \
            --daily base/raphael-xnu-r39-flash.img \
            --gpu base/raphael-xnu-r39-gpu-flash.img \
            --kernel "$REL/r40-kernel.bin" \
            --out-daily "$REL/raphael-xnu-r40-flash.img" \
            --out-gpu "$REL/raphael-xnu-r40-gpu-flash.img" | tee "$REL/r40-pack.txt"
          KSHA2=$(cut -d' ' -f1 "$REL/r40-kernel-sha.txt")
          echo "KSHA2=$KSHA2" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # ⑤ 门禁复证 + 判读预注册：r40-kernel-id 对双输出镜像判读。
      - name: "⑤/⑧ r40-kernel-id 复证门禁（双镜像：R40 内核 + R39 loader/cmdline/卷 + 日常原样）"
        run: |
          set -eu
          cd hackios
          python3 tools/r40-kernel-id.py "$REL/raphael-xnu-r40-flash.img" "$REL/raphael-xnu-r40-gpu-flash.img" \
                  --expect-loader-sha 4bf828e425e4b59d3668461ff89ef290dfbf3215cceec903f1662255fe45a3db \
                  --expect-kernel-sha "$KSHA2" \
                  --expect-volume-sha 5b9bbbcb6b5ede61d734bf8144fc639d4e419a22bb81e7d6cf93141f4fbe8746 \
                  | tee "$REL/r40-kernel-id.txt"
          grep -c "loader  sha256" "$REL/r40-kernel-id.txt" | grep -qx 2 || { echo "::error::双镜像都要读到 loader 条目"; exit 1; }
          grep -c "the kernel entry is R40" "$REL/r40-kernel-id.txt" | grep -qx 1 || { echo "::error::GPU 镜像内核判词不是 R40（本轮取证构建）"; exit 1; }
          grep -c "the kernel entry is R33" "$REL/r40-kernel-id.txt" | grep -qx 1 || { echo "::error::日常镜像内核必须仍是 R33（控制组）"; exit 1; }
          grep -c "the cmdline is the R39 GPU form verbatim" "$REL/r40-kernel-id.txt" | grep -qx 1 || { echo "::error::GPU 镜像 cmdline 不是 R39 组原样（R40 零 cmdline 改动）"; exit 1; }
          grep -c "the cmdline is the daily image WITHOUT" "$REL/r40-kernel-id.txt" | grep -qx 1 || { echo "::error::日常镜像必须无任何 gpu token（控制组原样）"; exit 1; }
          grep -c "the ramdisk entry is R39" "$REL/r40-kernel-id.txt" | grep -qx 1 || { echo "::error::GPU 镜像小卷不是 R39 卷"; exit 1; }
          grep -c "the ramdisk entry is R13..R33" "$REL/r40-kernel-id.txt" | grep -qx 1 || { echo "::error::日常镜像小卷不是 R13 谱系"; exit 1; }
          echo "r40 复证门禁全绿。"

      # ---------------------------------------------------------------
      # ⑥ SHA256 + README（判读树预注册 + WiFi 固件 kit 说明）+ 启动卷/小卷原样转发 + Release
      - name: "⑥/⑧ SHA256 + README + 启动卷/小卷转发 + Release（r40-springboard）"
        run: |
          set -eu
          cd hackios
          cp base/raphael-r39-flashboot.apfs "$REL/raphael-r40-flashboot.apfs"
          cp base/r39-md1-root.apfs "$REL/r40-md1-root.apfs"
          cat "$REL/r40-kernel-sha.txt" >> "$REL/toolchain-versions.txt"
          {
            echo "r40 lineage (loader/cmdline/md1 = the r39 release's bytes re-packed; only the kernel moved)"
            sha256sum "$REL/raphael-r40-flashboot.apfs" "$REL/r40-md1-root.apfs"
          } >> "$REL/toolchain-versions.txt"
          {
            sha256sum "$REL/raphael-xnu-r40-flash.img" "$REL/raphael-xnu-r40-gpu-flash.img" \
                      "$REL/raphael-r40-flashboot.apfs" "$REL/r40-md1-root.apfs"
          } > "$REL/SHA256SUMS"
          cat > "$REL/README.txt" <<'EOF'
          ============================================================
           R40 · 纯血 hackios SpringBoard 交付包（raphael / K20 Pro）
           —— GPU 取证轮：首次丢帧即出全快照（R39 验尸的取证缺口补上）
              （内核 = R39 源码 + 一文件补丁；loader/cmdline/卷 = r39
               release 原字节；WiFi 固件走 flashboot，用户侧重建）
          ============================================================
          ⚠️⚠️⚠️ 启动卷只 stage 一个文件：raphael-r40-flashboot.apfs ⚠️⚠️⚠️
            （R14 事故纪律不变：md1 备份不要 stage，flash.img 已内嵌全量小卷）
          主镜像   : raphael-xnu-r40-flash.img（= r39 逐字节原样：本轮控制组）
          GPU 镜像 : raphael-xnu-r40-gpu-flash.img（cmdline =
                      touchscreen=1 buttons=1 cpus=8 ufs=2 bootcpu=7
                      root_apfs=ufs_userdata gpu=1 adreno=22 adreno_pause=0
                      adreno_watch=0 adreno_keep=1 metal=1
                      fb_scan=1 wifi=1 wifi_bdf=bd_f11cn.bin
                      = R39 组原样，零改动）
                      装载器 = r39 release 原字节（4bf828e4…，指纹门禁）
                      内核   = R40 取证构建（R39 源码 + 一文件补丁 +
                               R40 标记串；r40_kernel_gate 三律全绿）
                      卷     = r39 release 原字节（5b9bbbcb…）
                      usb/DTB = r39 原字节
          启动卷   : raphael-r40-flashboot.apfs（= r39 官方字节，原样转发；
                     WiFi 固件版见下【WiFi 固件 kit】）
          小卷 md1 : r40-md1-root.apfs（= r39 官方字节，原样转发）
          【R40 的一刀，与依据】
          R39 logdump（5353 行全文验尸）定案：[123.9s] 起 SpringBoard 帧
          缓冲的渲染 fence 永久停滞——"the GPU is not done with surface
          4/3 after 500 ms; frame dropped" x30+，CP 读指针停在 1488/2439，
          RBBM_INT_0_STATUS=0（无声卡死，非页错/保护错），GMU 却认为忙。
          取证缺口坐实：swap 路径 SWAP_GPU_MS=500 < gpuWait 的 1000ms 报告
          门 ⇒ 30+ 次超时全部静默，死得不明不白。R40 补丁：首次丢帧即调
          redwood_gpu_report("frame dropped") ⇒ CP_HW_FAULT /
          CP_PROTECT_STATUS / RBBM_STATUS / IB1+IB2 剩余全快照一次到手。
          零行为变更：只在已发生的失败路径上加一句报告。
          【判读树 L（logdump 全文入账后判）】
          L1 = 若黑屏复现（swap 30+ "frame dropped" 行再现）⇒ logdump 必含
               "adreno: gpu: frame dropped: submission N is the last, the
               core has done M; ring: read up to X, written up to Y; status
               Z, interrupts W; command processor: fault F, interrupts I,
               protection P" + "in the first command buffer at …, N words to
               go" 两行 ⇒ 快照全文送回 = R41 定点修的输入。
               若整轮无一次 "frame dropped" ⇒ GPU 观察通过（R39 卡死非稳
               态），显示线结案。
          L2 = WiFi 双态（wifi=1 已在 cmdline，零改动）：
               a) 原样 flashboot（无固件）："wifi: raphael modem/WLAN
                  firmware is missing from the RAM image"（= R39 的 L3，
                  停在原地，正常）。
               b) 固件版 flashboot（kit 重建 + stage）："wifi: SM8150
                  MPSS/ath10k is being brought up beside the system's start"
                  ⇒ 链走 6..15 步；因 NV 快照（modemst1/2/fsg/fsc）缺席预
                  期停在 RMTFS/efs 相关行——这是预期停点，Root 备份 NV 后
                  下一轮通关。若意外联网成功 ⇒ 收获轮，直接验收。
          L3 = 回归护栏："raphael-display: three scanout buffers" 在场 +
               frame 计数越过 4 + flip 行持续 ⇒ 显示无回归；系统本体活
               （buttons 统计/温度/内存每分钟报）。
          回滚 = 刷回 r39 GPU 镜像。
          【WiFi 固件 kit（用户侧，私有件不进库不进 release）】
          # 电脑上：fw-raphael/ = 你从手机提取的目录（上游 README 3.2）
          git clone --depth 1 https://github.com/Gsjsjzhznsz/hackios-xnu-kernel r40kit
          git clone --depth 1 https://github.com/Gsjsjzhznsz/hackios-xnu-userland r40kit-userland
          python3 r40kit/tools/r40_flashboot_build.py \
            --base raphael-r40-flashboot.apfs --fw fw-raphael/ \
            --apfs-dir r40kit-userland/tools/apfs \
            --out raphael-r40-flashboot-fw.apfs \
            --manifest r40-flashboot-manifest.json
          # 产出 raphael-r40-flashboot-fw.apfs（~84MB），stage 它替代上面的
          # 启动卷；NV 四分区（modemst1/2/fsg/fsc，需 Root，上游 README 3.3）
          # 放进 fw-raphael/ 可让链走得更远。
          【手机端（bootloader）】
          fastboot flash boot raphael-xnu-r40-gpu-flash.img
          （启动卷 stage 一次：raphael-r40-flashboot.apfs 或固件版）
          ⚠️ 含 Apple 版权内容，仅供个人研究；下载完成后请尽快删除本 Release。
          EOF
          echo "README + SHA256SUMS + 转发资产就位"
          df -h /

      - name: "⑥b/⑧ 发布 Release（直链交付，r40-springboard）"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "R40 · 纯血 hackios SpringBoard · GPU 取证轮（首次丢帧全快照；内核 = R39 + 一文件补丁；其余 = r39 原字节；WiFi 固件走 flashboot 用户侧重建）"
          body: |
            raphael (K20 Pro) R40 交付包：**GPU 取证轮**。

            R39 验尸定案（logdump 5353 行全文入账）：[123.9s] 起 SpringBoard
            帧缓冲渲染 fence 永久停滞——"not done with surface 4/3 after
            500 ms; frame dropped" x30+，CP 停在 1488/2439，RBBM_INT_0_STATUS
            =0（无声卡死），GMU 认为忙。取证缺口坐实：swap 的 500ms 等待
            < gpuWait 的 1000ms 报告门 ⇒ 30+ 次超时全部静默。

            R40 一刀：首次丢帧即调 redwood_gpu_report("frame dropped")
            ⇒ CP_HW_FAULT/CP_PROTECT_STATUS/RBBM_STATUS/IB1+IB2 全快照。
            零行为变更（只在已发生的失败路径加一句报告）。内核 = R39 源码
            + 一文件补丁 + R40 标记串（r40_kernel_gate 三律：尺寸带/strings
            增量恰为{标记,Darwin 版本行}/字节簇界）；loader/cmdline/卷/usb
            = r39 release 原字节骑乘；日常镜像 = r39 逐字节（控制组）。

            WiFi 线并行推进：固件走 flashboot（md0，stage 上限 4GB 装得下
            84.8MB；64MB payload 窗口装不下），cmdline 零改动（r39 预告过
            "固件入卷后无需再改 cmdline"）。用户侧一步重建（r40kit 工具 +
            你提取的 fw-raphael/，见 README）；NV 四分区缺席时链走 6..15 步
            停在 RMTFS（预期停点，L2 预注册）。

            判读树 L 见 README（L1 取证快照/GPU 结案、L2 WiFi 双态、L3 回归
            护栏）。回滚 = 刷回 r39 GPU 镜像。

            ⚠️ 含 Apple 版权内容，仅供个人研究；下载完成后请尽快删除本 Release。
          fail_on_unmatched_files: true
          files: |
            release/raphael-xnu-r40-flash.img
            release/raphael-xnu-r40-gpu-flash.img
            release/raphael-r40-flashboot.apfs
            release/r40-md1-root.apfs
            release/r40-kernel-gate.txt
            release/SHA256SUMS
            release/README.txt
            release/toolchain-versions.txt

      # ---------------------------------------------------------------
      - name: "⑥c/⑧ 直链汇总（跑完看这里，复制即用）"
        run: |
          set -eu
          echo "════════════ 全部下载直链 ════════════"
          for f in "$REL"/raphael-xnu-r40-flash.img "$REL"/raphael-xnu-r40-gpu-flash.img \
                   "$REL"/raphael-r40-flashboot.apfs "$REL"/r40-md1-root.apfs \
                   "$REL"/r40-kernel-gate.txt "$REL"/SHA256SUMS "$REL"/README.txt "$REL"/toolchain-versions.txt; do
            echo "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/$(basename "$f")"
          done
