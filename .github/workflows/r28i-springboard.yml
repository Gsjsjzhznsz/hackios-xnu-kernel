      # ---------------------------------------------------------------

      - name: "诊断产物（.o 与 .ll，失败也上传）"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-diag
          path: |
            /tmp/var_as-is.o
            /tmp/var_O0.o
            /tmp/var_O1.o
            /tmp/probe_frontend.ll
            /tmp/probe_O2mid.ll
            /tmp/probe_O0mid.ll
          if-no-files-found: ignore

      - name: "⑤/⑥ 打 r28i 双启动镜像（外科手术：只换 kernel 条目；装载器 v7 / ramdisk / cmdline / DTB / 头字段 = R28d 原字节）"
        run: |
          set -eu
          cd hackios
          bash tools/r28i-flash-build.sh r28d/raphael-xnu-r28d-flash.img r28d/raphael-xnu-r28d-gpu-flash.img
          cp raphael-xnu-r28i-flash.img "$REL/"
          cp raphael-xnu-r28i-gpu-flash.img "$REL/"
          # 启动卷与小卷：R28d 的官方字节，名字换成本轮（对照用，不刷也不影响 boot）
          cp r28d/raphael-r28d-flashboot.apfs "$REL/raphael-r28i-flashboot.apfs"
          cp r28d/r28d-md1-root.apfs "$REL/r28i-md1-root.apfs"
          # 对打包后的双镜像离线复证（与 ③ 源码构建、⑤ 打包内打印三方对齐）
          python3 tools/r28i-kernel-id.py \
                  "$REL/raphael-xnu-r28i-flash.img" "$REL/raphael-xnu-r28i-gpu-flash.img" | tee r28i-kernel-id.txt
          grep -c "VERDICT: the kernel entry is R28i" r28i-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像必须双双判 R28i 内核"; exit 1; }
          grep -c "VERDICT: the ramdisk entry is R13..R28d VERBATIM" r28i-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像的小卷必须是 R28d 原字节（本轮不换卷）"; exit 1; }
          grep -c "ec15106da4bad290" r28i-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像的 loader 必须是设备验证过的 v7（ec15106d…）"; exit 1; }
          grep -q "needs no T2 token" r28i-kernel-id.txt || { echo "::error::cmdline 校验行缺失（本轮 cmdline 必须零改动、无 T2 token）"; exit 1; }
          # GPU 镜像的 cmdline 必须带 gpu=1（R28d 原样）、日常镜像不带（R28d 原样）
          echo "→ gpu=1 判决行计数 = $(grep 'cmdline "' r28i-kernel-id.txt | grep -c 'gpu=1')（应为 1）"
          grep 'cmdline "' r28i-kernel-id.txt || true
          test "$(grep 'cmdline "' r28i-kernel-id.txt | grep -c 'gpu=1')" = 1 || { echo "::error::两张镜像的 cmdline 判决行里必须恰好 GPU 镜像带 gpu=1"; exit 1; }
          echo "（cmdline 检查过：恰好 GPU 镜像带 gpu=1，两行都是 R28d 原字节）"
          ls -lh "$REL"
          df -h .

      # ---------------------------------------------------------------
      - name: "⑥/⑥ SHA256 + README + 发布 Release（只有 boot 资产，几十 MB）"
        run: |
          set -eu
          cd "$REL"
          : > SHA256SUMS
          for f in raphael-xnu-r28i-flash.img raphael-xnu-r28i-gpu-flash.img \
                   raphael-r28i-flashboot.apfs r28i-md1-root.apfs; do
            sha256sum "$f" >> SHA256SUMS
          done
          REPO="${{ github.repository }}"
          TAG="${{ inputs.release_tag }}"
          cat > README.txt <<EOF
          ============================================================
           R28i · 纯血 hackios SpringBoard 交付包（raphael / K20 Pro）
           —— T2 对照二版：adsp 的 .mdt 内嵌进内核、T2 默认开启、
              工具链钉死；底板卷/cmdline/装载器零改动，只换内核
          ============================================================
          ⚠️⚠️⚠️ 启动卷只 stage 一个文件：raphael-r28i-flashboot.apfs ⚠️⚠️⚠️
            （R14 事故纪律不变：md1 备份不要 stage，flash.img 已内嵌全量小卷）
          主镜像   : raphael-xnu-r28i-flash.img（触摸 + 按键 + 八核；不跑 GPU 步骤）
          GPU 镜像 : raphael-xnu-r28i-gpu-flash.img（同上 + gpu=1；step 19 默认跑 T2）
          启动卷   : raphael-r28i-flashboot.apfs（= R28d 官方字节 = R13 全量，原样转发）
          小卷 md1 : r28i-md1-root.apfs（= R28d 官方字节；对照用，本轮镜像的
                      ramdisk 条目与它逐字节相同——不重建、不加 adsp.mbn）

          【R28G/R28h 之后，本轮改了什么、为什么】
            R28G（T2 一版）真机第一秒死机；R28h-B（同内核 + R28d 原卷）跑到
            122 s、用户态起来了——死因判给 R28g 重建的 md1 卷，内核无罪。
            但 R28h-B 同时暴露：R28g 世代的内核让 lsd/analyticsd/mobilegestalt
            无限 SIGBUS（pid 29 崩到 121），SpringBoard 卡白苹果；R28d 内核
            （同 cmdline、同卷）从未如此——嫌疑头名是构建环境漂移：
            r25-* 缓存键的跨代 restore 链（theos/xnu-deps 两层，两次构建可能
            拿到不同代的缓存）与 runner 镜像滚动的 apt clang。
            R28i 的回答：
              · 工具链钉死：L1ghtmann v19.0.0-L2 具名 tag（不再 latest）；
                theos/xnu-deps 缓存键全新且**无 restore 链**（首跑从钉死源
                确定性重建）；每一层编译器的完整版本号入档
                （toolchain-versions.txt，随 release 交付，未来轮次对表）；
              · T2 默认开启：刷机不带任何参数，GPU 镜像的 step 19 自动跑
                T2（R28h-B 的教训——旧 cmdline 没带 token，整轮落空）；
              · adsp 的 .mdt 内嵌进内核（raphael_adsp_fw.h，7,820 B，
                sha256 f5881fc7…，与 R28g 卷里那份逐字节相同）：不再读卷，
                R28G 的死因从结构上移除；卷/cmdline/装载器/DTB 零改动，
                本轮唯一变量 = kernel 条目。
            手术纪律：底板四件 = R28d release 官方字节（SHA 硬校验）；
            装载器 v7（ec15106d…）逐字节原样；ramdisk 条目 == R28d 原卷
            （372c7fcb…）；cmdline 逐字节 R28d（无 T2 token——开关是默认值）；
            one kernel, both images。

          【本轮判读树（两张镜像、按序刷，一次定位）】
            第一刷 · 主镜像（日常控制组，~2 分钟看分晓）：
              进桌面/锁屏正常、lsd 不崩 → 构建环境已复原（工具链钉死有效），
              R28g 的 SIGBUS 判给那次构建 → 直接第二刷；
              lsd/analyticsd 仍 SIGBUS 卡白苹果 → 编译环境仍有暗变量（或 T2
              代码的静态布局踩雷）→ 发日志，下一轮出 R28i-minus（R28d 源码
              原样重编）分离"环境"与"布局"两个变量。
            第二刷 · GPU 镜像（T2 对照，等 ~45-55s 到 step 19）：
              基线行应自报：R28i: the two-parameter baseline -- adreno_e1_mode=2
              (...)，the T2 control adreno_test_adsp=1 (ON: the adsp's own
              .mdt, from the kernel's embedded copy, INSTEAD of the zap
              attempt ...) ——注意：不传参数它就是 1（默认开）。
              证据链四行（都在判决行之前）：
                "fw/adsp.mbn: 7820 bytes, the kernel's own embedded copy"
                "an ELF of 15 segments ... the metadata is the whole .mdt"
                "THE ADSP'S CHAIN SAYS: THE PHONE'S OWN PRODUCTION CHAIN"
                "T2 armed: smc 0x42000201 ... x2 1, x3 <页>（size 留家）"
              ★ 判决行（本轮唯一目的）"T2 VERDICT:"：
                · ACCEPTED (0) → XNU→Hyp→TZ 链路无罪；zap 被拒是 zap 定向的
                  → 立即准备 T3（逆向 secapp cmd 0x49：为什么拒自家原厂
                  stock zap）。
                · refused with -3145797（与 zap 同码）→ 全局墙：查 XNU 侧
                  内存 buffer 在 TZ 眼里的问题（cache flush / 地址 / hyp
                  包装壳）与 secapp 会话注入（hw_id / serial /
                  root_of_trust 与 Android 侧差异）。
                · -3145738（-0x30000A）→ 数据根本没到 TZ，hyp 本地解析就
                  挂了：查 .mdt 的包装形态（大概率没包对，不是链路问题）。
                · 其它码 → 新证据，直接进 T3 对照 secapp 0x49 错误面。
              收尾三行（预期内，不是失败）：give-up 一行；"the step stops
              here by design (adreno_test_adsp=1)"；step 19 FAILED 同 r28d
              形 → 用户态照常（白苹果 → SpringBoard）。
              若 lsd 在 GPU 镜像崩而主镜像不崩 → GPU 步骤/T2 运行时的问题
              （新证据，发日志）。

          【离线复验】
            python3 tools/r28i-kernel-id.py <image>
            （代数 grep：R28i 代数戳=2、基线=1、T2 宣告=2、内嵌副本=2、
             判决=3、开关=3；R28g/R28d 旧措辞全 0；ramdisk 判 R13..R28d
             VERBATIM；cmdline 无 T2 token——开关是内核默认值）

          【工具链审计（本轮新增交付）】
            toolchain-versions.txt：runner 镜像 / apt clang / lld / dsymutil /
            theos ld64 的完整版本号 + 工具链 tarball 的具名 tag。若下一轮
            再出现"同源码不同行为"，先对这张表。

          【手机端（Termux / bootloader）】
            fastboot boot  raphael-xnu-r28i-flash.img      # 第一刷：控制组
            fastboot oem  ramdisk
            fastboot stage raphael-r28i-flashboot.apfs
            fastboot oem  run
            # T2 对照（第二刷，无需任何参数）：
            fastboot boot  raphael-xnu-r28i-gpu-flash.img
            fastboot oem  ramdisk
            fastboot stage raphael-r28i-flashboot.apfs
            fastboot oem  run      # 等 "T2 VERDICT:" 判决行（~45-55s）
          直链：
            https://github.com/${REPO}/releases/download/${TAG}/raphael-xnu-r28i-flash.img
            https://github.com/${REPO}/releases/download/${TAG}/raphael-xnu-r28i-gpu-flash.img
            https://github.com/${REPO}/releases/download/${TAG}/raphael-r28i-flashboot.apfs
            https://github.com/${REPO}/releases/download/${TAG}/r28i-md1-root.apfs
            https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS
          ⚠️ userdata 上的 iOS 卷是唯一存货：绝不要让 MIUI 开机
             （Android 会重格回 f2fs，iOS 卷即毁）。
          ⚠️ 每次开机都要重复 boot/oem ramdisk/stage/oem run 四步
             （启动卷住 RAM 不落盘，"不写手机闪存"设计的一部分）。
          ⚠️ 含 Apple 版权内容，仅个人研究；下载完成后请尽快删除本 Release。
          EOF
          echo "→ SHA256SUMS："
          cat SHA256SUMS

      - name: "⑥b/⑥ 发布 Release（直链交付，r28i-springboard）"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "R28i · 纯血 hackios SpringBoard · T2 对照二版（adsp 内嵌 + 默认开启 + 工具链钉死，只换内核）"
          body: |
            raphael (K20 Pro) R28i 交付包：**T2 对照二版**。

            R28G（T2 一版）第一秒死机，R28h-B 判死因 = R28g 重建的 md1 卷
            （同内核 + R28d 原卷活了 122 s）；同时 R28h-B 暴露 R28g 世代内核的
            lsd/analyticsd/mobilegestalt 无限 SIGBUS（R28d 内核从未如此）——
            嫌疑头名 = 构建环境漂移（r25-* 缓存键跨代 restore 链 + runner
            滚动）。本轮三件事：

            1. **工具链钉死**：L1ghtmann v19.0.0-L2 具名 tag；theos/xnu-deps
               缓存键全新、无 restore 链（首跑从钉死源确定性重建）；全部编译器
               版本号入档 toolchain-versions.txt（随 release 交付）。
            2. **T2 默认开启**：不传任何参数，GPU 镜像 step 19 自动跑 T2
               （R28h-B 教训：旧 cmdline 没带 token，整轮落空）。
            3. **adsp 的 .mdt 内嵌进内核**（7,820 B，与 R28g 卷里那份逐字节
               相同）：不再读卷，R28G 死因从结构上移除。

            手术只动 kernel 条目：底板四件 = R28d 官方字节（SHA 硬校验）、
            装载器 v7 逐字节原样、ramdisk = R28d 原卷、cmdline 逐字节 R28d
            （无 T2 token——开关是内核默认值）。主镜像 = lsd 控制组
            （不跑 GPU 步骤），GPU 镜像 = T2 对照。

            判读（判读树全文见 Release 资产 README.txt）：先刷主镜像看 lsd
            （不崩 = 环境已复原）→ 再刷 GPU 镜像等 "T2 VERDICT:"——
            0=链路无罪→T3；-3145797=与 zap 同墙（全局）；-3145738=没到
            TZ（查包装）；其它=新证据进 T3。

            ⚠️ 含 Apple 版权内容，仅供个人研究；下载完成后请尽快删除本 Release。
          fail_on_unmatched_files: true
          files: |
            release/raphael-xnu-r28i-flash.img
            release/raphael-xnu-r28i-gpu-flash.img
            release/raphael-r28i-flashboot.apfs
            release/r28i-md1-root.apfs
            release/SHA256SUMS
            release/README.txt
            release/toolchain-versions.txt

      - name: "直链汇总（跑完看这里，复制即用）"
        run: |
          set -eu
          echo "════════════ 全部下载直链 ════════════"
          for f in "$REL"/raphael-xnu-r28i-flash.img "$REL"/raphael-xnu-r28i-gpu-flash.img \
                   "$REL"/raphael-r28i-flashboot.apfs "$REL"/r28i-md1-root.apfs \
                   "$REL"/SHA256SUMS "$REL"/README.txt "$REL"/toolchain-versions.txt; do
            echo "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/$(basename "$f")"
          done
