name: R28i · SpringBoard 一键流水线（T2 对照二版 · 内嵌 adsp + 默认开启 + 工具链固定，装载器 v7 原字节，卷/cmdline 零改动）
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "hackios 内核树 fork（含 xnu/ + raphael_adsp_fw.h + tools/r28i-*）"
        required: true
        default: "Gsjsjzhznsz/hackios-xnu-kernel"
      release_tag:
        description: "Release tag（直链的一部分）"
        required: true
        default: "r28i-springboard"
      r28d_image:
        description: "R28d 日常镜像直链（外科手术的底板）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r28d-springboard/raphael-xnu-r28d-flash.img"
      r28d_gpu_image:
        description: "R28d GPU 镜像直链（外科手术的底板）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r28d-springboard/raphael-xnu-r28d-gpu-flash.img"
      r28d_flashboot:
        description: "R28d 启动卷直链（= R13 全量字节，真机验证过）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r28d-springboard/raphael-r28d-flashboot.apfs"
      r28d_root:
        description: "R28d 小卷 md1 直链（对照用：本轮镜像的 ramdisk 条目必须逐字节等于它）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r28d-springboard/r28d-md1-root.apfs"
permissions:
  contents: write
concurrency:
  group: r28i-springboard
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      REL: ${{ github.workspace }}/release
      THEOS: /home/runner/theos     # (literal: GitHub Actions' env: block expands nothing)
      CCACHE_DIR: ${{ github.workspace }}/hackios/.ccache
    steps:
      # ---------------------------------------------------------------
      - name: "①/⑥ 磁盘准备与依赖（内核构建工具链）"
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-dev clang lld ccache \
                       flex bison m4 perl python3 autoconf automake libtinfo6 xz-utils uuid-dev 7zip >/dev/null
          command -v clang && command -v ccache && command -v 7z
          # dsymutil：Ubuntu 的 apt clang 不往 /usr/bin 放它（R11 run 39973048286 的教训）
          DS=$(command -v dsymutil || clang --print-prog-name=dsymutil 2>/dev/null || true)
          [ -x "$DS" ] || DS=$(ls /usr/lib/llvm-*/bin/dsymutil 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$DS" ] && [ -x "$DS" ]; then
            sudo ln -sf "$DS" /usr/bin/dsymutil
          else
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/bin/dsymutil >/dev/null && sudo chmod +x /usr/bin/dsymutil
          fi
          mkdir -p "$REL"
          # R28i 工具链审计第一页：runner 镜像自带的编译器版本，原样入档（R28h-B 的 lsd SIGBUS
          # 嫌疑头名是构建环境漂移——r25-* 缓存键的跨代 restore 链 + runner 滚动更新；本轮把
          # 每一层工具链的完整版本号写进构建日志与 release 资产，未来任何一轮都能对表）
          {
            echo "R28i toolchain audit (recorded $(date -u +%FT%TZ))"
            echo "--- runner image ---"
            cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION)=' || true
            echo "--- apt clang (the kernel's host compiler) ---"
            clang --version | head -2
            lld --version 2>/dev/null || true
            echo "--- apt dsymutil ---"
            dsymutil --version 2>/dev/null | head -1 || true
          } | tee "$REL/toolchain-versions.txt"
          df -h /

      # ---------------------------------------------------------------
      - name: "②/⑥ 取树 + 取 R28d 资产（本轮底板；SHA 对官方 SHA256SUMS 硬校验）"
        run: |
          set -eu
          git clone --depth 1 "https://github.com/${{ inputs.kernel_repo }}.git" hackios
          cd hackios
          echo "→ 内核树 @ $(git log -1 --format='%h %s')"
          ls -lh xnu/files/bsd/dev/raphael_adreno.c xnu/files/bsd/dev/raphael_adsp_fw.h \
                tools/r28i-flash-build.sh tools/r28i-kernel-id.py fw-gpu-raphael/adsp.mbn
          # R28d 的四件资产：两张镜像是外科手术的底板（装载器 v7 原字节在里面），
          # 启动卷与小卷本轮原样沿用（小卷同时是"镜像 ramdisk 条目必须逐字节等于它"的对照物）。
          mkdir -p r28d
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o r28d/raphael-xnu-r28d-flash.img  "${{ inputs.r28d_image }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o r28d/raphael-xnu-r28d-gpu-flash.img "${{ inputs.r28d_gpu_image }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o r28d/raphael-r28d-flashboot.apfs "${{ inputs.r28d_flashboot }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o r28d/r28d-md1-root.apfs "${{ inputs.r28d_root }}"
          sha256sum r28d/* | tee r28d/SHA256SUMS.r28d
          # 硬校验：四件资产必须是 R28d release 的官方字节（r28d-springboard 的 SHA256SUMS）
          python3 - r28d/ <<'PY'
          import hashlib, sys
          want = {
              'raphael-xnu-r28d-flash.img':    '95278e76df1857e069e40f97815f533e8a8ea0328516bb6421d79a4e2959bb72',
              'raphael-xnu-r28d-gpu-flash.img':'ef441b1c9630ade83e61c0fd4cbad09229694361367a00f6df640e2cd85b1f71',
              'raphael-r28d-flashboot.apfs':   '14485e7c5ce125ef516168445c2500ac04ca5e40a908c2aef516b2d92c24ba0c',
              'r28d-md1-root.apfs':            '372c7fcb7730726a8fb806eec7251e0e75a4188f64db6fbaedcf5b7663672dd4',
          }
          for name, sha in want.items():
              got = hashlib.sha256(open(sys.argv[1] + name, 'rb').read()).hexdigest()
              assert got == sha, f'{name}: {got} != the R28d release sha {sha}'
          print('底板四件全部等于 R28d release 的官方字节（r28d-springboard SHA256SUMS）')
          PY
          # 立等可取的装载器门禁：R28d 镜像里的 loader 条目必须是设备已验证的 v7（ec15106d…），
          # 内核条目必须是 R28d、小卷必须是 R13 谱系——本轮手术的底板谱系三查
          python3 tools/r28i-kernel-id.py r28d/raphael-xnu-r28d-flash.img r28d/raphael-xnu-r28d-gpu-flash.img | tee r28d-id.txt
          grep -q "ec15106da4bad290" r28d-id.txt || { echo "::error::R28d 镜像的 loader 不是设备验证过的 v7（ec15106d…）"; exit 1; }
          grep -Ec "loader +sha256" r28d-id.txt | grep -qx 2 || { echo "::error::两张 R28d 镜像都要读到 loader 条目"; exit 1; }
          grep -q "VERDICT: the kernel entry is R28d" r28d-id.txt || { echo "::error::底板镜像的内核不是 R28d"; exit 1; }
          grep -q "VERDICT: the ramdisk entry is R13..R28d VERBATIM" r28d-id.txt || { echo "::error::底板镜像的小卷不是 R13 谱系"; exit 1; }
          # 两张底板镜像的 ramdisk 条目必须就是 r28d-md1-root.apfs 的字节（本轮"卷零改动"的对照物）
          python3 - r28d/ <<'PY'
          import gzip, struct, sys
          def ramdisk_of(path):
              img = open(path, 'rb').read()
              blob = gzip.decompress(img[4096:4096 + struct.unpack('<I', img[8:12])[0]])
              x = blob.find(b'XNUP')
              size = struct.unpack('<I', blob[x+4:x+8])[0]
              i, out = x + 8, {}
              while i + 24 <= x + 8 + size and blob[i] != 0:
                  name = blob[i:i+16].rstrip(b'\0').decode()
                  esize = struct.unpack('<I', blob[i+16:i+20])[0]
                  out[name] = blob[i+24:i+24+esize]
                  i += 24 + ((esize + 15) & ~15)
              return out['ramdisk']
          base = open(sys.argv[1] + 'r28d-md1-root.apfs', 'rb').read()
          for n in ('raphael-xnu-r28d-flash.img', 'raphael-xnu-r28d-gpu-flash.img'):
              r = ramdisk_of(sys.argv[1] + '/' + n)
              assert r == base, f'{n}: ramdisk 条目与 r28d-md1-root.apfs 不一致'
          print('底板两镜像的 ramdisk 条目 == r28d-md1-root.apfs，逐字节')
          PY

      # ---------------------------------------------------------------
      # R28i 工具链纪律（lsd SIGBUS 的头号嫌疑：r25-* 缓存键的跨代 restore 链让两次
      # 构建可能拿到不同代的 theos / xnu-deps）。本轮缓存键全新、**不带 restore-keys**：
      # 首跑必 miss → 从钉死的 URL 重建（L1ghtmann v19.0.0-L2 具名 tag + theos/sdks
      # 固定源），重建是确定性的；后续同键命中同一份。跨代混用从结构上不再可能。
      - name: "②c/⑥ 缓存：theos（工具链 + iPhoneOS16.5.sdk；R28i 全新键、无 restore 链）"
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: r28i-theos-v19L2-v1
      - name: "②d/⑥ 缓存：xnu-deps（Apple 开源件 + host 工具 + SDK 链接树；R28i 全新键、无 restore 链）"
        uses: actions/cache@v4
        with:
          path: hackios/xnu-deps
          key: r28i-xnu-deps-v1
      # R28i 沿 R28b/R28d/R28g 的 clean build 纪律：ccache 零回填（空仓起跑），
      # 本轮每个 .o 都从本轮源码编译；缓存只存不用（给后面的轮次）。
      - name: "②e/⑥ ccache（R28i clean build——零回填，只存不用）"
        uses: actions/cache@v4
        with:
          path: hackios/.ccache
          key: r28i-ccache-${{ github.run_id }}

      # ---------------------------------------------------------------
      - name: "③/⑥ 内核源码构建（theos 固定 v19.0.0-L2 + xnu/apply.sh + xnu-deps + clean ccache + make + R28i 门禁）"
        run: |
          set -eu
          # theos 本体 + 工具链：R28i 起工具链 URL 钉死（不再 releases/latest——
          # latest 一旦上游发新版本，两次构建之间就会漂移）。钉的是 git tag
          # main-update_3-eabca92（release 显示名 v19.0.0-L2）——download URL 只认
          # git tag，不认显示名，run 40213864365 就是栽在拿显示名当 tag 404；
          # 该 release 自 2024-04 未动过，与 R28d/R28g 实际拉到的字节相同，纯收紧
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/ld64" ]; then
            rm -rf "$THEOS"
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
            mkdir -p "$THEOS/toolchain"
            curl -fL --retry 3 --retry-delay 5 -sS https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          fi
          "$THEOS/toolchain/linux/iphone/bin/ld64" --version | tee -a "$REL/toolchain-versions.txt" || true
          echo "--- theos toolchain tarball identity ---" | tee -a "$REL/toolchain-versions.txt"
          echo "L1ghtmann/llvm-project v19.0.0-L2 (git tag main-update_3-eabca92; pinned; R28i discipline)" | tee -a "$REL/toolchain-versions.txt"
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" ]; then
            rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk" /tmp/theos-sdks
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
            git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
            mkdir -p "$THEOS/sdks"
            mv /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
            rm -rf /tmp/theos-sdks
          fi
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" || { echo "::error::theos/sdks 的 iPhoneOS16.5.sdk 就位失败"; exit 1; }
          df -h /
          cd hackios
          xnu/apply.sh
          # 内核编译器钉死：theos 工具链的 clang（上面按 git tag 下载的那份），绝不许
          # runner 的 apt clang 编内核 —— R28i run 40214391444：当日 apt clang 把三个
          # "T2 VERDICT:" 判决串无声无息地从内核里剥了（-w 吃掉了警告，门禁兜住的）；
          # R28d→R28g 的 apt clang 漂移也是 lsd SIGBUS 的头号嫌疑。xnu-clang wrapper
          # 读 XNU_HOST_CLANG（本轮起支持）；host 工具（mig 等）仍用 apt 的。
          XNU_HOST_CLANG="$THEOS/toolchain/linux/iphone/bin/clang"
          export XNU_HOST_CLANG
          test -x "$XNU_HOST_CLANG" || { echo "::error::theos 工具链 clang 缺位（$XNU_HOST_CLANG）"; exit 1; }
          "$XNU_HOST_CLANG" --version | tee -a "$REL/toolchain-versions.txt"
          grep -q "eabca92" "$REL/toolchain-versions.txt" || { echo "::error::内核编译器不是钉死的 theos clang（eabca92）"; exit 1; }
          bash xnu-deps/setup.sh || { echo "::error::setup.sh 失败——exporthdrs.log 尾部："; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          export XNU_CCACHE=1 CCACHE_COMPILERCHECK=content XNU_WRAPPER_LOG="$PWD/xnu-clang-args.log"
          : > "$XNU_WRAPPER_LOG"
          ccache -C >/dev/null 2>&1 || true
          ccache -M 2G >/dev/null 2>&1 || true
          echo "→ R28i clean build：ccache 零回填空仓起跑，本轮每个对象都从本轮源码编译"
          echo "→ ccache 起步统计（应全零）："; ccache -s 2>/dev/null | head -8 || true
          ./xnu-build.sh -j4 -k || echo "（make 退出码 $?——上游文档：链接后的检查，内核若已产出即成功）"
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          ls -la "$K" || { echo "::error::内核没有产出——exporthdrs.log 与 make 日志尾部："; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          # --- R28i 诊断 v2：wrapper 自录 argv + 真实命令重放矩阵（一轮定位删串元凶）---
          echo "→ 诊断 A：内核 T2 VERDICT 计数 = $(strings -a "$K" | grep -c 'T2 VERDICT:')（应为 3）"
          REALRAW=$(grep -m1 "raphael_adreno.c" "$PWD/xnu-clang-args.log" || true)
          TAB=$(printf '\t')
          CWD="${REALRAW%%$TAB*}"
          REAL="${REALRAW#*$TAB}"
          if [ -z "$REAL" ]; then
            echo "::error::诊断：wrapper 日志里没有 raphael_adreno 行"
            wc -l "$PWD/xnu-clang-args.log" || true
            head -3 "$PWD/xnu-clang-args.log" | cut -c1-300 || true
            exit 1
          fi
          echo "→ 诊断 B：raphael_adreno 的真实 argv（截断 1400 字符）："
          echo "$REAL" | cut -c1-1400
          SRC=xnu-src/xnu-8796.121.2
          TCC="$THEOS/toolchain/linux/iphone/bin/clang"
          python3 - "$REAL" "$CWD" "$TCC" <<'PY'
          import shlex, subprocess, sys, os
          real, cwd, tcc = sys.argv[1], sys.argv[2], sys.argv[3]
          argv = shlex.split(real)
          drop_flags = ('-o', '-MF', '-MT', '-MQ')
          clean, skip = [], False
          for a in argv:
              if skip:
                  skip = False
                  continue
              if a in drop_flags:
                  skip = True
                  continue
              if a.startswith(('-MF=', '-MT=', '-MQ=')) or a == '-c':
                  continue
              clean.append(a)
          os.chdir(cwd)
          print(f'  (replaying from the real cwd: {cwd})')
          # the wrapper itself appends these on every exec: -target, -w, -include compat.h
          compat = os.path.abspath('xnu-deps/hostinc/xnu_clang_compat.h')
          if not os.path.exists(compat):
              compat = os.path.abspath(os.path.join(cwd, '../../xnu-deps/hostinc/xnu_clang_compat.h'))
          base = ['-target', 'arm64-apple-ios16.5', '-w']
          if os.path.exists(compat):
              base += ['-include', compat]

          def run(tag, m, b=None):
              out = f'/tmp/var_{tag}.o'
              cmd = [tcc] + (base if b is None else b) + m + ['-c', '-o', out]
              r = subprocess.run(cmd, capture_output=True, text=True)
              n = -1
              try:
                  s = subprocess.run(['strings', '-a', out], capture_output=True, text=True).stdout
                  n = s.count('T2 VERDICT:')
              except Exception:
                  pass
              warn = sum(1 for l in r.stderr.splitlines() if 'warning' in l.lower())
              print(f'  {tag:12s} T2VERDICT={n}  rc={r.returncode}  warnings={warn}')
              if r.returncode != 0 and r.stderr:
                  print('    ERR:', r.stderr.splitlines()[0][:200])
              return n

          def apply(m, old_f, new_f):
              if not old_f:
                  m.append(new_f)
                  return m
              i = m.index(old_f) if old_f in m else -1
              if i < 0:
                  return m
              if new_f:
                  m[i] = new_f
              elif old_f in ('-include', '-fsanitize-ignorelist'):
                  del m[i:i+2]
              else:
                  del m[i]
              return m

          print('REPLAY MATRIX (3 = the string survived, 0 = it was dropped):')
          run('as-is', list(clean))
          run('no-w', list(clean), [x for x in base if x != '-w'])
          bi = base.index('-include') if '-include' in base else -1
          run('no-incl', list(clean), base[:bi] + base[bi+2:] if bi >= 0 else base)
          variants = [
              ('O1',        '-O2', '-O1'),
              ('Os',        '-O2', '-Os'),
              ('O0',        '-O2', '-O0'),
              ('no-mker',   '-mkernel', ''),
              ('no-merge',  '-fmerge-all-constants', ''),
              ('no-builtin','-fno-builtin', ''),
              ('no-avz',    '-ftrivial-auto-var-init=zero', ''),
              ('no-inline', '', '-fno-inline-functions'),
              ('no-san',    '-fsanitize=signed-integer-overflow', ''),
              ('no-sanrt',  '-fsanitize-minimal-runtime', ''),
              ('no-ovmin',  '-miphoneos-version-min=16.5', ''),
              ('no-dvolat', '-Dvolatile=__volatile', ''),
          ]
          for tag, old_f, new_f in variants:
              run(tag, apply(list(clean), old_f, new_f))
          pan_seq = ['-Xclang', '-target-feature', '-Xclang', '+pan']
          mp = list(clean)
          for k in range(len(mp) - 3):
              if mp[k:k+4] == pan_seq:
                  del mp[k:k+4]
                  break
          run('no-pan', mp)
          print('IR PROBES (-O2 in clean already; the trailing -O0 wins):')
          def probe(tag, extra):
              out = f'/tmp/probe_{tag}.ll'
              cmd = [tcc] + base + clean + ['-S', '-emit-llvm'] + extra + ['-o', out]
              r = subprocess.run(cmd, capture_output=True, text=True)
              n = -1
              try:
                  n = open(out, errors='replace').read().count('T2 VERDICT:')
              except Exception:
                  pass
              print(f'  {tag:16s} T2VERDICT-in-IR={n}  rc={r.returncode}')
              if r.returncode != 0 and r.stderr:
                  print('    ERR:', r.stderr.splitlines()[0][:200])
          probe('frontend', ['-Xclang', '-disable-llvm-passes'])
          probe('O2mid',    ['-O2'])
          probe('O0mid',    ['-O0'])
          print('IR DONE. frontend=0 -> the front end eats it; O2mid=0 & frontend=3 -> the mid end; O2mid=3 & .o=0 -> the AArch64 back end.')
          print('REPLAY DONE. as-is=0 and any variant=3 -> that variant is the fix or the trigger.')

          PY
          echo "→ ccache 收官统计："; ccache -s 2>/dev/null | head -8 || true
          # ---- R28i 门禁：本轮自己的标记（含内嵌 .mdt 的字节级证明）、保留的先轮标记、退役措辞反查、
          # 新 sha 断言（不允许等于任何一代历史内核）
          python3 - "$K" fw-gpu-raphael/adsp.mbn <<'PY'
          import hashlib, sys
          d = open(sys.argv[1], 'rb').read()
          fw = open(sys.argv[2], 'rb').read()
          for marker, what in ((b'R28i: the kernel generation line', 'R28i 代数戳（驱动首行 + step 1 首次 flush）'),
                               (b'R28i: the two-parameter baseline', 'R28i 基线状态行（step 19 四开关自报）'),
                               (b'R28i: the T2 control', 'R28i T2 对照宣告（announce + 调用 what 串）'),
                               (b"the kernel's own embedded copy", 'R28i 内嵌副本宣告（announce + 来源行）'),
                               (b'fw/adsp.mbn', 'R28i 来源行（内嵌副本的名字）'),
