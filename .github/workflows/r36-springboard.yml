name: R36 · SpringBoard 一键流水线（J3 关闭轮：sbin/init = union 挂载 init（userland pin 6f04967）——Metal 的发现链在真根 /System/Library/Extensions 拼路径，卷内链接它永远看不到（R35 logdump 实锤：bundle NOT THERE）；init 把镜像自己的 Extensions union-bind 到 iOS 真根（MNT_UNION，/jb-bin 同款机制），bundle 站到 Apple AGX 件旁边。内核 = R33 字节 verbatim（shadiff 门禁）；cmdline = R35 组原样（metal=1 在内，零新 token）；卷 = R35 GL+Metal 字节 + 恰好两处换装（sbin/init、etc/rc.jobs）；底板 = r35 release（其 GPU 镜像 = J3 案发镜像）；GL+Metal 六件不再重建——它们就在底料里）
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "hackios 内核树 fork（含 xnu/ + tools/r36-*）"
        required: true
        default: "Gsjsjzhznsz/hackios-xnu-kernel"
      release_tag:
        description: "Release tag（直链的一部分）"
        required: true
        default: "r36-springboard"
      base_image:
        description: "r35 日常镜像直链（= r34 逐字节；R36 日常镜像再次原样转发）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r35-springboard/raphael-xnu-r35-flash.img"
      base_gpu_image:
        description: "r35 GPU 镜像直链（外科手术的底板：J3 案发镜像，只换 ramdisk 条目 = J3-fix 卷，cmdline 原样）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r35-springboard/raphael-xnu-r35-gpu-flash.img"
      base_flashboot:
        description: "r35 启动卷直链（= R13 谱系，真机验证过，原样转发）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r35-springboard/raphael-r35-flashboot.apfs"
      base_root:
        description: "r35 小卷 md1 直链（卷构建的底料：GL+Metal 六件就在这些字节里）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r35-springboard/r35-md1-root.apfs"
permissions:
  contents: write
concurrency:
  group: r36-springboard
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      REL: ${{ github.workspace }}/release
      THEOS: /home/runner/theos     # (literal: GitHub Actions' env: block expands nothing)
      CCACHE_DIR: ${{ github.workspace }}/hackios/.ccache
    outputs:
      volume_sha: ${{ steps.volume.outputs.volume_sha }}
    steps:
      # ---------------------------------------------------------------
      - name: "①/⑥ 磁盘准备与依赖（内核工具链；R36 无 Mesa 构建——GL+Metal 六件就在 r35 卷里）"
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-dev clang lld ccache \
                       flex bison m4 perl python3 autoconf automake libtinfo6 xz-utils uuid-dev 7zip \
                       >/dev/null
          command -v clang && command -v ccache && command -v 7z
          # dsymutil：BUILD_DSYM=0 时规则根本不查询它，链接只是保险（R11 run 39973048286 的教训）
          DS=$(command -v dsymutil || clang --print-prog-name=dsymutil 2>/dev/null || true)
          [ -x "$DS" ] || DS=$(ls /usr/lib/llvm-*/bin/dsymutil 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$DS" ] && [ -x "$DS" ]; then
            sudo ln -sf "$DS" /usr/bin/dsymutil
          else
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/bin/dsymutil >/dev/null && sudo chmod +x /usr/bin/dsymutil
          fi
          mkdir -p "$REL"
          {
            echo "R36 toolchain audit (recorded $(date -u +%FT%TZ))"
            echo "--- runner image ---"
            cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION)=' || true
            echo "--- apt clang (the kernel's host compiler) ---"
            clang --version | head -2
            lld --version 2>/dev/null || true
          } | tee "$REL/toolchain-versions.txt"
          df -h /

      # ---------------------------------------------------------------
      - name: "②/⑥ 取树 + 取 r35 资产（本轮底板；SHA 对官方 SHA256SUMS 硬校验）"
        run: |
          set -eu
          git clone --depth 1 "https://github.com/${{ inputs.kernel_repo }}.git" hackios
          cd hackios
          echo "→ 内核树 @ $(git log -1 --format='%h %s')"
          ls -lh xnu/files/bsd/dev/raphael_adreno.c tools/r36_volume_build.py tools/r36_flash_build.py \
                tools/r36_init_build.sh tools/r36-kernel-id.py
          # r35 的四件资产：两张镜像是外科手术的底板（GPU 底板 = J3 案发镜像：内核条目 = R33
          # 420f4b71…，cmdline = R35 组含 metal=1，小卷 = R35 GL+Metal 卷），启动卷原样转发，
          # 小卷 = 卷构建的底料（GL+Metal 六件 + 链接 + inject.conf 行都在它里面）。
          mkdir -p base
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/raphael-xnu-r35-flash.img  "${{ inputs.base_image }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/raphael-xnu-r35-gpu-flash.img "${{ inputs.base_gpu_image }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/raphael-r35-flashboot.apfs "${{ inputs.base_flashboot }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/r35-md1-root.apfs "${{ inputs.base_root }}"
          sha256sum base/* | tee base/SHA256SUMS.r35base
          # 硬校验：四件资产必须是 r35 release 的官方字节
          # （gpu 的 4eec8b34 = run 40704068058 step② 对 release 直链完整下载的 sha256——
          #   本地 07fd928a 是上会话 curl 中断的坏副本，作废；底板谱系三查即法律自证）
          python3 - base/ <<'PY'
          import hashlib, sys
          want = {
              'raphael-xnu-r35-flash.img':    'b0f9f6df4ea13ad9d45048e7ff15e33d7b2fcb67204d01964b1014517ca8a60b',
              'raphael-xnu-r35-gpu-flash.img':'4eec8b340534bea96ca5a31731f0e47bc8b038eaf7f806c49b0d22d7c21da6a9',
              'raphael-r35-flashboot.apfs':   '14485e7c5ce125ef516168445c2500ac04ca5e40a908c2aef516b2d92c24ba0c',
              'r35-md1-root.apfs':            '6a8b055d1ea48b4647843c6eda47880121af3ba50886ddad152ef76edd09de6f',
          }
          for name, sha in want.items():
              got = hashlib.sha256(open(sys.argv[1] + name, 'rb').read()).hexdigest()
              assert got == sha, f'{name}: {got} != the r35 release sha {sha}'
          print('底板四件全部等于 r35 release 的官方字节（r35-springboard SHA256SUMS）')
          PY
          # 底板谱系三查（r36-kernel-id 还在本树）：v7 装载器 + R33 内核 + 小卷三态判读
          # （--expect-volume-sha = r35 release 的 GL+Metal 卷）
          python3 tools/r36-kernel-id.py base/raphael-xnu-r35-flash.img base/raphael-xnu-r35-gpu-flash.img \
                  --expect-volume-sha 6a8b055d1ea48b4647843c6eda47880121af3ba50886ddad152ef76edd09de6f \
                  --expect-volume-name "the R35 GL+Metal volume" | tee base-id.txt
          grep -q "ec15106da4bad290" base-id.txt || { echo "::error::r35 底板镜像的 loader 不是设备验证过的 v7（ec15106d…）"; exit 1; }
          grep -Ec "loader  sha256" base-id.txt | grep -qx 2 || { echo "::error::两张 r35 底板镜像都要读到 loader 条目"; exit 1; }
          grep -c "VERDICT: the kernel entry is R36" base-id.txt | grep -qx 2 || { echo "::error::底板镜像的内核不是 R33 字节（= R36 期望）"; exit 1; }
          grep -q "VERDICT: the ramdisk entry is R13..R33 (the R13 bytes)" base-id.txt || { echo "::error::r35 日常镜像的小卷不是 R13 谱系"; exit 1; }
          grep -q "VERDICT: the ramdisk entry is the R35 GL+Metal volume" base-id.txt || { echo "::error::r35 GPU 底板的小卷不是 R35 GL+Metal 卷"; exit 1; }
          grep -q "NO new token" base-id.txt || { echo "::error::r35 GPU 底板的 cmdline 判读不对（应报 R35/R36 GPU set：metal=1 在内）"; exit 1; }
          grep -c "libredwood-gl.dylib=2" base-id.txt | grep -qx 1 || { echo "::error::r35 GPU 底板小卷的名字表指纹缺 libredwood-gl.dylib"; exit 1; }
          # 两张底板镜像的 ramdisk 条目必须与各自底料一致（日常 = R13 谱系字节；GPU = r35-md1-root.apfs）
          python3 - base/ <<'PY'
          import gzip, struct, hashlib, sys
          def ramdisk_of(path):
              img = open(path, 'rb').read()
              blob = gzip.decompress(img[4096:4096 + struct.unpack('<I', img[8:12])[0]])
              x = blob.find(b'XNUP')
              size = struct.unpack('<I', blob[x+4:x+8])[0]
              i, out = x + 8, {}
              while i + 24 <= x + 8 + size and blob[i] != 0:
                  name = blob[i:i+16].rstrip(b'\0').decode()
                  esize = struct.unpack('<I', blob[i+16:i+20])[0]
                  out[name] = blob[i+24:i+24+esize]
                  i += 24 + ((esize + 15) & ~15)
              return out['ramdisk']
          daily_expect = '372c7fcb7730726a8fb806eec7251e0e75a4188f64db6fbaedcf5b7663672dd4'
          gpu_base = open(sys.argv[1] + 'r35-md1-root.apfs', 'rb').read()
          assert hashlib.sha256(ramdisk_of(sys.argv[1] + 'raphael-xnu-r35-flash.img')).hexdigest() == daily_expect, \
              'r35 日常镜像的 ramdisk 条目不是 R13 谱系字节'
          assert ramdisk_of(sys.argv[1] + 'raphael-xnu-r35-gpu-flash.img') == gpu_base, \
              'r35 GPU 镜像的 ramdisk 条目与 r35-md1-root.apfs 不一致'
          print('底板两镜像的 ramdisk 条目 == 各自底料，逐字节')
          PY

      # ---------------------------------------------------------------
      # R28i 工具链纪律（R35 原样继承）：缓存键全新、无 restore 链，重建确定性。
      - name: "②c/⑥ 缓存：theos（工具链 + iPhoneOS16.5.sdk；R36 全新键、无 restore 链）"
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: r36-theos-v19L2-v1
      - name: "②d/⑥ 缓存：xnu-deps（Apple 开源件 + host 工具 + SDK 链接树；R36 全新键、无 restore 链）"
        uses: actions/cache@v4
        with:
          path: hackios/xnu-deps
          key: r36-xnu-deps-v1
      - name: "②e/⑥ ccache（R36 clean build——零回填，只存不用）"
        uses: actions/cache@v4
        with:
          path: hackios/.ccache
          key: r36-ccache-${{ github.run_id }}

      # ---------------------------------------------------------------
      # ③ 内核构建：R36 改的是卷里的一个 init，不是内核——本轮的构建是一次内容等价
      # 证明：同一棵树、同一个钉死的工具链，重建内核必须与 R33 发布字节内容等价（shadiff
      # 门禁，R34 run 40621589211 同法通过）。精确 sha 门禁天生不可满足——构建把墙钟写进
      # 版本串、cctools ld 假签名随机 LC_UUID（R34 run 40607732684 法证），差一个代码字节
      # 都是环境漂移或误改内核，必须查清，不许带着疑点上机。
      - name: "③/⑥ 内核源码构建 + R33 内容等价门禁（theos v19.0.0-L2 + xnu/apply.sh + xnu-deps + clean ccache + make；shadiff --gate 参照 = r35 GPU 底板内核条目 = 420f4b71…）"
        run: |
          set -eu
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/ld64" ]; then
            rm -rf "$THEOS"
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
            mkdir -p "$THEOS/toolchain"
            curl -fL --retry 3 --retry-delay 5 -sS https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          fi
          "$THEOS/toolchain/linux/iphone/bin/ld64" --version | tee -a "$REL/toolchain-versions.txt" || true
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" ]; then
            rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk" /tmp/theos-sdks
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
            git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
            mkdir -p "$THEOS/sdks"
            mv /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
            rm -rf /tmp/theos-sdks
          fi
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" || { echo "::error::iPhoneOS16.5.sdk 就位失败"; exit 1; }
          df -h /
          cd hackios
          xnu/apply.sh
          XNU_HOST_CLANG="$THEOS/toolchain/linux/iphone/bin/clang"
          export XNU_HOST_CLANG
          test -x "$XNU_HOST_CLANG" || { echo "::error::theos 工具链 clang 缺位"; exit 1; }
          "$XNU_HOST_CLANG" --version | tee -a "$REL/toolchain-versions.txt"
          grep -q "eabca92" "$REL/toolchain-versions.txt" || { echo "::error::内核编译器不是钉死的 theos clang"; exit 1; }
          bash xnu-deps/setup.sh || { echo "::error::setup.sh 失败"; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          export XNU_CCACHE=1 CCACHE_COMPILERCHECK=content XNU_WRAPPER_LOG="$PWD/xnu-clang-args.log"
          : > "$XNU_WRAPPER_LOG"
          ccache -C >/dev/null 2>&1 || true
          ccache -M 2G >/dev/null 2>&1 || true
          # dSYM 在这条流水线里是纯开销且脆弱（R34 run 40560646210：DSYMUTIL 解析为空 →
          # bash 把 --minimize 当命令 → Error 127；R35 run 40670171127 抄丢旗标后同伤复发）。
          # 正解 = 上游正规开关 BUILD_DSYM=0（MakeInc.def:298 默认 1；=0 时 dSYM 规则走
          # mkdir+touch 分支，DSYMUTIL 根本不被查询）。内核字节 = 编译+链接+strip，门禁证明力不变。
          ./xnu-build.sh -j4 -k BUILD_DSYM=0 || echo "（make 退出码 $?——上游文档：链接后的检查，内核若已产出即成功）"
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          ls -la "$K" || { echo "::error::内核没有产出"; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          # --- R36 门禁一：R33 标记快检（树没被误改的第一道网）
          echo "→ 诊断：R33 标记快检（R36 不动内核，措辞应与 R33 发布件全同）"
          echo "    R33 generation line = $(strings -a "$K" | grep -cF 'R33: the kernel generation line')（应 2）"
          echo "    R33 resident round = $(strings -a "$K" | grep -cF 'R33: the resident round')（应 1）"
          echo "    R33 keep switch = $(strings -a "$K" | grep -cF 'THE GPU STAYS ON for the system to draw with')（应 1）"
          echo "    R33 SCMDMP begin = $(strings -a "$K" | grep -cF 'SCMDMP: R33 begins')（应 1）"
          echo "    R32/R31 旧戳（应 0）= $(strings -a "$K" | grep -cE 'R32: the kernel generation line|R31: the kernel generation line')（应 0）"
          # --- R36 门禁二：内容等价——R33 的源必须产出 R33 的代码字节。
          # 精确 sha 门禁天生不可满足（墙钟版本串 + 随机 LC_UUID，R34 法证：重建 vs R33 =
          # 34 字节全落在 UUID+时间戳两个 meta 区）。正解 = shadiff 内容等价（R34 run
          # 40621589211 通过）：尺寸相等 + 非回收 + 差异只在 <=2 个 build-meta 簇
          # （UUID>=8B / 时间戳<=32B）+ 残留<=8B + 字符串差全是 Darwin 版本行。
          # 参照 = r35 GPU 底板的内核条目（= R33 发布字节 420f4b71…；② 的 r36-kernel-id
          # 判读已断言底板内核 = R33 verbatim）。
          KSHA=$(sha256sum "$K" | cut -d' ' -f1)
          echo "rebuilt kernel sha256: $KSHA" | tee -a "$REL/toolchain-versions.txt"
          python3 tools/r34_shadiff.py --gate base/raphael-xnu-r35-gpu-flash.img "$K" || {
            echo "::error::重建内核与 R33（420f4b71…）不是内容等价——见上方 GATE 法证输出；先查清，不许带疑点上机"
            exit 1
          }
          echo "→ ccache 收官统计："; ccache -s 2>/dev/null | head -8 || true

      - name: "诊断产物（wrapper argv 日志，失败也上传）"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-diag
          path: |
            hackios/xnu-clang-args.log
          if-no-files-found: ignore

      # ---------------------------------------------------------------
      # ④ 卷构建：R36 的全部内容变化都在这一步里。底料 = r35-md1（GL+Metal 六件、链接、
      # inject.conf 行、R34 谱系的一切都在里面，不重建）；脚本自己提取 R35 的 sbin/init
      # 作旧件证人（两个修复串必须"在新 init 里在、在旧 init 里不在"），再调
      # r36_init_build.sh 用内核构建同款钉死工具链编出 union init（userland pin 6f04967），
      # 换装 sbin/init 与 etc/rc.jobs 两处，其余逐字节原样；selftest 往返 + 全卷 diff 门禁。
      - name: "④/⑥ 卷构建（r35 GL+Metal 底料 + 恰好两处换装：sbin/init = union init、etc/rc.jobs = rc.jobs.r36metal；selftest 往返 + 全卷逐字节 diff）"
        id: volume
        run: |
          set -eu
          cd hackios
          python3 tools/r36_volume_build.py \
              --base base/r35-md1-root.apfs \
              --apfs-dir tools/apfs \
              --rc-jobs userland/rc.jobs.r36metal \
              --out "$REL/r36-md1-root.apfs" \
              --manifest "$REL/r36-volume-manifest.json" \
              --slack 512 2>&1 | tee "$REL/r36-volume-build.log"
          VSHA=$(python3 -c "import json;print(json.load(open('$REL/r36-volume-manifest.json'))['volume']['sha256'])")
          echo "volume_sha=$VSHA" >> "$GITHUB_OUTPUT"
          echo "→ R36 J3-fix 卷 sha256: $VSHA"
          ISHA=$(python3 -c "import json;m=json.load(open('$REL/r36-volume-manifest.json'));print(m['sbin_init']['r36_sha256'])")
          echo "→ 卷里的 sbin/init（union init）sha256: $ISHA"
          test "$(stat -c %s "$REL/r36-md1-root.apfs")" -lt 33554432 || { echo "::error::J3-fix 卷超过 32 MB（payload 预算告急）"; exit 1; }

      # ---------------------------------------------------------------
      - name: "⑤/⑥ 打 r36 双启动镜像（外科手术：底板 = r35 release；日常镜像逐字节原样，GPU 镜像只换 ramdisk 条目 = J3-fix 卷，cmdline = R35 组原样含 metal=1——零新 token；装载器 v7 / kernel R33 / DTB = r35 原字节）"
        run: |
          set -eu
          cd hackios
          python3 tools/r36_flash_build.py \
              --daily base/raphael-xnu-r35-flash.img \
              --gpu base/raphael-xnu-r35-gpu-flash.img \
              --volume "$REL/r36-md1-root.apfs" \
              --volume-sha "${{ steps.volume.outputs.volume_sha }}" \
              --out-daily "$REL/raphael-xnu-r36-flash.img" \
              --out-gpu "$REL/raphael-xnu-r36-gpu-flash.img" 2>&1 | tee "$REL/r36-flash-build.log"
          # 启动卷：r35 的官方字节（= R13 谱系，真机验证过），名字换成本轮（不刷也不影响 boot）
          cp base/raphael-r35-flashboot.apfs "$REL/raphael-r36-flashboot.apfs"
          # 对打包后的双镜像离线复证
          python3 tools/r36-kernel-id.py \
                  "$REL/raphael-xnu-r36-flash.img" "$REL/raphael-xnu-r36-gpu-flash.img" \
                  --expect-volume-sha "${{ steps.volume.outputs.volume_sha }}" \
                  --expect-volume-name "the R36 J3-fix volume" | tee r36-kernel-id.txt
          grep -c "VERDICT: the kernel entry is R36" r36-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像必须双双判 R36 内核（= R33 字节 verbatim）"; exit 1; }
          grep -c "ec15106da4bad290" r36-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像的 loader 必须是设备验证过的 v7"; exit 1; }
          grep -c "VERDICT: the ramdisk entry is R13..R33 (the R13 bytes)" r36-kernel-id.txt | grep -qx 1 || { echo "::error::日常镜像的小卷必须仍是 R13 谱系（本轮控制组）"; exit 1; }
          grep -c "VERDICT: the ramdisk entry is the R36 J3-fix volume" r36-kernel-id.txt | grep -qx 1 || { echo "::error::GPU 镜像的小卷必须是 R36 J3-fix 卷"; exit 1; }
          grep -c "libredwood-gl.dylib=2" r36-kernel-id.txt | grep -qx 1 || { echo "::error::J3-fix 卷的名字表指纹缺 libredwood-gl.dylib"; exit 1; }
          grep -c "RedwoodMetal.bundle=5" r36-kernel-id.txt | grep -qx 1 || { echo "::error::J3-fix 卷的名字表指纹缺 RedwoodMetal.bundle（应 5：bundle 名 x Info.plist x Extensions 链）"; exit 1; }
          grep -c "metal_props=2" r36-kernel-id.txt | grep -qx 1 || { echo "::error::J3-fix 卷的名字表指纹缺 metal_props"; exit 1; }
          # cmdline：R35 组原样，零新 token——每日镜像无 GPU token，GPU 镜像恰好全组
          test "$(grep 'cmdline       :' r36-kernel-id.txt | grep -c 'gpu=1')" = 1 || { echo "::error::必须恰好 GPU 镜像带 gpu=1"; exit 1; }
          test "$(grep 'cmdline       :' r36-kernel-id.txt | grep -c 'adreno_keep=1')" = 1 || { echo "::error::必须恰好 GPU 镜像带 adreno_keep=1（R33 的 resident 开关原样）"; exit 1; }
          test "$(grep 'cmdline       :' r36-kernel-id.txt | grep -c 'metal=1')" = 1 || { echo "::error::必须恰好 GPU 镜像带 metal=1（R35 的 token，本轮原样）"; exit 1; }
          test "$(grep 'cmdline       :' r36-kernel-id.txt | grep -c 'touchscreen=1 buttons=1 cpus=8 ufs=2 bootcpu=7 root_apfs=ufs_userdata gpu=1 adreno=22 adreno_pause=0 adreno_watch=0 adreno_keep=1 metal=1')" = 1 || { echo "::error::GPU 镜像的 cmdline 不是恰好 = R35 组原样"; exit 1; }
          # 卷里的 init 确实换了（manifest 的双 sha + 长度都在案）
          python3 - "$REL/r36-volume-manifest.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          ini = m['sbin_init']
          assert ini['r35_sha256'] != ini['r36_sha256'], 'sbin/init did not change'
          assert m['round'] == 'R36 J3-fix (the union init)', m['round']
          print('manifest: sbin/init r35 %s… -> r36 %s… (%d B); rc.jobs %s…'
                % (ini['r35_sha256'][:12], ini['r36_sha256'][:12], ini['r36_size'],
                   m['rc_jobs_sha256'][:12]))
          PY
          echo "（cmdline 检查过：本轮 token 零变化；唯一卷变化 = sbin/init + rc.jobs 两处换装）"
          ls -lh "$REL"
          df -h .

      # ---------------------------------------------------------------
      - name: "⑥/⑥ SHA256 + README + 发布（R36：J 判读树（union init 的 Metal 发现链关闭判决）+ R35 的 J3 入账，只有 boot 资产）"
        run: |
          set -eu
          cd "$REL"
          : > SHA256SUMS
          for f in raphael-xnu-r36-flash.img raphael-xnu-r36-gpu-flash.img \
                   raphael-r36-flashboot.apfs r36-md1-root.apfs; do
            sha256sum "$f" >> SHA256SUMS
          done
          REPO="${{ github.repository }}"
          TAG="${{ inputs.release_tag }}"
          cat > README.txt <<EOF
          ============================================================
           R36 · 纯血 hackios SpringBoard 交付包（raphael / K20 Pro）
           —— J3 关闭轮：sbin/init = union 挂载 init（userland 6f04967）
              （内核 = R33 字节 verbatim；cmdline = R35 组原样零新 token；
               卷 = R35 GL+Metal 字节 + 恰好两处换装）
          ============================================================
          ⚠️⚠️⚠️ 启动卷只 stage 一个文件：raphael-r36-flashboot.apfs ⚠️⚠️⚠️
            （R14 事故纪律不变：md1 备份不要 stage，flash.img 已内嵌全量小卷）
          主镜像   : raphael-xnu-r36-flash.img（= r35 = r34 逐字节原样：本轮控制组）
          GPU 镜像 : raphael-xnu-r36-gpu-flash.img（cmdline =
                      touchscreen=1 buttons=1 cpus=8 ufs=2 bootcpu=7
                      root_apfs=ufs_userdata gpu=1 adreno=22 adreno_pause=0
                      adreno_watch=0 adreno_keep=1 metal=1
                      = R35 的 token 组原样（零新 token）；卷变量：
                      sbin/init = union init（flash_root 把镜像自己的
                        /System/Library/Extensions MNT_RDONLY|MNT_UNION 到
                        iOS 真根的同名目录——bundle 链接站到 Apple AGX 件
                        旁边、恰是 Metal step 3 拼路径的地方；/jb-bin 同款
                        机制，R28i 真机验证过）
                      etc/rc.jobs = rc.jobs.r36metal（命令行与 r35metal 全同：
                        wait 22; props show/on; metal_test; metal_drv_test
                        --sweep——判决行不变，变的是 init）
                      其余 = R35 谱系逐字节原样（GL 三件 + libredwood-gl +
                        RedwoodMetal.bundle + 三件 Metal 工具 + inject.conf）
          启动卷   : raphael-r36-flashboot.apfs（= r35 = r34 官方字节，原样转发）
          小卷 md1 : r36-md1-root.apfs（本轮新卷；逐文件清单见
                      r36-volume-manifest.json，含 sbin/init 的新旧双 sha）
          【R35 的设备判决（用户 logdump 3019 行全文入账，本轮的地基）】
            系统全活：内核在跑、GPU 585MHz/35.7°C、触摸按键正常、
            SpringBoard 接管、无 panic。两案在册：
            ① J3（本轮课题）：metal_props 报 "Metal would open
               /System/Library/Extensions/RedwoodMetal.bundle: NOT
               THERE"——Metal 的发现链 step 3 在真根拼路径，卷内链接
               它永远看不到；metal_test 数遍真根 Extensions 只有
               Apple 的 AGX 件；MTLCreateSystemDefaultDevice() = nil。
            ② CA 停摆（R37 课题，本轮不动内核）：backboardd 的 CA
               上下文是 FD640 硬件、PUI 四帧提交成功、第 4 帧后主合
               成环停摆——内核显示驱动的 TE 相位/三缓冲/SwapWait 是
               参考仓库 10-23 轮的修法，下一轮搬。
          【R36 改了什么（以及刻意不改什么）】
            内核：一字节未动（R33 的 420f4b71… verbatim；CI 用同一棵
            树 + 钉死的工具链重建，shadiff 内容等价门禁——差异只许
            落在 UUID/时间戳两个 build-meta 簇，代码区零差异）。
            cmdline：零新 token（R35 组原样，metal=1 在内——它的门
            R35 已实测通过：props 落上了）。
            卷：R35 GL+Metal 字节 + 恰好两处换装（sbin/init、
            etc/rc.jobs）。GL+Metal 六件不重建——a5ef0c3 只动 init.c，
            它们在底料里逐字节 riding。
          【本轮判读树（J：union init 的 Metal 发现链关闭判决）】
            刷 GPU 镜像，等 boot 走完（应与 R35 全同），再等 demo job
            的五行（rwtouch wait 22 后）：
              metal_props show（应报 "(none)"）
              metal_props on（设两个属性）
              metal_test（五步发现链 + CoreImage）
              metal_drv_test --sweep
            自检（任一不满足 ⇒ 本票作废）：
              P0  R33/R34/R35 的全相位行照旧（step 12/19/21/22 +
                  STAYS-ON）
              P1  系统照常起（触摸活着；SpringBoard 照旧——黑屏是
                  R37 的课题，本轮预期不变）
              P2  启动日志里 init 的 union 行："our Metal plug-in
                  beside iOS's own, where Metal's discovery opens
                  it"（check 成功措辞）；若见 "bindfs union ... : ..."
                  ⇒ mount 被拒，J8
            判决分支：
              J1  metal_test step 3 打开 bundle 成功（真根上！）+
                  五步全绿 + drv sweep 有计数 ⇒ J3 关闭、Metal 发现
                  链真机打通 ⇒ 下一轮：R37 内核显示轮（CA 停摆）
              J2  metal_test 报 IOAcceleratorES 无属性/写入被拒 ⇒
                  不可能（R35 已证 metal=1 门通过）——发生了就查
                  cmdline 组装
              J3  metal_test step 3 仍报 bundle NOT THERE ⇒ union
                  挂载没生效（查 P2 的 init 行：挂载成功了吗？链接
                  在 union 视图里吗？）
              J8  init 日志打 "bindfs union ... : ..." ⇒ mount 系
                  统调用被拒（R33 内核对 bindfs+MNT_UNION 的态度
                  与 R28i 时不同？/flash 的挂载点状态？）
              J9  系统起不来（比 R35 早期的新伤）⇒ init 自己的回
                  归（bind_dir_union 在 check 链里的位置/行为）；
                  回滚 = 刷回 r35 GPU 镜像
              J4/J5/J6/J7  同 R35 的树（类拒绝/注入路/daemon 循环/
                  早期崩，按 R35 措辞分诊）
              回滚：刷回 r35 GPU 镜像（本轮的卷变化随镜像整体回退）
          【logdump 读取纪律（P3：不变）】
            分区每次整写都以头行开始；拉取后按头行截断；自有区判读
            双保险（写边界 + 指针计数）。设备端一键：sh run_ios.sh
            flash r36 gpu -w 180（或 logdump）。
          【离线复验】
            python3 tools/r36-kernel-id.py <image> --expect-volume-sha <r36-md1 sha>
            （代数 grep：kernel entry is R36 ×2；loader v7 ×2；日常镜像
             ramdisk = R13..R33 ×1；GPU 镜像 = R36 J3-fix volume ×1；
             名字表 libredwood-gl.dylib=2、RedwoodMetal.bundle=5、
             metal_props=2；cmdline 数据行 metal=1 ×1）
          【工具链审计】
            toolchain-versions.txt：每层编译器完整版本号 + 具名 tag
            （R28i 纪律，R36 原样继承；缓存键全新）。
          【手机端（Termux / bootloader）】
            fastboot boot  raphael-xnu-r36-gpu-flash.img   # R36 轮（J3-fix 卷）
            fastboot oem  ramdisk
            fastboot stage raphael-r36-flashboot.apfs
            fastboot oem  run      # 等系统起完（~1 分钟）再等 demo 的五行
                                   # 判决（rwtouch wait 22 之后）
            # 设备端一键：sh run_ios.sh flash r36 gpu -w 180
            # 控制组：主镜像 = r35 = r34 逐字节原样，无需重刷
          直链：
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-xnu-r36-gpu-flash.img
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-xnu-r36-flash.img
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-r36-flashboot.apfs
            https://github.com/\${REPO}/releases/download/\${TAG}/r36-md1-root.apfs
            https://github.com/\${REPO}/releases/download/\${TAG}/r36-volume-manifest.json
            https://github.com/\${REPO}/releases/download/\${TAG}/SHA256SUMS
          ⚠️ userdata 上的 iOS 卷是唯一存货：绝不要让 MIUI 开机
             （Android 会重格回 f2fs，iOS 卷即毁）。
          ⚠️ 每次开机都要重复 boot/oem ramdisk/stage/oem run 四步。
          ⚠️ 含 Apple 版权内容，仅个人研究；下载完成后请尽快删除本 Release。
          EOF

      - name: "⑥b/⑥ 发布 Release（直链交付，r36-springboard）"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "R36 · 纯血 hackios SpringBoard · J3 关闭轮（union init 进卷：Metal 的 bundle 站上真根发现路径；内核 = R33 字节 verbatim；cmdline = R35 组原样）"
          body: |
            raphael (K20 Pro) R36 交付包：**J3 关闭轮**。

            R35 设备判决（用户 logdump 3019 行全文入账）：系统全活
            （内核/GPU 585MHz/触摸按键/SpringBoard/无 panic），两案
            在册——J3：Metal 的发现链在真根 /System/Library/Extensions
            拼路径，卷内链接永远看不到（bundle NOT THERE ⇒ 设备 =
            nil）；CA 停摆：backboardd 的 CA 上下文是 FD640 硬件、
            四帧提交成功后主合成环停摆（内核显示轮 R37 的课题）。

            本轮一件事：sbin/init = union 挂载 init（userland 6f04967
            ——init a5ef0c3 的 flash_root 把镜像自己的 Extensions
            MNT_RDONLY|MNT_UNION 到 iOS 真根同名目录，bundle 链接站
            到 Apple AGX 件旁边、恰是 Metal step 3 拼路径的地方；
            /jb-bin 同款机制 R28i 真机验证过）。内核一字节未动
            （420f4b71… verbatim + CI shadiff 门禁），cmdline = R35
            组原样零新 token，卷 = R35 字节 + 恰好两处换装——单变量
            纪律：变的是 init，判决行不变。

            判读树 J：J1 = metal_test step 3 在真根打开 bundle + 五步
            全绿 + sweep 有计数 ⇒ J3 关闭、Metal 发现链真机打通（下
            一轮 R37 内核显示轮）；J3 = 仍 NOT THERE ⇒ union 未生效
            （查 init 的 check 行）；J8 = "bindfs union ... : ..." ⇒
            mount 被拒；J9 = 系统起不来 ⇒ init 回归。回滚 = 刷回
            r35 GPU 镜像。P1 明示：黑屏是 R37 的课题，本轮预期不变。

            手术：底板 = r35 release（GPU 底板 = J3 案发镜像），日常
            镜像逐字节原样，GPU 镜像只换 ramdisk 条目 = J3-fix 卷；
            装载器 v7 / kernel R33 / DTB = r35 原字节（SHA 硬校验）。

            ⚠️ 含 Apple 版权内容，仅供个人研究；下载完成后请尽快删除本 Release。
          fail_on_unmatched_files: true
