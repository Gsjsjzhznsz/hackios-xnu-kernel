            release/raphael-xnu-r36-flash.img
            release/raphael-xnu-r36-gpu-flash.img
            release/raphael-r36-flashboot.apfs
            release/r36-md1-root.apfs
            release/r36-volume-manifest.json
            release/SHA256SUMS
            release/README.txt
            release/toolchain-versions.txt
      - name: "直链汇总（跑完看这里，复制即用）"
        run: |
          set -eu
          echo "════════════ 全部下载直链 ════════════"
          for f in "$REL"/raphael-xnu-r36-flash.img "$REL"/raphael-xnu-r36-gpu-flash.img \
