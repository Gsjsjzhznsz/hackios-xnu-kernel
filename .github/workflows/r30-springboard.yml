      # ---------------------------------------------------------------

      - name: "诊断产物（wrapper argv 日志，失败也上传）"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-diag
          path: |
            hackios/xnu-clang-args.log
          if-no-files-found: ignore

      - name: "⑤/⑥ 打 r30 双启动镜像（外科手术：双镜像换 kernel 条目；GPU 镜像 cmdline 加 gpu=1+全相位 token 组——R28l 死因断言已修，日常镜像 cmdline / 装载器 v7 / ramdisk / DTB / 头字段 = R28d 原字节）"
        run: |
          set -eu
          cd hackios
          bash tools/r30-flash-build.sh r28d/raphael-xnu-r28d-flash.img r28d/raphael-xnu-r28d-gpu-flash.img
          cp raphael-xnu-r30-flash.img "$REL/"
          cp raphael-xnu-r30-gpu-flash.img "$REL/"
          # 启动卷与小卷：R28d 的官方字节，名字换成本轮（对照用，不刷也不影响 boot）
          cp r28d/raphael-r28d-flashboot.apfs "$REL/raphael-r30-flashboot.apfs"
          cp r28d/r28d-md1-root.apfs "$REL/r30-md1-root.apfs"
          # 对打包后的双镜像离线复证（与 ③ 源码构建、⑤ 打包内打印三方对齐）
          python3 tools/r30-kernel-id.py \
                  "$REL/raphael-xnu-r30-flash.img" "$REL/raphael-xnu-r30-gpu-flash.img" | tee r30-kernel-id.txt
          grep -c "VERDICT: the kernel entry is R30" r30-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像必须双双判 R30 内核"; exit 1; }
          grep -c "VERDICT: the ramdisk entry is R13..R28d VERBATIM" r30-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像的小卷必须是 R28d 原字节（本轮不换卷）"; exit 1; }
          grep -c "ec15106da4bad290" r30-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像的 loader 必须是设备验证过的 v7（ec15106d…）"; exit 1; }
          grep -q "WITH the full-step tokens" r30-kernel-id.txt || { echo "::error::GPU 镜像的 cmdline 必须带完整全相位 token 组（adreno=22 adreno_pause=0 adreno_watch=0，无 skip）"; exit 1; }
          grep -q "WITHOUT any adreno token" r30-kernel-id.txt || { echo "::error::日常镜像的 cmdline 必须不带任何 adreno token（控制组原样）"; exit 1; }
          # GPU 镜像的 cmdline 必须带 gpu=1（R28d 原样）、日常镜像不带（R28d 原样）
          # —— 数数据行（"cmdline       :" 前缀），VERDICT 行不匹配它（R28i 的教训）。
          test "$(grep 'cmdline       :' r30-kernel-id.txt | grep -c 'gpu=1')" = 1 || { echo "::error::两张镜像的 cmdline 数据行里必须恰好 GPU 镜像带 gpu=1"; exit 1; }
          test "$(grep 'cmdline       :' r30-kernel-id.txt | grep -c 'adreno=22')" = 1 || { echo "::error::两张镜像的 cmdline 数据行里必须恰好 GPU 镜像带 adreno=22（全相位）"; exit 1; }
          test "$(grep 'cmdline       :' r30-kernel-id.txt | grep -c 'adreno_skip')" = 0 || { echo "::error::R30 的 GPU cmdline 不得带 adreno_skip（step 19 必须跑）"; exit 1; }
          echo "（cmdline 检查过：GPU 镜像 = R28d 原字节 + gpu=1 + 全相位 token 组，日常镜像 = R28d 原字节 verbatim；R28l 死因断言已修）"
          ls -lh "$REL"
          df -h .

      # ---------------------------------------------------------------
      - name: "⑥/⑥ SHA256 + README + 发布（R30：M/N 判读树（M2 契约打包 + N3 日志环）+ logdump P3 读取纪律，只有 boot 资产）"
        run: |
          set -eu
          cd "$REL"
          : > SHA256SUMS
          for f in raphael-xnu-r30-flash.img raphael-xnu-r30-gpu-flash.img \
                   raphael-r30-flashboot.apfs r30-md1-root.apfs; do
            sha256sum "$f" >> SHA256SUMS
          done
          REPO="${{ github.repository }}"
          TAG="${{ inputs.release_tag }}"
          cat > README.txt <<EOF
          ============================================================
           R30 · 纯血 hackios SpringBoard 交付包（raphael / K20 Pro）
           —— 被吞真码回收：GPU 镜像全相位（adreno=22，zap 的 step 19
              在列），拒绝现场逐区 dump SCM 队列/句柄缓存/64KB 状态区/
              TZ DIAG，每区落盘后才碰下一区
          ============================================================
          ⚠️⚠️⚠️ 启动卷只 stage 一个文件：raphael-r30-flashboot.apfs ⚠️⚠️⚠️
            （R14 事故纪律不变：md1 备份不要 stage，flash.img 已内嵌全量小卷）
          主镜像   : raphael-xnu-r30-flash.img（触摸 + 按键 + 八核；不跑 GPU 步骤；
                      cmdline 逐字节 = R28d 原字节，R28k 已证干净的控制组）
          GPU 镜像 : raphael-xnu-r30-gpu-flash.img（同上 + gpu=1 +
                      adreno=22 adreno_pause=0 adreno_watch=0：全相位 22 步全跑，
                      宣告行应打 "steps up to 22, without those in mask 0x0"）
          启动卷   : raphael-r30-flashboot.apfs（= R28d 官方字节 = R13 全量，原样转发）
          小卷 md1 : r30-md1-root.apfs（= R28d 官方字节；对照用）

          【R30 改了什么、为什么】
            R28m 真机判决在案：M2 规范打包 0/52 字节差异仍 -3145797；
            N3 环 dump 落地且解码（rounds=0 ⇒ 环 = hyp 全量日志史，29 行
            1355 字节）——环内只有两行 [300045] 包装码，mssecapp 传输失败
            零出现，HypX 登记失败 0xfa11。结论：hyp 格式层全面出局，真
            TZ 返回值 w0 在 0x8572703c 的 cbz 处被丢弃、从未写入任何日志。
            但 hyp 恒等映射已被 N3 实证（登记表 0x146bfb30 → 环
            0x858e0000），被吞调用四周的状态是 EL1 可直读的物理内存。
            R30 的动作只有一个：拒绝现场，give-up 推土之前，逐区捞干净——
              QUE      0x85775e00 + cpu*0x30，0x200 B（SCM 队列条目：
                       +0x1d4 状态机 / +0x1e0 pending fnid / +0x200 计数）
              HND      0x858a6390 + cpu*0x18，0x40 B（per-cpu 句柄缓存
                       {fnid, valid} 对——0x02000201 是否留有残迹）
              GLB      0x858a5900，0xc00 B（HypX 全局 0x858a59b8/d8/e8——
                       真机环解码 REGISTRATION FAILED 0xfa11，预期空；
                       +0x800 = SCM 请求计数器 0x858a6100；+0xa90 = 八核
                       句柄 0x858a6390..0x858a6450）
              SCMDMP   0x85775000，0x10000 B（SCM 区全量 64KB：+0xe00 队列
                       字段 / +0x20000 调度器状态 / 中间一切，任何"返回码"
                       字段都可能直接命中真码）
              TZDIAG   TZ 自己的日志：hyp 启动时把它映射进 HLOS 页表（真机
                       环无任何 "Failed to map TZ DIAG" 行且 rounds=0 =
                       全量史），基址 = 物理 0x146bf720 处的 u32（hyp 的
                       0x857120b8 读的就是这个字），0x3000 B——若
                       sec_img_auth 跑过，fuse_read/证书行就在这里
              HYPDIAG  hyp 自己的 diag 缓冲：基址 = 物理 0x857619e8 处的
                       u64（0x8571200c 的孪生映射），0x2000 B
            每区 dump 后立即 put_the_log_away 再碰下一区：后区 wedge 不吃
            前区的记录。M2 打包（zap_header_m2）与 N3 环 dump（hyp_log_dump）
            原样随行——两者都是已立功的机器。adreno_scmsweep=0 可关 64KB
            大扫（小读保留）。
            工具教训入账：R28m 及之前所有轮的 README heredoc 终止符带
            10 空格前缀（shell 见非零缩进 = 永不终止），README.txt 尾部
            带 3 行垃圾且尾部命令从未执行——本轮修复（终止符 10 空格 =
            列 0）。

          【本轮判读树（S：先自检探针，再判真码）】
            第一刷 · GPU 镜像（全相位；等 ~2-3 分钟过风暴首发窗）：
              探针自检（任一不满足 ⇒ 本票作废，修复后重跑）：
                P0  宣告行 "adreno: R30: the swallowed-code recovery" 在场
                P1  "steps up to 22, without those in mask 0x0"——全相位
                    落地探针；若打别的 mask 值 ⇒ cmdline 未落地，作废
                P2  拒绝行后跟 HYPLOG 环 dump（R28m 行为原样，作对照基线）
                P3  SCMDMP 区组逐区出现：R30 begins → QUE 8 行 → HND 2 行
                    → GLB 12 行 → SCMDMP 2048 行 → TZREG 行 → TZDIAG 384 行
                    （登记字合理时）→ HYPDIAG 256 行（同）；每区后跟
                    "on the record" flush 行
                P4  任一区 "did not map" = 该区 EL1 不可读——记录之（本身
                    即证据）；任一 flush 超时行 = 记录之（继续跑）
              判决分支：
                S1  QUE/HND/GLB 捞到 0x02000201 残迹 + 状态机/返回码字段
                    非零 ⇒ 对照拒绝分支表（下）直接得唯一死因
                S2  64KB SCMDMP 行内发现 0x3000xx（≠0x300045）⇒ 同表分诊
                S3  TZREG 非零且 TZDIAG 出可读文本：
                    S3a  有 PAS/GPU/zap/fuse_read 痕迹 ⇒ 认证到达 TZ 内部
                         ⇒ 真码双源互证（SCM 区 + TZDIAG），死因锁定
                    S3b  区域可读但无 PAS 痕迹 ⇒ 调用死在 QSEE 入口/EL3
                         ⇒ 下一步 devcfg/ATF 取证（XBL 镜像）
                S4  TZREG = 0 ⇒ TZ 从未发布 diag 基址 ⇒ 登记链在 XBL 层
                    已断（新证据，指向更早的层）
                S5  全部 did not map / 全零 ⇒ 非恒等映射假说复活或 hyp 已
                    擦除 ⇒ 下轮 adreno_hyplog=<addr> 手动路径 + 分块小读
                S6  wedge ⇒ 哪个区 wedge 哪个区不可读，本身即证据
              真码判读表（T3-batch3/batch4 静态枚举，一表到底）：
                0x30001B            = api_ns 门（periph>0x1d/buf NULL/ctx——
                                      懒创建已排除）
                0x30001C/1D±n       = 主认证流 0x1c04e410 各拒绝分支（拷贝/
                                      版本/哈希/魔数 0x2ec88ff0/元数据 elem
                                      0xa,9,0x15,0x16,5,0xf,0x10/映射/防回滚/
                                      分配）
                0x30000A..0E        = mem pin 失败族（0x1c04d75c，sub
                                      0x4d..0x51）
                0x30004A / 0x30004E-50/1F/4D/4F = 0x1c04e5f4 与 ret 8..14
                                      映射表 @0x1c11cee0
                0x300042..0x300049  = QSEE handler 错误带（0x300045 不在其中
                                      ——batch3 普查实锤）
                小值族（1/2/3, SCM_E_*）或 0xFFFFFFFF = 死在 ATF/EL3 入口
                0x02000201 无残迹   = 调用未真正入队 ⇒ 逆向 hyp 队列状态机
                                      0x8571801c
              附带：T2 对照（adsp ACCEPTED 0）照旧先跑 = 链路无罪基础判词，
                    与 S 判定同 boot 双入账。
            控制组 · 主镜像（可选，R28k 已证干净）：第三验证入账即可。

          【logdump 读取纪律（P3：三次残迹教训的对策）】
            分区每次整写都以头行开始：== XNU FLUSH #N at T s (why); L bytes
            follow == 。拉取后按头行截断：本轮记录 = 头行 + 紧随的 L 字节，
            其后的一切都是更长旧写的残留，不进判读（R28j 轮 ~467 KB 固定读
            长的教训；R28k 轮复测日志的风暴=首刷残迹，probe 逐字节验证）。
            自有区判读双保险：写边界（写尾腰斩行）+ 指针计数（"N s: the
            kernel has logged"）。设备端一键工具 run_ios.sh 的 diag/split
            已焊入本纪律。本轮拒绝现场会有多次 FLUSH（refusal 行、N3 环、
            R30 每区各一次）——每次 FLUSH 的自有区都要独立截取判读。

          【离线复验】
            python3 tools/r30-kernel-id.py <image>
            （代数 grep：R30 代数戳=2、R30 宣告=1、SCMDMP 九标记各 1、
             scmsweep 开关=2、M2 三标记各 1、N3 三标记各 1、
             R28k 继续宣告=1、R28m/R28k/R28l 代数戳=0、
             R28j 基线=1、R28j T2 宣告=2、序贯收尾=1、zap give-up=1、
             页检查各 1、哈希段头各 1、判决=3、开关=4；R28i 及更早措辞全 0；
             ramdisk 判 R13..R28d VERBATIM；
             cmdline：GPU 镜像带 gpu=1 + adreno=22 全相位组、无 adreno_skip、
             日常镜像无任何 adreno token）

          【工具链审计】
            toolchain-versions.txt：每层编译器完整版本号 + 具名 tag
            （R28i 纪律，R30 原样继承；缓存键全新）。
            同源码异行为时先对这张表。

          【手机端（Termux / bootloader）】
            fastboot boot  raphael-xnu-r30-gpu-flash.img   # R30 轮（GPU 镜像）
            fastboot oem  ramdisk
            fastboot stage raphael-r30-flashboot.apfs
            fastboot oem  run      # 等宣告行 + M2 段表 + steps 1..22（或到 FAILED 止）
                                   # 再等 ~2 分钟过风暴首发窗，然后抓 logdump
            # 设备端一键：sh run_ios.sh flash r30 gpu -w 180
            # 控制组（可选）：同样的四步，换 raphael-xnu-r30-flash.img
          直链：
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-xnu-r30-gpu-flash.img
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-xnu-r30-flash.img
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-r30-flashboot.apfs
            https://github.com/\${REPO}/releases/download/\${TAG}/r30-md1-root.apfs
            https://github.com/\${REPO}/releases/download/\${TAG}/SHA256SUMS
          ⚠️ userdata 上的 iOS 卷是唯一存货：绝不要让 MIUI 开机
             （Android 会重格回 f2fs，iOS 卷即毁）。
          ⚠️ 每次开机都要重复 boot/oem ramdisk/stage/oem run 四步
             （启动卷住 RAM 不落盘，"不写手机闪存"设计的一部分）。
          ⚠️ 含 Apple 版权内容，仅个人研究；下载完成后请尽快删除本 Release。
          EOF

      - name: "⑥b/⑥ 发布 Release（直链交付，r30-springboard）"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "R30 · 纯血 hackios SpringBoard · 被吞真码回收（GPU 镜像全相位 adreno=22，拒绝现场逐区 dump SCM 队列/句柄缓存/64KB 状态区/TZ DIAG）"
          body: |
            raphael (K20 Pro) R30 交付包：**被吞真码回收——GPU 镜像全相位**。

            R28m 真机判决链：M2 规范打包 0/52 字节差异仍 -3145797；N3 环
            dump 落地且解码（rounds=0 ⇒ 环 = hyp 全量日志史）——环内只有
            两行 [300045] 包装码，mssecapp 传输失败零出现，HypX 登记失败
            0xfa11。hyp 格式层全面出局，真 TZ 返回值 w0 在 0x8572703c 的
            cbz 处被丢弃、从未入日志。但 hyp 恒等映射已被 N3 实证——被吞
            调用四周的状态是 EL1 可直读的物理内存。

            R30 的动作：拒绝现场（give-up 推土之前）逐区 dump——
            ① SCM 队列条目 0x85775e00+cpu*0x30（0x200 B：pending fnid/
            状态机/返回码残迹）；② per-cpu 句柄缓存 0x858a6390+cpu*0x18
            （0x40 B：0x02000201 残迹）；③ 全局块 0x858a5900（0xc00 B：
            HypX 全局/请求计数器/八核句柄）；④ SCM 区全量 0x85775000 起
            64KB（任何返回码字段都可能直接命中）；⑤ TZ DIAG 区（基址 =
            物理 0x146bf720 处 u32，hyp 启动映射的同一字；0x3000 B——
            sec_img_auth 跑过则 fuse_read/证书行在此）；⑥ hyp diag（基址
            = 0x857619e8 处 u64；0x2000 B）。每区 dump 后立即落盘再碰下
            一区：后区 wedge 不吃前区记录。M2 打包与 N3 环 dump 原样随行。

            判读树 S：QUE/HND/GLB 捞到 0x02000201 残迹或 64KB 区发现
            0x3000xx ⇒ 对照 batch3/batch4 拒绝分支表（0x30001B api_ns 门 /
            0x30001D±n 主认证流各分支 / 0x30000A..E mem pin / 0x30004E-50
            映射表 / 0x300042-49 handler 错误带——0x300045 不在其中）直接
            得唯一死因；TZDIAG 有 PAS 痕迹 ⇒ 双源互证；无 PAS 痕迹 ⇒ 死在
            QSEE 入口/EL3 ⇒ 下一步 devcfg/ATF（XBL）；TZREG=0 ⇒ 登记链断
            在 XBL；全 did not map ⇒ 非恒等映射假说复活；wedge ⇒ 本身即
            证据。附带：T2 对照（adsp ACCEPTED 0）照旧先跑。

            手术：kernel 条目双镜像同换；GPU 镜像 cmdline 加 gpu=1 + 全相位
            token 组，日常镜像 cmdline 逐字节 R28d 原样；装载器 v7 / ramdisk
            / DTB = R28d 原字节（SHA 硬校验）。
            工具教训入账：本系列此前所有轮的 README heredoc 终止符带前导
            空格（永不终止），README.txt 尾部带 3 行垃圾——本轮修复。

            logdump 按头行 "L bytes follow" 截断，且只判自有区（写边界 +
            指针计数）——P3 纪律，README.txt 有全文；run_ios.sh 已焊入。
            本轮拒绝现场多次 FLUSH（refusal/N3 环/R30 每区各一次），每次
            FLUSH 的自有区独立截取判读。

            ⚠️ 含 Apple 版权内容，仅供个人研究；下载完成后请尽快删除本 Release。
          fail_on_unmatched_files: true
          files: |
            release/raphael-xnu-r30-flash.img
            release/raphael-xnu-r30-gpu-flash.img
            release/raphael-r30-flashboot.apfs
            release/r30-md1-root.apfs
            release/SHA256SUMS
            release/README.txt
            release/toolchain-versions.txt
      - name: "直链汇总（跑完看这里，复制即用）"
        run: |
          set -eu
          echo "════════════ 全部下载直链 ════════════"
          for f in "$REL"/raphael-xnu-r30-flash.img "$REL"/raphael-xnu-r30-gpu-flash.img \
                   "$REL"/raphael-r30-flashboot.apfs "$REL"/r30-md1-root.apfs \
                   "$REL"/SHA256SUMS "$REL"/README.txt "$REL"/toolchain-versions.txt; do
            echo "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/$(basename "$f")"
          done
