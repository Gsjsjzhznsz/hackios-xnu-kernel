            release/raphael-xnu-r27-gpu-flash.img
            release/raphael-r27-flashboot.apfs
            release/r27-md1-root.apfs
            release/SHA256SUMS
            release/README.txt

      - name: "直链汇总（跑完看这里，复制即用）"
