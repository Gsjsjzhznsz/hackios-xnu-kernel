                             (b"no test-key marks -- the chain reads like the phone's own", 'R23 两岔兜底（R25 三岔除名）'),
                             (b"read the secboot and rollback fuses (E7: the whole qfprom windows", 'R25b：step 2 的 E7 整扫退役（早死轮摘除）'),
                             (b"R25 E1: Linux's shape", 'R26：E1 文本改由 adreno_e1_mode 两态承载（R25 措辞退役）'),
                             (b"R25: the shape sweeps", 'R28：形状扫描总宣告退役（改判定罪，adreno_shape_sweep 开关门控）'),
                             (b"R25b: E7 moved to the end of the refusal path", 'R28：熔丝扫描在案措辞退役（adreno_qfprom 开关门控）'),
                             (b'R28: the two-parameter baseline', 'R28b：R28 旧基线措辞退役（源码确实前移的机器证明）'),
                             (b'R28b: the kernel generation line', 'R28d：R28b 旧代数戳退役（本轮源码前移的机器证明）'),
                             (b'R28b: the two-parameter baseline', 'R28d：R28b 旧基线措辞退役（本轮源码前移的机器证明）'),
                             (b'R28d: the kernel generation line', 'R28g：R28d 旧代数戳退役（本轮源码前移的机器证明）'),
                             (b'R28d: the two-parameter baseline', 'R28g：R28d 旧基线措辞退役（本轮源码前移的机器证明）')):
              assert gone not in d, f'已退役标记未删净：{what}（{gone!r} 仍在二进制里）'
          print(f'✓ 源码构建的内核带齐 R11-R28g 全部标记、退役标记已删净（{len(d):,} B）')
          import hashlib
          ksha = hashlib.sha256(d).hexdigest()
          print(f'✓ 本轮源码构建内核 sha256 = {ksha}')
          print('   已知历史值：R27/R27b = 372f0b0a…，R28 = 9e3dd447…，R28b/R28c 内核 = 36a1e953…，R28d = 99b9ea75…；')
          print('   R28g 源码已改词（代数戳 + 基线行 + T2 对照三件），必须是其中任何一个都不是的新值')
          for label, needle in (('R28g 代数戳（want 2）', b'R28g: the kernel generation line'),
                                ('R28g 基线（want 1）', b'R28g: the two-parameter baseline'),
                                ('R28g T2 宣告（want 2）', b'R28g: the T2 control'),
                                ('R28g T2 判决（want 3）', b'T2 VERDICT:'),
                                ('R28g T2 开关（want 3）', b'adreno_test_adsp'),
                                ('R28d 代数戳（want 0）', b'R28d: the kernel generation line'),
                                ('R28d baseline（want 0）', b'R28d: the two-parameter baseline'),
                                ('R28  baseline（want 0）', b'R28: the two-parameter baseline'),
                                ('R25  sweeps（want 0）', b'R25: the shape sweeps'),
                                ('R25b E7 announce（want 0）', b'R25b: E7 moved to the end of the refusal path')):
                  print(f'    grep {label}: {d.count(needle)}')
          assert ksha not in ('372f0b0af38d84f7d343a322f21c41156e6675581e08964b0ac15378be447d9c',
                              '9e3dd447d1e92158b9e7159cf3508ca3414e6366d066373210ed746f590667b3',
                              '36a1e9534da454854a0110724447ffa06d9fcae8995e98cf1487d419cfed3ed6',
                              '99b9ea75de307be1fe2fb368a67493d850c762f71580bb6d1a4e4b010c698603'), '新源码必须给出新内核 sha256（R27/R28/R28b/R28d 都不允许）'
          PY
          df -h /

      # ---------------------------------------------------------------
      - name: "⑤/⑥ 打 r28g 双启动镜像（外科手术：换 kernel 与 ramdisk 条目 + GPU 镜像 cmdline 加 adreno_test_adsp=1；装载器 v7 / DTB / 头字段 = R28d 原字节）"
        run: |
          set -eu
          cd hackios
          bash tools/r28g-flash-build.sh r28d/raphael-xnu-r28d-flash.img r28d/raphael-xnu-r28d-gpu-flash.img
          cp raphael-xnu-r28g-flash.img "$REL/"
          cp raphael-xnu-r28g-gpu-flash.img "$REL/"
          cp r28g-md1-root.apfs "$REL/"
          cp r28d/raphael-r28d-flashboot.apfs "$REL/raphael-r28g-flashboot.apfs"
          # 对打包后的双镜像离线复证（与 ③ 源码构建、⑤ 打包内打印三方对齐）
          python3 tools/r28g-kernel-id.py \
                  "$REL/raphael-xnu-r28g-flash.img" "$REL/raphael-xnu-r28g-gpu-flash.img" | tee r28g-kernel-id.txt
          grep -c "VERDICT: the kernel entry is R28g" r28g-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像必须双双判 R28g 内核"; exit 1; }
          grep -c "VERDICT: the ramdisk entry is R28g" r28g-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像必须双双判 R28g 小卷"; exit 1; }
          grep -c "ec15106da4bad290" r28g-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像的 loader 必须是设备验证过的 v7（ec15106d…）"; exit 1; }
          grep -q "adreno_test_adsp=1" r28g-kernel-id.txt || { echo "::error::GPU 镜像的 cmdline 缺 adreno_test_adsp=1"; exit 1; }
          # 7z 第三读者：卷里的 fw/adsp.mbn 与四个固件都在
          7z l "$REL/r28g-md1-root.apfs" | grep -E "fw[/\\]" || true
          ls -lh "$REL"
          df -h .

      # ---------------------------------------------------------------
      - name: "⑥/⑥ SHA256 + README + 发布 Release（只有 boot 资产，几十 MB）"
        run: |
          set -eu
          cd "$REL"
          : > SHA256SUMS
          for f in raphael-xnu-r28g-flash.img raphael-xnu-r28g-gpu-flash.img \
                   raphael-r28g-flashboot.apfs r28g-md1-root.apfs; do
            sha256sum "$f" >> SHA256SUMS
          done
          REPO="${{ github.repository }}"
          TAG="${{ inputs.release_tag }}"
          cat > README.txt <<EOF
          ============================================================
           R28g · 纯血 hackios SpringBoard 交付包（raphael / K20 Pro）
           —— T2 对照轮：step 19 交给 TrustZone 的是 ADSP 自己的
              .mdt（pas id 1），不是 zap 的——同一条调用链，
              换一个本机原厂真固件，隔离「文件」与「路径」两个变量
          ============================================================
          ⚠️⚠️⚠️ 启动卷只 stage 一个文件：raphael-r28g-flashboot.apfs ⚠️⚠️⚠️
            （R14 事故纪律不变：md1 备份不要 stage，flash.img 已内嵌全量小卷）
          主镜像   : raphael-xnu-r28g-flash.img（触摸 + 按键 + 八核；不跑 GPU 步骤）
          GPU 镜像 : raphael-xnu-r28g-gpu-flash.img（同上 + gpu=1 adreno_test_adsp=1）
          启动卷   : raphael-r28g-flashboot.apfs（= R13 全量字节，逐字节原样）
          小卷 md1 : r28g-md1-root.apfs（R28d 卷 + fw/adsp.mbn，重建而非补丁）

          【本轮为什么（T1 判决之后的唯一缺口）】
            T1（官方固件包轮）定案：V12.5.6.0.RFKCNXM 包 = 本机固件集
            （hyp/tz/devcfg/storsec 逐字节），随卷 a640_zap.mbn = 包内
            /firmware/a640_zap.elf（sha 全等）——「版本错配」假说死亡。
            TZ 拒的是自家原厂 stock zap。r28d 日志唯一从未动过的变量：
            换一个本机原厂真固件、走同一条调用链。本轮就是它：
              · 文件：fw/adsp.mbn = NON-HLOS FAT16 image/ADSP.MDT
                （7,820 B，ELF32 15 段，hash 段 0x1c78@0x1000，
                 证书在 phdr 表与 hash 段之间：Xiaomi Attestation CA /
                 Xiaomi Root CA，无测试链标记）——Android 每次开机都
                经这条链（adsp-pil，pas id 1）起它的音频 DSP；
              · 调用：与 zap 完全同形（0x42000201 可抢占两参数，
                 VALUE_AND_BUFFER 不带 size，自家新页 + 清缓存）；
              · 差异只有两处：文件，与 pas id。
            红线遵守：zap 路径零改动（adreno_test_adsp=0 时逐字节同 r28d
            行为）；测试只挂在 GPU 镜像（主镜像 cmdline 不动）；
            adsp.mbn 经上游 apfs.py 读卷→mkapfs.py 重建入卷（-z
            --plain fw，四件 fw 全部单 extent 原位），三方门禁
            （volume-build 自证 + r24b 审计 gate + 7z）全过。

          【本轮判读树（GPU 镜像，预期时程）】
            0. 照旧四步开机（boot / oem ramdisk / stage / oem run）。
            1. ~40-52s：梯子到 step 19。通道探针照旧全答（0xc2000601 族）。
            2. 基线行应自报：R28g: the two-parameter baseline --
               adreno_e1_mode=2 (...)，the T2 control adreno_test_adsp=1
               (the adsp's own .mdt over the same channel, INSTEAD of the
               zap attempt)，形状/熔丝扫描照旧默认关。
            3. 证据链四行（都在 before 判决行）：
                 "fw/adsp.mbn: 7820 bytes in the image of /dev/md1"（卷里真有）
                 "an ELF of 15 segments ... the metadata is the whole .mdt"
                 "THE ADSP'S CHAIN SAYS: THE PHONE'S OWN PRODUCTION CHAIN"
                 "T2 armed: smc 0x42000201 ... x2 1, x3 <页>（size 留家）"
            4. ★ 判决行（本轮唯一目的）"T2 VERDICT:"：
               · ACCEPTED (0) → XNU→Hyp→TZ 链路无罪；zap 被拒是 zap
                 定向的 → 立即准备 T3（逆向 secapp cmd 0x49：为什么拒
                 自家原厂 stock zap）。
               · refused with -3145797（与 zap 同码）→ 全局墙：查
                 XNU 侧内存 buffer 在 TZ 眼里的问题（cache flush /
                 地址 / hyp 包装壳）与 secapp 会话注入（hw_id /
                 serial / root_of_trust 与 Android 侧差异）。
               · -3145738（-0x30000A）→ 数据根本没到 TZ，hyp 本地
                 解析就挂了：对照 r28d 零页基线查 adsp 文件的包装
                 形态（大概率没包对，不是链路问题）。
               · 其它码 → 新证据，直接进 T3 对照 secapp 0x49 错误面。
            5. 收尾三行（预期内，不是失败）：
                 give-up 交回调用一行；
                 "the step stops here by design (adreno_test_adsp=1)"
                 "adreno: step 19: FAILED; the steps after it are not
                  attempted"（与 r28d 同形）→ 用户态照常推进（白苹果 →
                 SpringBoard）。
            6. 本轮 step 19 不走 zap 路径：r28d 的 E1 判词
               （-3145797 / 零页 -3145738）不应再出现——出现即说明
               开关没挂上，发日志。
            7. logdump 判读：python3 logdump-read.py；v7 flush 通道照常。

          【离线复验】
            python3 tools/r28g-kernel-id.py <image>
            （代数 grep：R28g 代数戳=2、基线=1、T2 宣告=2、判决=3、
             开关=3；R28d/R28 旧措辞全 0；ramdisk 结构判 R28g
             （含 fw/adsp.mbn；卷 sha 随构建机 zlib 变化，仅信息性））

          【手机端（Termux / bootloader）】
            fastboot boot  raphael-xnu-r28g-flash.img
            fastboot oem  ramdisk
            fastboot stage raphael-r28g-flashboot.apfs
            fastboot oem  run
            # T2 对照（第二次开机）：
            fastboot boot  raphael-xnu-r28g-gpu-flash.img
            fastboot oem  ramdisk
            fastboot stage raphael-r28g-flashboot.apfs
            fastboot oem  run      # 等 "T2 VERDICT:" 判决行（~45-55s）
          直链：
            https://github.com/${REPO}/releases/download/${TAG}/raphael-xnu-r28g-flash.img
            https://github.com/${REPO}/releases/download/${TAG}/raphael-xnu-r28g-gpu-flash.img
            https://github.com/${REPO}/releases/download/${TAG}/raphael-r28g-flashboot.apfs
            https://github.com/${REPO}/releases/download/${TAG}/r28g-md1-root.apfs
            https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS
          ⚠️ userdata 上的 iOS 卷是唯一存货：绝不要让 MIUI 开机
             （Android 会重格回 f2fs，iOS 卷即毁）。
          ⚠️ 每次开机都要重复 boot/oem ramdisk/stage/oem run 四步
             （启动卷住 RAM 不落盘，"不写手机闪存"设计的一部分）。
          ⚠️ 含 Apple 版权内容，仅个人研究；下载完成后请尽快删除本 Release。
          EOF
          echo "→ SHA256SUMS："
          cat SHA256SUMS

      - name: "⑥b/⑥ 发布 Release（直链交付，r28g-springboard）"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "R28g · 纯血 hackios SpringBoard · T2 对照轮（adsp 的 .mdt 走 zap 的同一条调用链 + 小卷换血）"
          body: |
            raphael (K20 Pro) R28g 交付包：**T2 对照轮**。

            T1（官方固件包轮）定案：包 = 本机固件集，随卷 zap = 包内
            stock zap（sha 全等）——「版本错配」死亡，TZ 拒的是自家
            原厂固件。本轮补上 r28d 日志唯一没动过的变量：GPU 镜像
            cmdline 加 adreno_test_adsp=1，step 19 交给 TrustZone 的
            就是 ADSP 自己的 .mdt（pas id 1，Android 每次开机都经这条
            链起音频 DSP 的那个元数据镜像），与 zap 尝试完全同形
            （0x42000201 可抢占两参数、VALUE_AND_BUFFER、自家新页 +
            清缓存）——差异只有文件与 id 两处。zap 路径零改动
            （adreno_test_adsp=0 时逐字节同 r28d 行为）。

            小卷 md1 换血：fw/adsp.mbn（NON-HLOS 的 image/ADSP.MDT，
            7,820 B，Xiaomi 链）经上游 apfs.py 读卷 → mkapfs.py 重建
            入卷（-z --plain fw；80 项逐字节原样、新件单 extent 原位、
            三方门禁全过）。装载器 v7 逐字节原样（ec15106d…）；
            DTB/头字段 = R28d 原字节；clean build + 新 sha 断言。

            判读：等 "T2 VERDICT:" 一行——0=链路无罪→T3（secapp
            0x49）；-3145797=与 zap 同墙（全局：查 hyp 包装壳与
            secapp 会话）；-3145738=没到 TZ（查包装形态）；
            其它=新证据进 T3。判读树全文见 Release 资产 README.txt。

            ⚠️ 含 Apple 版权内容，仅供个人研究；下载完成后请尽快删除本 Release。
          fail_on_unmatched_files: true
          files: |
            release/raphael-xnu-r28g-flash.img
            release/raphael-xnu-r28g-gpu-flash.img
            release/raphael-r28g-flashboot.apfs
            release/r28g-md1-root.apfs
            release/SHA256SUMS
            release/README.txt

      - name: "直链汇总（跑完看这里，复制即用）"
        run: |
          set -eu
          echo "════════════ 全部下载直链 ════════════"
          for f in "$REL"/raphael-xnu-r28g-flash.img "$REL"/raphael-xnu-r28g-gpu-flash.img \
                   "$REL"/raphael-r28g-flashboot.apfs "$REL"/r28g-md1-root.apfs \
                   "$REL"/SHA256SUMS "$REL"/README.txt; do
            echo "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/$(basename "$f")"
          done
