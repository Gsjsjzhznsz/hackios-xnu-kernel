name: R28g · SpringBoard 一键流水线（T2 对照轮 · adsp 元数据 + 换卷 + 外科换内核，装载器 v7 原字节）
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "hackios 内核树 fork（含 xnu/ + fw-gpu-raphael/adsp.mbn + tools/r28g-*）"
        required: true
        default: "Gsjsjzhznsz/hackios-xnu-kernel"
      release_tag:
        description: "Release tag（直链的一部分）"
        required: true
        default: "r28g-springboard"
      r28d_image:
        description: "R28d 日常镜像直链（外科手术的底板）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r28d-springboard/raphael-xnu-r28d-flash.img"
      r28d_gpu_image:
        description: "R28d GPU 镜像直链（外科手术的底板）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r28d-springboard/raphael-xnu-r28d-gpu-flash.img"
      r28d_flashboot:
        description: "R28d 启动卷直链（= R13 全量字节，真机验证过）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r28d-springboard/raphael-r28d-flashboot.apfs"
      r28d_root:
        description: "R28d 小卷 md1 直链（= R13 全量字节；与本轮新卷对照用）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r28d-springboard/r28d-md1-root.apfs"
permissions:
  contents: write
concurrency:
  group: r28g-springboard
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      REL: ${{ github.workspace }}/release
      THEOS: /home/runner/theos     # (literal: GitHub Actions' env: block expands nothing)
      CCACHE_DIR: ${{ github.workspace }}/hackios/.ccache
    steps:
      # ---------------------------------------------------------------
      - name: "①/⑥ 磁盘准备与依赖（内核构建工具链）"
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-dev clang lld ccache \
                       flex bison m4 perl python3 autoconf automake libtinfo6 xz-utils uuid-dev 7zip >/dev/null
          command -v clang && command -v ccache && command -v 7z
          # dsymutil：Ubuntu 的 apt clang 不往 /usr/bin 放它（R11 run 39973048286 的教训）
          DS=$(command -v dsymutil || clang --print-prog-name=dsymutil 2>/dev/null || true)
          [ -x "$DS" ] || DS=$(ls /usr/lib/llvm-*/bin/dsymutil 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$DS" ] && [ -x "$DS" ]; then
            sudo ln -sf "$DS" /usr/bin/dsymutil
          else
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/bin/dsymutil >/dev/null && sudo chmod +x /usr/bin/dsymutil
          fi
          mkdir -p "$REL"
          df -h /

      # ---------------------------------------------------------------
      - name: "②/⑥ 取树 + 取 R28d 资产 + 取上游 userland（apfs.py/mkapfs.py，本轮换卷要用的两个读者/作者）"
        run: |
          set -eu
          git clone --depth 1 "https://github.com/${{ inputs.kernel_repo }}.git" hackios
          # 上游 userland：只借它的 APFS 读者/作者（tools/apfs）。与内核树并排放在工作区根，
          # 正是 tools/r28g-flash-build.sh 的 APFS_TOOLS 默认路径（hackios/../hackios-xnu-userland）。
          git clone --depth 1 https://github.com/oosexgang/hackios-xnu-userland.git hackios-xnu-userland
          ls hackios-xnu-userland/tools/apfs/apfs.py hackios-xnu-userland/tools/apfs/mkapfs.py
          cd hackios
          echo "→ 内核树 @ $(git log -1 --format='%h %s')"
          ls -lh xnu/files/bsd/dev/raphael_adreno.c fw-gpu-raphael/adsp.mbn \
                tools/r28g-flash-build.sh tools/r28g-volume-build.py tools/r28g-kernel-id.py
          # R28d 的四件资产：两张镜像是外科手术的底板（装载器 v7 原字节在里面），
          # 启动卷与 md1 卷本轮原样沿用/对照。r28d/ 在内核树内（本步 cwd）。
          mkdir -p r28d
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o r28d/raphael-xnu-r28d-flash.img  "${{ inputs.r28d_image }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o r28d/raphael-xnu-r28d-gpu-flash.img "${{ inputs.r28d_gpu_image }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o r28d/raphael-r28d-flashboot.apfs "${{ inputs.r28d_flashboot }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o r28d/r28d-md1-root.apfs "${{ inputs.r28d_root }}"
          sha256sum r28d/* | tee r28d/SHA256SUMS.r28d
          # 立等可取的装载器门禁：R28d 镜像里的 loader 条目必须是设备已验证的 v7（ec15106d…）
          python3 tools/r28g-kernel-id.py r28d/raphael-xnu-r28d-flash.img r28d/raphael-xnu-r28d-gpu-flash.img | tee r28d-id.txt
          grep -q "ec15106da4bad290" r28d-id.txt || { echo "::error::R28d 镜像的 loader 不是设备验证过的 v7（ec15106d…）"; exit 1; }
          grep -Ec "loader +sha256" r28d-id.txt | grep -qx 2 || { echo "::error::两张 R28d 镜像都要读到 loader 条目"; exit 1; }
          grep -q "VERDICT: the kernel entry is R28d" r28d-id.txt || { echo "::error::底板镜像的内核不是 R28d"; exit 1; }
          grep -q "VERDICT: the ramdisk entry is R13..R28d" r28d-id.txt || { echo "::error::底板镜像的小卷不是 R13 谱系"; exit 1; }
          # 两张底板镜像的 ramdisk 条目必须就是 r28d-md1-root.apfs 的字节（flash-build 从它换卷）
          python3 - r28d/ <<'PY'
          import gzip, hashlib, struct, sys
          def ramdisk_of(path):
              img = open(path, 'rb').read()
              blob = gzip.decompress(img[4096:4096 + struct.unpack('<I', img[8:12])[0]])
              x = blob.find(b'XNUP')
              size = struct.unpack('<I', blob[x+4:x+8])[0]
              i, out = x + 8, {}
              while i + 24 <= x + 8 + size and blob[i] != 0:
                  name = blob[i:i+16].rstrip(b'\0').decode()
                  esize = struct.unpack('<I', blob[i+16:i+20])[0]
                  out[name] = blob[i+24:i+24+esize]
                  i += 24 + ((esize + 15) & ~15)
              return out['ramdisk']
          base = open(sys.argv[1] + '/r28d-md1-root.apfs', 'rb').read()
          for n in ('raphael-xnu-r28d-flash.img', 'raphael-xnu-r28d-gpu-flash.img'):
              r = ramdisk_of(sys.argv[1] + '/' + n)
              assert r == base, f'{n}: ramdisk 条目与 r28d-md1-root.apfs 不一致'
          print('底板两镜像的 ramdisk 条目 == r28d-md1-root.apfs，逐字节')
          PY

      # ---------------------------------------------------------------
      # 缓存三连：theos / xnu-deps / ccache（沿 r25 的键位；ccache 依旧零回填——clean build 审计姿态）
      - name: "②c/⑥ 缓存：theos（工具链 + iPhoneOS16.5.sdk）"
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: r25-theos-v1
          restore-keys: |
            r23-theos-v1
            r22-theos-v1
            r20-theos-v1
            r19-theos-v1
            r18-theos-v1
            r17-theos-v1
            r16-theos-v1
            r15-theos-v1
            r14-theos-v1
      - name: "②d/⑥ 缓存：xnu-deps（Apple 开源件 + host 工具 + SDK 链接树）"
        uses: actions/cache@v4
        with:
          path: hackios/xnu-deps
          key: r25-xnu-deps-v1
          restore-keys: |
            r23-xnu-deps-v1
            r22-xnu-deps-v1
            r20-xnu-deps-v1
            r19-xnu-deps-v1
            r18-xnu-deps-v1
            r17-xnu-deps-v1
            r16-xnu-deps-v1
            r15-xnu-deps-v1
            r14-xnu-deps-v1
      # R28g 沿 R28b/R28d 的 clean build 纪律：ccache 零回填（空仓起跑），
      # 本轮每个 .o 都从本轮源码编译；缓存只存不用（给后面的轮次）。
      - name: "②e/⑥ ccache（R28g 沿 R28b/R28d：clean build——零回填，只存不用）"
        uses: actions/cache@v4
        with:
          path: hackios/.ccache
          key: r28g-ccache-${{ github.run_id }}

      # ---------------------------------------------------------------
      - name: "③/⑥ 内核源码构建（theos + xnu/apply.sh + xnu-deps + clean ccache + make + R28g 门禁）"
        run: |
          set -eu
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/ld64" ]; then
            rm -rf "$THEOS"
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
            mkdir -p "$THEOS/toolchain"
            curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          fi
          "$THEOS/toolchain/linux/iphone/bin/ld64" --version || true
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" ]; then
            rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk" /tmp/theos-sdks
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
            git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
            mkdir -p "$THEOS/sdks"
            mv /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
            rm -rf /tmp/theos-sdks
          fi
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" || { echo "::error::theos/sdks 的 iPhoneOS16.5.sdk 就位失败"; exit 1; }
          df -h /
          cd hackios
          xnu/apply.sh
          bash xnu-deps/setup.sh || { echo "::error::setup.sh 失败——exporthdrs.log 尾部："; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          export XNU_CCACHE=1 CCACHE_COMPILERCHECK=content
          ccache -C >/dev/null 2>&1 || true
          ccache -M 2G >/dev/null 2>&1 || true
          echo "→ R28g clean build：ccache 零回填空仓起跑，本轮每个对象都从本轮源码编译"
          echo "→ ccache 起步统计（应全零）："; ccache -s 2>/dev/null | head -8 || true
          ./xnu-build.sh -j4 -k || echo "（make 退出码 $?——上游文档：链接后的检查，内核若已产出即成功）"
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          ls -la "$K" || { echo "::error::内核没有产出——exporthdrs.log 与 make 日志尾部："; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          echo "→ ccache 收官统计："; ccache -s 2>/dev/null | head -8 || true
          python3 - "$K" <<'PY'
          import sys
          d = open(sys.argv[1], 'rb').read()
          for marker, what in ((b'\x9f\x4e\x00\x71', 'cmp w20,#0x13（门铃 19 分发）'),
                               (b'\x08\x01\xa0\x52', 'movz w8,#0x8,lsl#16（门铃 19 使能）'),
                               (b'RAPHAEL TOUCH', '触摸驱动'),
                               (b'buttons: step 1', '按键驱动'),
                               (b'a640_gmu.bin', 'GPU 驱动（a640 固件名）'),
                               (b'a640_zap.mbn', 'GPU 驱动（zap mbn）'),
                               (b'adsp.mbn', 'GPU 驱动（R28g：adsp 元数据名）'),
                               (b'the panel dimmed to', 'fbdim 调光'),
                               (b'going on with the configured rates', 'R12 测量降级（adreno step5）'),
                               (b'going with the ID registers', 'R13 SMMU 修复（IDR 优先）'),
                               (b'was not started: the firmware answers', 'PSCI SMP 起核路径'),
                               (b"this firmware's verdict of started", 'R14 GMU 判据分支'),
                               (b"the power-on block's pull-ups", 'R14 PON 拉电阻回读'),
                               (b"'s status byte changed to", 'R14 按键原始字节见证'),
                               (b"the two pages the GMU's own code asks for", 'R15 GMU scratch 两页'),
                               (b'cb tlbiall', 'R15 上下文银行全量 TLB 清洗'),
                               (b'a context bank nobody used before', 'R16 处女银行（GMU 路径）'),
                               (b'trying context bank', 'R16 银行候选（GMU 路径）'),
                               (b'tlbiallnsnh', 'R16 全局 TLB 失效'),
                               (b'the stream the bank names for it', 'R16 故障流 ID 取证'),
                               (b'what our own tables say for', 'R16 页表 walk 转储'),
                               (b'arrived late', 'R16 迟到答案'),
                               (b'make the SMMU forget every translation again', 'R16 msg30 前再清洗'),
                               (b'survivable, cleared, the wait goes on', 'R17 可活故障容忍'),
                               (b'while the GMU was deciding', 'R17 等待期故障轮询'),
