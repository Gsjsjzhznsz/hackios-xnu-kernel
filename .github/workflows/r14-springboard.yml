# =====================================================================
#  R14 · SpringBoard 一键流水线（boot-only 直造，GitHub Actions）
#  -------------------------------------------------------------------
#  R13 真机战报：八核全上（7 cpu）、SMMU 修复生效（step 8/9 过），
#  GPU 梯子推进到 step 15 —— 固件装载成功（版本号回读正常）且 GMU
#  已活（babeface + hfi_ctrl_status bit0 固件自置），但 step 15 判为
#  失败。R14 三件事：
#    ① GMU step 15 判据按固件版本分支（本仓 kgsl 权威对齐）：
#       vendor a6xx_gmu_device_start——core ≤ 0x20010004 的旧固件，
#       "已启动"的判据是 fw_init_result 整词 == 0xBABEFACE；只有更新
#       的固件才等 bit 8 (0x100)/掩码 0x1FF。本机固件 core=0x20000105
#       （旧），R13 却按新固件等 bit 8 —— 0xbabeface & 0x1ff = 0xCE，
#       永不满足 = 假超时。R14：step 14 回读的版本字决定判据，轮询
#       放宽到 5 s，并打印所选判据。
#    ② 音量键 witnesses（R13 新 bug：电源键好、音量上下全无反应）：
#       内核层 —— PON/GPIO6 两个原始状态字节每次变化都打日志（上限
#       40 行），step 4 只读回读 PON 拉电阻 (0x70) 与去抖 (0x71)
#       —— "硬件没看见按键" 与 "驱动丢了事件" 从此两种日志面孔；
#       用户态层 —— inject.c 每次 send_button 都打日志（按键是稀疏
#       事件，常开无洪泛），按钮类记录不再受"前 4 条"限流。CI 新增
#       一步：以 theos 工具链现场重编 libredwood.dylib（覆盖 prebuilt
#       旧件）并验见证字符串，root.apfs 直造（无 iOS 下载）。
#    ③ CI 再提速：root.apfs 不再走 三级获取/7.8GB 回退 —— build.sh
#       的 CRYPTEXES=flash 路径本就不需要 iOS 卷（实测 5 秒直造），
#       R14 起每轮直造；flashboot.apfs 内容与 R13 一致（stage0 未动
#       ），直取 R13 release。缓存键迁到 r14-（restore-keys 回退取
#       r13- 的现存缓存，温跑不丢命中率）。
#
#  内核标记（构建门禁新增）：R14 = "this firmware's verdict of
#  started"（判据分支）+ "the power-on block's pull-ups"（PON 拉电阻
#  回读）+ "'s status byte changed to"（原始字节见证）。
#  loader 标记：R10/R13 全套不变。
#  双镜像 cmdline：touchscreen=1 buttons=1 cpus=8 ufs=2 bootcpu=7
#  root_apfs=ufs_userdata（GPU 镜像再 + gpu=1）。
#
#  部署：默认分支 .github/workflows/r14-springboard.yml → Run workflow。
#  注意：重复运行前先删掉旧 Release（或换 release_tag）。
# =====================================================================
name: R14 · SpringBoard 一键流水线（boot-only 直造）
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "hackios 内核树 fork（含 xnu/ + tools/r14-flash-build.sh）"
        required: true
        default: "Gsjsjzhznsz/hackios-xnu-kernel"
      userland_repo:
        description: "hackios userland 树 fork"
        required: true
        default: "Gsjsjzhznsz/hackios-xnu-userland"
      release_tag:
        description: "Release tag（直链的一部分）"
        required: true
        default: "r14-springboard"
      flashboot_url:
        description: "flashboot.apfs 直链（内容与 R13 一致，直取 R13 release）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r13-springboard/raphael-r13-flashboot.apfs"
permissions:
  contents: write
concurrency:
  group: r14-springboard
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      REL: ${{ github.workspace }}/release
      THEOS: /home/runner/theos     # (literal: GitHub Actions' env: block expands nothing)
      CCACHE_DIR: ${{ github.workspace }}/hackios/.ccache
    steps:
      # ---------------------------------------------------------------
      - name: "①/⑧ 磁盘准备与依赖（内核构建工具链 + 打包工具）"
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-dev clang lld ccache \
                       flex bison m4 perl python3 autoconf automake libtinfo6 xz-utils uuid-dev 7zip >/dev/null
          command -v clang && command -v ccache && command -v 7z
          # dsymutil：Ubuntu 的 apt clang 不往 /usr/bin 放它（R11 run 39973048286 的教训）
          DS=$(command -v dsymutil || clang --print-prog-name=dsymutil 2>/dev/null || true)
          [ -x "$DS" ] || DS=$(ls /usr/lib/llvm-*/bin/dsymutil 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$DS" ] && [ -x "$DS" ]; then
            sudo ln -sf "$DS" /usr/bin/dsymutil
          else
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/bin/dsymutil >/dev/null && sudo chmod +x /usr/bin/dsymutil
          fi
          mkdir -p "$REL"
          df -h /

      # ---------------------------------------------------------------
      - name: "②/⑧ 取树（kernel fork + userland fork）"
        run: |
          set -eu
          git clone --depth 1 "https://github.com/${{ inputs.kernel_repo }}.git" hackios
          cd hackios
          if ! USERLAND_URL="https://github.com/${{ inputs.userland_repo }}.git" common/setup.sh; then
            echo "::warning::userland fork 拉取失败，回退上游 oosexgang/hackios-xnu-userland"
            rm -rf .userland.git
            USERLAND_URL="https://github.com/oosexgang/hackios-xnu-userland.git" common/setup.sh
          fi
          echo "→ raphael 启动链与 R14 打包器："
          ls -lh prebuilt/raphael/ tools/r14-flash-build.sh fw-gpu-raphael/
          git log -1 --format='→ kernel 树 @ %h %s'

      # ---------------------------------------------------------------
      - name: "②b/⑧ 编译门禁（loader：编译 + 特征串全验，内核构建前快速失败）"
        run: |
          set -eu
          cd hackios
          bash xnuloader/build.sh
          python3 - <<'PY'
          d = open('xnuloader/loader.efi', 'rb').read()
          for feat in (b'oem gic', b'oem sgi', b'oem peek', b'NXSB at +32',
                     b'as the firmware left it', b'never showed up as pending', b'oem gicset',
                     b'oem gicgroup', b'group repair', b'pre-arm before CPU_ON',
                     b'at the hung verdict',
                     b'oem irqtest', b'DELIVERS as a Group 1 NS IRQ', b'R10 branch',
                     b'the readback reads 0',
                     b'R10 clean screen round', b'screen cleared for the handoff',
                     b'cores for the kernel, in the order it takes them'):
              assert feat in d, f'loader.efi 缺特征串 {feat!r}'
          assert b'debug=0x8' not in d, 'loader.efi 仍带 debug=0x8'
          print(f'✓ R14 loader（R10 0.10 原样，含多核路径特征）{len(d):,} B')
          PY

      # ---------------------------------------------------------------
      # 缓存三连：键迁到 r14-，restore-keys 先取 r14- 再回退 r13-（内容不变 → 秒级命中，
      # 命中后在新键名下续存，r13 的旧条目自然过期）
      - name: "②c/⑧ 缓存：theos（工具链 + iPhoneOS16.5.sdk）"
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: r14-theos-v1
          restore-keys: r13-theos-v1
      - name: "②d/⑧ 缓存：xnu-deps（Apple 开源件 + host 工具 + SDK 链接树）"
        uses: actions/cache@v4
        with:
          path: hackios/xnu-deps
          key: r14-xnu-deps-v1
          restore-keys: r13-xnu-deps-v1
      - name: "②e/⑧ 缓存：ccache（内核编译）"
        uses: actions/cache@v4
        with:
          path: hackios/.ccache
          key: r14-ccache-${{ github.run_id }}
          restore-keys: |
            r14-ccache-
            r13-ccache-

      # ---------------------------------------------------------------
      - name: "③/⑧ 内核源码构建（theos + xnu/apply.sh + xnu-deps + ccache + make）"
        run: |
          set -eu
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/ld64" ]; then
            # 缓存可能带来残缺树（run 40059592397：r13-theos-v1 只有 158MB、无 toolchain）——
            # git clone 不进非空目录，先清场再取
            rm -rf "$THEOS"
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
            mkdir -p "$THEOS/toolchain"
            curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          fi
          "$THEOS/toolchain/linux/iphone/bin/ld64" --version || true
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" ]; then
            rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk" /tmp/theos-sdks
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
            git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
            mkdir -p "$THEOS/sdks"
            mv /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
            rm -rf /tmp/theos-sdks
          fi
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" || { echo "::error::theos/sdks 的 iPhoneOS16.5.sdk 就位失败"; exit 1; }
          df -h /
          cd hackios
          xnu/apply.sh
          bash xnu-deps/setup.sh || { echo "::error::setup.sh 失败——exporthdrs.log 尾部："; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          export XNU_CCACHE=1 CCACHE_COMPILERCHECK=content
          ccache -M 2G >/dev/null 2>&1 || true
          echo "→ ccache 起步统计："; ccache -s 2>/dev/null | head -8 || true
          ./xnu-build.sh -j4 -k || echo "（make 退出码 $?——上游文档：链接后的检查，内核若已产出即成功）"
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          ls -la "$K" || { echo "::error::内核没有产出——exporthdrs.log 与 make 日志尾部："; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          echo "→ ccache 收官统计："; ccache -s 2>/dev/null | head -8 || true
          python3 - "$K" <<'PY'
          import sys
          d = open(sys.argv[1], 'rb').read()
          for marker, what in ((b'\x9f\x4e\x00\x71', 'cmp w20,#0x13（门铃 19 分发）'),
                               (b'\x08\x01\xa0\x52', 'movz w8,#0x8,lsl#16（门铃 19 使能）'),
                               (b'RAPHAEL TOUCH', '触摸驱动'),
                               (b'buttons: step 1', '按键驱动'),
                               (b'a640_gmu.bin', 'GPU 驱动（a640 固件名）'),
                               (b'a640_zap.mbn', 'GPU 驱动（zap mbn）'),
                               (b'the panel dimmed to', 'fbdim 调光'),
                               (b'going on with the configured rates', 'R12 测量降级（adreno step5）'),
                               (b'going with the ID registers', 'R13 SMMU 修复（IDR 优先）'),
                               (b'was not started: the firmware answers', 'PSCI SMP 起核路径'),
                               (b"this firmware's verdict of started", 'R14 GMU 判据分支'),
                               (b"the power-on block's pull-ups", 'R14 PON 拉电阻回读'),
                               (b"'s status byte changed to", 'R14 按键原始字节见证')):
              assert marker in d, f'源码构建的内核缺 {what}'
          print(f'✓ 源码构建的内核带齐 R11-R14 全部标记（{len(d):,} B）')
          PY
          df -h /

      # ---------------------------------------------------------------
      # R14 新增：音量键的用户态见证必须进镜像，而卷构建走 PREBUILT（打包预编译 dylib，
      # 不编译源码）——所以在 CI 里用 theos 工具链现场重编 libredwood.dylib，覆盖 prebuilt
      # 里的旧件（只覆盖工作区，不动 git），并验证见证字符串确实编了进去。
      - name: "③b/⑧ R14 音量见证进用户态：现场重编 libredwood.dylib 并验证"
        run: |
          set -eu
          cd hackios
          source xnu-env.sh
          mkdir -p userland/obj
          # 与 userland/build.sh 的 DYN 行逐字一致（xnu-clang + theos SDK）
          xnu-clang -arch arm64 -isysroot "$THEOS/sdks/iPhoneOS16.5.sdk" -O1 -dynamiclib \
            -install_name /redwood/lib/libredwood.dylib -framework CoreFoundation -framework IOKit -lobjc \
            -o prebuilt/userland/libredwood.dylib userland/src/inject.c
          python3 - <<'PY'
          d = open('prebuilt/userland/libredwood.dylib', 'rb').read()
          for m in (b'button %s %s (page %#x, usage %#x)', b'sample type %u finger %u at %u %u'):
              assert m in d, f'libredwood.dylib 缺 R14 见证串 {m!r}（编的是旧源码？）'
          print(f'✓ libredwood.dylib 带齐 R14 音量见证（{len(d):,} B，覆盖 prebuilt 旧件）')
          PY

      # ---------------------------------------------------------------
      # R14：root.apfs 直造（无 iOS 下载）。CRYPTEXES=flash 路径只需要固件 + prebuilt 程序，
      # 实测数秒。flashboot.apfs 的内容与 R13 完全一致（stage0 未动），直取 R13 release。
      - name: "④/⑧ 小卷直造：root.apfs（固件 + 新 libredwood 进卷）"
        run: |
          set -eu
          cd hackios
          mkdir -p fw-gpu
          cp fw-gpu-raphael/a640_gmu.bin fw-gpu-raphael/a630_sqe.fw fw-gpu-raphael/a640_zap.mbn fw-gpu/
          PREBUILT=1 FLASHBOOT=1 CRYPTEXES=flash REST=1 WIFID=0 bash userland/build.sh
          [ -f userland/root.apfs ] || { echo "::error::root.apfs 未产出"; exit 1; }
          python3 - <<'PY'
          import hashlib
          d = open('userland/root.apfs', 'rb').read(36)
          assert d[32:36] == b'NXSB', f'root.apfs 不是 APFS 容器（@+32 读到 {d[32:36]!r}）'
          size = len(open('userland/root.apfs','rb').read())
          print(f'✓ root.apfs 是 APFS 容器 = md1 /redwood（{size:,} B, sha256 {hashlib.sha256(open("userland/root.apfs","rb").read()).hexdigest()[:16]}…）')
          PY
          7z l userland/root.apfs | grep -q 'fw/a640_gmu.bin' || { echo "::error::root.apfs 里没有 fw/a640_gmu.bin"; exit 1; }
          # 打包后的卷里内容被压缩，字符串不可裸搜——解出 dylib 验证（失败只警告，门禁在 ③b）
          if 7z e userland/root.apfs -o/tmp/r14chk libredwood.dylib -r >/dev/null 2>&1; then
            F=$(find /tmp/r14chk -name 'libredwood.dylib' | head -1)
            if [ -n "$F" ] && grep -q 'button %s %s' "$F"; then
              echo '✓ 卷内的 libredwood.dylib 带音量见证（解包验证）'
            else
              echo '::warning::卷内 dylib 解包验证未过（门禁以 ③b 的编译时验证为准）'
            fi
          else
            echo '::warning::7z 解包 dylib 未成（7z 对此卷的兼容问题），门禁以 ③b 为准'
          fi
          ls -lh userland/root.apfs

      - name: "④b/⑧ flashboot.apfs：直取 R13 release（内容与 R14 所需一致）"
        run: |
          set -eu
          cd hackios
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
               -o userland/flashboot.apfs "${{ inputs.flashboot_url }}" \
            || { echo "::error::flashboot.apfs 直取失败（R13 release 不可达？）——它没有 iOS 之外的替代来源，请检查 URL"; exit 1; }
          # 顶层顶格 heredoc（r13 的教训：<< 终止符不许缩进，run 40060156833 的 ④b 又撞了一次）
          python3 - <<'PY'
          d = open('userland/flashboot.apfs', 'rb').read(36)
          assert d[32:36] == b'NXSB', f'flashboot.apfs 不是 APFS 容器（@+32 读到 {d[32:36]!r}）'
          print('✓ flashboot.apfs 是 APFS 容器 = md0 stage0')
          PY
          7z l userland/flashboot.apfs | grep -q 'launchd' || { echo "::error::flashboot.apfs 里没有 sbin/launchd"; exit 1; }
          ls -lh userland/flashboot.apfs

      # ---------------------------------------------------------------
      - name: "⑤/⑧ 打 r14 双启动镜像（r1 固件 + r2 shim + R10 loader + 本仓库源码内核 + cpus=8 + 小卷 md1）"
        run: |
          set -eu
          cd hackios
          bash tools/r14-flash-build.sh .
          cp userland/raphael-xnu-r14-flash.img "$REL/"
          cp userland/raphael-xnu-r14-gpu-flash.img "$REL/"
          cp userland/flashboot.apfs "$REL/raphael-r14-flashboot.apfs"
          cp userland/root.apfs "$REL/r14-boot-volume-root.apfs"
          ls -lh "$REL"
          df -h .

      # ---------------------------------------------------------------
      - name: "⑥/⑧ SHA256 + README + 发布 Release（只有 boot 资产，几十 MB）"
        run: |
          set -eu
          cd "$REL"
          : > SHA256SUMS
          for f in raphael-xnu-r14-flash.img raphael-xnu-r14-gpu-flash.img \
                   raphael-r14-flashboot.apfs r14-boot-volume-root.apfs; do
            sha256sum "$f" >> SHA256SUMS
          done
          REPO="${{ github.repository }}"
          TAG="${{ inputs.release_tag }}"
          cat > README.txt <<EOF
          ============================================================
           R14 · 纯血 hackios SpringBoard 交付包（raphael / K20 Pro）
           —— boot-only 直造：iOS 卷不随行（手机里已刷好，R5-R13 字节相同）
          ============================================================
          主镜像   : raphael-xnu-r14-flash.img（触摸 + 按键 + 八核；
                     cmdline touchscreen=1 buttons=1 cpus=8）
          GPU 镜像 : raphael-xnu-r14-gpu-flash.img（同上 + gpu=1：梯子
                     这次过 step 15/16，新水域 17-21 HFI 消息）
          启动卷   : raphael-r14-flashboot.apfs（stage0 = md0；内容与
                     R13 一致，手头有 R13 的可不重复 stage）
          小镜像   : r14-boot-volume-root.apfs（备份用；R14 重造——
                     音量键见证进了 libredwood.dylib）
          内核     : 本仓库源码构建；R14 改动 = GMU step 15 判据按
                     固件版本分支（旧固件整词 0xBABEFACE，vendor
                     a6xx_gmu_device_start 权威）+ 按键原始字节见证
                     + PON 拉电阻只读回读

          【R13 战报回顾】八核全上（banner "7 cpu"）；SMMU 修复生效
          （step 8/9 过）；GMU 固件装载成功且 GMU 已活——fw_init_result
          0xbabeface、hfi_ctrl_status bit0 固件自置——但 step 15 判败：
          R13 等的是 bit 8（新固件判据），本机固件 core 0x20000105 是
          旧系（vendor 源码：core ≤ 0x20010004 的判据 = 整词
          0xBABEFACE）。0xbabeface & 0x1ff = 0xCE，永不满足 = 假超时。

          【R14 音量键 witnesses】（主/GPU 镜像通用，klog + loader log）
          - 内核层：按键原始状态字节每次变化打一行
              "buttons: the power-on block's status byte changed to 0x…"
              "buttons: volume up's pin's status byte changed to 0x…"
            step 4 新增只读回读：
              "buttons: the power-on block's pull-ups: resin's bit is on/OFF…"
          - 用户态层（backboardd 内）：每个按键事件投递打一行
              "redwood: input: button volume up DOWN (page 0xc, usage 0xe9)"
          - 判读树：
            a) 按音量键、原始字节纹丝不动 → 硬件/配置层（看 resin
               pull-up 是否 OFF；volume up 看 GPIO6 电平）
            b) 字节动了、无 "PRESSED at" → 驱动状态机（回传日志即诊）
            c) 有 PRESSED、无 "redwood: input: button" → 内核→用户态
            d) 有 button 投递行、仍无音量 UI → SpringBoard/音频栈侧
               （R15 的战场：mediaserverd 不在系统里，音量 HUD 的
               数据源可能根本不存在——到这步就算确诊了）

          【GPU 梯子判读】（GPU 镜像，klog 里 adreno: N）
          - step 15 新增一行 "this firmware's verdict of started:
            (result & 0xffffffff) == 0xbabeface (its core version is
            0x20000105)" → 过 15/16，17 起第一次真发 HFI 消息
          - 卡在哪一步都正常：每步一行日志，回传 klog 下一轮接着修
          - "THE GPU IS NOT STARTED: step N" = 梯子在 N 步止损，
            系统照常软渲染跑完（触摸/按键/八核不受影响）

          【手机端（Termux / bootloader）】
            fastboot boot  raphael-xnu-r14-flash.img
            fastboot oem  ramdisk
            fastboot stage raphael-r14-flashboot.apfs
            fastboot oem  run         # 黑屏 → 桌面；八核自动上；+5s 触摸
            # GPU 实验（第二次开机）：
            fastboot boot  raphael-xnu-r14-gpu-flash.img
            fastboot oem  ramdisk
            fastboot stage raphael-r14-flashboot.apfs
            fastboot oem  run
          直链：
            https://github.com/${REPO}/releases/download/${TAG}/raphael-xnu-r14-flash.img
            https://github.com/${REPO}/releases/download/${TAG}/raphael-xnu-r14-gpu-flash.img
            https://github.com/${REPO}/releases/download/${TAG}/raphael-r14-flashboot.apfs
            https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS

          【CI 提速说明（R14 起）】root.apfs 直造（无 iOS 下载，数秒）；
          flashboot 直取 R13 release；theos/xnu-deps/ccache 缓存键迁
          r14-（restore-keys 回退 r13- 现存缓存）；libredwood.dylib 由
          CI 现场重编（theos 已就位）。温跑全程约 15-25 分钟。

          ⚠️ userdata 上的 iOS 卷是唯一存货：绝不要让 MIUI 开机
             （Android 会重格回 f2fs，iOS 卷即毁）。
          ⚠️ 每次开机都要重复 boot/oem ramdisk/stage/oem run 四步
             （启动卷住 RAM 不落盘，"不写手机闪存"设计的一部分）。
          ⚠️ 含 Apple 版权内容，仅个人研究；下载完成后请尽快删除本 Release。
          EOF
          echo "→ SHA256SUMS："
          cat SHA256SUMS

      - name: "⑥b/⑧ 发布 Release（直链交付）"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "R14 · 纯血 hackios SpringBoard · GMU 判据修复 + 音量键 witnesses"
          body: |
            raphael (K20 Pro) R14 交付包：**boot-only 直造**（几十 MB——iOS 卷 R5-R13 字节相同，
            手机里已刷好，不再随行）。

            R14 三件事：
            - **GMU step 15 判据修复**：R13 的 GMU 其实活着（babeface + HFI bit0 自置），
              但 R13 等的是 bit 8（vendor 对 core > 0x20010004 新固件的判据）；本机固件
              core 0x20000105 是旧系，判据 = 整词 0xBABEFACE（vendor a6xx_gmu_device_start
              权威）。判据现在按 step 14 回读的版本字分支，轮询放宽到 5 s
            - **音量键 witnesses**：内核层原始状态字节变化日志 + PON 拉电阻只读回读；
              用户态层每个按键投递一行。下一轮日志直接裁决四层责任
              （硬件 / 驱动 / 投递 / SpringBoard-音频栈）
            - **CI 再提速**：root.apfs 直造（无 iOS 下载）；flashboot 直取 R13；
              libredwood.dylib CI 现场重编；缓存键迁 r14-

            手机端：主镜像四步开机；GPU 镜像第二刷：adreno 15/16 应过，新水域 17-21。
            判读树（音量键四层责任 + GPU 梯子）见附件 README.txt。

            ⚠️ 含 Apple 版权内容，仅供个人研究；下载完成后请尽快删除本 Release。
          fail_on_unmatched_files: true
          files: |
            release/raphael-xnu-r14-flash.img
            release/raphael-xnu-r14-gpu-flash.img
            release/raphael-r14-flashboot.apfs
            release/r14-boot-volume-root.apfs
            release/SHA256SUMS
            release/README.txt

      - name: "直链汇总（跑完看这里，复制即用）"
        run: |
          set -eu
          echo "════════════ 全部下载直链 ════════════"
          for f in "$REL"/raphael-xnu-r14-flash.img "$REL"/raphael-xnu-r14-gpu-flash.img \
                   "$REL"/raphael-r14-flashboot.apfs "$REL"/r14-boot-volume-root.apfs \
                   "$REL"/SHA256SUMS "$REL"/README.txt; do
            echo "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/$(basename "$f")"
          done
