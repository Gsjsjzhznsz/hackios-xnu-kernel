      # ---------------------------------------------------------------

      - name: "诊断产物（wrapper argv 日志，失败也上传）"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-diag
          path: |
            hackios/xnu-clang-args.log
          if-no-files-found: ignore

      - name: "⑤/⑥ 打 r28m 双启动镜像（外科手术：双镜像换 kernel 条目；GPU 镜像 cmdline 加 gpu=1+全相位 token 组——R28l 死因断言已修，日常镜像 cmdline / 装载器 v7 / ramdisk / DTB / 头字段 = R28d 原字节）"
        run: |
          set -eu
          cd hackios
          bash tools/r28m-flash-build.sh r28d/raphael-xnu-r28d-flash.img r28d/raphael-xnu-r28d-gpu-flash.img
          cp raphael-xnu-r28m-flash.img "$REL/"
          cp raphael-xnu-r28m-gpu-flash.img "$REL/"
          # 启动卷与小卷：R28d 的官方字节，名字换成本轮（对照用，不刷也不影响 boot）
          cp r28d/raphael-r28d-flashboot.apfs "$REL/raphael-r28m-flashboot.apfs"
          cp r28d/r28d-md1-root.apfs "$REL/r28m-md1-root.apfs"
          # 对打包后的双镜像离线复证（与 ③ 源码构建、⑤ 打包内打印三方对齐）
          python3 tools/r28m-kernel-id.py \
                  "$REL/raphael-xnu-r28m-flash.img" "$REL/raphael-xnu-r28m-gpu-flash.img" | tee r28m-kernel-id.txt
          grep -c "VERDICT: the kernel entry is R28m" r28m-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像必须双双判 R28m 内核"; exit 1; }
          grep -c "VERDICT: the ramdisk entry is R13..R28d VERBATIM" r28m-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像的小卷必须是 R28d 原字节（本轮不换卷）"; exit 1; }
          grep -c "ec15106da4bad290" r28m-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像的 loader 必须是设备验证过的 v7（ec15106d…）"; exit 1; }
          grep -q "WITH the full-step tokens" r28m-kernel-id.txt || { echo "::error::GPU 镜像的 cmdline 必须带完整全相位 token 组（adreno=22 adreno_pause=0 adreno_watch=0，无 skip）"; exit 1; }
          grep -q "WITHOUT any adreno token" r28m-kernel-id.txt || { echo "::error::日常镜像的 cmdline 必须不带任何 adreno token（控制组原样）"; exit 1; }
          # GPU 镜像的 cmdline 必须带 gpu=1（R28d 原样）、日常镜像不带（R28d 原样）
          # —— 数数据行（"cmdline       :" 前缀），VERDICT 行不匹配它（R28i 的教训）。
          test "$(grep 'cmdline       :' r28m-kernel-id.txt | grep -c 'gpu=1')" = 1 || { echo "::error::两张镜像的 cmdline 数据行里必须恰好 GPU 镜像带 gpu=1"; exit 1; }
          test "$(grep 'cmdline       :' r28m-kernel-id.txt | grep -c 'adreno=22')" = 1 || { echo "::error::两张镜像的 cmdline 数据行里必须恰好 GPU 镜像带 adreno=22（全相位）"; exit 1; }
          test "$(grep 'cmdline       :' r28m-kernel-id.txt | grep -c 'adreno_skip')" = 0 || { echo "::error::R28m 的 GPU cmdline 不得带 adreno_skip（step 19 必须跑）"; exit 1; }
          echo "（cmdline 检查过：GPU 镜像 = R28d 原字节 + gpu=1 + 全相位 token 组，日常镜像 = R28d 原字节 verbatim；R28l 死因断言已修）"
          ls -lh "$REL"
          df -h .

      # ---------------------------------------------------------------
      - name: "⑥/⑥ SHA256 + README + 发布（R28m：L1-L3 相位二分判读树 + logdump P2/P3 读取纪律，只有 boot 资产）"
        run: |
          set -eu
          cd "$REL"
          : > SHA256SUMS
          for f in raphael-xnu-r28m-flash.img raphael-xnu-r28m-gpu-flash.img \
                   raphael-r28m-flashboot.apfs r28m-md1-root.apfs; do
            sha256sum "$f" >> SHA256SUMS
          done
          REPO="${{ github.repository }}"
          TAG="${{ inputs.release_tag }}"
          cat > README.txt <<EOF
          ============================================================
           R28m · 纯血 hackios SpringBoard 交付包（raphael / K20 Pro）
           —— M2 契约打包 + N3 白盒探针：GPU 镜像全相位（adreno=22，
              zap 的 step 19 在列），拒绝现场 dump QHEE 日志环
          ============================================================
          ⚠️⚠️⚠️ 启动卷只 stage 一个文件：raphael-r28m-flashboot.apfs ⚠️⚠️⚠️
            （R14 事故纪律不变：md1 备份不要 stage，flash.img 已内嵌全量小卷）
          主镜像   : raphael-xnu-r28m-flash.img（触摸 + 按键 + 八核；不跑 GPU 步骤；
                      cmdline 逐字节 = R28d 原字节，R28k 已证干净的控制组）
          GPU 镜像 : raphael-xnu-r28m-gpu-flash.img（同上 + gpu=1 +
                      adreno=22 adreno_pause=0 adreno_watch=0：全相位 22 步全跑，
                      宣告行应打 "steps up to 22, without those in mask 0x0"）
          启动卷   : raphael-r28m-flashboot.apfs（= R28d 官方字节 = R13 全量，原样转发）
          小卷 md1 : r28m-md1-root.apfs（= R28d 官方字节；对照用）

          【R28m 改了什么、为什么】
            T3-batch3 判决链在案：hyp 的 PIL_parseMetadata 七步格式检查全过
            （ELF 魔数/类/规范头字段/TOCTOU 双读/哈希段 0x02000000 旗标），
            -3145797 = hyp 的 pil_init_image_to_tz 包装码（cneg 负号化），
            任何下游失败统一改写 0x300045，真错码被吞进 QHEE 日志环；
            M2 自由度压缩到单维度 = 结构正确的整文件 ELF 外壳 + 哈希段内容。
            R28m 的两个动作：
            ① M2：zap 元数据页不再盲拷整文件——zap_header_m2 按文件自己的
              程序头重建（每段摆回声明的 p_offset、规范 ELF 头字段重写、
              哈希段旗标强制在位、重写差异数打日志——预期零差异 = 文件
              本已规范，墙铁定在哈希段内容）。
            ② N3：拒绝现场立刻读 QHEE 日志环（hyp_log_dump：登记表物理
              0x146bfb30 → ring 0x858e0000 / 0x2000 B / magic "mpyh"，
              两级验证，全环 raw hex 落盘），赶在 give-up 推环之前——
              被吞的真错码，或"环里没有"的证明，本轮入档。
            附带在案：R28l run 40331159223 从未产出镜像（其 flash-build
            收尾断言漏了 GPU 底板的 gpu=1；内核本身编译干净），R28l 相位
            二分从未执行；R28m 修断言并取代该轮。

          【本轮判读树（M/N：先自检探针，再判分晓）】
            第一刷 · GPU 镜像（全相位；等 ~2-3 分钟过风暴首发窗）：
              探针自检（任一不满足 ⇒ 本票作废，修复后重跑）：
                P0  宣告行 "adreno: R28m: the M2 contract build + the N3
                    white-box probe" 在场
                P1  "steps up to 22, without those in mask 0x0"——全相位
                    落地探针；若打别的 mask 值 ⇒ cmdline 未落地，作废
                P2  M2 段表逐段在场（type/flags/filesz/p_offset 逐段一行）
                    且 "M2: the header rewritten canonical: N of 52 bytes
                    differ" ——N=0：文件本已规范（墙在哈希段内容）；N>0：
                    M2 修了真实差异（本轮变量生效）
                P3  logdump 按头行 "L bytes follow" 截断，只判自有区
                    （写边界 + 指针计数；R28j/R28k 三次残迹教训）
              ★ M 判定（step 19 的 E1）：
                M1  E1 ACCEPTED (0) ⇒ 墙倒：M2 契约修复成立 ⇒ 看 step 20/21
                    （3D core 出安全模式与否 = K 线）；lsd 风暴若现 = 写相位
                    触发面确证（R28l 相位二分的历史使命一并结案）
                M2  E1 仍 -3145797 ⇒ 读 N3 环 dump：
                    N-a  环内出现 mssecapp/真码行（"Failed 0x%x" 族或任何
                         0x3xxxxx 形值）⇒ 真错码到手 ⇒ 按码值分诊（对照
                         0x3000xx 族 = PIL 层码；其他 = TZ secboot 码域）
                    N-b  环内只有 "pil_init_image_to_tz [300045]" ⇒ hyp
                         内部无 raw 码日志 ⇒ 真码在 EL3/TZ ⇒ secapp 反汇编
                         （tz.mbn dd 分区）升终极路径
                    N-c  登记表/magic 不符 ⇒ QHEE 非恒等映射或登记区非 NS
                         可读 ⇒ 下轮 adreno_hyplog=<va> 手动指环
                    N-d  探针 wedge/panic ⇒ 本身即证据（登记区或环不可从
                         EL1 读）⇒ 下轮探针关闭或改道（预注册已含）
              附带：T2 对照（adsp）本轮照旧先跑——T2 ACCEPTED 0 仍是链路
                    无罪的基础判词，与 M 判定同 boot 双入账。
            控制组 · 主镜像（可选，R28k 已证干净）：第三验证入账即可。

          【logdump 读取纪律（P3：三次残迹教训的对策）】
            分区每次整写都以头行开始：== XNU FLUSH #N at T s (why); L bytes
            follow == 。拉取后按头行截断：本轮记录 = 头行 + 紧随的 L 字节，
            其后的一切都是更长旧写的残留，不进判读（R28j 轮 ~467 KB 固定读
            长的教训；R28k 轮复测日志的风暴=首刷残迹，probe 逐字节验证）。
            自有区判读双保险：写边界（写尾腰斩行）+ 指针计数（"N s: the
            kernel has logged"）。设备端一键工具 run_ios.sh 的 diag/split
            已焊入本纪律。

          【离线复验】
            python3 tools/r28m-kernel-id.py <image>
            （代数 grep：R28m 代数戳=2、M2+N3 宣告=1、M2 三标记各 1、
             N3 三标记各 1、R28k 继续宣告=1、R28k/R28l 代数戳=0、
             R28j 基线=1、R28j T2 宣告=2、序贯收尾=1、zap give-up=1、
             页检查各 1、哈希段头各 1、判决=3、开关=4；R28i 及更早措辞全 0；
             ramdisk 判 R13..R28d VERBATIM；
             cmdline：GPU 镜像带 gpu=1 + adreno=22 全相位组、无 adreno_skip、
             日常镜像无任何 adreno token）

          【工具链审计】
            toolchain-versions.txt：每层编译器完整版本号 + 具名 tag
            （R28i 纪律，R28m 原样继承；缓存键全新——R28l 环境嫌疑一并清除）。
            同源码异行为时先对这张表。

          【手机端（Termux / bootloader）】
            fastboot boot  raphael-xnu-r28m-gpu-flash.img   # M2+N3 轮（GPU 镜像）
            fastboot oem  ramdisk
            fastboot stage raphael-r28m-flashboot.apfs
            fastboot oem  run      # 等宣告行 + M2 段表 + steps 1..22（或到 FAILED 止）
                                   # 再等 ~2 分钟过风暴首发窗，然后抓 logdump
            # 设备端一键：sh run_ios.sh flash r28m gpu -w 180
            # 控制组（可选）：同样的四步，换 raphael-xnu-r28m-flash.img
          直链：
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-xnu-r28m-gpu-flash.img
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-xnu-r28m-flash.img
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-r28m-flashboot.apfs
            https://github.com/\${REPO}/releases/download/\${TAG}/r28m-md1-root.apfs
            https://github.com/\${REPO}/releases/download/\${TAG}/SHA256SUMS
          ⚠️ userdata 上的 iOS 卷是唯一存货：绝不要让 MIUI 开机
             （Android 会重格回 f2fs，iOS 卷即毁）。
          ⚠️ 每次开机都要重复 boot/oem ramdisk/stage/oem run 四步
             （启动卷住 RAM 不落盘，"不写手机闪存"设计的一部分）。
          ⚠️ 含 Apple 版权内容，仅个人研究；下载完成后请尽快删除本 Release。
                    EOF
