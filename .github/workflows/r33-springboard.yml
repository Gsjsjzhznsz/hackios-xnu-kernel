                  print(f'    grep {label}: {d.count(needle)}')
          assert ksha not in ('372f0b0af38d84f7d343a322f21c41156e6675581e08964b0ac15378be447d9c',
                              '9e3dd447d1e92158b9e7159cf3508ca3414e6366d066373210ed746f590667b3',
                              '36a1e9534da454854a0110724447ffa06d9fcae8995e98cf1487d419cfed3ed6',
                              '99b9ea75de307be1fe2fb368a67493d850c762f71580bb6d1a4e4b010c698603',
                              '9cbcac8a4d66b1a64ec3e7b723055be367027ec190d9ef89b7c8bb0e106855a3',
                              '3a0d746dbc03136bd23bce1b82f6280b8bfd443b2e34ad8f93cfb3b6669fee53',
                              '57db84e7400f1a353930e1a7ef4825ffd17ef3d0252c04efd3f77508479d6b82',
                              '916d7719d400bfd69350b69df9fd3a0d082cc5c1cc007920184c58184eb6fe89',
                              '911a69df7434ee76e004d2e5243b290cf73dc582e2f86f019bf5e986faf89c4e',
                              '4a7088302cea1e81e044f531b4323690c617a1f271997aee7a8fbce0d255fe8f',
                              '8c86a90e45c8098b363cd797bb6ce31ea297e4255cb4d0ef4e91826f341230d2',
                              'e0ab7fde98ee7095b8c8908d2d57c4a913cb094aef7bb5f0ad573e529376990e',
                              '05de7d6a1228cc7e273385274cc91c96f2c23dc4cb9589c2c74197a5f2e7ed70',
                              '44b5a2b97e2eeffa071c8b57c8a854985b1558aefe1b70f634e88e81b92c4f5e'), '新源码必须给出新内核 sha256（R27/R28/R28b/R28d/R28g/R28i/R28j/R28k/R28m/R30/R31/R32 系都不允许；R28l 无席位——从未出片）'
          PY
          df -h /

      # ---------------------------------------------------------------

      - name: "诊断产物（wrapper argv 日志，失败也上传）"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-diag
          path: |
            hackios/xnu-clang-args.log
          if-no-files-found: ignore

      - name: "⑤/⑥ 打 r33 双启动镜像（外科手术：底板 = r32 release，双镜像换 kernel 条目；GPU 镜像 cmdline = r32 token 组 + 追加 adreno_keep=1（本轮唯一变量：GPU 常驻）；装载器 v7 / ramdisk / DTB / 头字段 = r32 原字节）"
        run: |
          set -eu
          cd hackios
          bash tools/r33-flash-build.sh base/raphael-xnu-r32-flash.img base/raphael-xnu-r32-gpu-flash.img
          cp raphael-xnu-r33-flash.img "$REL/"
          cp raphael-xnu-r33-gpu-flash.img "$REL/"
          # 启动卷与小卷：r32 的官方字节（= R13 谱系，真机验证过），名字换成本轮（对照用，不刷也不影响 boot）
          cp base/raphael-r32-flashboot.apfs "$REL/raphael-r33-flashboot.apfs"
          cp base/r32-md1-root.apfs "$REL/r33-md1-root.apfs"
          # 对打包后的双镜像离线复证（与 ③ 源码构建、⑤ 打包内打印三方对齐）
          python3 tools/r33-kernel-id.py \
                  "$REL/raphael-xnu-r33-flash.img" "$REL/raphael-xnu-r33-gpu-flash.img" | tee r33-kernel-id.txt
          grep -c "VERDICT: the kernel entry is R33" r33-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像必须双双判 R33 内核"; exit 1; }
          grep -c "VERDICT: the ramdisk entry is R13..R32 VERBATIM" r33-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像的小卷必须是 R13 谱系原字节（本轮不换卷）"; exit 1; }
          grep -c "ec15106da4bad290" r33-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像的 loader 必须是设备验证过的 v7（ec15106d…）"; exit 1; }
          grep -q "WITH the full-step tokens AND the resident switch" r33-kernel-id.txt || { echo "::error::GPU 镜像的 cmdline 必须带全相位 token 组 + adreno_keep=1（本轮唯一变量：GPU 常驻）"; exit 1; }
          grep -q "WITHOUT any adreno token" r33-kernel-id.txt || { echo "::error::日常镜像的 cmdline 必须不带任何 adreno token（控制组原样）"; exit 1; }
          # GPU 镜像的 cmdline 必须带 gpu=1 与 adreno_keep=1、日常镜像都不带
          # —— 数数据行（"cmdline       :" 前缀），VERDICT 行不匹配它（R28i 的教训）。
          test "$(grep 'cmdline       :' r33-kernel-id.txt | grep -c 'gpu=1')" = 1 || { echo "::error::两张镜像的 cmdline 数据行里必须恰好 GPU 镜像带 gpu=1"; exit 1; }
          test "$(grep 'cmdline       :' r33-kernel-id.txt | grep -c 'adreno=22')" = 1 || { echo "::error::两张镜像的 cmdline 数据行里必须恰好 GPU 镜像带 adreno=22（全相位）"; exit 1; }
          test "$(grep 'cmdline       :' r33-kernel-id.txt | grep -c 'adreno_keep=1')" = 1 || { echo "::error::两张镜像的 cmdline 数据行里必须恰好 GPU 镜像带 adreno_keep=1（GPU 常驻开关）"; exit 1; }
          test "$(grep 'cmdline       :' r33-kernel-id.txt | grep -c 'adreno_skip')" = 0 || { echo "::error::R33 的 GPU cmdline 不得带 adreno_skip（step 19 必须跑）"; exit 1; }
          echo "（cmdline 检查过：GPU 镜像 = r32 token 组 + adreno_keep=1（唯一新增），日常镜像 = r32 原字节 verbatim；本轮外科手术换 kernel 条目 + GPU 镜像追加一个 token）"
          ls -lh "$REL"
          df -h .

      # ---------------------------------------------------------------
      - name: "⑥/⑥ SHA256 + README + 发布（R33：H 判读树（GPU 常驻首发）+ R32 设备判决入账 + logdump P3 读取纪律，只有 boot 资产）"
        run: |
          set -eu
          cd "$REL"
          : > SHA256SUMS
          for f in raphael-xnu-r33-flash.img raphael-xnu-r33-gpu-flash.img \
                   raphael-r33-flashboot.apfs r33-md1-root.apfs; do
            sha256sum "$f" >> SHA256SUMS
          done
          REPO="${{ github.repository }}"
          TAG="${{ inputs.release_tag }}"
          cat > README.txt <<EOF
          ============================================================
           R33 · 纯血 hackios SpringBoard 交付包（raphael / K20 Pro）
           —— GPU 常驻轮：R32 设备判决墙倒之后，keep 决策读 gpu=1
              （adreno_keep=0 否决）+ GPU 镜像 cmdline 追加 adreno_keep=1
          ============================================================
          ⚠️⚠️⚠️ 启动卷只 stage 一个文件：raphael-r33-flashboot.apfs ⚠️⚠️⚠️
            （R14 事故纪律不变：md1 备份不要 stage，flash.img 已内嵌全量小卷）
          主镜像   : raphael-xnu-r33-flash.img（触摸 + 按键 + 八核；不跑 GPU 步骤）
          GPU 镜像 : raphael-xnu-r33-gpu-flash.img（gpu=1 + adreno=22
                      adreno_pause=0 adreno_watch=0 + adreno_keep=1：
                      全相位 22 步全跑，跑完 GPU 不再拆除——本轮唯一变量）
          启动卷   : raphael-r33-flashboot.apfs（= r32 官方字节 = R13 全量，原样转发）
          小卷 md1 : r33-md1-root.apfs（= r32 官方字节；对照用）

          【R32 的设备判决（用户 logdump 入账，本轮的地基）】
            fork 精确形（厂商 .mdt 原 pack）的首次真机全相位测试，逐墙全倒：
              step 12  TRUSTZONE ACCEPTS THE ZAP SHADER'S SIGNATURE FROM
                       THIS KERNEL（签元数据收下，answer 0）
              step 19  TRUSTZONE HAS AUTHENTICATED AND STARTED THE ZAP
                       SHADER（MEM_SETUP 0x1000 @ dt pil_gpu_region
                       0x98f15000 → 写码 1968 B → AUTH_AND_RESET answer 0）
              step 21  the page reads 0x600dc0de: THE 3D CORE WRITES OUR
                       MEMORY ON COMMAND
              step 22  A PICTURE DRAWN BY THE GPU IS ON THE PANEL: orange,
                       white, blue from the top（GPU 画的画面上屏）
            然后 step 23 + step-0 把这一切全拆了（GMU slumber、zap give-up、
            SMMU 拆表、CX collapse），系统继续软件渲染（"SpringBoard: no
            GPU draws"）。
          【为什么拆：本轮修的 bug】
            驱动头注释一直承诺 gpu=1 = "全部步骤，且 GPU 留给系统画"，
            但 keep 决策只读 adreno_keep——而 gpu=1 不带 adreno= 的路径
            （by-itself 日常 GPU 形，keep=1 内建）从未在本项目上跑过：
            本项目 GPU 镜像一直带 adreno=22（探针形），keep 不在场 ⇒
            演示完必拆。R32 GPU 镜像（gpu=1 adreno=22 adreno_pause=0
            adreno_watch=0）正是这一形态。
          【R33 改了什么】
            一、内核（raphael_adreno.c）：keep 决策改为 gpu=1 也算数
            （adreno_keep=0 是显式否决，保留探针-即-拆的历史行为）；
            代数戳 R32→R33；R32 主宣告退役为 R33 resident round 行
            （其判决已由设备 logdump 入账）。step-19 厂商 .mdt 机制、
            M2 档案、N3 环 dump、R30 大扫、T2 对照全部原样骑乘。
            二、GPU 镜像 cmdline：追加 adreno_keep=1（唯一新增 token）——
            双保险（内核新语义 + 显式 token），且 boot-args 回显里意图可见。
            三、参照系（用户指令"参考同机型正常使用 gpu 和 WIFI 的
            HeliumStudio-Dev/hackios-xnu-kernel"）：其 raphael-bringup
            的日常 GPU 形就是裸 gpu=1（device.conf BOOTARGS），A640 常驻
            + freedreno/FD640 GLES 已在其真机验证；WiFi（ath10k/WCN399x
            + ICNSS/SNOC）也是其独立大移植。本项目本轮对齐其 GPU 常驻形。

          【本轮判读树（H：GPU 常驻首发的裁决）】
            第一刷 · GPU 镜像（全相位 + keep；等 ~2-3 分钟过风暴首发窗）：
              探针自检（任一不满足 ⇒ 本票作废，修复后重跑）：
                P0  宣告行 "adreno: R33: the resident round" 在场
                P1  构建行 "the vendor .mdt is built" + p_offset 不动行
                P2  "steps up to 22, without those in mask 0x0"——全相位落地
                P3  T2 对照照旧 ACCEPTED (0)（链路无罪基线）
                P4  系统起来（UI 回归，软件渲染）——R31d 极性修复保持生效
              判决分支：
                H1  step 22 之后出现 "adreno: THE GPU STAYS ON for the
                    system to draw with: the service RedwoodGPU"，且其后再无
                    'the GMU accepts "slumber"' / 'TrustZone has given it up'
                    / CX-collapse 拆除块 ⇒ GPU 常驻路径首次落地（RedwoodGPU
                    服务在册、提交环活着）。注意：SpringBoard 仍软件渲染
                    （"no GPU draws"）——GL 用户态（Mesa over RedwoodGPU）
                    是下一轮，本轮【预期如此】，不是失败。
                H2  任一步骤 FAILED 或 keep 行缺席 ⇒ 整份 logdump 送回，
                    按码分诊（步骤判决表沿用 R32 的 G 树：12/19/21/22
                    已是设备实证基线，任何回退都是新变量）
                H3  GPU 常驻状态下系统死亡/风暴 ⇒ 单 token 回滚：
                    fastboot oem cmdline-append "adreno_keep=0"（否决权）
                    ——或直接刷主镜像（无 GPU 步骤）
            控制组 · 主镜像（可选）：第三验证入账即可。

          【logdump 读取纪律（P3：三次残迹教训的对策）】
            分区每次整写都以头行开始：== XNU FLUSH #N at T s (why); L bytes
            follow == 。拉取后按头行截断：本轮记录 = 头行 + 紧随的 L 字节，
            其后的一切都是更长旧写的残留，不进判读。自有区判读双保险：写
            边界（写尾腰斩行）+ 指针计数（"N s: the kernel has logged"）。
            设备端一键工具 run_ios.sh 的 diag/split 已焊入本纪律。

          【离线复验】
            python3 tools/r33-kernel-id.py <image>
            （代数 grep：R33 代数戳=2、R33 resident round=1、STAYS-ON 行=1、
             vendor .mdt 构建行=1、p_offset 不动=1、SCMDMP 九标记各 1、
             scmsweep 开关=2、M2 三标记各 1、N3 三标记各 1、R28k 继续宣告=1、
             R32/R31/R30/R28m/R28k/R28l 代数戳与宣告=0、R28j 基线=1、
             R28j T2 宣告=2、序贯收尾=1、zap give-up=1、页检查各 1、
             哈希段头各 1、判决=3、开关=4；R28i 及更早措辞全 0；
             ramdisk 判 R13..R32 VERBATIM；
             cmdline：GPU 镜像带 gpu=1 + adreno=22 全相位组 + adreno_keep=1、
             无 adreno_skip；日常镜像无任何 adreno token）

          【工具链审计】
            toolchain-versions.txt：每层编译器完整版本号 + 具名 tag
            （R28i 纪律，R33 原样继承；缓存键全新）。
            同源码异行为时先对这张表。

          【手机端（Termux / bootloader）】
            fastboot boot  raphael-xnu-r33-gpu-flash.img   # R33 轮（GPU 镜像）
            fastboot oem  ramdisk
            fastboot stage raphael-r33-flashboot.apfs
            fastboot oem  run      # 等宣告行 + steps 1..22 + THE GPU STAYS ON 行
                                   # 再等 ~2 分钟过风暴首发窗，然后抓 logdump
            # 设备端一键：sh run_ios.sh flash r33 gpu -w 180
            # 控制组（可选）：同样的四步，换 raphael-xnu-r33-flash.img
          直链：
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-xnu-r33-gpu-flash.img
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-xnu-r33-flash.img
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-r33-flashboot.apfs
            https://github.com/\${REPO}/releases/download/\${TAG}/r33-md1-root.apfs
            https://github.com/\${REPO}/releases/download/\${TAG}/SHA256SUMS
          ⚠️ userdata 上的 iOS 卷是唯一存货：绝不要让 MIUI 开机
             （Android 会重格回 f2fs，iOS 卷即毁）。
          ⚠️ 每次开机都要重复 boot/oem ramdisk/stage/oem run 四步
             （启动卷住 RAM 不落盘，"不写手机闪存"设计的一部分）。
          ⚠️ 含 Apple 版权内容，仅个人研究；下载完成后请尽快删除本 Release。
          EOF


      - name: "⑥b/⑥ 发布 Release（直链交付，r33-springboard）"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "R33 · 纯血 hackios SpringBoard · GPU 常驻轮（R32 实机墙倒入账：TZ 认签 / zap 起动 / 3D 核画上屏；keep 决策读 gpu=1 + cmdline 追加 adreno_keep=1——步骤跑完不再拆除）"
          body: |
            raphael (K20 Pro) R33 交付包：**GPU 常驻轮**。

            R32 设备判决（用户 logdump 入账）：fork 精确形首测全墙倒——
            step 12 "TRUSTZONE ACCEPTS THE ZAP SHADER'S SIGNATURE"、
            step 19 "TRUSTZONE HAS AUTHENTICATED AND STARTED THE ZAP
            SHADER"、step 21 3D 核按命令写内存（0x600dc0de）、step 22
            "A PICTURE DRAWN BY THE GPU IS ON THE PANEL"。GPU 全管线
            真机打通；随后探针自拆（keep 决策只读 adreno_keep，而 GPU
            镜像的 adreno=22 形态不带它），系统回到软件渲染。

            本轮修的 bug：驱动头注释承诺 gpu=1 = 全部步骤且 GPU 留给
            系统，代码只认 adreno_keep——文档与代码的契约断裂，R32 的
            拆除正是其代价。R33 keep 决策读 gpu=1（adreno_keep=0 显式
            否决权保留探针-即-拆行为），GPU 镜像 cmdline 追加
            adreno_keep=1（唯一新增 token，双保险）。

            判读树 H：H1 = "THE GPU STAYS ON for the system to draw
            with: the service RedwoodGPU" 且无拆除块 ⇒ GPU 常驻路径首次
            落地（SpringBoard 仍软件渲染 = GL 用户态是下一轮，预期如此）；
            H2 = 步骤回退 ⇒ logdump 按码分诊；H3 = 常驻态系统不稳 ⇒
            adreno_keep=0 单 token 回滚。

            参照系：HeliumStudio-Dev/hackios-xnu-kernel（raphael-bringup，
            同机型）的日常 GPU 形 = 裸 gpu=1（A640 常驻 + freedreno/FD640
            GLES 真机验证）；其 WiFi（ath10k/ICNSS/SNOC）为下一阶段移植项。

            手术：底板 = r32 release（内核条目 R32 44b5a2b9…），双镜像
            同换 kernel 条目；GPU 镜像 cmdline = r32 token 组 +
            adreno_keep=1；装载器 v7 / ramdisk（R13 谱系）/ DTB = r32
            原字节（SHA 硬校验）。step-19 厂商 .mdt 机制、M2 档案、N3、
            R30 大扫、T2 对照全部原样骑乘。

            logdump 按头行 "L bytes follow" 截断，且只判自有区（写边界 +
            指针计数）——P3 纪律。

            ⚠️ 含 Apple 版权内容，仅供个人研究；下载完成后请尽快删除本 Release。
          fail_on_unmatched_files: true
          files: |
            release/raphael-xnu-r33-flash.img
            release/raphael-xnu-r33-gpu-flash.img
            release/raphael-r33-flashboot.apfs
            release/r33-md1-root.apfs
            release/SHA256SUMS
            release/README.txt
            release/toolchain-versions.txt
      - name: "直链汇总（跑完看这里，复制即用）"
        run: |
          set -eu
          echo "════════════ 全部下载直链 ════════════"
          for f in "$REL"/raphael-xnu-r33-flash.img "$REL"/raphael-xnu-r33-gpu-flash.img \
                   "$REL"/raphael-r33-flashboot.apfs "$REL"/r33-md1-root.apfs \
                   "$REL"/SHA256SUMS "$REL"/README.txt "$REL"/toolchain-versions.txt; do
            echo "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/$(basename "$f")"
          done
