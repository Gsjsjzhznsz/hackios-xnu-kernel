name: R33 · SpringBoard 一键流水线（GPU 常驻轮：R32 实机判决墙倒（TZ 认签/zap 起动/3D 核画上屏）后，keep 决策读 gpu=1（adreno_keep=0 否决）+ GPU 镜像 cmdline 追加 adreno_keep=1——步骤跑完不再拆除，RedwoodGPU 服务交接系统 · 底板 = r32 release · 卷零改动）
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "hackios 内核树 fork（含 xnu/ + raphael_adsp_fw.h + tools/r33-*）"
        required: true
        default: "Gsjsjzhznsz/hackios-xnu-kernel"
      release_tag:
        description: "Release tag（直链的一部分）"
        required: true
        default: "r32-springboard"
      base_image:
        description: "r32 日常镜像直链（外科手术的底板；内核条目 = R32 44b5a2b9…）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r32-springboard/raphael-xnu-r32-flash.img"
      base_gpu_image:
        description: "r32 GPU 镜像直链（外科手术的底板；cmdline 已带全相位 token 组，本轮追加 adreno_keep=1）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r32-springboard/raphael-xnu-r32-gpu-flash.img"
      base_flashboot:
        description: "r32 启动卷直链（= R13 全量字节，真机验证过）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r32-springboard/raphael-r32-flashboot.apfs"
      base_root:
        description: "r32 小卷 md1 直链（对照用：本轮镜像的 ramdisk 条目必须逐字节等于它）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r32-springboard/r32-md1-root.apfs"
permissions:
  contents: write
concurrency:
  group: r33-springboard
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      REL: ${{ github.workspace }}/release
      THEOS: /home/runner/theos     # (literal: GitHub Actions' env: block expands nothing)
      CCACHE_DIR: ${{ github.workspace }}/hackios/.ccache
    steps:
      # ---------------------------------------------------------------
      - name: "①/⑥ 磁盘准备与依赖（内核构建工具链）"
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-dev clang lld ccache \
                       flex bison m4 perl python3 autoconf automake libtinfo6 xz-utils uuid-dev 7zip >/dev/null
          command -v clang && command -v ccache && command -v 7z
          # dsymutil：Ubuntu 的 apt clang 不往 /usr/bin 放它（R11 run 39973048286 的教训）
          DS=$(command -v dsymutil || clang --print-prog-name=dsymutil 2>/dev/null || true)
          [ -x "$DS" ] || DS=$(ls /usr/lib/llvm-*/bin/dsymutil 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$DS" ] && [ -x "$DS" ]; then
            sudo ln -sf "$DS" /usr/bin/dsymutil
          else
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/bin/dsymutil >/dev/null && sudo chmod +x /usr/bin/dsymutil
          fi
          mkdir -p "$REL"
          # R28i 工具链审计第一页：runner 镜像自带的编译器版本，原样入档（R28h-B 的 lsd SIGBUS
          # 嫌疑头名是构建环境漂移——r25-* 缓存键的跨代 restore 链 + runner 滚动更新；本轮把
          # 每一层工具链的完整版本号写进构建日志与 release 资产，未来任何一轮都能对表）
          {
            echo "R28i toolchain audit (recorded $(date -u +%FT%TZ))"
            echo "--- runner image ---"
            cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION)=' || true
            echo "--- apt clang (the kernel's host compiler) ---"
            clang --version | head -2
            lld --version 2>/dev/null || true
            echo "--- apt dsymutil ---"
            dsymutil --version 2>/dev/null | head -1 || true
          } | tee "$REL/toolchain-versions.txt"
          df -h /

      # ---------------------------------------------------------------
      - name: "②/⑥ 取树 + 取 r31 资产（本轮底板；SHA 对官方 SHA256SUMS 硬校验）"
        run: |
          set -eu
          git clone --depth 1 "https://github.com/${{ inputs.kernel_repo }}.git" hackios
          cd hackios
          echo "→ 内核树 @ $(git log -1 --format='%h %s')"
          ls -lh xnu/files/bsd/dev/raphael_adreno.c xnu/files/bsd/dev/raphael_adsp_fw.h \
                tools/r33-flash-build.sh tools/r33-kernel-id.py fw-gpu-raphael/adsp.mbn
          # r32 的四件资产：两张镜像是外科手术的底板（装载器 v7 原字节在里面，
          # 内核条目 = R32 44b5a2b9…，GPU 底板的 cmdline 已带全相位 token 组），
          # 启动卷与小卷本轮原样沿用（小卷同时是"镜像 ramdisk 条目必须逐字节等于它"的对照物）。
          mkdir -p base
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/raphael-xnu-r32-flash.img  "${{ inputs.base_image }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/raphael-xnu-r32-gpu-flash.img "${{ inputs.base_gpu_image }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/raphael-r32-flashboot.apfs "${{ inputs.base_flashboot }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/r32-md1-root.apfs "${{ inputs.base_root }}"
          sha256sum base/* | tee base/SHA256SUMS.r32base
          # 硬校验：四件资产必须是 r32 release 的官方字节（r32-springboard 的 SHA256SUMS）
          python3 - base/ <<'PY'
          import hashlib, sys
          want = {
              'raphael-xnu-r32-flash.img':    'a5a86f206553abf9ece9d4d0e6c96b1334a766058fee5b2c6b13cf97deef3ce0',
              'raphael-xnu-r32-gpu-flash.img':'f4b0504472fcbff6ac554ddc49aa0be0f91e6004891ac29c2e5da4da30f0f50a',
              'raphael-r32-flashboot.apfs':   '14485e7c5ce125ef516168445c2500ac04ca5e40a908c2aef516b2d92c24ba0c',
              'r32-md1-root.apfs':            '372c7fcb7730726a8fb806eec7251e0e75a4188f64db6fbaedcf5b7663672dd4',
          }
          for name, sha in want.items():
              got = hashlib.sha256(open(sys.argv[1] + name, 'rb').read()).hexdigest()
              assert got == sha, f'{name}: {got} != the r32 release sha {sha}'
          print('底板四件全部等于 r32 release 的官方字节（r32-springboard SHA256SUMS）')
          PY
          # 立等可取的装载器门禁：r32 底板镜像里的 loader 条目必须是设备已验证的 v7（ec15106d…），
          # 内核条目必须是 R32、小卷必须是 R13 谱系——本轮手术的底板谱系三查
          python3 tools/r33-kernel-id.py base/raphael-xnu-r32-flash.img base/raphael-xnu-r32-gpu-flash.img | tee base-id.txt
          grep -q "ec15106da4bad290" base-id.txt || { echo "::error::r32 底板镜像的 loader 不是设备验证过的 v7（ec15106d…）"; exit 1; }
          grep -Ec "loader +sha256" base-id.txt | grep -qx 2 || { echo "::error::两张 r32 底板镜像都要读到 loader 条目"; exit 1; }
          grep -q "VERDICT: the kernel entry is R32" base-id.txt || { echo "::error::底板镜像的内核不是 R32"; exit 1; }
          grep -q "VERDICT: the ramdisk entry is R13..R32 VERBATIM" base-id.txt || { echo "::error::底板镜像的小卷不是 R13 谱系"; exit 1; }
          # 两张底板镜像的 ramdisk 条目必须就是 r32-md1-root.apfs 的字节（本轮"卷零改动"的对照物）
          python3 - base/ <<'PY'
          import gzip, struct, sys
          def ramdisk_of(path):
              img = open(path, 'rb').read()
              blob = gzip.decompress(img[4096:4096 + struct.unpack('<I', img[8:12])[0]])
              x = blob.find(b'XNUP')
              size = struct.unpack('<I', blob[x+4:x+8])[0]
              i, out = x + 8, {}
              while i + 24 <= x + 8 + size and blob[i] != 0:
                  name = blob[i:i+16].rstrip(b'\0').decode()
                  esize = struct.unpack('<I', blob[i+16:i+20])[0]
                  out[name] = blob[i+24:i+24+esize]
                  i += 24 + ((esize + 15) & ~15)
              return out['ramdisk']
          base = open(sys.argv[1] + 'r32-md1-root.apfs', 'rb').read()
          for n in ('raphael-xnu-r32-flash.img', 'raphael-xnu-r32-gpu-flash.img'):
              r = ramdisk_of(sys.argv[1] + '/' + n)
              assert r == base, f'{n}: ramdisk 条目与 r32-md1-root.apfs 不一致'
          print('底板两镜像的 ramdisk 条目 == r32-md1-root.apfs，逐字节')
          PY

      # ---------------------------------------------------------------
      # R28i 工具链纪律（R32 原样继承）：lsd SIGBUS 的头号嫌疑是 r25-* 缓存键的
      # 跨代 restore 链（两次构建可能拿到不同代的 theos / xnu-deps）。每轮缓存键
      # 全新、**不带 restore-keys**：首跑必 miss → 从钉死的 URL 重建（L1ghtmann
      # v19.0.0-L2 具名 tag + theos/sdks 固定源），重建是确定性的；后续同键命中
      # 同一份。跨代混用从结构上不再可能。
      - name: "②c/⑥ 缓存：theos（工具链 + iPhoneOS16.5.sdk；R33 全新键、无 restore 链）"
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: r33-theos-v19L2-v1
      - name: "②d/⑥ 缓存：xnu-deps（Apple 开源件 + host 工具 + SDK 链接树；R33 全新键、无 restore 链）"
        uses: actions/cache@v4
        with:
          path: hackios/xnu-deps
          key: r33-xnu-deps-v1
      # R31 沿 R28i 的 clean build 纪律：ccache 零回填（空仓起跑），
      # 本轮每个 .o 都从本轮源码编译；缓存只存不用（给后面的轮次）。
      - name: "②e/⑥ ccache（R33 clean build——零回填，只存不用）"
        uses: actions/cache@v4
        with:
          path: hackios/.ccache
          key: r33-ccache-${{ github.run_id }}

      # ---------------------------------------------------------------
      - name: "③/⑥ 内核源码构建（theos 固定 v19.0.0-L2 + xnu/apply.sh + xnu-deps + clean ccache + make + R33 门禁）"
        run: |
          set -eu
          # theos 本体 + 工具链：R28i 起工具链 URL 钉死（R31 原样继承，不再 releases/latest——
          # latest 一旦上游发新版本，两次构建之间就会漂移）。钉的是 git tag
          # main-update_3-eabca92（release 显示名 v19.0.0-L2）——download URL 只认
          # git tag，不认显示名，run 40213864365 就是栽在拿显示名当 tag 404；
          # 该 release 自 2024-04 未动过，与 R28d/R28g 实际拉到的字节相同，纯收紧
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/ld64" ]; then
            rm -rf "$THEOS"
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
            mkdir -p "$THEOS/toolchain"
            curl -fL --retry 3 --retry-delay 5 -sS https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          fi
          "$THEOS/toolchain/linux/iphone/bin/ld64" --version | tee -a "$REL/toolchain-versions.txt" || true
          echo "--- theos toolchain tarball identity ---" | tee -a "$REL/toolchain-versions.txt"
          echo "L1ghtmann/llvm-project v19.0.0-L2 (git tag main-update_3-eabca92; pinned; R28i discipline, R31 inherits)" | tee -a "$REL/toolchain-versions.txt"
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" ]; then
            rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk" /tmp/theos-sdks
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
            git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
            mkdir -p "$THEOS/sdks"
            mv /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
            rm -rf /tmp/theos-sdks
          fi
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" || { echo "::error::theos/sdks 的 iPhoneOS16.5.sdk 就位失败"; exit 1; }
          df -h /
          cd hackios
          xnu/apply.sh
          # 内核编译器钉死：theos 工具链的 clang（上面按 git tag 下载的那份），绝不许
          # runner 的 apt clang 编内核 —— R28i run 40214391444：当日 apt clang 把三个
          # "T2 VERDICT:" 判决串无声无息地从内核里剥了（-w 吃掉了警告，门禁兜住的）；
          # R28d→R28g 的 apt clang 漂移也是 lsd SIGBUS 的头号嫌疑。xnu-clang wrapper
          # 读 XNU_HOST_CLANG（本轮起支持）；host 工具（mig 等）仍用 apt 的。
          XNU_HOST_CLANG="$THEOS/toolchain/linux/iphone/bin/clang"
          export XNU_HOST_CLANG
          test -x "$XNU_HOST_CLANG" || { echo "::error::theos 工具链 clang 缺位（$XNU_HOST_CLANG）"; exit 1; }
          "$XNU_HOST_CLANG" --version | tee -a "$REL/toolchain-versions.txt"
          grep -q "eabca92" "$REL/toolchain-versions.txt" || { echo "::error::内核编译器不是钉死的 theos clang（eabca92）"; exit 1; }
          bash xnu-deps/setup.sh || { echo "::error::setup.sh 失败——exporthdrs.log 尾部："; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          export XNU_CCACHE=1 CCACHE_COMPILERCHECK=content XNU_WRAPPER_LOG="$PWD/xnu-clang-args.log"
          : > "$XNU_WRAPPER_LOG"
          ccache -C >/dev/null 2>&1 || true
          ccache -M 2G >/dev/null 2>&1 || true
          echo "→ R33 clean build：ccache 零回填空仓起跑，本轮每个对象都从本轮源码编译"
          echo "→ ccache 起步统计（应全零）："; ccache -s 2>/dev/null | head -8 || true
          ./xnu-build.sh -j4 -k || echo "（make 退出码 $?——上游文档：链接后的检查，内核若已产出即成功）"
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          ls -la "$K" || { echo "::error::内核没有产出——exporthdrs.log 与 make 日志尾部："; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          # --- R32 诊断（快检）：R32 新增/判决串计数 + wrapper 自录 argv 留档 ---
          #    R28i 曾用 17 变体重放矩阵 + IR 探针定位“编译器无声删串”事件（元凶＝当日
          #    apt clang，run 40214391444；现已钉死 theos clang，矩阵退役，只留快检与
          #    argv 留档——若任何计数与门禁不符，xnu-clang-args.log 里有离线重放要用的
          #    真实命令行）。
          echo "→ 诊断 A：R33/R28j 判决/证据串计数（应与门禁表一致）"
          echo "    T2 VERDICT: = $(strings -a "$K" | grep -cF 'T2 VERDICT:')（应 3）"
          echo "    the zap attempt follows = $(strings -a "$K" | grep -cF 'the zap attempt follows in this same boot')（应 1）"
          echo "    R28j give-up = $(strings -a "$K" | grep -cF 'R28j: the give-up right after the refusal')（应 1）"
          echo "    T2 page check = $(strings -a "$K" | grep -cF 'T2 page check')（应 1）"
          echo "    E1 page check = $(strings -a "$K" | grep -cF 'E1 page check')（应 1）"
          echo "    adsp hash head = $(strings -a "$K" | grep -cF "the adsp's hash segment's head")（应 1）"
          echo "    zap hash head = $(strings -a "$K" | grep -cF "the zap's hash segment's head")（应 1）"
          echo "    R33 generation line = $(strings -a "$K" | grep -cF 'R33: the kernel generation line')（应 2）"
          echo "    R33 resident round = $(strings -a "$K" | grep -cF 'R33: the resident round')（应 1）"
          echo "    R33 keep switch = $(strings -a "$K" | grep -cF 'THE GPU STAYS ON for the system to draw with')（应 1）"
          echo "    R32 form riding = $(strings -a "$K" | grep -cF 'one attempt, the fork-exact form (R32: the vendor .mdt below')（应 1）"
          echo "    R32 mdt built = $(strings -a "$K" | grep -cF 'the vendor .mdt is built')（应 1）"
          echo "    R32 p_offset intact = $(strings -a "$K" | grep -cF 'p_offset rides untouched at %#x')（应 1）"
          echo "    R33 SCMDMP begin = $(strings -a "$K" | grep -cF 'SCMDMP: R33 begins')（应 1）"
          echo "    R33 QUE = $(strings -a "$K" | grep -cF 'SCMDMP QUE cpu%d: the SCM queue entry')（应 1）"
          echo "    R33 HND = $(strings -a "$K" | grep -cF 'SCMDMP HND cpu%d: the per-cpu handle cache entry')（应 1）"
          echo "    R33 GLB = $(strings -a "$K" | grep -cF 'SCMDMP GLB: phys 0x858a5900')（应 1）"
          echo "    R33 SCM sweep = $(strings -a "$K" | grep -cF 'the SCM region, all %u bytes')（应 1）"
          echo "    R33 TZREG = $(strings -a "$K" | grep -cF 'SCMDMP TZREG: the TZ DIAG registry word')（应 1）"
          echo "    R33 TZDIAG = $(strings -a "$K" | grep -cF "TZDIAG: the TZ's own log")（应 1）"
          echo "    R33 HDREG = $(strings -a "$K" | grep -cF 'SCMDMP HDREG: the hyp DIAG registry word')（应 1）"
          echo "    R33 HYPDIAG = $(strings -a "$K" | grep -cF "HYPDIAG: the hypervisor's own diag buffer")（应 1）"
          echo "    R33 scmsweep switch = $(strings -a "$K" | grep -cF 'adreno_scmsweep')（应 2）"
          echo "    R31/R32 旧戳（全 0） = gen/announce/packed/rewrite/begin = $(strings -a "$K" | grep -cE 'R31: the kernel generation line|R31: the fork-proven form|the packed metadata is built|p_offset rewritten|SCMDMP: R31 begins|R32: the kernel generation line|R32: the fork-exact form -- a real vendor pair|SCMDMP: R32 begins')（应 0）"
          echo "    M2 seg table = $(strings -a "$K" | grep -cF 'M2: seg %u: type')（应 1）"
          echo "    M2 canonical rewrite = $(strings -a "$K" | grep -cF 'M2: the header rewritten canonical')（应 1）"
          echo "    M2 chain verdict = $(strings -a "$K" | grep -cF 'M2: THE SIGNATURE CHAIN SAYS')（应 1）"
          echo "    N3 registry line = $(strings -a "$K" | grep -cF 'HYPLOG: the registry at phys 0x146bfb30')（应 1）"
          echo "    N3 ring dump line = $(strings -a "$K" | grep -cF 'HYPLOG: the ring, all %u bytes')（应 1）"
          echo "    N3 boot arg = $(strings -a "$K" | grep -cF 'adreno_hyplog')（应 1）"
          echo "    R28k run-goes-on（R28k 措辞原样保留，路径本轮不达） = $(strings -a "$K" | grep -cF 'R28k: the run goes on to the 3D core without the zap')（应 1）"
          echo "    R28j generation line = $(strings -a "$K" | grep -cF 'R28j: the kernel generation line')（应 0）"
          echo "→ 诊断 B：raphael_adreno 的真实 argv 已由 wrapper 录进 xnu-clang-args.log（删串复发时离线重放用）"
          grep -m1 "raphael_adreno.c" "$PWD/xnu-clang-args.log" | cut -c1-300 || true
          echo "→ ccache 收官统计："; ccache -s 2>/dev/null | head -8 || true
          # ---- R33 门禁：本轮自己的标记（含内嵌 .mdt 的字节级证明）、保留的先轮标记、
          # 退役措辞反查（R32 全套代数戳/宣告本轮退役）、新 sha 断言（不允许等于任何一代历史内核）
          python3 - "$K" fw-gpu-raphael/adsp.mbn <<'PY'
          import hashlib, sys
          d = open(sys.argv[1], 'rb').read()
          fw = open(sys.argv[2], 'rb').read()
          for marker, what in ((b'R33: the kernel generation line', 'R33 代数戳（驱动首行 + step 1 首次 flush）'),
                               (b'R33: the resident round', 'R33 主目标宣告（GPU 常驻轮）'),
                               (b'THE GPU STAYS ON for the system to draw with', 'R33 keep 落地行（RedwoodGPU 交接）'),
                               (b'one attempt, the fork-exact form (R32: the vendor .mdt below', 'R32 step-19 形态措辞（骑乘保留）'),
                               (b'the vendor .mdt is built', 'R32 厂商 .mdt 构建行（骑乘保留）'),
                               (b'p_offset rides untouched at %#x', 'R32 p_offset 不动行（骑乘保留：表 verbatim）'),
                               (b'SCMDMP: R33 begins', 'R33 探针起点行'),
                               (b'SCMDMP QUE cpu%d: the SCM queue entry', 'R33 队列条目行（0x85775e00+cpu*0x30）'),
