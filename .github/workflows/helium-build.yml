name: Helium raphael kernel build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      THEOS: /home/runner/theos
      HELIUM_SHA: 57722468a3774e2ec60017705ec356ae9b31f40e
      JOBS: '4'
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang lld llvm flex bison m4 perl python3 python3-dev autoconf automake libtool libtinfo6 xz-utils uuid-dev 7zip ripgrep
      - name: Prepare Theos and SDK
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain"
          curl -fsSL --retry 3 https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -a /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang" || { echo 'Toolchain clang missing'; exit 1; }
          test -x "$THEOS/toolchain/linux/iphone/bin/ld" || { echo 'Theos linker ld missing'; exit 1; }
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" || { echo 'iOS SDK headers missing'; exit 1; }
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | tee /tmp/helium-clang-version.txt
          grep -q eabca92 /tmp/helium-clang-version.txt || { echo 'Unexpected clang build'; exit 1; }
      - name: Fetch pinned Helium source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch raphael-bringup https://github.com/HeliumStudio-Dev/hackios-xnu-kernel.git helium
          test "$(git -C helium rev-parse HEAD)" = "$HELIUM_SHA"
      - name: Build raphael kernel
        run: |
          set -euo pipefail
          cd helium
          mkdir -p /tmp/helium-clang
          cat > /tmp/helium-clang/clang <<'SH'
          #!/bin/bash
          set -e
          driver=clang
          [[ "$(basename "$0")" == clang++ ]] && driver=clang++
          for arg in "$@"; do
            case "$arg" in
              arm64-apple-ios*) exec "$THEOS/toolchain/linux/iphone/bin/$driver" "$@" ;;
            esac
          done
          exec "/usr/bin/$driver" "$@"
          SH
          chmod +x /tmp/helium-clang/clang
          ln -s clang /tmp/helium-clang/clang++
          export PATH="/tmp/helium-clang:$PATH"
          test "$(command -v clang)" = /tmp/helium-clang/clang
          test "$(command -v clang++)" = /tmp/helium-clang/clang++
          command -v ld
          printf 'int main(void) { return 0; }\n' | clang -x c - -o /tmp/host-compiler-check
          /tmp/host-compiler-check
          xnu/apply.sh
          if ! xnu-deps/setup.sh; then
            echo 'Dependency setup failed; relevant host build logs follow:'
            for log in xnu-deps/mig-build.log xnu-deps/mm_bootstrap_cmds/config.log xnu-deps/unifdef-build.log xnu-deps/exporthdrs.log; do
              if [ -f "$log" ]; then echo "--- $log ---"; tail -100 "$log"; fi
            done
            exit 1
          fi
          export CC="$THEOS/toolchain/linux/iphone/bin/clang"
          python3 tools/mk-ath10k.py
          test -s xnu-deps/build/ath10k/out/ath10k.o
          export WIFI_OBJECT="$PWD/xnu-deps/build/ath10k/out/ath10k.o"
          ./xnu-build.sh -j4 -k BUILD_DSYM=0
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          test -s "$K"
          python3 - "$K" <<'PY'
          import hashlib, pathlib, struct, sys
          p = pathlib.Path(sys.argv[1])
          data = p.read_bytes()
          assert struct.unpack_from('<II', data) == (0xfeedfacf, 0x100000c), 'not ARM64 Mach-O'
          assert b'hakios' in data.lower(), 'missing HakiOS marker'
          print('Helium kernel bytes:', len(data), 'sha256:', hashlib.sha256(data).hexdigest())
          PY
          mkdir -p "$GITHUB_WORKSPACE/output" userland/obj
          cp "$K" "$GITHUB_WORKSPACE/output/helium-raphael-kernel.bin"
          source ./xnu-env.sh
          cd userland
          CC='xnu-clang -arch arm64 -Os -static -nostdlib -ffreestanding -fno-stack-protector -fno-builtin -Wall -Wextra'
          LD='-Wl,-e,_start -Wl,-pagezero_size,0x100000000'
          $CC -Ilibmini -c libmini/mini.c -o obj/mini.o
          $CC -c libmini/start.S -o obj/start.o
          for prog in init stage0 child; do
            $CC -Ilibmini $LD -o "$GITHUB_WORKSPACE/output/helium-$prog" "src/$prog.c" obj/mini.o obj/start.o
          done
          python3 - "$GITHUB_WORKSPACE/output/helium-init" <<'PY'
          import pathlib, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          assert b'kern.hakios_switch_root' in data
          assert b'the prepared system image is the root, read from flash' in data
          print('Prepared-system init strings verified')
          PY
          cd "$GITHUB_WORKSPACE/output"
          sha256sum helium-raphael-kernel.bin helium-init helium-stage0 helium-child > SHA256SUMS
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: helium-raphael-kernel
          path: output/
          if-no-files-found: error
          retention-days: 3
