      - name: "⑥b/⑥ 发布 Release（直链交付，r28j-springboard）"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "R28j · 纯血 hackios SpringBoard · T2 对照三版（同 boot 序贯 adsp→zap，只换内核）"
          body: |
            raphael (K20 Pro) R28j 交付包：**T2 对照三版——同 boot 序贯轮**。

            R28i 的 T2 判决 ACCEPTED(0) 证明 XNU→Hyp→TZ 链路无罪，但它对照的
            zap -3145797 出自 R28d 的另一次 boot。R28j 补上唯一缺失的对照：
            同一次 boot 里背靠背的两次尝试——adsp 尝试→give-up→zap 尝试→
            give-up（拒绝后紧跟），两半之间只有文件、id、读取来源三处不同。
            另加 T2/E1 页检查行与两个哈希段头 0x40 dump（T3 台账 Q5 设备侧
            作答）。QFPROM 身份行保持退役（secboot 熔丝行是 R25 杀手本族）。

            手术只动 kernel 条目：底板四件 = R28d 官方字节（SHA 硬校验）、
            装载器 v7 逐字节原样、ramdisk = R28d 原卷、cmdline 逐字节 R28d
            （无 T2 token）。主镜像 = lsd 控制组，GPU 镜像 = 序贯轮。

            判读（J1-J5 全文见 Release 资产 README.txt）：J1 = T2 0 + zap
            -3145797 → 同 boot 闭环成立，T3 转正；J2 = zap 变 -3145738 →
            缓存/页污染并查 lsd；J3 = zap 0 → 回查构建链；J4 = T2 翻车 →
            序贯状态污染；J5 = 死机 → flush 锚点定位。logdump 按头行
            "L bytes follow" 截断（P2 纪律，README.txt 有全文）。

            ⚠️ 含 Apple 版权内容，仅供个人研究；下载完成后请尽快删除本 Release。
