      # ---------------------------------------------------------------

      - name: "诊断产物（wrapper argv 日志，失败也上传）"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-diag
          path: |
            hackios/xnu-clang-args.log
          if-no-files-found: ignore

      - name: "⑤/⑥ 打 r28j 双启动镜像（外科手术：只换 kernel 条目；装载器 v7 / ramdisk / cmdline / DTB / 头字段 = R28d 原字节）"
        run: |
          set -eu
          cd hackios
          bash tools/r28j-flash-build.sh r28d/raphael-xnu-r28d-flash.img r28d/raphael-xnu-r28d-gpu-flash.img
          cp raphael-xnu-r28j-flash.img "$REL/"
          cp raphael-xnu-r28j-gpu-flash.img "$REL/"
          # 启动卷与小卷：R28d 的官方字节，名字换成本轮（对照用，不刷也不影响 boot）
          cp r28d/raphael-r28d-flashboot.apfs "$REL/raphael-r28j-flashboot.apfs"
          cp r28d/r28d-md1-root.apfs "$REL/r28j-md1-root.apfs"
          # 对打包后的双镜像离线复证（与 ③ 源码构建、⑤ 打包内打印三方对齐）
          python3 tools/r28j-kernel-id.py \
                  "$REL/raphael-xnu-r28j-flash.img" "$REL/raphael-xnu-r28j-gpu-flash.img" | tee r28j-kernel-id.txt
          grep -c "VERDICT: the kernel entry is R28j" r28j-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像必须双双判 R28j 内核"; exit 1; }
          grep -c "VERDICT: the ramdisk entry is R13..R28d VERBATIM" r28j-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像的小卷必须是 R28d 原字节（本轮不换卷）"; exit 1; }
          grep -c "ec15106da4bad290" r28j-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像的 loader 必须是设备验证过的 v7（ec15106d…）"; exit 1; }
          grep -q "needs no T2 token" r28j-kernel-id.txt || { echo "::error::cmdline 校验行缺失（本轮 cmdline 必须零改动、无 T2 token）"; exit 1; }
          # GPU 镜像的 cmdline 必须带 gpu=1（R28d 原样）、日常镜像不带（R28d 原样）
          # —— 数数据行（"cmdline       :" 前缀），VERDICT 行不匹配它（R28i 的教训）。
          test "$(grep 'cmdline       :' r28j-kernel-id.txt | grep -c 'gpu=1')" = 1 || { echo "::error::两张镜像的 cmdline 数据行里必须恰好 GPU 镜像带 gpu=1"; exit 1; }
          echo "（cmdline 检查过：恰好 GPU 镜像带 gpu=1，两行都是 R28d 原字节）"
          ls -lh "$REL"
          df -h .

      # ---------------------------------------------------------------
      - name: "⑥/⑥ SHA256 + README + 发布（R28j：J1-J5 判读树 + logdump P2 读取纪律，只有 boot 资产）"
        run: |
          set -eu
          cd "$REL"
          : > SHA256SUMS
          for f in raphael-xnu-r28j-flash.img raphael-xnu-r28j-gpu-flash.img \
                   raphael-r28j-flashboot.apfs r28j-md1-root.apfs; do
            sha256sum "$f" >> SHA256SUMS
          done
          REPO="${{ github.repository }}"
          TAG="${{ inputs.release_tag }}"
          cat > README.txt <<EOF
          ============================================================
           R28j · 纯血 hackios SpringBoard 交付包（raphael / K20 Pro）
           —— T2 对照三版 · 同 boot 序贯：adsp→give-up→zap→give-up；
              装载器 v7 原字节、卷/cmdline 零改动，只换内核
          ============================================================
          ⚠️⚠️⚠️ 启动卷只 stage 一个文件：raphael-r28j-flashboot.apfs ⚠️⚠️⚠️
            （R14 事故纪律不变：md1 备份不要 stage，flash.img 已内嵌全量小卷）
          主镜像   : raphael-xnu-r28j-flash.img（触摸 + 按键 + 八核；不跑 GPU 步骤）
          GPU 镜像 : raphael-xnu-r28j-gpu-flash.img（同上 + gpu=1；step 19 默认跑
                      T2 + zap 序贯，无需任何参数）
          启动卷   : raphael-r28j-flashboot.apfs（= R28d 官方字节 = R13 全量，原样转发）
          小卷 md1 : r28j-md1-root.apfs（= R28d 官方字节；对照用）

          【R28j 改了什么、为什么】
            R28i 的 T2 判决 ACCEPTED(0)：XNU→Hyp→TZ 链路无罪。但它对照的 zap
            -3145797 出自 R28d 的另一次 boot（跨内核二进制）——还缺的唯一一组
            对照，就是同一次 boot 里背靠背的两次尝试。R28j 把 T2 对照从 INSTEAD
            改为 BEFORE：adsp 尝试→adsp give-up→zap 尝试→zap give-up（拒绝后
            紧跟），两半之间只有文件、id、读取来源三处不同；通道、调用者、调用
            形状、页、flush 全部一致。另加两组证据行：T2/E1 page check（页对齐
            +长度，与 armed 行同字段同序）、两个哈希段头 0x40 字节 dump（adsp
            的以证书开头、zap 的以零 version/img_id 开头——T3 台账的 Q5 在设备
            上直接作答）。QFPROM 身份行保持退役：secboot/rollback 熔丝行是 R25
            t=4s 杀手本族（R27b 已定罪读取本身），熔丝对照归 T3 离线做。

          【本轮判读树（J1-J5：两张镜像、按序刷，一次定位）】
            第一刷 · 主镜像（日常控制组，~2 分钟看分晓）：
              进桌面正常、lsd 不崩 → 构建环境保持干净 → 直接第二刷；
              lsd/analyticsd SIGBUS → 环境仍有暗变量 → 发日志（对照 R28i 轮）。
            第二刷 · GPU 镜像（序贯轮，等 ~45-60s 到 step 19）：
              证据链顺序（全在同一 boot，四 call 一体）：
                基线行 "R28j: the two-parameter baseline ... BEFORE the zap attempt"
                "fw/adsp.mbn: 7820 bytes, the kernel's own embedded copy"
                "T2 armed: ... x2 1 (the pas id) ..."
                "T2 page check: ... page-aligned ..."
                "the adsp's hash segment's head, ..."
                ★ "T2 VERDICT:" ← 第一半的判决
                adsp give-up（"R28j: the adsp's give-up"）
                "the T2 control (...) is on the record above; the zap attempt
                 follows in this same boot"
                ...zap 段（find / chain / E1 armed / E1 page check / zap hash head）...
                ★ zap 拒绝行 "refused: the call returns ..." ← 第二半的判决
                ★ "R28j: the give-up right after the refusal" ← 第二半的收尾
                零页对照 / supports 诊断（同 r28d 形）
              ★★ J 判定（以 T2 码 × zap 码为轴）：
                J1  T2=0 且 zap=-3145797（-0x300045）→ 同 boot 闭环成立：链路
                    无罪 + 拒绝是 zap 定向的（签名/身份/策略）→ T3 转正（离线
                    逆向 secapp cmd 0x49 拒绝分支；zap 哈希段头 0x40 是输入
                    差异候选）。
                J2  zap 变 -3145738（-0x30000A）→ 缓冲/解析层：页污染或缓存
                    维护嫌疑 → 并查 lsd（本 boot 是否真有 SIGBUS）+ 对照两段
                    page check 行。
                J3  zap=0（被接受）→ 跨 boot 状态差异实锤（R28d 的拒绝另有
                    其因）→ 回查 R28d→R28i→R28j 构建链与卷差异。
                J4  T2≠0（本轮 T2 翻车，R28i 是 0）→ 同 boot 序贯引入了状态
                    污染（前一 boot 的残留/顺序效应）→ 对照 R28i 排查。
                J5  判决前死机/复位 → 以最后一条 flush 锚点（put_the_log_away
                    的 what 串）定位死亡窗口。
              收尾预期（不是失败）：adsp give-up 0、zap give-up 0、step 19
              FAILED 同 r28d 形 → 用户态照常（白苹果 → SpringBoard）。

          【logdump 读取纪律（P2：上轮残留教训的对策——v7 头行已够用）】
            分区每次整写都以头行开始：== XNU FLUSH #N at T s (why); L bytes
            follow == 。拉取后按头行截断：本轮记录 = 头行 + 紧随的 L 字节，
            其后的一切（半行截断、时间倒流、上轮 boot 数据）都是更长旧写的
            残留，不进判读。boot 身份以内核版本行的构建时间戳为准；同内核
            重启场景用头行计数 #N 的跳变识别新 boot。若头行缺失（从未 flush
            就死）→ 整分区都是上一轮的记录，按旧纪律（半行检测 + 时间单调
            性）判读。（装载器 v8 的分区尾哨兵/boot 序号列后续轮次。）

          【离线复验】
