name: R28d · SpringBoard 一键流水线（CPU monitor 豁免轮 · 外科换内核，装载器 v7 原字节）
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "hackios 内核树 fork（含 xnu/ + tools/r28d-flash-build.sh）"
        required: true
        default: "Gsjsjzhznsz/hackios-xnu-kernel"
      release_tag:
        description: "Release tag（直链的一部分）"
        required: true
        default: "r28d-springboard"
      r28c_image:
        description: "R28c 日常镜像直链（外科手术的底板）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r28c-springboard/raphael-xnu-r28c-flash.img"
      r28c_gpu_image:
        description: "R28c GPU 镜像直链（外科手术的底板）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r28c-springboard/raphael-xnu-r28c-gpu-flash.img"
      r28c_flashboot:
        description: "R28c 启动卷直链（= R13 全量字节，真机验证过）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r28c-springboard/raphael-r28c-flashboot.apfs"
      r28c_root:
        description: "R28c 小卷 md1 直链（= R13 全量字节）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r28c-springboard/r28c-md1-root.apfs"
permissions:
  contents: write
concurrency:
  group: r28d-springboard
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      REL: ${{ github.workspace }}/release
      THEOS: /home/runner/theos     # (literal: GitHub Actions' env: block expands nothing)
      CCACHE_DIR: ${{ github.workspace }}/hackios/.ccache
    steps:
      # ---------------------------------------------------------------
      - name: "①/⑥ 磁盘准备与依赖（内核构建工具链）"
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-dev clang lld ccache \
                       flex bison m4 perl python3 autoconf automake libtinfo6 xz-utils uuid-dev 7zip >/dev/null
          command -v clang && command -v ccache && command -v 7z
          # dsymutil：Ubuntu 的 apt clang 不往 /usr/bin 放它（R11 run 39973048286 的教训）
          DS=$(command -v dsymutil || clang --print-prog-name=dsymutil 2>/dev/null || true)
          [ -x "$DS" ] || DS=$(ls /usr/lib/llvm-*/bin/dsymutil 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$DS" ] && [ -x "$DS" ]; then
            sudo ln -sf "$DS" /usr/bin/dsymutil
          else
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/bin/dsymutil >/dev/null && sudo chmod +x /usr/bin/dsymutil
          fi
          mkdir -p "$REL"
          df -h /

      # ---------------------------------------------------------------
      - name: "②/⑥ 取树 + 取 R28c 资产（本轮的底板与卷，逐字节原样搬运）"
        run: |
          set -eu
          git clone --depth 1 "https://github.com/${{ inputs.kernel_repo }}.git" hackios
          cd hackios
          echo "→ 内核树 @ $(git log -1 --format='%h %s')"
          ls -lh xnu/files/bsd/kern/kern_minimac.c tools/r28d-flash-build.sh tools/r28d-kernel-id.py
          # R28c 的四件资产：两张镜像是外科手术的底板（装载器 v7 原字节在里面），两卷改名沿用
          mkdir -p r28c
          for pair in "r28c_image=raphael-xnu-r28c-flash.img" "r28c_gpu_image=raphael-xnu-r28c-gpu-flash.img" \
                      "r28c_flashboot=raphael-r28c-flashboot.apfs" "r28c_root=r28c-md1-root.apfs"; do
            key=${pair%%=*}; out=${pair##*=}
            url=$(eval echo "\${{ inputs.$key }}")
            curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o "r28c/$out" "$url"
          done
          sha256sum r28c/* | tee r28c/SHA256SUMS.r28c
          # 立等可取的装载器门禁：R28c 镜像里的 loader 条目必须是设备已验证的 v7（ec15106d…）
          python3 tools/r28d-kernel-id.py r28c/raphael-xnu-r28c-flash.img r28c/raphael-xnu-r28c-gpu-flash.img | tee r28c-id.txt
          grep -q "ec15106da4bad290" r28c-id.txt || { echo "::error::R28c 镜像的 loader 不是设备验证过的 v7（ec15106d…）"; exit 1; }
          grep -c "loader sha256" r28c-id.txt | grep -qx 2 || { echo "::error::两张 R28c 镜像都要读到 loader 条目"; exit 1; }

      # ---------------------------------------------------------------
      # 缓存三连：theos / xnu-deps / ccache（沿 r28b 的键位；ccache 依旧零回填——clean build 审计姿态）
      - name: "②c/⑥ 缓存：theos（工具链 + iPhoneOS16.5.sdk）"
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: r25-theos-v1
          restore-keys: |
            r23-theos-v1
            r22-theos-v1
            r20-theos-v1
            r19-theos-v1
            r18-theos-v1
            r17-theos-v1
            r16-theos-v1
            r15-theos-v1
            r14-theos-v1
      - name: "②d/⑥ 缓存：xnu-deps（Apple 开源件 + host 工具 + SDK 链接树）"
        uses: actions/cache@v4
        with:
          path: hackios/xnu-deps
          key: r25-xnu-deps-v1
          restore-keys: |
            r23-xnu-deps-v1
            r22-xnu-deps-v1
            r20-xnu-deps-v1
            r19-xnu-deps-v1
            r18-xnu-deps-v1
            r17-xnu-deps-v1
            r16-xnu-deps-v1
            r15-xnu-deps-v1
            r14-xnu-deps-v1
      # R28d 沿 R28b 的 clean build 纪律：ccache 零回填（空仓起跑），
      # 本轮每个 .o 都从本轮源码编译；缓存只存不用（给后面的轮次）。
      - name: "②e/⑥ ccache（R28d 沿 R28b：clean build——零回填，只存不用）"
        uses: actions/cache@v4
        with:
          path: hackios/.ccache
          key: r28d-ccache-${{ github.run_id }}

      # ---------------------------------------------------------------
      - name: "③/⑥ 内核源码构建（theos + xnu/apply.sh + xnu-deps + clean ccache + make + R28d 门禁）"
        run: |
          set -eu
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/ld64" ]; then
            rm -rf "$THEOS"
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
            mkdir -p "$THEOS/toolchain"
            curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          fi
          "$THEOS/toolchain/linux/iphone/bin/ld64" --version || true
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" ]; then
            rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk" /tmp/theos-sdks
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
            git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
            mkdir -p "$THEOS/sdks"
            mv /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
            rm -rf /tmp/theos-sdks
          fi
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" || { echo "::error::theos/sdks 的 iPhoneOS16.5.sdk 就位失败"; exit 1; }
          df -h /
          cd hackios
          xnu/apply.sh
          bash xnu-deps/setup.sh || { echo "::error::setup.sh 失败——exporthdrs.log 尾部："; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          export XNU_CCACHE=1 CCACHE_COMPILERCHECK=content
          ccache -C >/dev/null 2>&1 || true
          ccache -M 2G >/dev/null 2>&1 || true
          echo "→ R28d clean build：ccache 零回填空仓起跑，本轮每个对象都从本轮源码编译"
          echo "→ ccache 起步统计（应全零）："; ccache -s 2>/dev/null | head -8 || true
          ./xnu-build.sh -j4 -k || echo "（make 退出码 $?——上游文档：链接后的检查，内核若已产出即成功）"
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          ls -la "$K" || { echo "::error::内核没有产出——exporthdrs.log 与 make 日志尾部："; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          echo "→ ccache 收官统计："; ccache -s 2>/dev/null | head -8 || true
          python3 - "$K" <<'PY'
          import sys
          d = open(sys.argv[1], 'rb').read()
          for marker, what in ((b'\x9f\x4e\x00\x71', 'cmp w20,#0x13（门铃 19 分发）'),
                               (b'\x08\x01\xa0\x52', 'movz w8,#0x8,lsl#16（门铃 19 使能）'),
                               (b'RAPHAEL TOUCH', '触摸驱动'),
                               (b'buttons: step 1', '按键驱动'),
                               (b'a640_gmu.bin', 'GPU 驱动（a640 固件名）'),
                               (b'a640_zap.mbn', 'GPU 驱动（zap mbn）'),
                               (b'the panel dimmed to', 'fbdim 调光'),
                               (b'going on with the configured rates', 'R12 测量降级（adreno step5）'),
                               (b'going with the ID registers', 'R13 SMMU 修复（IDR 优先）'),
                               (b'was not started: the firmware answers', 'PSCI SMP 起核路径'),
                               (b"this firmware's verdict of started", 'R14 GMU 判据分支'),
                               (b"the power-on block's pull-ups", 'R14 PON 拉电阻回读'),
                               (b"'s status byte changed to", 'R14 按键原始字节见证'),
                               (b"the two pages the GMU's own code asks for", 'R15 GMU scratch 两页'),
                               (b'cb tlbiall', 'R15 上下文银行全量 TLB 清洗'),
                               (b'a context bank nobody used before', 'R16 处女银行（GMU 路径）'),
                               (b'trying context bank', 'R16 银行候选（GMU 路径）'),
                               (b'tlbiallnsnh', 'R16 全局 TLB 失效'),
                               (b'the stream the bank names for it', 'R16 故障流 ID 取证'),
                               (b'what our own tables say for', 'R16 页表 walk 转储'),
                               (b'arrived late', 'R16 迟到答案'),
                               (b'make the SMMU forget every translation again', 'R16 msg30 前再清洗'),
                               (b'survivable, cleared, the wait goes on', 'R17 可活故障容忍'),
                               (b'while the GMU was deciding', 'R17 等待期故障轮询'),
                               (b'has stopped answering', 'R17 假失败判据修复'),
                               (b'with a bus error', 'R17 致命故障分类'),
                               (b'the patience was not wasted', 'R17 答案耗时标定'),
                               (b'while the 3D core was powered', 'R17 OOB 循环故障轮询'),
                               (b'the bank is programmed and ON before the stream table is touched', 'R19 先开后表的参考顺序（保留）'),
                               (b"the core's second stream (1) through the same context", 'R19 二流绑定（=1 实验分支在场）'),
                               (b"raphael's dt gives the gfx streams the mask 0x401", 'R21 本机 DT 形态判词'),
                               (b"the second stream (1) under entry 0's own wing", 'R21 二流默认罩住'),
                               (b"raphael's TrustZone took the processor with it", 'R21 判词：give-up 不再默认发'),
                               (b"the give-up call is not sent by default", 'R21 通道先行'),
                               (b"no zap shader can be asked for", 'R21 通道暗门判词'),
                               (b"the whole door is dark", 'R21 整门皆暗'),
                               (b"adreno_tzunload", 'R21 give-up 实验开关'),
                               (b"with the channel proven", 'R21 通道验证后补发'),
                               (b'whether it "supports" the GPU\'s image', 'R21 supports 诊断'),
                               (b"the same of the audio's, for comparison", 'R21 audio 对照'),
                               (b"the metadata is built as", 'R22 元数据形态宣告'),
                               (b"the whole file, every p_offset at the real bytes (Linux's)", 'R22 全文件形态'),
                               (b"the call was preempted %d time%s before it was answered", 'R22 被抢占计数'),
                               (b"a one-page metadata the way it is asked", 'R22 单页元数据判词'),
                               (b"THE SIGNATURE CHAIN SAYS", 'R23 签名链判词'),
                               (b'the hashes carry "', 'R23 哈希段明文名字'),
                               (b"A TEST KEY (Qualcomm SecTools", 'R23 测试签名判词（防旧件回流）'),
                               (b"one attempt, the form both working callers use", 'R23 单一规范尝试'),
                               (b"the R22 matrix proved the code does not move", 'R23 矩阵结论入档'),
                               (b"the control: a page of zeroes as the GPU's metadata", 'R23 零页对照宣告'),
                               (b"control, the GPU's id over zeroes", 'R23 GPU 零页对照'),
                               (b"control, the audio's id over the same zeroes", 'R23 audio 零页对照'),
                               (b"THE SAME CODE: the refusal comes BEFORE the image", 'R23 同码判词（调用级）'),
                               (b"A DIFFERENT ANSWER: TrustZone does read the buffer", 'R23 换码判词（镜像级）'),
                               (b"the place is a fresh page of ours", 'R23 动态页落位'),
                               (b"dt's pil_gpu_region is referenced by nothing", 'R23 孤儿区判词'),
                               (b"adreno_zapmem", 'R23 落位覆盖开关'),
                               (b"no memory for the zap image", 'R23 落位分配判词'),
                               (b"Xiaomi Attestation CA", 'R25 小米量产链探针'),
                               (b"Xiaomi Root CA", 'R25 小米根链探针'),
                               (b"THE PHONE'S OWN PRODUCTION CHAIN", 'R25 量产链判词'),
                               (b"no test-key marks and no Xiaomi marks", 'R25 三岔兜底判词'),
                               (b'R28d: the kernel generation line', 'R28d 内核代数戳（驱动首行 + step 1 首次 flush）'),
                               (b'R28d: the two-parameter baseline', 'R28d 两参基线状态行（step 19 三开关自报）'),
                               (b"the CPU monitor's override goes to every process", 'R28d minimac：CPU monitor 豁免行（lsd 的 1015）'),
                               (b'E2: the size sweep', 'R25 E2 尺寸扫描'),
                               (b'E2 control: the hash table corrupted', 'R25 E2 损坏哈希表对照'),
                               (b'E3: the argument word sweep', 'R25 E3 参数字扫描'),
                               (b'E4: the id sweep', 'R25 E4 id 扫描'),
                               (b'E5: the same call again', 'R25 E5 状态测试'),
                               (b'E5: after the give-up', 'R25 E5 give-up 后再发'),
                               (b'secboot and rollback fuses', 'R25 E7 qfprom 窗口全查'),
                               (b"R28: the shape sweeps, retired behind adreno_shape_sweep=1", 'R28 形状扫描门控宣告（默认离场）'),
                               (b"R28: retired behind adreno_qfprom=1", 'R28 熔丝扫描门控宣告（默认离场）'),
                               (b'XNULIVE3', 'R26 内核三页结构（flush 通道）'),
                               (b'adreno_e1_mode', 'R26 E1 形态开关'),
                               (b'the empty probe', 'R26 空探针'),
                               (b'step 19 entered', 'R26 step 19 入口宣告'),
                               (b'goes to the storage first', 'R26 落盘守卫判词'),
                               (b'did not put the log away in time', 'R26 flush 超时判词'),
                               (b'R26 E1, adreno_e1_mode=3', 'R26 E1 三参形态（受审）'),
                               (b'R26 E1, adreno_e1_mode=2', 'R26 E1 两参形态（对照）'),
                               (b"step 1's first line: the flush channel's own test", 'R27 flush 通道自测（step 1 首行）'),
                               (b'step 20 entered: the 3D core\'s registers are next', 'R27 step 20 入口守卫'),
                               (b'step 21 entered: out of secure mode', 'R27 step 21 入口守卫'),
                               (b'step 22 entered: the first frame is next', 'R27 step 22 入口守卫'),
                               (b'the steps are over (R27)', 'R27 探针结束守卫'),
                               (b'adreno_shape_sweep', 'R28 形状扫描退役开关'),
                               (b"R28: the shape sweeps, retired behind adreno_shape_sweep=1", 'R28 形状扫描改判措辞'),
                               (b"R28: retired behind adreno_qfprom=1", 'R28 熔丝扫描改判措辞')):
              assert marker in d, f'源码构建的内核缺 {what}'
          for gone, what in ((b'of the stream table does not keep what is written', 'R18 条目 0 拒写取证'),
                             (b'of the stream table instead', 'R18 换条目路由'),
                             (b'the free entries are offered one by one', 'R18 条目候选搜索'),
                             (b'refused every entry', 'R18 全条目拒绝判词'),
                             (b'the hypervisor drops SMR/S2CR', 'R19 看守者判词（R21 证伪并除名）'),
                             (b'TAKEN TO MEAN THAT IT KEEPS A ZAP SHADER', 'R21 除名：拒绝即失败'),
                             (b'attempt %u of 3', 'R22 三连矩阵（R23 除名）'),
                             (b"R21's packed metadata, a call that may be preempted", 'R22 尝试2（R23 除名）'),
                             (b'the whole .mbn as the metadata, a call "at once"', 'R22 尝试3（R23 除名）'),
                             (b'the give-up call takes the refusal back', 'R22 尝试间清理（R23 除名）'),
                             (b'attempt %u refused: the call returns', 'R22 逐试拒绝码（R23 除名）'),
                             (b'the next attempt goes on all the same', 'R22 矩阵判读（R23 除名）'),
                             (b'three attempts -- the whole .mbn as the metadata', 'R22 矩阵宣告（R23 除名）'),
                             (b"no test-key marks -- the chain reads like the phone's own", 'R23 两岔兜底（R25 三岔除名）'),
                             (b"read the secboot and rollback fuses (E7: the whole qfprom windows", 'R25b：step 2 的 E7 整扫退役（早死轮摘除）'),
                             (b"R25 E1: Linux's shape", 'R26：E1 文本改由 adreno_e1_mode 两态承载（R25 措辞退役）'),
                             (b"R25: the shape sweeps", 'R28：形状扫描总宣告退役（改判定罪，adreno_shape_sweep 开关门控）'),
                             (b"R25b: E7 moved to the end of the refusal path", 'R28：熔丝扫描在案措辞退役（adreno_qfprom 开关门控）'),
                             (b'R28: the two-parameter baseline', 'R28b：R28 旧基线措辞退役（源码确实前移的机器证明）'),
                             (b'R28b: the kernel generation line', 'R28d：R28b 旧代数戳退役（本轮源码前移的机器证明）'),
                             (b'R28b: the two-parameter baseline', 'R28d：R28b 旧基线措辞退役（本轮源码前移的机器证明）')):
              assert gone not in d, f'已退役标记未删净：{what}（{gone!r} 仍在二进制里）'
          print(f'✓ 源码构建的内核带齐 R11-R28d 全部标记、退役标记已删净（{len(d):,} B）')
          import hashlib
          ksha = hashlib.sha256(d).hexdigest()
          print(f'✓ 本轮源码构建内核 sha256 = {ksha}')
          print('   已知历史值：R27/R27b = 372f0b0a…，R28 = 9e3dd447…，R28b/R28c 内核 = 36a1e953…；')
          print('   R28d 源码已改词（代数戳 + baseline + minimac 豁免行），必须是其中任何一个都不是的新值')
          for label, needle in (('R28d 代数戳（want 2）', b'R28d: the kernel generation line'),
                                ('R28d baseline（want 1）', b'R28d: the two-parameter baseline'),
                                ('R28d minimac 行（want 1）', b"the CPU monitor's override goes to every process"),
                                ('R28b 代数戳（want 0）', b'R28b: the kernel generation line'),
                                ('R28b baseline（want 0）', b'R28b: the two-parameter baseline'),
                                ('R28  baseline（want 0）', b'R28: the two-parameter baseline'),
                                ('R25  sweeps（want 0）', b'R25: the shape sweeps'),
                                ('R25b E7 announce（want 0）', b'R25b: E7 moved to the end of the refusal path')):
                  print(f'    grep {label}: {d.count(needle)}')
          assert ksha not in ('372f0b0af38d84f7d343a322f21c41156e6675581e08964b0ac15378be447d9c',
                              '9e3dd447d1e92158b9e7159cf3508ca3414e6366d066373210ed746f590667b3',
                              '36a1e9534da454854a0110724447ffa06d9fcae8995e98cf1487d419cfed3ed6'), '新源码必须给出新内核 sha256（R27/R28/R28b 都不允许）'
          PY
          df -h /

      # ---------------------------------------------------------------
      - name: "⑤/⑥ 打 r28d 双启动镜像（外科手术：只换 kernel 条目；loader v7 / ramdisk / DTB / 头字段 = R28c 原字节）"
        run: |
          set -eu
          cd hackios
          bash tools/r28d-flash-build.sh r28c/raphael-xnu-r28c-flash.img r28c/raphael-xnu-r28c-gpu-flash.img
          cp raphael-xnu-r28d-flash.img "$REL/"
          cp raphael-xnu-r28d-gpu-flash.img "$REL/"
          cp r28c/raphael-r28c-flashboot.apfs "$REL/raphael-r28d-flashboot.apfs"
          cp r28c/r28c-md1-root.apfs "$REL/r28d-md1-root.apfs"
          # 对打包后的双镜像离线复证（与 ③ 源码构建、⑤ 打包内打印三方对齐）
          python3 tools/r28d-kernel-id.py \
                  "$REL/raphael-xnu-r28d-flash.img" "$REL/raphael-xnu-r28d-gpu-flash.img" | tee r28d-kernel-id.txt
          grep -q "VERDICT: the kernel entry is R28d" r28d-kernel-id.txt || { echo "::error::离线复证未判 R28d"; exit 1; }
          grep -c "VERDICT: the kernel entry is R28d" r28d-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像必须双双判 R28d"; exit 1; }
          grep -c "ec15106da4bad290" r28d-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像的 loader 必须是设备验证过的 v7（ec15106d…）"; exit 1; }
          ls -lh "$REL"
          df -h .

      # ---------------------------------------------------------------
      - name: "⑥/⑥ SHA256 + README + 发布 Release（只有 boot 资产，几十 MB）"
        run: |
          set -eu
          cd "$REL"
          : > SHA256SUMS
          for f in raphael-xnu-r28d-flash.img raphael-xnu-r28d-gpu-flash.img \
                   raphael-r28d-flashboot.apfs r28d-md1-root.apfs; do
            sha256sum "$f" >> SHA256SUMS
          done
          REPO="${{ github.repository }}"
          TAG="${{ inputs.release_tag }}"
          cat > README.txt <<EOF
          ============================================================
           R28d · 纯血 hackios SpringBoard 交付包（raphael / K20 Pro）
           —— CPU monitor 豁免轮：R28c 卡白苹果 = lsd 的 1015 特权被拒，
              内核把"拒绝"做成了"重装监控还答 0"，lsd 死循环重试
          ============================================================
          ⚠️⚠️⚠️ 启动卷只 stage 一个文件：raphael-r28d-flashboot.apfs ⚠️⚠️⚠️
            （R14 事故纪律不变：md1 备份不要 stage，flash.img 已内嵌全量小卷）
          主镜像   : raphael-xnu-r28d-flash.img（触摸 + 按键 + 八核；不跑 GPU 步骤）
          GPU 镜像 : raphael-xnu-r28d-gpu-flash.img（同上 + gpu=1）
          启动卷   : raphael-r28d-flashboot.apfs（= R13 全量字节，逐字节原样）

          【R28c 战报裁决（本轮的立案证据，四问四答）】
            Q1 "denied attempt to escape CPU monitor" 是什么机制？
               —— 是内核的任务策略层（XNU task_policy.c 的 per-thread CPU
                  monitor），不是 sandbox 的文件/网络限制。链条全文：
                  launchd 在 spawn lsd 时用 posix_spawnattr 的 cpumonitor
                  参数武装了一个 CPU 监控（kern_exec.c:4177"来自 spawn 的
                  激活一律当有特权"）；lsd 稍后用 process_policy 系统调用
                  请求解除（percentage=0xFF=DISABLE）；内核用
                  priv_check_cred(PRIV_PROC_CPUMON_OVERRIDE=1015) 鉴权，
                  我们的 minisandbox 层拿 lsd 签名里的
                  com.apple.private.kernel.override-cpumon 去对，没对上。
            Q2 GPU 梯子（52 秒）改变了 CPU 监控状态吗？
               —— 没有。三重证据：①监控是在 lsd 出生时（60.12s）由
                  launchd 的 spawn 属性武装的，与 GPU 寄存器无关；②拒绝
                  是对 lsd 签名 entitlement 的静态查找，与轮次无关；③梯子
                  ~52s 跑完，lsd 60.1s 才出生、62.49s 才第一次被拒——
                  拒绝发生时梯子早已不在运行。梯子的真实影响是"时间"：
                  它在引导路径上同步跑，把用户态整体推迟了 ~48s（这就是
                  R24b 梯子 4s 时 SpringBoard 出生早、本轮 52s 时出生晚
                  的全部原因）。
            Q3 为什么 R24b 没触发？
               —— R24b 的记录根本没活到那一步：它的 logdump 止于 48s
                  （backboardd "startup complete. 8.02662s" 之后 0.7s，
                  渲染中截断），lsd 当时才 0.7 秒大；这堵墙在 lsd 活到
                  ~2.4s 时才现身（R28c 里 60.12s 出生 → 62.49s 首拒）。
                  "R24b 八秒进 SpringBoard"是 backboardd 自己的
                  "8.02662s elapsed"启动耗时被误读成了墙钟。同一 rootfs、
                  同一 lsd、同一检查代码——R24b 多跑两秒就会打出同一串
                  拒绝。墙上从来没有门，只有没走到墙跟前。
            Q4 lsd 需要什么 entitlement？为什么缺？
               —— com.apple.private.kernel.override-cpumon（我们的特权
                  1015）。它不是 R28b 弄丢的：R24b 起就没有——这个环境
                  从不把签名 entitlement 附到进程上（读的是 lsd 签名里的
                  entitlement 清单，lsd 的清单里没有这把钥匙）。真机上
                  由完整 sandbox 按档案授予；我们只有 minisandbox 一张桌。
            ★ 更糟的是内核的"拒绝"方式（task_policy.c:2799-2876）：
                  它不返回错误——它把默认值塞回去、按全局帽（50% / 3min）
                  钳制、重新武装监控、然后答 0。调用方看不见拒绝，只能
                  一遍遍重试：11 秒 144 次（r28c-logdump 3422-3423 行，
                  "privilege 1015 refused" 与 "escape CPU monitor denied"
                  相隔 28µs，同一事件的两层视角）。SpringBoard 等 lsd 的
                  应用注册，等成了白苹果。

          【R28d 本轮改动（外科手术，一处）】
            · xnu/files/bsd/kern/kern_minimac.c：PRIV_PROC_CPUMON_OVERRIDE
              加入 PRIV_WORK_INTERVAL 的"人人有份"档——同文件自己的先例
              （"拒绝即致命"），第一次放行时打印
              "minisandbox: the CPU monitor's override goes to every
               process (the refusal was fatal to lsd -- R28d)"
            · 代数戳换词：R28b → R28d（驱动首行 + step 1 + step 19 三开关
              行）；R28b 旧措辞进退役表，门禁断言（grep = 0）。
            · 实验逻辑零变化：两参基线默认（adreno_e1_mode=2）、形状/
              熔丝扫描退役（adreno_shape_sweep=0 / adreno_qfprom=0）、
              flush 通道、三开关、keep-logdump 全部原样。
            · 装载器 v7 逐字节原样（ec15106d…，R28c 轮设备已验证的那份
              构建产物）；卷零置换；ramdisk/DTB/头字段 = R28c 原字节。
            · clean build：ccache 零回填；构建期打印 kernel sha256 +
              判词 grep 计数；断言新 sha ∉ {R27, R28, R28b}。

          【本轮判读树（预期时程，GPU 镜像）】
            0. 照旧四步开机（boot / oem ramdisk / stage / oem run）；
               本轮不需要 keep-logdump——跑完等 SpringBoard。
            1. ~52s：梯子跑完（step 19 E1 判词照旧，预期 -3145797、
               零页对照 -3145738）；用户态开动。
            2. ~60s：lsd 出生；~62s 前后内核日志应出现一行（只一次）：
                 "minisandbox: the CPU monitor's override goes to every
                  process (the refusal was fatal to lsd -- R28d)"
               —— 这是修复上机的活证据。
            3. 此后不应再出现 "denied attempt to escape CPU monitor"
               （R28c 同期 11 秒 144 次）。lsd 完成应用注册 →
               SpringBoard UI 顶掉白苹果（~70-90s，首次可到桌面）。
            4. 若仍有其它进程报 minisandbox privilege 拒绝（如
               iconservicesagent / distnoted 的 request 类）——那些是
               "allowed"噪声行，不是墙；只把"导致卡住"的报上来。
            5. 离线复验：python3 tools/r28d-kernel-id.py <image>
               （代数 grep：R28d 代数戳=2、R28d baseline=1、
                minimac 行=1、R28b/R28 旧措辞全 0）
            6. logdump 判读沿用 R28c 口诀（python3 logdump-read.py）；
               本轮 v7 修复已设备验证，flush 通道照常工作。

          【手机端（Termux / bootloader）】
            fastboot boot  raphael-xnu-r28d-flash.img
            fastboot oem  ramdisk
            fastboot stage raphael-r28d-flashboot.apfs
            fastboot oem  run
            # GPU 实验（第二次开机）：
            fastboot boot  raphael-xnu-r28d-gpu-flash.img
            fastboot oem  ramdisk
            fastboot stage raphael-r28d-flashboot.apfs
            fastboot oem  run      # 等到 ~90s：白苹果应让位给 SpringBoard
          直链：
            https://github.com/${REPO}/releases/download/${TAG}/raphael-xnu-r28d-flash.img
            https://github.com/${REPO}/releases/download/${TAG}/raphael-xnu-r28d-gpu-flash.img
            https://github.com/${REPO}/releases/download/${TAG}/raphael-r28d-flashboot.apfs
            https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS
          ⚠️ userdata 上的 iOS 卷是唯一存货：绝不要让 MIUI 开机
             （Android 会重格回 f2fs，iOS 卷即毁）。
          ⚠️ 每次开机都要重复 boot/oem ramdisk/stage/oem run 四步
             （启动卷住 RAM 不落盘，"不写手机闪存"设计的一部分）。
          ⚠️ 含 Apple 版权内容，仅个人研究；下载完成后请尽快删除本 Release。
          EOF
          echo "→ SHA256SUMS："
          cat SHA256SUMS

      - name: "⑥b/⑥ 发布 Release（直链交付，r28d-springboard）"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "R28d · 纯血 hackios SpringBoard · CPU monitor 豁免轮（lsd 的 1015 特权 + 白苹果摘除）"
          body: |
            raphael (K20 Pro) R28d 交付包：**CPU monitor 豁免轮**。

            R28c 战报：内核活着（73.6s 由五指手势有序返回，无崩溃），backboardd
            在渲染（surface 1125x2436、swap 1-5），但 SpringBoard 起不来——
            lsd[29] 从 62.49s 起自旋，144 次 "denied attempt to escape CPU
            monitor (missing required entitlement)"。链条读源码闭合：
            launchd 在 spawn lsd 时武装了 CPU 监控（posix_spawnattr 的
            cpumonitor），lsd 用 process_policy 请求解除，内核拿签名里的
            com.apple.private.kernel.override-cpumon（特权 1015）鉴权没对上；
            而内核的"拒绝"不返回错误——塞默认值、按全局帽钳制、重新武装、
            答 0——lsd 看不见拒绝，只能永远重试。GPU 梯子无罪（监控在 lsd
            出生时武装，拒绝是对签名的静态查找；梯子的影响是"时间"：把
            用户态推迟 ~48s）。R24b 无罪也无幸——它的记录止于 48s，lsd 才
            0.7 秒大，墙在 lsd 活到 ~2.4s 才现身；"8 秒进 SpringBoard"是
            backboardd 自己的启动耗时被误读。

            R28d = 一处外科手术：kern_minimac.c 把 PRIV_PROC_CPUMON_OVERRIDE
            加进 PRIV_WORK_INTERVAL 的"人人有份"档（同文件"拒绝即致命"的
            先例），首次放行打印 "the refusal was fatal to lsd -- R28d"。
            代数戳换词 R28b→R28d（旧措辞进退役表）；装载器 v7 逐字节原样
            （ec15106d…，设备已验证构建）；卷零置换；ramdisk/DTB/头字段
            = R28c 原字节；clean build（ccache 零回填）+ 新 sha 断言。

            判读：~62s 应见 minimac 放行行（只一次），此后无 CPU monitor
            拒绝；lsd 完成注册，白苹果让位 SpringBoard（~70-90s）。
            E1 判词照旧（预期 -3145797 / 零页对照 -3145738）。

            ⚠️ 含 Apple 版权内容，仅供个人研究；下载完成后请尽快删除本 Release。
          fail_on_unmatched_files: true
          files: |
            release/raphael-xnu-r28d-flash.img
            release/raphael-xnu-r28d-gpu-flash.img
            release/raphael-r28d-flashboot.apfs
            release/r28d-md1-root.apfs
            release/SHA256SUMS
            release/README.txt

      - name: "直链汇总（跑完看这里，复制即用）"
        run: |
          set -eu
          echo "════════════ 全部下载直链 ════════════"
          for f in "$REL"/raphael-xnu-r28d-flash.img "$REL"/raphael-xnu-r28d-gpu-flash.img \
                   "$REL"/raphael-r28d-flashboot.apfs "$REL"/r28d-md1-root.apfs \
                   "$REL"/SHA256SUMS "$REL"/README.txt; do
            echo "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/$(basename "$f")"
          done
