name: R35 · SpringBoard 一键流水线（Metal 轮：RedwoodMetal.bundle 进卷 + IOAcceleratorES 发现链 + cmdline 追加 metal=1 + libredwood-gl.dylib 注入 backboardd；内核 = R33 字节 verbatim（字节复现门禁）；底板 = r34 release · I1 已由用户 logdump 坐实（freedreno FD640 三角上屏）之后，Metal 发现链 + 系统级 GL 通道的首上机轮）
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "hackios 内核树 fork（含 xnu/ + tools/r35-*）"
        required: true
        default: "Gsjsjzhznsz/hackios-xnu-kernel"
      release_tag:
        description: "Release tag（直链的一部分）"
        required: true
        default: "r35-springboard"
      base_image:
        description: "r34 日常镜像直链（R35 日常镜像 = 它逐字节原样：本轮的控制组）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r34-springboard/raphael-xnu-r34-flash.img"
      base_gpu_image:
        description: "r34 GPU 镜像直链（外科手术的底板：ramdisk 换 GL+Metal 卷、cmdline 追加 metal=1）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r34-springboard/raphael-xnu-r34-gpu-flash.img"
      base_flashboot:
        description: "r34 启动卷直链（= R13 谱系，真机验证过，原样转发）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r34-springboard/raphael-r34-flashboot.apfs"
      base_root:
        description: "r34 小卷 md1 直链（卷构建的底料：GL+Metal 增量从这些字节上长出来）"
        required: false
        default: "https://github.com/Gsjsjzhznsz/hackios-xnu-kernel/releases/download/r34-springboard/r34-md1-root.apfs"
permissions:
  contents: write
concurrency:
  group: r35-springboard
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      REL: ${{ github.workspace }}/release
      THEOS: /home/runner/theos     # (literal: GitHub Actions' env: block expands nothing)
      CCACHE_DIR: ${{ github.workspace }}/hackios/.ccache
    outputs:
      volume_sha: ${{ steps.volume.outputs.volume_sha }}
    steps:
      # ---------------------------------------------------------------
      - name: "①/⑦ 磁盘准备与依赖（内核工具链 + GL/Metal 构建件 meson/ninja/llvm）"
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-dev clang lld ccache \
                       flex bison m4 perl python3 autoconf automake libtinfo6 xz-utils uuid-dev 7zip \
                       meson ninja-build llvm >/dev/null
          command -v clang && command -v ccache && command -v 7z && command -v meson && command -v ninja
          # dsymutil：Ubuntu 的 apt clang 不往 /usr/bin 放它（R11 run 39973048286 的教训）
          DS=$(command -v dsymutil || clang --print-prog-name=dsymutil 2>/dev/null || true)
          [ -x "$DS" ] || DS=$(ls /usr/lib/llvm-*/bin/dsymutil 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$DS" ] && [ -x "$DS" ]; then
            sudo ln -sf "$DS" /usr/bin/dsymutil
          else
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/bin/dsymutil >/dev/null && sudo chmod +x /usr/bin/dsymutil
          fi
          # llvm-ar：Mesa 的构建件（mk-mesa.sh 的清单）
          AR=$(ls /usr/lib/llvm-*/bin/llvm-ar 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$AR" ] && sudo ln -sf "$(readlink -f "$AR")" /usr/local/bin/llvm-ar
          command -v llvm-ar
          mkdir -p "$REL"
          {
            echo "R28i toolchain audit (recorded $(date -u +%FT%TZ))"
            echo "--- runner image ---"
            cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION)=' || true
            echo "--- apt clang (the kernel's host compiler) ---"
            clang --version | head -2
            lld --version 2>/dev/null || true
            echo "--- apt meson/ninja/llvm-ar (the GL/Metal build's pieces) ---"
            meson --version; ninja --version; llvm-ar --version | head -1
          } | tee "$REL/toolchain-versions.txt"
          df -h /

      # ---------------------------------------------------------------
      - name: "②/⑦ 取树 + 取 r34 资产（本轮底板；SHA 对官方 SHA256SUMS 硬校验）"
        run: |
          set -eu
          git clone --depth 1 "https://github.com/${{ inputs.kernel_repo }}.git" hackios
          cd hackios
          echo "→ 内核树 @ $(git log -1 --format='%h %s')"
          ls -lh xnu/files/bsd/dev/raphael_adreno.c tools/r35_volume_build.py tools/r35_flash_build.py \
                tools/r35_gl_metal_build.sh tools/r35-kernel-id.py tools/r34-kernel-id.py
          # r34 的四件资产：两张镜像是外科手术的底板（内核条目 = R33 420f4b71…，GPU 底板的
          # cmdline = R33 组原样、小卷 = R34 GL 卷——I1 的 freedreno 三角就是它跑出来的），启动卷
          # 原样转发，小卷 = 卷构建的底料（本轮的 GL+Metal 增量从它长出来）。
          mkdir -p base
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/raphael-xnu-r34-flash.img  "${{ inputs.base_image }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/raphael-xnu-r34-gpu-flash.img "${{ inputs.base_gpu_image }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/raphael-r34-flashboot.apfs "${{ inputs.base_flashboot }}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o base/r34-md1-root.apfs "${{ inputs.base_root }}"
          sha256sum base/* | tee base/SHA256SUMS.r34base
          # 硬校验：四件资产必须是 r34 release 的官方字节（r34-springboard 的 SHA256SUMS）
          python3 - base/ <<'PY'
          import hashlib, sys
          want = {
              'raphael-xnu-r34-flash.img':    'b0f9f6df4ea13ad9d45048e7ff15e33d7b2fcb67204d01964b1014517ca8a60b',
              'raphael-xnu-r34-gpu-flash.img':'1a1644180f91f54c925c0cb05abf8693abc0177a299dbb86e78394b98d491612',
              'raphael-r34-flashboot.apfs':   '14485e7c5ce125ef516168445c2500ac04ca5e40a908c2aef516b2d92c24ba0c',
              'r34-md1-root.apfs':            '7e15aaa6bb047fca48ea8b2b4ce7c84b0757deee76b95bbc2f825f6922e46abf',
          }
          for name, sha in want.items():
              got = hashlib.sha256(open(sys.argv[1] + name, 'rb').read()).hexdigest()
              assert got == sha, f'{name}: {got} != the r34 release sha {sha}'
          print('底板四件全部等于 r34 release 的官方字节（r34-springboard SHA256SUMS）')
          PY
          # 底板谱系三查（r34-kernel-id 还在本树）：v7 装载器 + R33 内核 + 小卷三态判读
          # （--expect-volume-sha = r34 release 的 GL 卷：r34-kernel-id 的 KNOWN 表止于 R13 谱系，
          #   R34 卷 sha 只能由打包时的 --expect 通道认领）
          python3 tools/r34-kernel-id.py base/raphael-xnu-r34-flash.img base/raphael-xnu-r34-gpu-flash.img \
                  --expect-volume-sha 7e15aaa6bb047fca48ea8b2b4ce7c84b0757deee76b95bbc2f825f6922e46abf | tee base-id.txt
          grep -q "ec15106da4bad290" base-id.txt || { echo "::error::r34 底板镜像的 loader 不是设备验证过的 v7（ec15106d…）"; exit 1; }
          grep -Ec "loader  sha256" base-id.txt | grep -qx 2 || { echo "::error::两张 r34 底板镜像都要读到 loader 条目"; exit 1; }
          grep -c "VERDICT: the kernel entry is R34" base-id.txt | grep -qx 2 || { echo "::error::底板镜像的内核不是 R34（= R33 字节 verbatim）"; exit 1; }
          grep -q "VERDICT: the ramdisk entry is R13..R33 VERBATIM" base-id.txt || { echo "::error::r34 日常镜像的小卷不是 R13 谱系"; exit 1; }
          grep -q "VERDICT: the ramdisk entry is the R34 GL-test volume" base-id.txt || { echo "::error::r34 GPU 镜像的小卷不是 R34 GL 卷"; exit 1; }
          grep -q "R34 adds no token" base-id.txt || { echo "::error::r34 GPU 底板的 cmdline 不该带 metal=1（那是本轮的新 token，R34 的判词是不加 token）"; exit 1; }
          grep -c "libOSMesa.8.dylib=2" base-id.txt | grep -qx 1 || { echo "::error::r34 GPU 底板小卷的名字表指纹缺 libOSMesa.8.dylib"; exit 1; }
          # 两张底板镜像的 ramdisk 条目必须与各自底料一致（日常 = R13 谱系字节；GPU = r34-md1-root.apfs）
          python3 - base/ <<'PY'
          import gzip, struct, hashlib, sys
          def ramdisk_of(path):
              img = open(path, 'rb').read()
              blob = gzip.decompress(img[4096:4096 + struct.unpack('<I', img[8:12])[0]])
              x = blob.find(b'XNUP')
              size = struct.unpack('<I', blob[x+4:x+8])[0]
              i, out = x + 8, {}
              while i + 24 <= x + 8 + size and blob[i] != 0:
                  name = blob[i:i+16].rstrip(b'\0').decode()
                  esize = struct.unpack('<I', blob[i+16:i+20])[0]
                  out[name] = blob[i+24:i+24+esize]
                  i += 24 + ((esize + 15) & ~15)
              return out['ramdisk']
          daily_expect = '372c7fcb7730726a8fb806eec7251e0e75a4188f64db6fbaedcf5b7663672dd4'
          gpu_base = open(sys.argv[1] + 'r34-md1-root.apfs', 'rb').read()
          assert hashlib.sha256(ramdisk_of(sys.argv[1] + 'raphael-xnu-r34-flash.img')).hexdigest() == daily_expect, \
              'r34 日常镜像的 ramdisk 条目不是 R13 谱系字节'
          assert ramdisk_of(sys.argv[1] + 'raphael-xnu-r34-gpu-flash.img') == gpu_base, \
              'r34 GPU 镜像的 ramdisk 条目与 r34-md1-root.apfs 不一致'
          print('底板两镜像的 ramdisk 条目 == 各自底料，逐字节')
          PY

      # ---------------------------------------------------------------
      # R28i 工具链纪律（R35 原样继承）：缓存键全新、无 restore 链，重建确定性。
      - name: "②c/⑦ 缓存：theos（工具链 + iPhoneOS16.5.sdk；R35 全新键、无 restore 链）"
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: r35-theos-v19L2-v1
      - name: "②d/⑦ 缓存：xnu-deps（Apple 开源件 + host 工具 + SDK 链接树；R35 全新键、无 restore 链）"
        uses: actions/cache@v4
        with:
          path: hackios/xnu-deps
          key: r35-xnu-deps-v1
      - name: "②e/⑦ ccache（R35 clean build——零回填，只存不用）"
        uses: actions/cache@v4
        with:
          path: hackios/.ccache
          key: r35-ccache-${{ github.run_id }}

      # ---------------------------------------------------------------
      # ③ 内核构建：R35 改的是卷和一个 cmdline token，不是内核——本轮的构建是一次可复现性
      # 证明：同一棵树、同一个钉死的工具链，必须重新产出 R33 的字节（420f4b71…）。差一个
      # 字节都是环境漂移或误改内核，必须查清，不许带着疑点上机。
      - name: "③/⑦ 内核源码构建 + R33 字节复现门禁（theos v19.0.0-L2 + xnu/apply.sh + xnu-deps + clean ccache + make；sha 必须 == 420f4b71…）"
        run: |
          set -eu
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/ld64" ]; then
            rm -rf "$THEOS"
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
            mkdir -p "$THEOS/toolchain"
            curl -fL --retry 3 --retry-delay 5 -sS https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          fi
          "$THEOS/toolchain/linux/iphone/bin/ld64" --version | tee -a "$REL/toolchain-versions.txt" || true
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" ]; then
            rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk" /tmp/theos-sdks
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
            git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
            mkdir -p "$THEOS/sdks"
            mv /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
            rm -rf /tmp/theos-sdks
          fi
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" || { echo "::error::iPhoneOS16.5.sdk 就位失败"; exit 1; }
          df -h /
          cd hackios
          xnu/apply.sh
          XNU_HOST_CLANG="$THEOS/toolchain/linux/iphone/bin/clang"
          export XNU_HOST_CLANG
          test -x "$XNU_HOST_CLANG" || { echo "::error::theos 工具链 clang 缺位"; exit 1; }
          "$XNU_HOST_CLANG" --version | tee -a "$REL/toolchain-versions.txt"
          grep -q "eabca92" "$REL/toolchain-versions.txt" || { echo "::error::内核编译器不是钉死的 theos clang"; exit 1; }
          bash xnu-deps/setup.sh || { echo "::error::setup.sh 失败"; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          export XNU_CCACHE=1 CCACHE_COMPILERCHECK=content XNU_WRAPPER_LOG="$PWD/xnu-clang-args.log"
          : > "$XNU_WRAPPER_LOG"
          ccache -C >/dev/null 2>&1 || true
          ccache -M 2G >/dev/null 2>&1 || true
          ./xnu-build.sh -j4 -k || echo "（make 退出码 $?——上游文档：链接后的检查，内核若已产出即成功）"
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          ls -la "$K" || { echo "::error::内核没有产出"; tail -60 xnu-deps/exporthdrs.log 2>/dev/null; exit 1; }
          # --- R35 门禁一：R33 标记快检（树没被误改的第一道网）
          echo "→ 诊断：R33 标记快检（R35 不动内核，措辞应与 R33 发布件全同）"
          echo "    R33 generation line = $(strings -a "$K" | grep -cF 'R33: the kernel generation line')（应 2）"
          echo "    R33 resident round = $(strings -a "$K" | grep -cF 'R33: the resident round')（应 1）"
          echo "    R33 keep switch = $(strings -a "$K" | grep -cF 'THE GPU STAYS ON for the system to draw with')（应 1）"
          echo "    R33 SCMDMP begin = $(strings -a "$K" | grep -cF 'SCMDMP: R33 begins')（应 1）"
          echo "    R32/R31 旧戳（应 0）= $(strings -a "$K" | grep -cE 'R32: the kernel generation line|R31: the kernel generation line')（应 0）"
          # --- R35 门禁二：字节复现——R33 的树必须产出 R33 的字节
          KSHA=$(sha256sum "$K" | cut -d' ' -f1)
          echo "rebuilt kernel sha256: $KSHA" | tee -a "$REL/toolchain-versions.txt"
          if [ "$KSHA" = "420f4b717b5dd0fe2f0b236bdbf2c686da6a2dd0169b3c9985de8e600e1e3560" ]; then
            echo "✅ 可复现性证明成立：同一棵树、同一个钉死的工具链，R33 的字节逐位重现（420f4b71…）"
          else
            echo "::error::重建内核 sha $KSHA != R33 发布字节 420f4b71…——环境漂移或内核源被误改；先查清，不许带疑点上机"
            exit 1
          fi
          echo "→ ccache 收官统计："; ccache -s 2>/dev/null | head -8 || true

      - name: "诊断产物（wrapper argv 日志，失败也上传）"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-diag
          path: |
            hackios/xnu-clang-args.log
          if-no-files-found: ignore

      # ---------------------------------------------------------------
      - name: "④/⑦ GL+Metal 构建（userland pin de5ef58 + Mesa 25.0.7 → GL 三件 + libredwood-gl.dylib + RedwoodMetal.bundle + metal_props/metal_test/metal_drv_test）"
        run: |
          set -eu
          cd hackios
          bash tools/r35_gl_metal_build.sh 2>&1 | tee "$REL/r35-glm-build.log"
          # 八件产物 + Info.plist，一样都不能少（脚本自身已验 Mach-O；这里验在册）
          for f in libOSMesa.8.dylib gl_test u2f_test libredwood-gl.dylib RedwoodMetal \
                   Info.plist metal_props metal_test metal_drv_test; do
            test -f "r35-glm/$f" || { echo "::error::GL+Metal 构建没有产出 $f"; exit 1; }
          done
          # bundle 的类名必须对上发现链的约定：Info.plist 的 NSPrincipalClass = RedwoodMetalDevice
          # （metal_plugin.plist 的原文；Metal 的 step 4 拿它问 [NSBundle classNamed:]）
          grep -q "RedwoodMetalDevice" r35-glm/Info.plist || { echo "::error::Info.plist 缺 RedwoodMetalDevice"; exit 1; }
          df -h /

      # ---------------------------------------------------------------
      - name: "⑤/⑦ 卷构建（R34 谱系底料 + GL/Metal 增量：selftest 往返 + 81 文件逐字节 + 6 增量 + 1 链接 + rc.jobs/inject.conf 换装）"
        id: volume
        run: |
          set -eu
          cd hackios
          python3 tools/r35_volume_build.py \
              --base base/r34-md1-root.apfs \
              --apfs-dir tools/apfs \
              --rc-jobs userland/rc.jobs.r35metal \
              --glm-dir r35-glm \
              --out "$REL/r35-md1-root.apfs" \
              --manifest "$REL/r35-volume-manifest.json" \
              --slack 512 2>&1 | tee "$REL/r35-volume-build.log"
          VSHA=$(python3 -c "import json;print(json.load(open('$REL/r35-volume-manifest.json'))['volume']['sha256'])")
          echo "volume_sha=$VSHA" >> "$GITHUB_OUTPUT"
          echo "→ R35 GL+Metal 卷 sha256: $VSHA"
          test "$(stat -c %s "$REL/r35-md1-root.apfs")" -lt 33554432 || { echo "::error::GL+Metal 卷超过 32 MB（payload 预算告急）"; exit 1; }

      # ---------------------------------------------------------------
      - name: "⑥/⑦ 打 r35 双启动镜像（外科手术：底板 = r34 release；日常镜像逐字节原样，GPU 镜像换 ramdisk 条目 = GL+Metal 卷 + cmdline 追加 metal=1；装载器 v7 / kernel R33 / DTB = r34 原字节）"
        run: |
          set -eu
          cd hackios
          python3 tools/r35_flash_build.py \
              --daily base/raphael-xnu-r34-flash.img \
              --gpu base/raphael-xnu-r34-gpu-flash.img \
              --volume "$REL/r35-md1-root.apfs" \
              --volume-sha "${{ steps.volume.outputs.volume_sha }}" \
              --out-daily "$REL/raphael-xnu-r35-flash.img" \
              --out-gpu "$REL/raphael-xnu-r35-gpu-flash.img" 2>&1 | tee "$REL/r35-flash-build.log"
          # 启动卷：r34 的官方字节（= R13 谱系，真机验证过），名字换成本轮（不刷也不影响 boot）
          cp base/raphael-r34-flashboot.apfs "$REL/raphael-r35-flashboot.apfs"
          # 对打包后的双镜像离线复证
          python3 tools/r35-kernel-id.py \
                  "$REL/raphael-xnu-r35-flash.img" "$REL/raphael-xnu-r35-gpu-flash.img" \
                  --expect-volume-sha "${{ steps.volume.outputs.volume_sha }}" | tee r35-kernel-id.txt
          grep -c "VERDICT: the kernel entry is R35" r35-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像必须双双判 R35 内核（= R33 字节 verbatim）"; exit 1; }
          grep -c "ec15106da4bad290" r35-kernel-id.txt | grep -qx 2 || { echo "::error::双镜像的 loader 必须是设备验证过的 v7"; exit 1; }
          grep -c "VERDICT: the ramdisk entry is R13..R33 (the R13 bytes)" r35-kernel-id.txt | grep -qx 1 || { echo "::error::日常镜像的小卷必须仍是 R13 谱系（本轮控制组）"; exit 1; }
          grep -c "VERDICT: the ramdisk entry is the R35 GL+Metal volume" r35-kernel-id.txt | grep -qx 1 || { echo "::error::GPU 镜像的小卷必须是 R35 GL+Metal 卷"; exit 1; }
          grep -c "libredwood-gl.dylib=2" r35-kernel-id.txt | grep -qx 1 || { echo "::error::GL+Metal 卷的名字表指纹缺 libredwood-gl.dylib"; exit 1; }
          grep -c "RedwoodMetal.bundle=5" r35-kernel-id.txt | grep -qx 1 || { echo "::error::GL+Metal 卷的名字表指纹缺 RedwoodMetal.bundle（应 5：bundle 名 x Info.plist x Extensions 链）"; exit 1; }
          grep -c "metal_props=2" r35-kernel-id.txt | grep -qx 1 || { echo "::error::GL+Metal 卷的名字表指纹缺 metal_props"; exit 1; }
          test "$(grep 'cmdline       :' r35-kernel-id.txt | grep -c 'gpu=1')" = 1 || { echo "::error::必须恰好 GPU 镜像带 gpu=1"; exit 1; }
          test "$(grep 'cmdline       :' r35-kernel-id.txt | grep -c 'adreno_keep=1')" = 1 || { echo "::error::必须恰好 GPU 镜像带 adreno_keep=1（R33 的 resident 开关原样）"; exit 1; }
          test "$(grep 'cmdline       :' r35-kernel-id.txt | grep -c 'metal=1')" = 1 || { echo "::error::必须恰好 GPU 镜像带 metal=1（本轮的唯一新 token）"; exit 1; }
          test "$(grep 'cmdline       :' r35-kernel-id.txt | grep -c 'touchscreen=1 buttons=1 cpus=8 ufs=2 bootcpu=7 root_apfs=ufs_userdata gpu=1 adreno=22 adreno_pause=0 adreno_watch=0 adreno_keep=1 metal=1')" = 1 || { echo "::error::GPU 镜像的 cmdline 不是恰好 = R33 组 + metal=1"; exit 1; }
          echo "（cmdline 检查过：本轮唯一 token 变化 = metal=1；唯一卷变化 = GL/Metal 增量）"
          ls -lh "$REL"
          df -h .

      # ---------------------------------------------------------------
      - name: "⑦/⑦ SHA256 + README + 发布（R35：J 判读树（Metal 发现链 + 系统级 GL 通道首判）+ I1 入账，只有 boot 资产）"
        run: |
          set -eu
          cd "$REL"
          : > SHA256SUMS
          for f in raphael-xnu-r35-flash.img raphael-xnu-r35-gpu-flash.img \
                   raphael-r35-flashboot.apfs r35-md1-root.apfs; do
            sha256sum "$f" >> SHA256SUMS
          done
          REPO="${{ github.repository }}"
          TAG="${{ inputs.release_tag }}"
          cat > README.txt <<EOF
          ============================================================
           R35 · 纯血 hackios SpringBoard 交付包（raphael / K20 Pro）
           —— Metal 轮：RedwoodMetal.bundle + IOAcceleratorES 发现链
              + cmdline 追加 metal=1 + libredwood-gl.dylib 注入 backboardd
              （内核 = R33 字节 verbatim；唯一 token 变量 = metal=1，
               唯一卷变量 = GL/Metal 增量）
          ============================================================
          ⚠️⚠️⚠️ 启动卷只 stage 一个文件：raphael-r35-flashboot.apfs ⚠️⚠️⚠️
            （R14 事故纪律不变：md1 备份不要 stage，flash.img 已内嵌全量小卷）
          主镜像   : raphael-xnu-r35-flash.img（= r34 逐字节原样：本轮控制组）
          GPU 镜像 : raphael-xnu-r35-gpu-flash.img（cmdline =
                      touchscreen=1 buttons=1 cpus=8 ufs=2 bootcpu=7
                      root_apfs=ufs_userdata gpu=1 adreno=22 adreno_pause=0
                      adreno_watch=0 adreno_keep=1 metal=1
                      = R33 的 token 组 + 恰好一个新 token；卷变量：
                      + lib/libredwood-gl.dylib（GL=1 的库：CoreAnimation
                        的调用表经 Mesa/freedreno 打到 A640）
                      + lib/RedwoodMetal.bundle/{RedwoodMetal,Info.plist}
                        （Metal 驱动：源码声明的 _MTLDevice 子类
                        RedwoodMetalDevice，-initWithAcceleratorPort: 打开
                        内核 RedwoodGPU 服务，buffer = msm GEM 分配）
                      + System/Library/Extensions/RedwoodMetal.bundle →
                        /redwood/lib/RedwoodMetal.bundle（Metal 的 step 3
                        自己拼的路径；目录是 iOS 的，链接跟卷走）
                      + bin/metal_props / metal_test / metal_drv_test
                      + etc/rc.jobs → rc.jobs.r35metal（wait 22; props
                        show/on; metal_test; metal_drv_test --sweep）
                      + etc/inject.conf +1 行（libredwood-gl → backboardd）
                      其余 = R34 谱系逐字节原样（GL 三件 riding）
          启动卷   : raphael-r35-flashboot.apfs（= r34 官方字节，原样转发）
          小卷 md1 : r35-md1-root.apfs（本轮新卷；逐文件清单见
                      r35-volume-manifest.json）
          【R34 的设备判决（用户 logdump 入账，本轮的地基）】
            I1 成立：gl_test 报 "freedreno; FD640; OpenGL ES 3.2 Mesa
            25.0.7"，三角 57 ms 画成、29 ms 读回、26% 像素计数与几何
            精确一致、上屏 8 秒——GL 全栈（Mesa→freedreno→RedwoodGPU）
            真机打通。kernel 侧 R33 的 STAYS-ON 照旧。
            另在案：backboardd "CoreAnimation: Failed to initialize
            Metal or OpenGLES contexts!" —— 窗口服务器的 Metal/GL 上下
            文创建失败，因为卷里没有 GL=1 的库、没有 Metal 设备可发现。
            这正是本轮要验的东西的前置。
          【R35 改了什么（以及刻意不改什么）】
            内核：一字节未动（R33 的 420f4b71… verbatim；CI 用同一棵
            树 + 钉死的工具链重建出同一份字节 = 可复现性门禁）。
            cmdline：恰好一个新 token（metal=1 = IOAcceleratorES 服务
            被允许接受两个发现属性；没有它 metal_props 的写入被内核
            拒绝，发现链无从谈起）。
            卷：R34 谱系 + 六件 Metal/GL 增量 + 一条 Extensions 链接 +
            两处换装（rc.jobs、inject.conf + backboardd 行）。
            libredwood-gl.dylib 是什么：userland/src/eagl.c（mkeagl.py
            生成的调用表）+ gl_osmesa.c over 同一个 Mesa——内核注入器
            读 etc/inject.conf 把它放进 backboardd；库自己的门
            （inject.c gpu_draws()）在 RedwoodGPU 服务在场时打开，
            CoreAnimation 从此经 EAGL→Mesa→freedreno→A640 画 UI。
            RedwoodMetal 是什么：Metal framework 的五步发现链（枚举
            IOAcceleratorES → 读两个属性 → 打开 bundle → 验
            isSubclassOfClass:_MTLDevice → initWithAcceleratorPort:）
            的终点是一个源码声明的 RedwoodMetalDevice——Apple 私有基类
            只借符号与 ivar 布局（非脆弱 ABI），资源层走本核 RedwoodGPU
            的 msm 形接口（与 Mesa 的 shim 同一条路，R34 已实机验证）。
            compute 的 AIR 编译器（libredwoodair.dylib）本轮刻意不带：
            它缺席是驱动打印的一句话，不是崩溃——compute 是下一轮。
          【本轮判读树（J：Metal 发现链 + 系统级 GL 通道首判）】
            刷 GPU 镜像，等 boot 走完（应与 R34 全同：steps 1..22 +
            STAYS-ON 行 + UI 起来），再等 demo job 的五行：
              rwtouch wait 22（系统安静后）
              metal_props show（应报 "(none)"）
              metal_props on（设两个属性）
              metal_test（五步发现链 + CoreImage）
              metal_drv_test --sweep（全类全方法清点）
            自检（任一不满足 ⇒ 本票作废）：
              P0  R33/R34 的全相位行照旧（step 12/19/21/22 + STAYS-ON）
              P1  系统照常起（触摸活着；R34 的 gl_test 卷内容仍在）
            判决分支：
              J1  metal_test 五步全绿（RedwoodMetalDevice 在册、设备
                  建成、CoreImage filter 工作）+ drv sweep 有计数 ⇒
                  Metal 发现链真机打通 ⇒ 下一轮：compute（AIR）+
                  triangle_app（CAMetalLayer 应用）
              J2  metal_test 报 IOAcceleratorES 无属性/写入被拒 ⇒
                  metal=1 没生效（查 cmdline 组装/内核门）
              J3  metal_test step 3 报 bundle NOT THERE ⇒ 卷的
                  Extensions 链接缺位（查卷构建）
              J4  step 4/5 类拒绝或注册 abort ⇒ logdump + 输出分诊
                  （Apple 基类符号绑定/协议断言/ivar 布局）
              J5  metal_test 绿、但 backboardd 仍报 Metal 失败 ⇒
                  预期内（窗口服务器的调用面深）：Metal 链已判活；
                  GL 通道另查 inject.conf 行/注入日志
              J6  daemon abort 循环（同名进程反复重生）⇒ 发现属性在
                  系统 期被某 daemon 吃到——下轮收窄时序（drv sweep
                  先行 / props off 收尾）
              J7  启动早期崩 ⇒ 与 GPU 无关的新伤，按 boot 分诊
              回滚：刷回 r34 GPU 镜像（本轮的卷/cmdline 变化随镜像整体回退）
          【logdump 读取纪律（P3：不变）】
            分区每次整写都以头行开始；拉取后按头行截断；自有区判读
            双保险（写边界 + 指针计数）。设备端一键：sh run_ios.sh
            flash r35 gpu -w 180（或 logdump）。
          【离线复验】
            python3 tools/r35-kernel-id.py <image> --expect-volume-sha <r35-md1 sha>
            （代数 grep：kernel entry is R35 ×2；loader v7 ×2；日常镜像
             ramdisk = R13..R33 ×1；GPU 镜像 = R35 GL+Metal volume ×1；
             名字表 libredwood-gl.dylib=2、RedwoodMetal.bundle=5、
             metal_props=2；cmdline 数据行 metal=1 ×1）
          【工具链审计】
            toolchain-versions.txt：每层编译器/构建件完整版本号 +
            具名 tag（R28i 纪律，R35 原样继承；缓存键全新）。
          【手机端（Termux / bootloader）】
            fastboot boot  raphael-xnu-r35-gpu-flash.img   # R35 轮（GL+Metal 卷）
            fastboot oem  ramdisk
            fastboot stage raphael-r35-flashboot.apfs
            fastboot oem  run      # 等系统起完（~1 分钟）再等 demo 的五行
                                   # 判决（rwtouch wait 22 之后）
            # 设备端一键：sh run_ios.sh flash r35 gpu -w 180
            # 控制组：主镜像 = r34 逐字节原样，无需重刷
          直链：
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-xnu-r35-gpu-flash.img
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-xnu-r35-flash.img
            https://github.com/\${REPO}/releases/download/\${TAG}/raphael-r35-flashboot.apfs
            https://github.com/\${REPO}/releases/download/\${TAG}/r35-md1-root.apfs
            https://github.com/\${REPO}/releases/download/\${TAG}/r35-volume-manifest.json
            https://github.com/\${REPO}/releases/download/\${TAG}/SHA256SUMS
          ⚠️ userdata 上的 iOS 卷是唯一存货：绝不要让 MIUI 开机
             （Android 会重格回 f2fs，iOS 卷即毁）。
          ⚠️ 每次开机都要重复 boot/oem ramdisk/stage/oem run 四步。
          ⚠️ 含 Apple 版权内容，仅个人研究；下载完成后请尽快删除本 Release。
          EOF

      - name: "⑦b/⑦ 发布 Release（直链交付，r35-springboard）"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "R35 · 纯血 hackios SpringBoard · Metal 轮（RedwoodMetal.bundle 发现链 + metal=1 + libredwood-gl 注入 backboardd；内核 = R33 字节 verbatim）"
          body: |
            raphael (K20 Pro) R35 交付包：**Metal 轮**。

            R34 设备判决（用户 logdump 入账）：I1 成立——gl_test 报
            freedreno FD640 / GLES 3.2 Mesa 25.0.7，三角真机画成上屏；
            backboardd 的 "Failed to initialize Metal or OpenGLES
            contexts" 在案 = 系统级通道缺席，即本轮课题。

            本轮三件事：① Metal 发现链上机——RedwoodMetal.bundle 进卷
            （+ /System/Library/Extensions 链接），cmdline 追加 metal=1，
            rc.jobs.r35metal 依次 metal_props on → metal_test（五步）→
            metal_drv_test --sweep（全类全方法）；② GL=1 的
            libredwood-gl.dylib 进卷并注入 backboardd（CoreAnimation
            经 EAGL→Mesa→freedreno→A640 画 UI 的通道）；③ 内核一字节
            未动（420f4b71… verbatim + CI 字节复现门禁），cmdline 恰好
            一个新 token——单变量纪律。

            判读树 J：J1 = 发现链五步全绿 + sweep 计数 ⇒ Metal 真机
            打通（下一轮 compute/triangle_app）；J2 = 属性被拒 ⇒
            metal=1 门；J3 = bundle 缺位；J4 = 类注册失败按码分诊；
            J5 = metal 绿但 backboardd 仍败 = 预期内；J6 = daemon 循环；
            J7 = 早期崩。回滚 = 刷回 r34 GPU 镜像。

            手术：底板 = r34 release（内核条目 R33 420f4b71…），日常
            镜像逐字节原样，GPU 镜像换 ramdisk 条目 + cmdline 追加
            metal=1；装载器 v7 / DTB = r34 原字节（SHA 硬校验）。

            ⚠️ 含 Apple 版权内容，仅供个人研究；下载完成后请尽快删除本 Release。
          fail_on_unmatched_files: true
          files: |
            release/raphael-xnu-r35-flash.img
            release/raphael-xnu-r35-gpu-flash.img
            release/raphael-r35-flashboot.apfs
            release/r35-md1-root.apfs
            release/r35-volume-manifest.json
            release/SHA256SUMS
            release/README.txt
            release/toolchain-versions.txt
      - name: "直链汇总（跑完看这里，复制即用）"
        run: |
          set -eu
          echo "════════════ 全部下载直链 ════════════"
          for f in "$REL"/raphael-xnu-r35-flash.img "$REL"/raphael-xnu-r35-gpu-flash.img \
                   "$REL"/raphael-r35-flashboot.apfs "$REL"/r35-md1-root.apfs \
                   "$REL"/r35-volume-manifest.json "$REL"/SHA256SUMS "$REL"/README.txt \
                   "$REL"/toolchain-versions.txt; do
            echo "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/$(basename "$f")"
          done
