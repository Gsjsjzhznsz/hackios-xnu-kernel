                     看守者拒绝的是"把流路由进没在翻译的 bank"的一切
                     SMR/S2CR 写入。R19：context bank 0 先完整编程并
                     打开（sctlr ON|SERVE_AFTER_FAULT 收尾），才动流表
                     （s2cr(0)=0、smr(0)=VALID|0x400<<16|0）；二流 1 走
                     同一 context 的 entry 2。R18 槽位搜索连根删除；
                     R17 全部成果一字不动。

          【R17/R18 战报回顾】Step 17 史诗级通关：msg 30 等到回复、OOB
          授权全过、rbbm_status=0x1——THE 3D CORE HAS POWER AND ANSWERS。
          R18：entry 0 拒写一切（三次写入读回全 0）→ 看守者立场查明。

          【R19 判读】（GPU 镜像，klog 里 adreno: N）
          - step 17 照旧全绿："the GMU accepts" ×4、"THE 3D CORE HAS
            POWER AND ANSWERS"
          - step 18 新看点（bank 先行）：
            · "give the SMMU's context 0 these tables ... the bank is
              programmed and ON before the stream table is touched"
            · 随后 smr(entry 0) 读回应为 0x84400400——R17 以来第一次
              落地，这一行就是 R19 的胜利线
            · 接着 "the core's second stream (1) through the same
              context"，entry 2 读回 0x84400401 → step 18 done
            · step 18 过 → SQE 微码就位 → 19-21（zap / start /
              commands）是本机的新水域，照常爬梯
          - 若 bank 已开而 entry 0 仍读 0：klog 整段回传——R20 的战场
            换到 s2cr 形态或 bank 4，与 R19 的顺序判据不冲突
          - 任何一步停住：整段回传 klog（fastboot oem log +
