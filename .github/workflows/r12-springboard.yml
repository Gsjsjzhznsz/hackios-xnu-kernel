          ③' 判读（GPU 实验镜像，klog 里 adreno: N）：
            - "step 5: ... going on with the configured rates" = 本轮生效签名
            - step 5 之后每步一行；22 = 硬件加速全通（动画丝滑）
            - 若卡在 6/7（GMU/RSCC 读）：地址表下一轮对象，回传 klog
            - 若计数器这次反而测出来了：白得的真频率数据，一并回传
