# Device profile: sourced by common/build.sh and common/run.sh. Generated by the raphael port
# (Xiaomi Mi 9T Pro / K20 Pro, SM8150). GIC/cores/small-cluster values are read from the phone's
# real device tree (work t12 golden image DTB, from vendor_boot); addresses follow cepheusPkg
# (Mi 9, same SoC) with the XNU payload where redwood has it.
NAME="Xiaomi Mi 9T Pro / K20 Pro (raphael)"
KIND=phone
SOC="Qualcomm Snapdragon 855 (SM8150)"

# --- boot chain (phones) ---------------------------------------------------------------------------
UEFI_TARGET=raphael            # Mu-Silicium device name: build_uefi.py -d raphael (raphaelPkg, HanaPkg/SM8150)
UEFI_FD=                       # a built SILICIUM_UEFI.fd; empty: Mu-Silicium/Build/raphaelPkg/... or prebuilt/uefi
DTB=                           # the phone's own device tree; empty: prebuilt/uefi/raphael.dtb (from vendor_boot)
FD_BASE=0x9FC00000             # cepheus layout: UEFI FD at 0x9FC00000 (MemoryMapLib: "UEFI FD")
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000        # same as redwood: 64 MB at 0xF0000000, free in the cepheus memory map

# --- boot image (raphael's ABL only accepts Android boot header v2 - v1 is a black screen) ----------
BOOTIMG_HEADER_VERSION=2       # 1 (upstream default) makes raphael's ABL reject the image (verified on t8/t13/t19)

# --- kernel and loader -----------------------------------------------------------------------------
# GIC 0x17A00000 / 0x17A60000, 8 cores, MPIDR shift 8, little cluster 0-3 (capacity 1024 vs 1740):
# all read from the real DTB; identical topology to redwood (4+4), but a different framebuffer area.
FB_BASE=0x9C000000             # cepheus "Display Reserved" (1080x2340x32); xnuloader picks platform_raphael by it
WIFI_ATH11K=0                  # raphael has WCN3998 (ath10k family), not ath11k; Wi-Fi is a later stage

# --- what the run needs ----------------------------------------------------------------------------
# bootcpu=7 runs on the Prime core (2.84 GHz); cpus=8 is the verified 8-core config (t12 line)
BOOTARGS="touchscreen=0 cpus=8"   # touchscreen=0 first bring-up: GT9886 driver is a later stage (redwood's is GT9916/SPI)
DEFAULT_SECS=900
USERLAND_VARS=""               # e.g. "GL=1" once the Adreno 640 path is exercised
FIRMWARE=""                    # later: fw-gpu fw-adsp ... (raphael's own firmware from its Android, never in the repo)
